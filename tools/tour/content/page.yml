# Page chrome: headings, leads, and the micro-labels inside the window replica.
# A slot spelled `{locale: some.key}` is pulled from locales/*.yml — that is the
# application's own string, in every language, and it is never retyped here.
# Edited by hand; rendered into docs/tour/index.html by `make tour`.

_schema: tour.page.v1
strings:
  th.dark:
    ru: Тёмная
    en: Dark
  th.light:
    ru: Светлая
    en: Light
  hero.h1:
    ru: Терминал за один экран
    en: The terminal in one screen
  hero.lead:
    ru: 'Ниже — интерактивная схема главного окна MoonTerminal, собранная из модели тура, палитры, метрик
      и выбранных строк локализации приложения. Нажмите любую зону, чтобы увидеть документированное
      пояснение и его источник.'
    en: 'Below is an interactive schematic of the MoonTerminal main window, assembled from the tour model,
      palette, metrics, and selected application locale strings. Click any zone to see its documented
      explanation and source.'
  map.h:
    ru: Карта окна
    en: Window map
  map.mode_group:
    ru: Рабочее пространство
    en: Workspace
  map.all:
    ru: Все номера
    en: All numbers
  rail.pick:
    ru: Выберите зону
    en: Pick a zone
  rail.h:
    ru: Наведите или кликните
    en: Hover or click
  rail.p:
    ru: Каждая зона объясняется той же строкой, что живёт в подсказках приложения.
    en: Every zone is explained by the same string that lives in the application's tooltips.
  qs.h:
    ru: Быстрый старт
    en: Quick start
  qs.lead:
    ru: 'Пять шагов от пустого окна до зелёного индикатора. Порядок важен: терминал не подключается, пока
      настройки не сохранены.'
    en: 'Five steps from an empty window to a green indicator. Order matters: the terminal does not connect
      until settings are saved.'
  pn.h:
    ru: Панели дока
    en: Dock panels
  pn.lead:
    ru: Двойной клик по вкладке или перетаскивание — панель уезжает в отдельное окно. Двойной клик ещё
      раз — возвращается.
    en: Double-click a tab or drag it — the panel pops out into its own window. Double-click again to
      bring it back.
  wn.h:
    ru: Отдельные окна
    en: Separate windows
  wn.lead:
    ru: Пять окон открываются кнопками справа в торговом тулбаре.
    en: Five windows open from the buttons on the right of the trading toolbar.
  hk.h:
    ru: Горячие клавиши
    en: Hotkeys
  hk.lead:
    ru: Всё, кроме встроенных, переназначается в Настройки → Хоткеи. Раскройте нужную группу.
    en: Everything except the built-ins is rebindable in Settings → Hotkeys. Open the group you need.
  ft.p:
    ru: MoonTerminal — десктопный торговый терминал для ядра Moonbot. Windows · macOS · Linux.
    en: MoonTerminal — desktop trading terminal for the Moonbot core. Windows · macOS · Linux.
  ft.built:
    ru: 'Страница собрана из данных репозитория: палитра и метрики — из зафиксированного снимка темы MoonUI;
      подписи и пояснения — из проверенной модели тура и выбранных locales/*.yml. Это схема, а не запись живой сессии.'
    en: 'This page is assembled from repository data: palette and metrics come from a committed MoonUI theme
      snapshot; labels and explanations come from the validated tour model and selected locales/*.yml. It is a schematic, not a live-session capture.'
