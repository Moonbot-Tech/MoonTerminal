# Five steps from download to a connected core. The bodies carry markup on
# purpose (`<code>`, `<a>`, `<b>`), which is what `html: true` declares — every
# other slot is escaped at render time.
# Edited by hand; rendered into docs/tour/index.html by `make tour`.

_schema: tour.quickstart.v1
steps:
- title:
    ru: Скачайте терминал
    en: Download the terminal
  body:
    ru: 'На странице <a href="https://github.com/Moonbot-Tech/MoonTerminal/releases/latest" target="_blank"
      rel="noopener">Releases</a> лежат готовые сборки: <code>MoonTerminal.exe</code> для Windows и <code>.dmg</code>
      для macOS. Под Linux пока только сборка из исходников — <code>make build</code>.'
    en: 'Ready builds live on the <a href="https://github.com/Moonbot-Tech/MoonTerminal/releases/latest"
      target="_blank" rel="noopener">Releases</a> page: <code>MoonTerminal.exe</code> for Windows and
      a <code>.dmg</code> for macOS. Linux is build-from-source for now — <code>make build</code>.'
    html: true
- title:
    ru: Откройте Настройки → Подключения
    en: Open Settings → Connections
  body:
    ru: Кнопка «Настройки» — справа в торговом тулбаре. Первая вкладка окна и есть та, что нужна.
    en: The Settings button sits at the right of the trading toolbar. The first tab of that window is
      the one you need.
    html: true
- title:
    ru: Добавьте ядро и вставьте ключ
    en: Add a core and paste the key
  body:
    ru: 'Кнопка <code>+ Добавить ядро (в «default»)</code> создаёт строку. Порядок важен: ключ несёт
      порт и режим внутри себя — ключ, скопированный до их настройки, уже устарел. На машине с MoonBot
      откройте UDP-порт ядра для входящих: в Windows это <code>netsh advfirewall firewall add rule
      name="MoonBot-UDP-5017" dir=in action=allow protocol=UDP localport=5017</code>; у хостера со своим
      фаерволом (AWS и подобные) порт нужно открыть и там, на обычном VPS достаточно правила Windows.
      В MoonBot зелёный кружок слева внизу открывает <code>Info</code>; в строке <code>Moon Kernel</code>
      нажмите <code>Settings</code> — откроется <code>Moon Proto</code>; на вкладке <code>Settings</code>
      включите <code>Kernel (VPS)</code>, задайте <code>Port</code> (по умолчанию <code>5017</code>),
      выберите версию переключателями <code>V0</code> / <code>V1</code> / <code>V2</code> (MoonBot
      по умолчанию создаёт ключ <code>V0</code>: если не сменить версию до <code>Copy Key</code>,
      терминал прочитает из ключа <code>V0</code>), нажмите <code>Apply</code> — появится зелёное «Server activated on port …». На строке <code>Key:</code>
      нажмите <code>Copy Key</code> (ключа нет — <code>New Key</code>). Вставьте его в поле «Ключ»
      кнопкой из буфера. Хост и порт отдельно вводить не надо — они внутри ключа.'
    en: 'The <code>+ Add core (to "default")</code> button creates a row. The order matters: the key
      carries the port and mode inside it — a key copied before they are set is stale. On the machine
      running MoonBot, open the core''s UDP port for inbound traffic: on Windows that is <code>netsh
      advfirewall firewall add rule name="MoonBot-UDP-5017" dir=in action=allow protocol=UDP localport=5017</code>;
      a hoster with its own firewall (AWS and the like) needs the port opened there too, while a plain
      VPS needs only the Windows rule. In MoonBot the green dot at the bottom left opens <code>Info</code>;
      on the <code>Moon Kernel</code> row press <code>Settings</code>, which opens <code>Moon Proto</code>;
      on its <code>Settings</code> tab tick <code>Kernel (VPS)</code>, set <code>Port</code> (default
      <code>5017</code>), choose the version with the <code>V0</code> / <code>V1</code> / <code>V2</code>
      radio buttons (MoonBot creates a <code>V0</code> key by default: unless you change the version
      before <code>Copy Key</code>, the terminal reads <code>V0</code> from the key), press
      <code>Apply</code> — a green "Server activated on port …" appears.
      On the <code>Key:</code> row press <code>Copy Key</code> (<code>New Key</code> if there is no
      key yet). Paste it into the Key field with the clipboard button. Host and port are not entered
      separately — they are inside the key.'
    html: true
- title:
    ru: Отметьте, что принимать
    en: Choose what to accept
  body:
    ru: <b>Акт</b> — подключаться вообще. <b>Окн</b> — рисовать окно ядра; выключенное «Окн» при включённом
      «Акт» даёт headless-ядро. Колонки <b>Данные</b> (Ord / Det / Rep / Bal / Str / Log / Alr / Arb)
      фильтруют, что вы принимаете от этого ядра.
    en: <b>Act</b> — connect at all. <b>Win</b> — draw the core's window; Win off with Act on gives you
      a headless core. The <b>Data</b> columns (Ord / Det / Rep / Bal / Str / Log / Alr / Arb) filter
      what you accept from that core.
    html: true
- title:
    ru: Нажмите «Сохранить»
    en: Press Save
  body:
    ru: До сохранения ядро честно пишет «Нет данных (сохраните настройки для подключения)». После — статус
      проходит «Подключение…» и становится зелёным «Подключено». Ключи уезжают в <code>servers.enc</code>,
      зашифрованные ключом из хранилища ОС.
    en: Until you save, the core plainly reports "No data (save settings to connect)". After that the
      status moves through "Connecting…" to a green "Connected". Keys go into <code>servers.enc</code>,
      encrypted with a key from the OS keyring.
    html: true
