# Steps from download to a connected core, then how to turn the Mini App on.
# Each step is a title, a short
# body and optional `blocks` — one-key mappings rendered in order:
#   group        a sub-heading naming WHERE the user acts
#   sub          one numbered sub-step (3.1, 3.2, ... across the whole step)
#   p            a plain paragraph
#   code         a literal command, the same in every language, with a copy button
#   path         a click path, one item per crumb
#   note / warn  a callout
#   terms        a list of {term, text} pairs
#   status       a status sequence, left to right
# Slots with `html: true` carry `<code>`, `<a>` or `<b>` on purpose; every
# other slot is escaped at render time.
# Edited by hand; rendered into docs/tour/index.html by `make tour`.

_schema: tour.quickstart.v2
steps:
- title:
    ru: Скачайте терминал
    en: Download the terminal
  body:
    ru: 'На странице <a href="https://github.com/Moonbot-Tech/MoonTerminal/releases/latest" target="_blank"
      rel="noopener">Releases</a> лежат готовые сборки: <code>MoonTerminal.exe</code> для Windows и <code>.dmg</code>
      для macOS. Под Linux пока только сборка из исходников — <code>make build</code>.'
    en: 'Ready builds live on the <a href="https://github.com/Moonbot-Tech/MoonTerminal/releases/latest"
      target="_blank" rel="noopener">Releases</a> page: <code>MoonTerminal.exe</code> for Windows and
      a <code>.dmg</code> for macOS. Linux is build-from-source for now — <code>make build</code>.'
    html: true
- title:
    ru: Откройте Настройки → Подключения
    en: Open Settings → Connections
  body:
    ru: Кнопка «Настройки» — справа в торговом тулбаре. Первая вкладка окна и есть та, что нужна.
    en: The Settings button sits at the right of the trading toolbar. The first tab of that window is
      the one you need.
    html: true
- title:
    ru: Добавьте ядро и вставьте ключ
    en: Add a core and paste the key
  body:
    ru: Сначала настройка на машине с MoonBot, потом ключ — в терминал.
    en: Set things up on the MoonBot machine first, then bring the key to the terminal.
    html: true
  blocks:
  - warn:
      ru: 'Порядок важен: ключ несёт порт и режим внутри себя. Задайте <code>Port</code>, режим и версию
        <b>до</b> <code>Copy Key</code> — ключ, скопированный раньше, уже устарел.'
      en: 'The order matters: the key carries the port and mode inside it. Set <code>Port</code>, the mode
        and the version <b>before</b> <code>Copy Key</code> — a key copied earlier is stale.'
      html: true
  - group:
      ru: На машине с MoonBot
      en: On the MoonBot machine
  - sub:
      ru: 'Откройте UDP-порт ядра для входящих. В Windows:'
      en: 'Open the core''s UDP port for inbound traffic. On Windows:'
  - code: netsh advfirewall firewall add rule name="MoonBot-UDP-5017" dir=in action=allow protocol=UDP localport=5017
  - note:
      ru: У хостера со своим фаерволом (AWS и подобные) порт нужно открыть и там. На обычном VPS достаточно
        правила Windows.
      en: A hoster with its own firewall (AWS and the like) needs the port opened there too. A plain VPS
        needs only the Windows rule.
  - sub:
      ru: 'Откройте настройки <code>Moon Proto</code>:'
      en: 'Open the <code>Moon Proto</code> settings:'
      html: true
  - path:
    - ru: зелёный кружок слева внизу
      en: green dot, bottom left
    - ru: <code>Info</code>
      en: <code>Info</code>
      html: true
    - ru: строка <code>Moon Kernel</code> → <code>Settings</code>
      en: <code>Moon Kernel</code> row → <code>Settings</code>
      html: true
    - ru: <code>Moon Proto</code>, вкладка <code>Settings</code>
      en: <code>Moon Proto</code>, <code>Settings</code> tab
      html: true
  - sub:
      ru: Включите <code>Kernel (VPS)</code>.
      en: Tick <code>Kernel (VPS)</code>.
      html: true
  - sub:
      ru: Задайте <code>Port</code> (по умолчанию <code>5017</code>).
      en: Set <code>Port</code> (default <code>5017</code>).
      html: true
  - sub:
      ru: Выберите версию переключателями <code>V0</code> / <code>V1</code> / <code>V2</code>.
      en: Choose the version with the <code>V0</code> / <code>V1</code> / <code>V2</code> radio buttons.
      html: true
  - note:
      ru: MoonBot по умолчанию создаёт ключ <code>V0</code>. Если не сменить версию до <code>Copy Key</code>,
        терминал прочитает из ключа <code>V0</code>.
      en: MoonBot creates a <code>V0</code> key by default. Unless you change the version before <code>Copy
        Key</code>, the terminal reads <code>V0</code> from the key.
      html: true
  - sub:
      ru: Нажмите <code>Apply</code> — появится зелёное «Server activated on port …».
      en: Press <code>Apply</code> — a green "Server activated on port …" appears.
      html: true
  - sub:
      ru: На строке <code>Key:</code> нажмите <code>Copy Key</code> (ключа нет — <code>New Key</code>).
      en: On the <code>Key:</code> row press <code>Copy Key</code> (<code>New Key</code> if there is no key
        yet).
      html: true
  - group:
      ru: В терминале
      en: In the terminal
  - sub:
      ru: Нажмите <code>+ Добавить ядро (в «default»)</code> — появится строка.
      en: Press <code>+ Add core (to "default")</code> — a row appears.
      html: true
  - sub:
      ru: Вставьте ключ в поле «Ключ» кнопкой из буфера.
      en: Paste the key into the Key field with the clipboard button.
  - note:
      ru: Хост и порт отдельно вводить не надо — они внутри ключа и видны серым в колонке «Адрес:порт».
      en: Host and port are not entered separately — they are inside the key and show in grey in the
        Address:port column.
  - group:
      ru: Ядро и терминал в одной локальной сети
      en: Core and terminal on one local network
  - p:
      ru: 'Ключ несёт внешний адрес машины с ядром, а многие домашние роутеры не пускают компьютер
        изнутри сети на свой же внешний адрес — соединения не будет. Впишите в колонку «Адрес:порт»
        локальный адрес машины с ядром, например <code>192.168.1.20</code> (порт возьмётся из ключа).
        Перевыпускать ключ не нужно.'
      en: 'The key carries the core machine''s public address, and many home routers do not let a
        computer inside the network reach its own public address — there is no connection. Type the
        core machine''s local address into the Address:port column, for example
        <code>192.168.1.20</code> (the port comes from the key). There is no need to re-export the key.'
      html: true
  - note:
      ru: Проброс порта на роутере в этой схеме не нужен, а правило фаервола на машине с ядром нужно (шаг
        выше). Проверка порта в MoonBot меряет доступность снаружи и может ругаться, хотя подключение из
        локальной сети работает.
      en: No router port forwarding is needed here, but the firewall rule on the core machine is (the step
        above). MoonBot's port check measures reachability from outside and may complain even though the
        connection from the local network works.
  - note:
      ru: 'Та же колонка выручает, если в ключе неверный адрес или его нет (поле подсвечено жёлтым), или
        провайдер сменил IP: впишите адрес, адрес:порт, <code>:порт</code> или DDNS-имя. Новый ключ это
        поле не затирает, а крестик в нём возвращает адрес из ключа.'
      en: 'The same column helps when the key''s address is wrong or missing (the field is highlighted in
        yellow), or your ISP changed the IP: type an address, address:port, <code>:port</code> or a DDNS
        name. A new key does not overwrite the field, and its cross returns to the key''s address.'
      html: true
  - note:
      ru: Станция по умолчанию подключается к ядру по адресу из ключа. Значок облака рядом с заполненным
        полем передаёт ей вписанный адрес — включайте его для исправленного внешнего адреса или
        DDNS-имени, но не для локального адреса вашей сети, до которого сервер станции не достанет.
      en: By default the station connects to the core on the key's address. The cloud glyph beside a
        filled field hands it the typed address — turn it on for a corrected public address or a DDNS
        name, not for an address of your local network, which the station's server cannot reach.
  - p:
      ru: 'Около 25 ядер хотят примерно треть целой машины без режима burstable и несколько сотен МБ
        свободно на сервере в 1 ГБ. Базовые 10% у burstable t3.micro ниже этого. Если статус станции
        снова показывает <code>0 мин</code>, проверьте <code>CPUCreditBalance</code> (AWS) и
        <code>killed</code> / <code>oom</code> в журнале службы.'
      en: 'About 25 cores want roughly a third of a whole non-burstable machine and a few hundred MB free
        on a 1 GB box. A burstable t3.micro''s 10% baseline is below that. If the station status comes
        back with <code>0 min</code>, check <code>CPUCreditBalance</code> (AWS) and <code>killed</code> /
        <code>oom</code> in the service journal.'
      html: true
- title:
    ru: Отметьте, что принимать
    en: Choose what to accept
  body:
    ru: 'Флажки в строке ядра:'
    en: 'Checkboxes on the core''s row:'
  blocks:
  - terms:
    - term:
        ru: Акт
        en: Act
      text:
        ru: подключаться вообще.
        en: connect at all.
    - term:
        ru: Данные
        en: Data
      text:
        ru: колонки <code>Ord</code> / <code>Det</code> / <code>Rep</code> / <code>Bal</code> / <code>Str</code>
          / <code>Log</code> / <code>Alr</code> / <code>Arb</code> фильтруют, что вы принимаете от этого ядра.
        en: the <code>Ord</code> / <code>Det</code> / <code>Rep</code> / <code>Bal</code> / <code>Str</code>
          / <code>Log</code> / <code>Alr</code> / <code>Arb</code> columns filter what you accept from that
          core.
        html: true
- title:
    ru: Нажмите «Сохранить»
    en: Press Save
  body:
    ru: 'До сохранения ядро не подключается. После — статус проходит путь:'
    en: 'Until you save, the core does not connect. After that the status moves along:'
  blocks:
  - status:
    - ru: Нет данных (сохраните настройки для подключения)
      en: No data (save settings to connect)
    - ru: Подключение…
      en: Connecting…
    - ru: Подключено
      en: Connected
  - p:
      ru: Ключи уезжают в <code>servers.enc</code>, зашифрованные ключом из хранилища ОС.
      en: Keys go into <code>servers.enc</code>, encrypted with a key from the OS keyring.
      html: true
- title:
    ru: Включите Mini App
    en: Turn on the Mini App
  body:
    ru: 'Mini App не ставится отдельно: оно выключено, пока вы его не включите. Адрес веб-приложения в
      @BotFather вставлять не нужно — терминал публикует кнопку сам.'
    en: 'Mini App is not a separate install: it stays off until you turn it on. Do not paste a web-app
      address into @BotFather — the terminal publishes the button itself.'
    html: true
  blocks:
  - group:
      ru: На этом компьютере
      en: On this computer
  - path:
    - ru: <code>Настройки</code>
      en: <code>Settings</code>
      html: true
    - ru: <code>Telegram</code>
      en: <code>Telegram</code>
      html: true
    - ru: <code>Бот Telegram</code>
      en: <code>Telegram bot</code>
      html: true
    - ru: <code>Mini App</code>
      en: <code>Mini App</code>
      html: true
  - sub:
      ru: 'Поставьте галку <code>Включить Mini App</code> и нажмите <code>Сохранить</code> в окне настроек.
        Пока не сохраните, строка: <code>Есть изменения. Нажмите «Сохранить», чтобы применить их.</code>'
      en: 'Tick <code>Enable Mini App</code> and press <code>Save</code> in the settings window. Until you
        save, the line is <code>Changes pending. Press Save to apply them.</code>'
      html: true
  - status:
    - ru: Подготавливаем Mini App. Дождитесь готовности, затем нажмите «Открыть» в боте.
      en: Preparing Mini App. Once ready, press Open in the bot.
    - ru: Готово. Откройте Mini App кнопкой в своём боте.
      en: Ready. Open Mini App using the button in your bot.
  - note:
      ru: 'Если не вышло, строка остаётся <code>Не удалось открыть доступ к Mini App. Проверьте интернет;
        повторная попытка выполняется автоматически.</code> Повтор идёт сам. Туннель ставить не нужно.'
      en: 'If it fails, the line stays <code>Could not make Mini App available. Check your internet
        connection; retrying automatically.</code> The retry runs by itself. There is no tunnel to install.'
      html: true
  - p:
      ru: 'Бота ещё нет: отправьте <code>/newbot</code> в @BotFather, вставьте <code>Токен бота</code> и
        нажмите <code>Сохранить</code>. Дождитесь <code>Бот подключён</code>, нажмите
        <code>Получить код привязки</code> и отправьте команду <code>/pair</code> боту в личном чате.
        Код действует 10 минут и только один раз.'
      en: 'No bot yet: send <code>/newbot</code> to @BotFather, paste the <code>Bot token</code> and press
        <code>Save</code>. Wait for <code>Bot connected</code>, press <code>Get pairing code</code> and
        send the <code>/pair</code> command to the bot in a private chat. The code works once and expires
        after 10 minutes.'
      html: true
  - p:
      ru: 'Терминал сам ставит кнопку меню <code>Открыть</code> рядом с полем сообщения, в каждом
        привязанном личном чате. Кнопка может отстать примерно на полминуты после строки готовности.
        <code>/miniapp</code> отвечает сразу той же кнопкой <code>Открыть</code> под сообщением.
        Терминал должен оставаться запущенным.'
      en: 'The terminal itself sets the menu button <code>Open</code> beside the message field, in each
        paired private chat. The button can lag by about half a minute after the ready line.
        <code>/miniapp</code> answers at once with the same <code>Open</code> button under the message.
        Keep the terminal running.'
      html: true
  - note:
      ru: '<code>Скопировать адрес Mini App</code>, открытый в обычном браузере, загружает страницу и
        затем показывает <code>Терминал недоступен. Туннель или сам терминал выключен.</code> Группе
        приходит <code>Доступ запрещён.</code> Один токен работает в одном месте: строка конфликта
        называет другой терминал или станцию.'
      en: '<code>Copy Mini App address</code> opened in an ordinary browser loads the page and then shows
        <code>The terminal could not be reached. The tunnel or the terminal is down.</code> A group gets
        <code>Access denied.</code> One token runs in one place: the conflict line names the other
        terminal or the station.'
      html: true
  - group:
      ru: Когда станция уже настроена
      en: When a station is already set up
  - p:
      ru: 'Галки на этом компьютере больше нет. Та же вкладка пишет: <code>Бот работает на станции на
        сервере Linux. Установка, состояние и действия станции — во вкладке «Станция».</code> Блок Mini
        App называется <code>Mini App на сервере</code> — он виден, когда станция уже сообщила бота.
        Переключение применяется сразу и перезапускает станцию. Подсказка говорит, что вход идёт через
        туннель Cloudflare и Mini App не откроется там, где Cloudflare заблокирован. Круглосуточно без
        этого терминала — вкладка <code>Станция</code>, кнопка <code>Установить</code>. Экран
        подтверждения уже перечисляет, что установка меняет на сервере.'
      en: 'The checkbox on this computer is gone. The same tab says <code>The bot runs on the station on a
        Linux server. The station''s install, status and actions are in the Station tab.</code> The Mini
        App box is <code>Mini App on the server</code>, shown once the station has reported the bot. It
        applies at once and restarts the station. Its hint says the entrance is a Cloudflare tunnel and
        the Mini App will not open where Cloudflare is blocked. Round the clock without this terminal is
        the <code>Station</code> tab, button <code>Install</code>. The confirm screen already lists what
        the install changes on the server.'
      html: true
