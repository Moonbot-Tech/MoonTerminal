# Core Status panel: per-core update-queue phase badges/tooltips and the fleet-wide footer
# counters. Separate from `update.yml`, which is the TERMINAL's own self-update namespace.
_version: 2

# --- Per-core phase, shown as a badge beside the reported build and as its hover text ---
core_update.phase.queued:
  ru: "В очереди"
  en: "Queued"
  es: "En cola"
core_update.phase.held:
  ru: "Ожидает — линия занята"
  en: "Held — lane busy"
  es: "En espera — línea ocupada"
core_update.phase.sent:
  ru: "Команда отправлена"
  en: "Command sent"
  es: "Comando enviado"
core_update.phase.waiting:
  ru: "Обновляется"
  en: "Updating"
  es: "Actualizando"
core_update.phase.verifying:
  ru: "Проверяем версию"
  en: "Verifying build"
  es: "Verificando la versión"
core_update.phase.succeeded:
  ru: "Обновлено"
  en: "Updated"
  es: "Actualizado"
core_update.phase.unchanged:
  ru: "Версия не изменилась"
  en: "Version unchanged"
  es: "Versión sin cambios"
core_update.phase.failed.not_sent:
  ru: "Не удалось отправить команду"
  en: "Command failed to send"
  es: "No se pudo enviar el comando"
core_update.phase.failed.never_dropped:
  ru: "Ядро не отключилось для обновления"
  en: "Core never dropped for the update"
  es: "El núcleo no se desconectó para la actualización"
core_update.phase.failed.not_ready:
  ru: "Не удалось дождаться готовности ядра для отправки"
  en: "Never came back online in time to be sent the update"
  es: "No volvió a estar disponible a tiempo para enviarle la actualización"
core_update.phase.failed.timeout:
  ru: "Не вернулось после обновления — таймаут"
  en: "Did not come back after the update — timed out"
  es: "No volvió tras la actualización — tiempo agotado"
core_update.phase.failed.gone:
  ru: "Адрес ядра стал неизвестен"
  en: "Core's endpoint became unknown"
  es: "La dirección del núcleo dejó de ser conocida"
core_update.phase.failed.abandoned:
  ru: "Прервано выходом из приложения"
  en: "Abandoned when the application quit"
  es: "Abandonado al cerrar la aplicación"
core_update.phase.failed.rejected:
  ru: "Ядро отклонило запрошенную сборку"
  en: "Core refused the requested build name"
  es: "El núcleo rechazó el nombre de la build solicitada"

# --- Unverified: the update finished but the terminal could not confirm the returned build ---
core_update.phase.unverified.unavailable:
  ru: "Версию не удалось проверить — переподключение недоступно"
  en: "Build not verified — reconnect unavailable"
  es: "Versión no verificada — reconexión no disponible"
core_update.phase.unverified.timeout:
  ru: "Версию не удалось проверить — ядро не вернулось вовремя"
  en: "Build not verified — the core did not come back in time"
  es: "Versión no verificada — el núcleo no volvió a tiempo"

# --- Fleet-wide footer counters, drawn only while a campaign is active ---
core_update.summary.updating:
  ru: "обновляется"
  en: "updating"
  es: "actualizando"
core_update.summary.queued:
  ru: "в очереди"
  en: "queued"
  es: "en cola"
core_update.summary.failed:
  ru: "с ошибкой"
  en: "failed"
  es: "con error"

# --- Updates list (Core Status "Updates" mode): columns, empty state, target wording ---
core_update.col.time:
  ru: "Время"
  en: "Time"
  es: "Hora"
core_update.col.core:
  ru: "Ядро"
  en: "Core"
  es: "Núcleo"
core_update.col.server:
  ru: "Сервер"
  en: "Server"
  es: "Servidor"
core_update.col.from_to:
  ru: "С -> на"
  en: "From -> to"
  es: "De -> a"
core_update.col.target:
  ru: "Цель"
  en: "Target"
  es: "Objetivo"
core_update.col.outcome:
  ru: "Итог"
  en: "Outcome"
  es: "Resultado"
core_update.col.duration:
  ru: "Длительность"
  en: "Duration"
  es: "Duración"
core_update.list_empty:
  ru: "Нет записей об обновлениях"
  en: "No update history"
  es: "Sin historial de actualizaciones"
core_update.target.release:
  ru: "Релиз"
  en: "Release"
  es: "Lanzamiento"
core_update.target.named:
  ru: "Бета %{name}"
  en: "Beta %{name}"
  es: "Beta %{name}"
# --- Hover-revealed row/server update control (shared control, controls/core_update) ---
core_update.row.action:
  ru: "Обновить это ядро"
  en: "Update this core"
  es: "Actualizar este núcleo"
core_update.server.action:
  ru: "Обновить %{n} ядер на сервере"
  en: "Update %{n} core(s) on this server"
  es: "Actualizar %{n} núcleo(s) de este servidor"
core_update.retry:
  ru: "Повторить обновление"
  en: "Retry the update"
  es: "Reintentar la actualización"
core_update.skipped_offline:
  ru: "%{n} не в сети"
  en: "%{n} offline"
  es: "%{n} sin conexión"
core_update.skipped_already:
  ru: "%{n} уже обновляется"
  en: "%{n} already updating"
  es: "%{n} ya en actualización"
# --- Footer fleet-wide bulk actions and their single shared confirm ---
core_update.fleet.all:
  ru: "Обновить все"
  en: "Update all"
  es: "Actualizar todo"
core_update.fleet.behind:
  ru: "Обновить отстающие"
  en: "Update behind"
  es: "Actualizar atrasados"
core_update.fleet.behind_none:
  ru: "Ни одно ядро не отстаёт от самой новой версии, видимой здесь, а релизы Moonbot терминалу не видны."
  en: "Nothing here reports an older build than the newest one visible, and the terminal can't see Moonbot releases."
  es: "Nada aquí reporta una versión más antigua que la más nueva visible, y la terminal no puede ver los lanzamientos de Moonbot."
core_update.confirm.title:
  ru: "Обновление ядер"
  en: "Update cores"
  es: "Actualizar núcleos"
core_update.confirm.q:
  ru: "Обновить %{cores} ядер на %{servers} серверах? Обновления идут параллельно по серверам — не более одного ядра одновременно на каждом."
  en: "Update %{cores} cores across %{servers} servers? Updates run in parallel across servers — no more than one core at a time per server."
  es: "¿Actualizar %{cores} núcleos en %{servers} servidores? Las actualizaciones se ejecutan en paralelo entre servidores — no más de un núcleo a la vez por servidor."
# --- Row context menu: the ordinary release update, and the named beta/test build one level
# deeper (a free-text prompt -- MoonProto has no list of available builds to offer) ---
core_update.menu.release:
  ru: "Обновить до релиза"
  en: "Update to release"
  es: "Actualizar a la versión de lanzamiento"
core_update.menu.named:
  ru: "Обновить до именованной версии…"
  en: "Update to a named version…"
  es: "Actualizar a una versión con nombre…"
core_update.menu.named_prompt:
  ru: "Имя сборки для %{core}:"
  en: "Build name for %{core}:"
  es: "Nombre de la build para %{core}:"
core_update.menu.named_ph:
  ru: "MoonBot-F8 или %{cmd} MoonBot-F8"
  en: "MoonBot-F8 or %{cmd} MoonBot-F8"
  es: "MoonBot-F8 o %{cmd} MoonBot-F8"
core_update.menu.named_hint:
  ru: "Можно ввести только имя сборки или вставить всю команду установки — подойдёт и то, и другое."
  en: "You can type just the build name, or paste the whole install command — either works."
  es: "Puedes escribir solo el nombre de la build, o pegar el comando de instalación completo — ambos funcionan."
core_update.menu.unavailable:
  ru: "Недоступно — ядро не готово или уже обновляется"
  en: "Unavailable — core not ready or already updating"
  es: "No disponible — núcleo no listo o ya actualizándose"
