# News panel: translate toggle, coin/tag filters, relative time, latency chain, subscription.
# rust-i18n `_version: 2` format: key -> locale-to-string map. Interpolation: %{var}.
_version: 2

news.translate:
  ru: "Перевод"
  en: "Translate"
  es: "Traducir"
news.pending:
  ru: "перевод ожидается"
  en: "translation pending"
  es: "traducción pendiente"
news.time.sec:
  ru: "%{n}с назад"
  en: "%{n}s ago"
  es: "hace %{n}s"
news.time.min:
  ru: "%{n} мин назад"
  en: "%{n} min ago"
  es: "hace %{n} min"
news.time.hour:
  ru: "%{n} ч назад"
  en: "%{n} h ago"
  es: "hace %{n} h"
news.time.day:
  ru: "%{n} дн назад"
  en: "%{n} d ago"
  es: "hace %{n} d"
news.empty:
