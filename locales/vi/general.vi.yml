general.valuation.more: "«Tại thời điểm giao dịch»: số tiền không đổi theo thời gian, theo tỷ giá của phút giao dịch đóng. «Hiện tại»: mọi số tiền được quy đổi theo tỷ giá hôm nay.\n\nChỉ đổi khi cố ý: “Tỷ giá hiện tại” lấy tỷ giá mới nhất trên spot Binance/Bybit chứ không phải sàn đã giao dịch, làm mới vài phút một lần và không lưu. Việc này cũng đổi tinh chỉnh ngưỡng: ngưỡng được chọn theo lịch sử đã định giá lại. Có hiệu lực sau khi lưu."
