general.live_scope.more: "«Tất cả cùng lúc»: kéo một biểu đồ về quá khứ thì mọi biểu đồ đều tạm dừng, nút Live trên thanh công cụ cho thấy điều đó. «Từng biểu đồ riêng»: thao tác kéo chỉ ảnh hưởng biểu đồ đó; nó tự quay lại Live khi được đưa về mép phải hoặc để yên 3 phút. Tạm dừng trên thanh công cụ dừng mọi biểu đồ, Live đưa tất cả về hiện tại."
