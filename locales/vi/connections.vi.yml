conn.market_src_tip: "Chữ thập và sổ lệnh lấy từ đâu. Dedup: mỗi sàn một core nguồn lấy dữ liệu thị trường cho tất cả (tiết kiệm khi nhiều core). Theo core: mỗi biểu đồ đọc thị trường từ core của nó (không dedup)."
