conn.core_sort_tip: "Thứ tự core xuất hiện trong MỌI danh sách của ứng dụng: đầu cửa sổ, Lệnh, Tài sản, Báo cáo, Phân tích, Bộ lọc, Chiến lược, Nhật ký. Core mất kết nối giữ chỗ — trạng thái hiện ở chấm trạng thái."
conn.core_sort.name: "Theo tên — bảng chữ cái"
