conn.endpoint_no_address: "Khóa không có địa chỉ — terminal kết nối tới 127.0.0.1, tức máy tính này. Nếu core chạy trên máy khác, hãy nhập địa chỉ máy đó vào đây hoặc xuất lại khóa trong MoonBot: chọn Kernel (VPS) và nhấn Apply (hoặc nhập IP máy chủ vào ô IP), rồi Copy Key."


# Tooltips.
conn.tip.key: "Khóa được tạo trong MoonBot, không phải trên trang web, và được sao chép SAU khi core đã cài — khóa mang host, cổng và chế độ theo; địa chỉ và cổng có thể đổi ở cột Địa chỉ:cổng khi cần. Thứ tự: 1) trên máy chủ MoonBot, mở cổng UDP của core cho lưu lượng vào; 2) trong MoonBot: chấm xanh góc dưới trái (cửa sổ Info) → Moon Kernel → Settings → cửa sổ Moon Proto, tab Settings: chọn Kernel (VPS), đặt Port, chọn V0/V1/V2 (mặc định V0), nhấn Apply; 3) ở đó, Key: → Copy Key (chưa có khóa — New Key); 4) dán vào đây bằng nút Dán và nhấn Lưu. Con mắt hiện hoặc ẩn khóa."
conn.key_ph: "Copy Key trong MoonBot"
# Placeholder of the "Charts" cell. The field holds a bundle NAME, not a count (see
# `conn.tip.bundle` and `ServerConfig::chart_bundle`), so the placeholder has to say "name".
conn.bundle_ph: "tên liên kết"
conn.tip.proto: "Chế độ vận chuyển MoonProto - cùng bộ V0/V1/V2 như trong cài đặt Moon Proto của core; hai phía phải cùng MỘT chế độ. Lấy từ khóa MỘT lần, khi chưa có chế độ; sau đó là của bạn, và khóa mới không còn ghi đè - nên không cần phát hành lại khóa chỉ để đổi chế độ. Gạch ngang nghĩa là khóa không ghi gì (bản xuất cũ) và kết nối chạy như V0. Áp dụng khi Lưu: core tự kết nối lại. Vì vậy chỉ nhấn Copy Key SAU KHI đã đặt Port và phiên bản trên core bằng nút V0/V1/V2 (MoonBot tạo khóa V0 theo mặc định): khóa mang chúng theo."
conn.tip.preset: "Core này hiện trong danh sách ở chế độ không gian làm việc nào: cả hai, chỉ MANUAL, hoặc chỉ AUTO. Chỉ là hiển thị — core bị ẩn vẫn kết nối và vẫn ghi dữ liệu."
conn.tip.total: "Core này tính vào tổng chân trang Tài sản thế nào. Tự động: các core cùng tài khoản sàn tính một lần. Loại: core không vào tổng. Riêng: core luôn tính một mình, không gộp."
conn.preset.both: "Cả hai"
# The same two mode NAMES the header dropdown lists (`workspace.mode.*`): this column picks which
