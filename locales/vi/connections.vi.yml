conn.col.endpoint: "Địa chỉ:cổng"
conn.tip.endpoint: "Địa chỉ và cổng mà terminal dùng để kết nối tới core. Để trống — lấy từ khóa (hiện màu xám). Hãy nhập của bạn khi core nằm trong mạng nội bộ, địa chỉ trong khóa sai hoặc không có, hoặc nhà mạng đổi IP: địa chỉ, địa chỉ:cổng, :cổng hoặc tên máy. Khóa mới không ghi đè ô này; dấu X trả về địa chỉ của khóa. Biểu tượng đám mây cạnh ô đã điền quyết định station có nhận địa chỉ này không."
conn.endpoint_duplicate: "Địa chỉ và cổng này đã được core %{name} dùng"
conn.address_ph: "từ khóa"
conn.endpoint_hint: "Để trống — địa chỉ của khóa. Có thể nhập địa chỉ, địa chỉ:cổng, :cổng hoặc tên máy; khóa mới không ghi đè ô này."
conn.endpoint_invalid: "Đây không phải địa chỉ. Hợp lệ: 192.168.1.5, 192.168.1.5:5017, :5017, [2001:db8::1]:5017 hoặc tên máy. Khi ô còn màu đỏ, core không kết nối."
conn.endpoint_no_address: "Khóa không có địa chỉ — terminal kết nối tới 127.0.0.1, tức máy tính này. Nếu core chạy trên máy khác, hãy nhập địa chỉ máy đó vào đây hoặc xuất lại khóa trong MoonBot: chọn Kernel (VPS) và nhấn Apply (hoặc nhập IP máy chủ vào ô IP), rồi Copy Key."
conn.endpoint_to_station_on: "Station cũng kết nối tới core qua địa chỉ này. Nhấn để station quay lại dùng địa chỉ của khóa."
conn.endpoint_to_station_off: "Station kết nối tới core qua địa chỉ của khóa. Nhấn để chuyển cả địa chỉ này cho station — nếu máy chủ của station truy cập được (địa chỉ mạng nội bộ của bạn thì không). Địa chỉ tới station khi bạn gửi các core cho nó."
