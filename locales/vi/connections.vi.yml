conn.tip.group: "Nhóm = một cửa sổ chính RIÊNG. Mọi core cùng tên nhóm nằm trong một cửa sổ; tên nhóm mới → cửa sổ chính mới."
conn.tip.bundle: "Tên liên kết biểu đồ: tín hiệu AddToChart từ NHIỀU core của một nhóm cùng tên gộp thành MỘT biểu đồ (một tab, tên ở tiêu đề). Trống = theo cài đặt chung (một tab mỗi core / tất cả trong một)."
