assets.roster_resize: "Kéo để đổi độ rộng cột. Nhấp đúp để đặt lại"
assets.transfer_title: "Chuyển %{coin}: %{from} -> %{to}"
assets.free: "khả dụng: %{n}"
assets.transfer_btn: "Chuyển"
