# --- Filters and combo boxes ---
report.filter.all: "Tất cả"
report.all_strategies: "Mọi chiến lược"
report.search_strategies: "Tìm chiến lược..."
# Separate Auto-workspace report filter. Unlike the exact picker search above, this value narrows the
# report itself by a strategy-name query in the shared syntax (comma = OR, space = AND,
# !word = exclude; see common.strategy_query_syntax).
report.filter.strategy_mask_ph: "Mặt nạ chiến lược"
report.filter.strategy_mask_tip: "Lọc báo cáo theo tên chiến lược."
report.filter.from: "Từ:"
report.filter.to: "Đến:"
# Doubles as the field's caption: there is no label beside it, so the placeholder names it.
report.filter.coin_ph: "Coin"
# Hover text of the coin field; a `=` beside the field marks the exact mode it describes.
report.filter.coin_tip: "Một phần ticker tìm mọi coin chứa nó (io: IO, BIO, IOTA). Dấu cách ở cuối hoặc chọn từ danh sách thì tìm đúng ticker (io : chỉ IO và hợp đồng của nó như IO_0925), đánh dấu bằng '=' cạnh ô."
report.filter.date_ph: "Ngày và giờ"
# Deleted row of the merged scope field. Off (default) hides trades soft-deleted in the core's
# report; on shows ONLY them. Export follows the same filter.
report.filter.deleted: "Chỉ đã xóa"
# Lifecycle row of the merged scope field, an axis independent of the real/emulator group above:
# that one is a trade's ORIGIN, this one is whether it has closed. On (default) shows still-running
# positions alongside closed trades, in the table AND in the totals; off removes them from both,
# and the export follows the same filter. Disabled on an Analytics-scoped Report, which forces
# closed rows regardless. Wording matches `report.open_positions_tip` so the switch and the footer
# figure it governs use one vocabulary.
report.filter.open_rows: "Vị thế đang mở"
# Full-width comment pane between the table and the totals: `show` is its row in the scope field.
# The pane reuses `show` as its caption; with no row selected the strip is simply empty.
report.comment.show: "Ghi chú giao dịch"
# Shown when a trade IS selected and its comment is empty. With no trade selected the pane stays
# blank instead — the two states must not read alike.
report.comment.empty: "không có ghi chú"
# Tooltip of the merged scope field. It states the two switch semantics the row labels alone
# cannot: the deleted one is EXCLUSIVE (on shows only those), the open-positions one is INCLUSIVE
# (off removes them from the table and the totals alike).
report.filter.scope_tip: "Chiều, loại giao dịch, giao dịch đã xóa, vị thế đang mở và ô ghi chú. “Chỉ đã xóa” tắt — giao dịch đã xóa bị ẩn; bật — chỉ hiện chúng. “Vị thế đang mở” tắt — bảng và tổng chỉ hiện giao dịch đã đóng."
# Abbreviation appended to the scope trigger while the row above is on.
report.filter.deleted_short: "xóa"
# Fixed title of the scope trigger; the non-default choices follow it after a middle dot.
report.filter.title: "Bộ lọc"
# Difference appended to the scope trigger while "Open positions" is off.
report.filter.closed_only_short: "đã đóng"
# First row of the scope field's direction group. Named "all sides" rather than a bare "all" so it
# does not read as the same option as the kind group's own first row.
report.filter.all_sides: "Mọi chiều"
# Error toast when a soft-delete/restore could not be sent (the core is offline or gone). The
# affected rows stay selected so nothing is silently lost.
report.delete_send_failed: "Không gửi được thay đổi: core không khả dụng. Các dòng vẫn được chọn."
# Selection commands shown in the totals row only while report rows are selected.
report.selection.count: "Đã chọn: %{n}"
report.selection.clear: "Bỏ chọn"
report.selection.copy: "Chép"
report.selection.delete: "Xóa (%{n})"
report.selection.restore: "Khôi phục (%{n})"
report.selection.copied: "Đã chép giao dịch: %{n}"
report.selection.delete_queued: "Đã xếp hàng xóa: %{n}. Lựa chọn hết sau khi core trả lời."
report.selection.restore_queued: "Đã xếp hàng khôi phục: %{n}. Lựa chọn hết sau khi core trả lời."
# The trigger draws a MoonUI icon asset, added in code; the dictionary contains text only.
report.columns_menu: "Cột"
# Menu for saving the report to a file (the ⇩ button left of Columns). The query period comes from
# the panel's current filter (preset or From/To dates). CSV and Excel remain untranslated.
report.export_menu: "Lưu báo cáo ra file (CSV / Excel)"
report.export.ok: "Đã xuất %{n} dòng"
report.export.fail: "Xuất thất bại — không lưu file"
report.export.csv: "CSV"
