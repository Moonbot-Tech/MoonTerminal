# --- Problems mode: the three diagnostic actions ---
# The reset and the re-read mirror MoonBot's own Problems window; the test is ours.
#
# A test publishes a `test` fact through the core's own detector worker (~2 s) and PROVES the
# channel end to end. It leaves a row behind that only the reset removes, which is why that pair
# ships together.
core_status.problems_test: "Thử kênh"
# Deliberately NOT MoonBot's "reset all", though it is the same command on the wire. MoonBot's
# window belongs to one core, so "all" there means all of that core's findings; this panel spans a
# fleet, where the same word reads as "all cores" and would be a lie the moment the operator has
# picked one. The button acts on the panel's scope, and the tooltip and the confirm both say how
# many cores that is.
core_status.problems_clear: "Đặt lại"
core_status.problems_test_tip: "Đăng một sự kiện thử qua bộ dò của chính core — khoảng hai giây. Chứng minh cả đường: bộ dò, dây, phép chiếu, bảng."
core_status.problems_refresh: "Làm mới"
# Said out loud because the label promises a round trip the protocol cannot make: a core pushes its
# list, nothing can ask for one. Saying so here is cheaper than an operator concluding the button is
# broken when a stale row does not move.
core_status.problems_refresh_tip: "Đọc lại những gì các core đã kết nối (%{cores}) đã gửi tới giờ. Nhấp một dòng để chỉ đọc lại core đó. Không xin được danh sách mới: giao thức không có lệnh đó — core tự gửi, khi kết nối và mỗi khi bộ dò của nó đổi danh sách. Nên nhấn sau khi core khởi động lại, khi các dòng cũ không còn nói về nó."
# The blast radius, stated BEFORE the dialog: an operator who picked no core is acting on the whole
# scope, and that is the difference between a tidy-up and a fleet-wide loss.
# The one-core forms, for when a clicked finding has narrowed the action. The scope-wide wording
# would state a falsehood about the panel ("connected cores: 1" for a scope of twenty-six) and would
# keep advising a click that, in this state, cancels the pick instead of making one.
core_status.problems_clear_tip_one: "Đặt lại chẩn đoán của core đã chọn — không hoàn lại, và với mọi terminal. Nhấp lại dòng của nó để về cả phạm vi"
core_status.problems_refresh_tip_one: "Đọc lại những gì core đã chọn đã gửi tới giờ. Không xin được danh sách mới: giao thức không có lệnh đó. Nhấp lại dòng của nó để về cả phạm vi"
core_status.problems_clear_tip: "Đặt lại chẩn đoán. Core đã kết nối: %{cores}. Không hoàn lại, và với mọi terminal. Nhấp một dòng để chỉ đặt lại core đó"
# The test is per-core on the wire and has no fleet-wide form worth having: publishing a test fact
# on two hundred cores litters two hundred cores. So it alone needs one core named.
core_status.problems_pick_core: "Lần thử đi tới một core: nhấp dòng sự cố của core đó trong bảng — hoặc thu phạm vi bảng về một core"
core_status.problems_picked_offline: "Core đã chọn đang ngoại tuyến — lệnh sẽ đợi nó trở lại"
core_status.problems_no_online: "Không có core nào trong phạm vi bảng đã kết nối"
# Guards the TEST alone. The command channel outlives the connection, so a queued test would fire on
# the next reconnect and publish its fact at some unannounced later moment, on a core the operator
# stopped looking at hours ago.
core_status.problems_core_offline: "Core đang ngoại tuyến — lần thử sẽ đợi lần nối lại và đăng sự kiện vào một lúc không báo trước"
core_status.problems_test_title: "Gửi một chẩn đoán thử?"
# The consequence is the whole reason this action is confirmed at all.
core_status.problems_test_q: "Core %{core} sẽ đăng một sự kiện thử qua bộ dò của chính nó — khoảng hai giây. Dòng ở lại trên core, và cách DUY NHẤT để gỡ là đặt lại, việc đó cũng xóa các phát hiện thật của core đó."
core_status.problems_test_sent: "Đã gửi thử tới %{core} — dòng xuất hiện sau vài giây"
core_status.problems_clear_sent: "Đã gửi đặt lại tới %{core} — các dòng mất khi core gửi danh sách tiếp theo"
core_status.problems_clear_sent_many: "Đã gửi đặt lại tới %{cores} core — các dòng mất khi các core đó gửi danh sách tiếp theo"
# Says what it re-read, not "done": the honest outcome of a re-read that found nothing new is an
# unchanged table, and a message claiming more would make that look like a failure.
core_status.problems_refreshed: "Core đã đọc lại: %{cores}"
# The shortfall, never a bare success: a fleet action that reached nine of twelve cores has failed
# on three, and only the toast can say so.
core_status.problems_fleet_none: "Không tới core nào trong %{cores} core — ngoại tuyến, hoặc kênh lệnh của chúng đóng"
core_status.problems_fleet_partial: "Tới %{sent} trong %{cores} core — số còn lại ngoại tuyến hoặc kênh đóng"
core_status.problems_not_sent: "Không gửi: kênh lệnh của core đóng"
core_status.problems_not_sent_offline: "Không gửi: core đang ngoại tuyến"
core_status.problems_clear_title: "Đặt lại chẩn đoán của core?"
# Blunt on purpose: the protocol's own warning is that cleared real diagnostics cannot be restored.
core_status.problems_clear_q: "Core %{core} sẽ bỏ mọi sự cố đã xác nhận và giả thuyết đang chờ — với mọi terminal, không có đường quay lại. Việc này không xử lý nguyên nhân: nếu nguyên nhân còn, core sẽ xác nhận sự cố lần nữa."
core_status.problems_clear_title_many: "Đặt lại chẩn đoán của nhiều core?"
# The core NAMES, not just how many: a count is nothing an operator can check, and this dialog is
# the last place the mistake is still cheap.
core_status.problems_clear_q_many: "Mỗi core trong %{cores} core này sẽ bỏ mọi sự cố đã xác nhận và giả thuyết đang chờ — với mọi terminal, không có đường quay lại. Việc này không xử lý nguyên nhân: những gì còn lại sẽ được xác nhận lần nữa."
