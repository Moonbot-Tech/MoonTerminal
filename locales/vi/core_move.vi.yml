# --- The server's key, before anything is sent ---
core_move.review.fingerprint: "Máy chủ %{addr} đưa ra khóa %{fingerprint}. Hãy so sánh với khóa mà nhà cung cấp của bạn hiển thị."
core_move.review.what: "Việc chuyển đăng nhập bằng tài khoản này, cài MoonBot cho Linux vào thư mục, tải lên cài đặt và cơ sở dữ liệu báo cáo của lõi, và mở cổng UDP trên tường lửa."
