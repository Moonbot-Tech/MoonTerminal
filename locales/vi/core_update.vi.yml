core_update.phase.unchanged: "Phiên bản không đổi"
core_update.phase.failed.not_sent: "Không gửi được lệnh"
core_update.phase.failed.never_dropped: "Core không ngắt để cập nhật"
core_update.phase.failed.not_ready: "Không trở lại trực tuyến kịp để nhận bản cập nhật"
