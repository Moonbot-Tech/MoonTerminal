# The rolling presets are labelled by their day count, matching report.period.*. A bare week or year
# label beside a current-month / current-year label reads as a calendar period and is not one.
# This Period enum has calendar month and calendar year (`cur_month` / `cur_year`) but no calendar
# week key of its own; the Profit Monitor's separate preset set borrows `report.period.cur_week`
# directly instead of duplicating it here.
# Labels only: persisted selection uses stable `p-week` / `p-year` / `p-cur-year` ids, so this
# needs no layout migration. `p-year` stays rolling 365 days; `p-cur-year` is the civil year.
# A rolling 7-day window ending today.
analytics.period.week: "7 ngày"
