# (`analytics/profit_monitor/model.rs`), the same way it already borrows `cur_month`/`cur_year`.
analytics.period.last_month: "Tháng trước"
# Calendar year from January 1st.
analytics.period.cur_year: "Năm nay"
# A rolling 30-day window — NOT a calendar month.
