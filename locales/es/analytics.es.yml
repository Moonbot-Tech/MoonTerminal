analytics.ticks.suggest_all_tip: "Buscar todos los campos marcados de los grupos que se pueden buscar (con modelo y al menos una operación reproducida) — ahora %{n}. Un campo marcado se busca de nuevo desde los valores de la estrategia, tenga lo que tenga V1; su celda de V1 recibe la respuesta y se vacía si coincide con la de la estrategia. Un campo sin marcar queda como en V1 y su celda no se toca, salvo el valor que requiere un interruptor que la búsqueda active (UseTakeProfit → TakeProfit): un valor para todas las estrategias"
