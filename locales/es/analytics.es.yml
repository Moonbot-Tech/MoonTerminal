analytics.tuner.compose_run: "Componer conjunto"
analytics.tuner.compose_help: "Compara tres caminos equivalentes: un conjunto propio, la búsqueda conjunta en todos los campos permitidos y ningún filtro adicional. Hasta %{seeds} seeds independientes comprueban cada corte temporal; primero votan los seeds dentro del corte y después los cortes. El beam conserva 8 ramas con un límite claro y se amplía hasta 16 cuando es ambiguo. La cifra decisiva es la GANANCIA ADICIONAL: el beneficio fuera de muestra menos lo que habría ganado el mismo número de operaciones sin filtrar, de modo que «sin filtros» no gana solo por conservarlas todas; solo cuenta por encima de un mínimo de operaciones conservadas. Con resultados cercanos se usan PF, menor drawdown y beneficio absoluto. Si los cortes reservados no separan nada, el resultado lo indica. Las casillas siguen siendo el límite. Debe seleccionarse una estrategia."
