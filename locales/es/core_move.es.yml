# A core moved onto a Linux server: the card button, the move's steps, warnings and outcomes.
_version: 1

core_move.card_button: "Mover a VPS…"
core_move.save_first: "Guarda primero el núcleo: el traslado necesita su clave guardada y su historial."

# --- Outcomes ---
core_move.lost: "El traslado se interrumpió sin respuesta: su hilo terminó."
core_move.switched: "Este terminal ahora se conecta al nuevo núcleo."
core_move.switch_failed: "El nuevo núcleo funciona en %{address}, pero este terminal no pudo cambiar a él: %{reason}. Pon esa dirección en el núcleo en Conexiones."
core_move.probe_failed: "No se pudo leer la clave del servidor: %{reason}"
core_move.failed: "El traslado falló: %{reason}"
core_move.failed_removed: "El traslado falló: %{reason}. El nuevo núcleo nunca se inició y se eliminó del servidor."
core_move.failed_left: "El traslado falló: %{reason}. El nuevo núcleo en %{dir} nunca se inició y no se pudo eliminar: %{remove}"
core_move.failed_started: "El traslado falló: %{reason}. El nuevo núcleo queda en %{dir} y el antiguo puede estar detenido: revisa ambos antes de operar."
core_move.failed_old_stopped: "El traslado falló: %{reason}. El núcleo antiguo está detenido y el nuevo está instalado en %{dir} pero sin iniciar: inicia uno de los dos antes de operar."
core_move.logged_in: "Sesión iniciada como %{user}."
core_move.old_stopped_by_hand: "El núcleo antiguo está detenido."

# --- Progress lines ---
core_move.step.snapshot: "Ajustes tomados del núcleo: %{size} MB, exchange %{exchange}."
core_move.step.composed: "Archivo de ajustes listo para %{exchange}."
core_move.step.composed_db: "Archivo de ajustes listo para %{exchange}, con la base de informes."
core_move.step.report_db: "Base de informes reconstruida: filas %{rows}, abiertas %{open}."
core_move.step.report_db_skipped: "Este terminal no tiene operaciones de este núcleo: no hay de qué reconstruir la base de informes."
core_move.step.strategies_read: "Estrategias leídas: %{n}, carpetas: %{folders}."
core_move.step.checked: "El servidor puede ejecutar MoonBot; el puerto está libre."
core_move.step.uploaded: "Ajustes subidos."
core_move.step.installed: "El nuevo núcleo está instalado, sin iniciar."
core_move.step.stop_requested: "Pidiendo al núcleo antiguo que se detenga…"
core_move.step.old_stopped: "El núcleo antiguo está detenido."
core_move.step.old_refused: "El núcleo antiguo no se detiene: operaciones sin terminar: %{n}."
core_move.step.old_refused_unknown: "El núcleo antiguo no se detiene."
core_move.step.started: "El nuevo núcleo arrancó y escucha."
core_move.step.strategies_written: "Estrategias escritas en el nuevo núcleo: %{n}; eliminadas las suyas: %{deleted}."
core_move.step.finished: "Indicador de primer arranque retirado."
core_move.step.removed: "El nuevo núcleo se eliminó del servidor."
core_move.warn.exchange: "No se pudo preguntar el exchange al núcleo antiguo: %{detail}"
core_move.warn.strategies_read: "No se pudieron leer las estrategias del núcleo antiguo; se usa el archivo de la instantánea: %{detail}"
core_move.warn.strategies_refresh: "No se pudieron releer las estrategias; se lleva el conjunto anterior: %{detail}"
core_move.warn.strategies_written: "Las estrategias del nuevo núcleo no están confirmadas: %{detail}"

# --- The station ---
core_move.station.same: "La estación ya tiene la nueva dirección."
core_move.station.not_followed: "La estación no sigue este núcleo."
core_move.station.sent: "La nueva dirección se envió a la estación."
core_move.station.failed: "La estación no aceptó la nueva dirección: %{reason}"
core_move.station.none: "No hay estación configurada desde este terminal."

# --- The new core's own word after its start ---
core_move.settled: "El núcleo nuevo entró en el exchange y escucha MoonProto."
core_move.not_settled: "El núcleo nuevo aún no está listo (%{state}) %{detail}; el traslado continúa: el núcleo antiguo ya está detenido."
core_move.status_unread: "No se leyó el estado del núcleo nuevo: %{reason}; el traslado continúa."
core_move.settling: "Núcleo nuevo: %{state}…"
