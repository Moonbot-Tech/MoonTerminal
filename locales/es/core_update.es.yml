core_update.fleet.named: "A una build…"
core_update.confirm.title: "Actualizar núcleos"
# The question is composed: cores and servers are the counted phrases below.
core_update.confirm.cores_one: "%{n} núcleo"
core_update.confirm.cores_few: "%{n} núcleos"
core_update.confirm.cores_many: "%{n} núcleos"
core_update.confirm.servers_one: "en %{n} servidor"
core_update.confirm.servers_few: "en %{n} servidores"
core_update.confirm.servers_many: "en %{n} servidores"
core_update.confirm.q_release: "¿Actualizar %{cores} %{servers} a la versión de lanzamiento?"
core_update.confirm.q_named: "¿Actualizar %{cores} %{servers} a la build indicada abajo?"
