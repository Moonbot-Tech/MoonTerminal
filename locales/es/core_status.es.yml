# --- Problems mode: the three diagnostic actions ---
# The reset and the re-read mirror MoonBot's own Problems window; the test is ours.
#
# A test publishes a `test` fact through the core's own detector worker (~2 s) and PROVES the
# channel end to end. It leaves a row behind that only the reset removes, which is why that pair
# ships together.
core_status.problems_test: "Probar el canal"
# Deliberately NOT MoonBot's "reset all", though it is the same command on the wire. MoonBot's
# window belongs to one core, so "all" there means all of that core's findings; this panel spans a
# fleet, where the same word reads as "all cores" and would be a lie the moment the operator has
# picked one. The button acts on the panel's scope, and the tooltip and the confirm both say how
# many cores that is.
core_status.problems_clear: "Restablecer"
core_status.problems_test_tip: "Publica un hecho de prueba mediante el propio detector del núcleo — unos dos segundos. Demuestra todo el recorrido: detector, cable, proyección, panel."
core_status.problems_refresh: "Actualizar"
# Said out loud because the label promises a round trip the protocol cannot make: a core pushes its
# list, nothing can ask for one. Saying so here is cheaper than an operator concluding the button is
# broken when a stale row does not move.
core_status.problems_refresh_tip: "Vuelve a leer lo que hayan enviado los núcleos conectados (%{cores}). Haz clic en una fila para releer solo ese núcleo. No se puede pedir una lista nueva: el protocolo no tiene ese comando — el núcleo la envía por sí mismo, al conectar y cuando sus detectores la cambian. Útil tras reiniciar un núcleo, cuando las filas antiguas ya no hablan de él."
# The blast radius, stated BEFORE the dialog: an operator who picked no core is acting on the whole
# scope, and that is the difference between a tidy-up and a fleet-wide loss.
# The one-core forms, for when a clicked finding has narrowed the action. The scope-wide wording
# would state a falsehood about the panel ("connected cores: 1" for a scope of twenty-six) and would
# keep advising a click that, in this state, cancels the pick instead of making one.
core_status.problems_clear_tip_one: "Restablece los diagnósticos del núcleo seleccionado — de forma irreversible y para todos los terminales. Haz clic en su fila otra vez para volver a todo el ámbito"
core_status.problems_refresh_tip_one: "Vuelve a leer lo que haya enviado el núcleo seleccionado. No se puede pedir una lista nueva: el protocolo no tiene ese comando. Haz clic en su fila otra vez para volver a todo el ámbito"
core_status.problems_clear_tip: "Restablece los diagnósticos. Núcleos conectados: %{cores}. Irreversible y para todos los terminales. Haz clic en una fila para restablecer solo ese núcleo"
# The test is per-core on the wire and has no fleet-wide form worth having: publishing a test fact
# on two hundred cores litters two hundred cores. So it alone needs one core named.
core_status.problems_pick_core: "La prueba va a un solo núcleo: haz clic en su hallazgo en la tabla — o reduce el ámbito del panel a un único núcleo"
core_status.problems_picked_offline: "El núcleo seleccionado está desconectado — el comando esperaría su regreso"
core_status.problems_no_online: "Ningún núcleo del ámbito del panel está conectado"
# Guards the TEST alone. The command channel outlives the connection, so a queued test would fire on
# the next reconnect and publish its fact at some unannounced later moment, on a core the operator
# stopped looking at hours ago.
core_status.problems_core_offline: "El núcleo está desconectado — la prueba esperaría su reconexión y publicaría su hecho en un momento posterior no anunciado"
core_status.problems_test_title: "¿Enviar un diagnóstico de prueba?"
# The consequence is the whole reason this action is confirmed at all.
core_status.problems_test_q: "El núcleo %{core} publicará un hecho de prueba mediante su propio detector — unos dos segundos. La fila permanece en el núcleo y la ÚNICA forma de quitarla es el restablecimiento, que también destruye los hallazgos reales de ese núcleo."
core_status.problems_test_sent: "Prueba enviada a %{core} — la fila aparece en un par de segundos"
core_status.problems_clear_sent: "Restablecimiento enviado a %{core} — las filas se irán cuando el núcleo envíe su próxima lista"
core_status.problems_clear_sent_many: "Restablecimiento enviado a %{cores} núcleos — las filas se irán cuando esos núcleos envíen sus próximas listas"
# Says what it re-read, not "done": the honest outcome of a re-read that found nothing new is an
# unchanged table, and a message claiming more would make that look like a failure.
core_status.problems_refreshed: "Núcleos releídos: %{cores}"
# The shortfall, never a bare success: a fleet action that reached nine of twelve cores has failed
# on three, and only the toast can say so.
core_status.problems_fleet_none: "No llegó a ninguno de los %{cores} núcleos — desconectados o con el canal de comandos cerrado"
core_status.problems_fleet_partial: "Llegó a %{sent} de %{cores} núcleos — el resto está desconectado o con el canal cerrado"
core_status.problems_not_sent: "No enviado: el canal de comandos del núcleo está cerrado"
core_status.problems_not_sent_offline: "No enviado: el núcleo está desconectado"
core_status.problems_clear_title: "¿Restablecer los diagnósticos del núcleo?"
# Blunt on purpose: the protocol's own warning is that cleared real diagnostics cannot be restored.
core_status.problems_clear_q: "El núcleo %{core} descartará todos los problemas confirmados y las hipótesis pendientes — para todos los terminales, sin vuelta atrás. No corrige ninguna causa: si persiste, el núcleo confirmará el problema de nuevo."
core_status.problems_clear_title_many: "¿Restablecer los diagnósticos de varios núcleos?"
# The core NAMES, not just how many: a count is nothing an operator can check, and this dialog is
# the last place the mistake is still cheap.
core_status.problems_clear_q_many: "Cada uno de estos %{cores} núcleos descartará todos los problemas confirmados y las hipótesis pendientes — para todos los terminales, sin vuelta atrás. No corrige ninguna causa: las que persistan se confirmarán de nuevo."
