# Settings -> Telegram -> the bot's segment -> "Station on a Linux server".
telegram.server.section: "Estación en un servidor Linux"
telegram.server.intro: "El bot, la Mini App y los informes funcionan en tu propio servidor Linux las 24 horas, incluso con el terminal apagado. El terminal configura el servidor por SSH y traslada allí el bot."
telegram.server.intro_more: "Al configurarlo, el terminal cierra el acceso por contraseña, instala el servicio y le pasa las claves de todos los núcleos activos. Unos 25 núcleos quieren cerca de un tercio de una máquina entera que no sea burstable y unos cientos de MB libres en un servidor de 1 GB. La base del 10% de un t3.micro burstable queda por debajo; si el estado vuelve con \"0 min\", revisa CPUCreditBalance (AWS) y killed / oom en el diario del servicio."
telegram.server.host: "IP del servidor"
telegram.server.login: "Usuario"
telegram.server.by_key: "Entrar con una clave SSH"
telegram.server.key_path: "Archivo de clave"
telegram.server.key_browse: "Examinar…"
telegram.server.passphrase: "Contraseña de la clave"
telegram.server.key_hint: "Ruta a una clave privada ed25519, ECDSA o RSA (OpenSSH, PuTTY .ppk, PKCS#8 o RSA PEM / PKCS#1). La contraseña solo si la clave está cifrada."
telegram.server.sudo_password: "Contraseña de sudo"
telegram.server.password: "Contraseña"
telegram.server.first_login_hint: "El acceso del proveedor (IP, usuario, contraseña de root o clave) se usa una vez y no se guarda. Tras la instalación, el acceso por contraseña queda cerrado y el terminal entra con su propia clave."
telegram.server.old_admin: "Contraseña anterior de moon"
telegram.server.release_hint: "El servicio se instala desde la última versión de MoonTerminal en GitHub, para la arquitectura del servidor (SHA-256 comprobado)."
telegram.server.transfer_hint: "El bot del terminal se traslada al servidor: su token, los chats y sus accesos. Cuando el bot funcione allí, el terminal borra su propio token; un bot local necesitará otro token. Si el traslado falla, el bot se queda en el terminal."
telegram.server.mini_app: "Mini App en el servidor"
telegram.server.mini_app_hint: "La Mini App se abre a través de un túnel de Cloudflare: donde Cloudflare está bloqueado no se abrirá, así que desactívala. Cambiarlo reinicia la estación."
