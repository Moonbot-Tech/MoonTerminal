telegram.server.section: "Estación en un servidor Linux"
telegram.server.intro: "El bot, la Mini App y los informes funcionan en tu propio servidor Linux las 24 horas, incluso con el terminal apagado. El terminal configura el servidor por SSH: cierra el acceso por contraseña, instala el servicio, le pasa las claves de todos los núcleos activos y traslada el bot."
