telegram.server.password: "Contraseña"
telegram.server.first_login_hint: "El acceso del proveedor (IP, usuario, contraseña de root o clave) se usa una vez y no se guarda. Tras la instalación, el acceso por contraseña queda cerrado y el terminal entra con su propia clave."
telegram.server.old_admin: "Contraseña anterior de moon"
telegram.server.release_hint: "El servicio se instala desde la última versión de MoonTerminal en GitHub, para la arquitectura del servidor (SHA-256 comprobado)."
telegram.server.transfer_hint: "El bot del terminal se traslada al servidor: su token, los chats y sus accesos. Cuando el bot funcione allí, el terminal borra su propio token; un bot local necesitará otro token. Si el traslado falla, el bot se queda en el terminal."
telegram.server.mini_app: "Mini App en el servidor"
