hotkeys.ruler_drag_hint: "Mantenga el modificador y arrastre con el botón izquierdo sobre el gráfico: muestra cuánto se movió el precio en porcentaje, en cuánto tiempo y cuánto se compró y vendió en ese tramo. Al soltar no queda nada. Mientras se mantiene el imán de dibujo (Ctrl, Cmd en macOS), los extremos se ajustan a los precios de las velas; con la regla en Ctrl, el imán funciona mientras Ctrl esté pulsado. Solo en el gráfico: en el libro de órdenes las mismas pulsaciones siguen siendo gestos de trading, y una línea de orden bajo el puntero se arrastra como antes."
