core_expert.waiting: "Esperando los ajustes del núcleo: el núcleo los envía en segundo plano tras conectarse."
core_expert.replaced: "En esta conexión responde ahora otro proceso de Moonbot. La página anterior se descartó en vez de escribirse en el nuevo proceso; los cambios preparados se conservan y se aplicarán sobre la nueva página cuando llegue."
