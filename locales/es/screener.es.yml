# Screener window with a Moonbot-style coin table.
# Column headers (Vol./ASK/Funding/…) are Moonbot domain tokens and remain untranslated in code.
_version: 1

screener.core_group_one: "%{n} núcleo"
screener.core_group_few: "%{n} núcleos"
screener.core_group_many: "%{n} núcleos"
screener.core_group_more_one: "%{n} más"
screener.core_group_more_few: "%{n} más"
screener.core_group_more_many: "%{n} más"
screener.footer_cores_one: "%{n} núcleo"
screener.footer_cores_few: "%{n} núcleos"
screener.footer_cores_many: "%{n} núcleos"
screener.empty_query_and_vol: "No hay monedas que coincidan con «%{query}» (Vol. desde %{vol})"
screener.empty_vol_filter: "No hay monedas con Vol. desde %{vol} — borra el filtro"

screener.window_title: "MoonTerminal — Screener"
# Three different reasons the coin table can be empty, three different sentences. `screener.empty`
# is the only one that asks for an action, so it is reserved for the only case where that action
# helps: no core is connected at all. A connected core that has not published a book yet gets
# `screener.empty_no_data`, and a core hidden by the workspace preset gets the shared
# `workspace.scope.all_hidden` instead of either.
screener.empty: "Sin datos de mercado — conecta un núcleo"
screener.empty_no_data: "Aún no se han recibido datos de mercado"
# A fourth: rows WERE published and the bottom bar's controls — the Type and Listed lists, a text
# or volume filter — left none of them.
screener.empty_filtered: "Ninguna fila coincide con los filtros actuales"
# A fifth: the Listed list emptied the table while its answers are still on their way — the
# cores connected under a minute ago. `%{n}` is the whole seconds left; `Listed` is the column's
# title and stays as it is.
screener.listed_collecting: "Listed aún se está recopilando: quedan %{n} s"
screener.coins: "monedas"
screener.all_cores: "Todos los núcleos"
screener.cores_n: "Núcleos: %{n}"
screener.columns: "Columnas"
# The cross-listing column and the list that filters it. The three values are Moonbot's own words for its
# `ListedType` strategy filter and stay English in the filter menu.
screener.listed_both: "Both"
screener.listed_spot_only: "Spot Only"
screener.listed_futures_only: "Futures Only"

# Short localized captions for Type and Listed cells.
screener.kind_short_spot: "Cont."
screener.kind_short_futures: "Futu."
screener.kind_short_quarterly: "Trim."
screener.listed_short_both: "Ambos"
screener.listed_short_spot_only: "Cont."
screener.listed_short_futures_only: "Futu."
screener.default_view: "Vista predeterminada"
# The auto-figures column (docs-internal/AUTO_FIGURES.md 13.4): its filter list and approach box,
# the Calculate button with its progress (`%{done}` of `%{total}` markets) and tooltips, the words a
# cell shows, and what an empty table says while the filter has nothing to go by. The column's own
# name is `auto_figures.title`, the event names are `auto_figures.event.*`.
screener.af_approach: "Aproximación ≤"
screener.af_calculate: "Calcular"
screener.af_progress: "Calculando %{done} / %{total}"
screener.af_calculate_tip: "Buscar figuras automáticas en todos los mercados del Screener con la caché local de velas de 5 minutos, con las filas del conjunto Main"
screener.af_restart_tip: "Calculando: pulsa para empezar de nuevo"
screener.af_no_rows_tip: "El conjunto de figuras automáticas de Main no tiene filas activadas"
screener.af_nothing: "nada"
screener.af_short: "poco historial"
screener.af_no_cache: "sin caché"
screener.af_unread: "caché no leída"
screener.af_stale: "caché atrasada %{age}"
screener.af_press_calculate: "Pulsa «Calcular» para elegir monedas por figuras automáticas"
screener.af_running: "Calculando figuras automáticas…"
# The row menu's copy entries (#1164): every listed coin, or those from the top of the current sort
# through the clicked row, as one comma-separated line. The menu shows the count; %{n} in the toast
# is that count.
screener.copy_coins_on_screen: "Copiar monedas en pantalla"
screener.copy_coins_through_row: "Copiar monedas hasta esta fila"
screener.coins_copied: "Monedas copiadas: %{n}"
