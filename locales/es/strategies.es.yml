strat.fields_refresh_buys_tip: "Guardar los cambios y solicitar la actualización de BUY de MoonShot al cambiar OrderSize, Short, EmulatorMode o AutoCancelBuy. El núcleo cancela los BUY pendientes afectados uno por ciclo del temporizador de MoonShot; los nuevos se colocan bajo las condiciones habituales, no necesariamente de inmediato. Las órdenes en fase de venta no se modifican. La confirmación solo cubre los ajustes. Los núcleos antiguos ignoran la solicitud. Espere la confirmación antes de otro envío; los ajustes sin cambios no fuerzan la actualización. Tras un tiempo de espera agotado, revise las órdenes y use sus controles habituales si es necesario."
