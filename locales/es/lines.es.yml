# Lines tab of the Settings window (order-line styling, orders.toml).
# rust-i18n `_version: 1` format: one language per file, flat dotted keys. Interpolation: %{var}.
_version: 1

# Line names (Order lines, Buy/Sell/Stop/Trailing/Take Profit/VStop/Pending cond/
# Liquidation) are trading terms and intentionally remain untranslated: lines.rs keeps them as
# English literals. This file contains only attributes and shared labels.
