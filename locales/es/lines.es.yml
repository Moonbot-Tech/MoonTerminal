lines.end_cross: "cruz final"
lines.knots: "nudos"
lines.thickness: "grosor"
lines.cross_size: "tamaño de cruz"
lines.cross_thickness: "grosor de cruz"
lines.knot_size: "tamaño de nudo"
lines.pending_group: "Colocada (no ejecutada):"
lines.pending_alpha: "opacidad"
lines.path_title: "Rastro de reprecios (ruta)"
lines.path_line_color: "con el color de su línea"
lines.path_alpha: "opacidad"
lines.path_hint: "Los escalones por los que se movió el precio de la orden — enviados por el núcleo o reconstruidos aquí. El tramo de traslado del stop siempre se dibuja."
lines.global: "Global"
lines.active_alpha: "Opacidad activa"
lines.closed_visibility: "Visibilidad cancel./cerradas"
lines.pending_dashed: "Orden pendiente: entrada discontinua"
lines.max_closed: "Máx. órdenes cerradas dibujadas"
