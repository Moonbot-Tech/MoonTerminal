# General tab of the Settings window.
# rust-i18n `_version: 1` format: one language per file, flat dotted keys. Interpolation: %{var}.
_version: 1

general.language: "Idioma de la interfaz"
general.valuation_mode: "Tasa para la conversión a USDT"
general.valuation_mode.historical: "Al cerrar la operación"
general.valuation_mode.current: "Tasa actual"
general.charts_split_by_core: "Pestaña de gráfico separada por núcleo"
general.charts_split_by_core_hint: "AddToChart por defecto: act — una pestaña por núcleo, des — todos los núcleos del grupo en una. La columna «Conjunto» del núcleo (Conexiones) lo anula: los núcleos con el mismo nombre de conjunto se unen en una pestaña."
general.main_idle_close: "Cierre automático de gráficos Main al estar inactivo"
general.main_idle_close_hint: "Inactivo = la ventana Main no está enfocada O está enfocada pero el ratón no se mueve. Cada gráfico se cierra tras N segundos de su propia inactividad (el más reciente, el último); el de pantalla completa también se cierra y sale del modo. Las suscripciones al libro de órdenes se cancelan de inmediato."
general.log_to_file: "Escribir registro en archivos"
general.log_to_file_hint: "Los registros de app y núcleos se escriben en logs/<fecha>_<fuente>.log (un archivo por fuente al día)."
general.log_retention: "Conservar registro"
general.log_retention_hint: "Los archivos más antiguos se eliminan al iniciar y una vez al día. 0 — conservar todo."

# Settings redesign (phases 3-5)
general.sec.lang_money: "Idioma y dinero"
general.sec.charts: "Gráficos"
general.sec.logs: "Registros"
general.language.hint: "Se aplica al guardar."
general.valuation.label: "Conversión a USDT"
general.valuation.hint: "Para el Informe y la Analítica."
general.valuation.more: "«En el momento de la operación»: el importe no cambia con el tiempo, al tipo del minuto en que cerró. «Actual»: todos los importes se recalculan al tipo de hoy.\n\nCámbielo solo deliberadamente: «Tasa actual» toma la última tasa conocida del spot de Binance/Bybit y no del exchange donde se operó, la actualiza cada pocos minutos y nunca la guarda. También cambia el ajuste: los umbrales se calculan sobre un histórico revalorizado. Se aplica al guardar."
general.tab_per_core.hint: "Si no, los núcleos del grupo comparten una pestaña."
general.book_pan.label: "Mover el gráfico en la zona del libro"
general.book_pan.hint: "Arrastrar sobre el libro desplaza el gráfico."
general.book_pan.more: "Desactívalo si en el libro sueles hacer clic en precios: entonces arrastrar ahí no mueve nada y los clics en precios funcionan como siempre."
general.idle_close.label: "Cerrar gráficos Main inactivos"
general.idle_close.hint: "Si la ventana no tiene el foco o el ratón no se mueve."
general.idle_close.after: "tras"
general.unit.sec: "s"
general.unit.days: "días"
general.log_files.label: "Escribir el registro en archivos"
general.log_files.hint: "La carpeta logs, un archivo por fuente al día."
general.log_retention.label: "Conservar"
general.log_retention.hint: "Los archivos antiguos se borran al iniciar y una vez al día."
