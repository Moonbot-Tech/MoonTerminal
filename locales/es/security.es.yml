security.rule: "Al menos %{min} caracteres y dos clases de caracteres distintas."
security.bits: "≈%{bits} bits"

# --- Strength meter ---
security.level.empty: "—"
security.level.weak: "Débil"
security.level.fair: "Regular"
security.level.good: "Buena"
security.level.strong: "Fuerte"
security.issue.none: "Aceptada"
security.issue.short: "Demasiado corta: mínimo %{min} caracteres"
security.issue.common: "Contiene una palabra conocida: se adivina de una vez"
security.issue.repeats: "Demasiada repetición del mismo carácter"
security.issue.sequence: "Las secuencias de caracteres consecutivos se adivinan al instante"
security.issue.one_class: "Solo una clase de caracteres: añada un dígito, una mayúscula o un símbolo"
security.issue.low_entropy: "Demasiado predecible: hágala más larga y variada"

# --- Machine key slots ---
security.machines: "Máquinas con acceso: %{used} de %{max}"
security.machines_unknown: "Máquinas con acceso: — de %{max}"
security.forget_machines: "Olvidar las demás"
security.machines_forgotten: "Acceso revocado para las demás máquinas"

# --- Apply results ---
security.applied: "Contraseñas guardadas"
security.pending_write: "Contraseñas aceptadas; guardando…"
security.err.not_saved: "La contraseña se aceptó pero la configuración no se guardó; corrija el error y guarde de nuevo"
security.err.empty: "Introduzca una contraseña"
security.err.mismatch: "Las contraseñas no coinciden"
security.err.not_editable: "La configuración no se abrió en esta ejecución: no hay dónde guardar la contraseña"
