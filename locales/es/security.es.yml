# Security block of the General settings tab and the startup login window.
# rust-i18n `_version: 1` format: one language per file, flat dotted keys. Interpolation: %{var}.
_version: 1

# --- Settings → General → Security ---
security.title: "Seguridad"
security.password: "Contraseña"
security.confirm: "Repetir"
security.mismatch: "Las contraseñas no coinciden"

# --- Launch gate ---
security.launch: "Contraseña al iniciar"
security.launch_hint: "Un pestillo local que se pide en cada inicio. Cualquier longitud. NO cifra las claves de los núcleos: quien acceda a los archivos las lee igual."

# --- servers.enc encryption password ---
security.file: "Contraseña de cifrado de servers.enc"
security.file_hint: "Se pide solo donde el archivo no se abre con la clave de la máquina: en una máquina nueva o tras perder el llavero del sistema. Una vez introducida correctamente se recuerda para esta máquina."
