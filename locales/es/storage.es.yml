storage.reports_hint: "Réplica tipada de la BD de informes de los núcleos. Recuperable: se resincroniza desde el servidor."

storage.strategies_enabled: "Mantener una BD local de estrategias"
storage.strategies_enabled_hint: "Historial de versiones de cambios reales de parámetros (la cosmética/inicio-parada no crea versiones). Se aplica al instante. La lista de campos ignorados se edita a mano en cfg/storage.toml."
storage.strategies_rows: "Estrategias: %{live} (eliminadas: %{deleted}) · Versiones: %{versions}"
storage.version_limit: "Límite de versiones por estrategia"
storage.version_limit_off: "sin límite"
