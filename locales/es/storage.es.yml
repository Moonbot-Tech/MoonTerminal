storage.trades_cleanup_pending: "contando…"
storage.trades_cleanup_failed: "no se pudo contar — %{err}"
storage.trades_cleanup_done: "%{prints} operaciones borradas, ≈ %{size} liberados"
storage.op_cleanup: "Limpieza"
storage.trades_hint: "El archivo puede borrarse con el terminal cerrado."

