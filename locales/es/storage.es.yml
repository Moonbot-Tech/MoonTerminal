storage.unit_min: "min"
storage.version_limit_hint: "0 — conservar todas las versiones (recomendado: el historial es irrecuperable). Un límite recorta las antiguas al escribir nuevas."
storage.strategies_hint: "La única copia del historial — una resincronización no lo restaura. Usa «Copia» para conservarlo."

storage.klines_hint: "Caché recuperable del historial de velas: el archivo puede borrarse con el terminal cerrado."

storage.trades_enabled: "Guardar las operaciones"
storage.trades_enabled_hint: "Las operaciones descargadas quedan en disco y no se descargan dos veces. Apagado — solo en memoria hasta cerrar el terminal."
storage.trades_max_mb: "Límite del archivo"
storage.trades_max_mb_hint: "Superado el límite se borran primero los registros más antiguos; 0 — sin límite."
storage.trades_margin: "Operaciones alrededor de una posición"
storage.trades_sec: "%{s} s"
storage.trades_min: "%{min} min"
storage.trades_margin_hint: "En cada extremo de una posición; en una larga, alrededor de la entrada y de la salida, velas entre ambas. Al menos 30 s: lo que necesita el afinador, que no juzga la salida de una variante más allá de esto tras el cierre."
storage.trades_long_position: "Posición larga desde"
storage.trades_long_position_hint: "Más larga — operaciones solo alrededor de la entrada y la salida. El afinador no ve el medio: una variante que pudo cerrar allí no se juzga en esa operación."
storage.trades_autoload_cores: "Descargar la cinta que falta desde los núcleos al arrancar"
storage.trades_autoload_cores_hint: "Operaciones de posiciones de estrategias cerradas mientras el terminal no estaba en marcha — desde el archivo del núcleo, que guarda las últimas miles de operaciones de cada mercado (minutos en una moneda activa, hasta un día en una tranquila), en cualquier bolsa, Bybit e Hyperliquid incluidas. No gasta el límite de peticiones de la bolsa; las posiciones de más de 48 h se omiten."
storage.trades_autoload: "Descargar la cinta que falta desde la bolsa al arrancar"
storage.trades_autoload_hint: "Lo que el archivo del núcleo no tiene — desde la bolsa, hasta donde aún sirve (futuros Binance 48 h, el resto hasta 30 días; Bybit e Hyperliquid no dan historial). Gasta el límite de peticiones; se para con el botón del afinador."
storage.trades_cleanup_at_startup: "Limpiar al arrancar"
storage.trades_cleanup_at_startup_hint: "Lo mismo que el botón «Limpiar», antes de descargar la cinta. Desde el próximo arranque."
storage.trades_cleanup: "Limpiar"
storage.trades_cleanup_run: "Limpiar ahora"
storage.trades_cleanup_hint: "Conserva las operaciones de posiciones de estrategias cerradas por la propia estrategia (lo que lee el afinador), dentro del paso «Operaciones alrededor de una posición». Ventas manuales, funding, liquidaciones y operaciones sin posición en el informe se van. El archivo se compacta al instante."
storage.trades_cleanup_preview: "se borrarán ≈ %{prints} operaciones, se liberarán ≈ %{size}"
