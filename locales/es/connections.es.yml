conn.core_sort: "Orden de núcleos"
conn.core_sort_tip: "El orden en que aparecen los núcleos en TODAS las listas de la aplicación: encabezado, Órdenes, Activos, Informe, Analítica, Escáner, Estrategias, Registro. Los núcleos desconectados mantienen su lugar — su estado se ve en el punto de estado."
