# Tooltips.
conn.tip.key: "La clave se crea en MoonBot, no en el sitio web, y se copia DESPUÉS de configurar el núcleo: lleva consigo host, puerto y modo; la dirección y el puerto se pueden cambiar en la columna Dirección:puerto si hace falta. Orden: 1) en el servidor de MoonBot, abre el puerto UDP del núcleo para tráfico entrante; 2) en MoonBot: el punto verde abajo a la izquierda (ventana Info) → Moon Kernel → Settings → ventana Moon Proto, pestaña Settings: activa Kernel (VPS), fija el Port, elige V0/V1/V2 (V0 por defecto), pulsa Apply; 3) ahí mismo Key: → Copy Key (sin clave: New Key); 4) pégala aquí con el botón Pegar y pulsa Guardar. El ojo la muestra/oculta."
conn.key_ph: "Copy Key en MoonBot"
# Placeholder of the "Charts" cell. The field holds a bundle NAME, not a count (see
# `conn.tip.bundle` and `ServerConfig::chart_bundle`), so the placeholder has to say "name".
conn.bundle_ph: "nombre del conjunto"
conn.tip.proto: "Modo de transporte MoonProto: el mismo trío V0/V1/V2 que en los ajustes Moon Proto del núcleo; ambos lados deben estar en el MISMO. Se toma de la clave UNA vez, mientras no haya modo definido; después es tuyo y una clave nueva ya no lo sobrescribe, así que no hace falta reemitir ninguna clave para cambiar de modo. Un guion significa que la clave no indicó nada (exportación antigua) y la conexión usa V0. Se aplica al guardar: el núcleo se reconecta solo. Por eso pulsa Copy Key solo DESPUÉS de fijar el Port y la versión en el núcleo con los botones V0/V1/V2 (MoonBot crea claves V0 por defecto): la clave los lleva consigo."
conn.tip.preset: "En qué modo de espacio de trabajo se muestra este núcleo en las listas: ambos, solo MANUAL o solo AUTO. Solo visualización — un núcleo oculto sigue conectándose y registrando."
conn.tip.total: "Cómo cuenta este núcleo en el total al pie de Activos. Auto: los núcleos de la misma cuenta de la bolsa cuentan una vez. Excluir: el núcleo queda fuera del total. Por separado: el núcleo siempre cuenta por sí solo, sin fusionarse."
conn.preset.both: "Ambos"
# The same two mode NAMES the header dropdown lists (`workspace.mode.*`): this column picks which
# of them shows the core, so a name that drifted apart here would read as a third mode.
conn.preset.classic: "MANUAL"
conn.preset.auto: "AUTO"
conn.total.auto: "Auto (por cuenta)"
conn.total.exclude: "Excluir"
conn.total.separate: "Por separado"
conn.tip.group: "Grupo = una ventana principal SEPARADA. Todos los núcleos con el mismo nombre de grupo viven en una ventana; un nombre de grupo nuevo → una ventana principal nueva."
conn.tip.bundle: "Nombre del conjunto de gráfico: las detecciones AddToChart de VARIOS núcleos de un grupo con el mismo nombre se unen en UN gráfico (una pestaña, el nombre en su título). Vacío = según el ajuste global (una pestaña por núcleo / todas en una)."
