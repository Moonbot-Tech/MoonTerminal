conn.tip.endpoint: "La dirección y el puerto a los que el terminal se conecta al núcleo. Vacío: se toman de la clave (en gris). Escribe los tuyos si el núcleo está en tu red local, la dirección de la clave es incorrecta o falta, o tu proveedor cambió la IP: dirección, dirección:puerto, :puerto o un nombre de host. Una clave nueva no sobrescribe este campo; la cruz vuelve a la dirección de la clave."
