conn.endpoint_no_address: "La clave no lleva dirección: el terminal se conecta a 127.0.0.1, este ordenador. Si el núcleo está en otra máquina, escribe aquí su dirección o vuelve a exportar la clave en MoonBot: activa Kernel (VPS) y pulsa Apply (o escribe la IP del servidor en el campo IP), luego Copy Key."
