assets.wallet.kind.spot: "Spot"
assets.wallet.kind.futures: "Futuros"
assets.wallet.kind.quarterly: "Trimestrales"
assets.wallet.filtered_empty: "Los %{n} activos están ocultos por el filtro de valor de %{thr}$"
assets.wallets_hint: "Carteras · arrastra una moneda entre contenedores"
assets.refresh_hint: "Actualizar saldos del núcleo"
# --- Wallet-section display settings (the gear beside the refresh button) ---
assets.settings.title: "Ajustes de carteras"
assets.settings.display: "Visualización"
assets.settings.group_by_venue: "Agrupar núcleos por exchange"
