# Top bar, status bar, toolbar, and detached chart window.
# rust-i18n `_version: 1` format: one language per file, flat dotted keys. Interpolation: %{var}.
# Intentionally untranslated: BUY · SELL · LONG · SHORT · ON · OFF · Live · the status-bar metrics line.
_version: 1

# --- Shell (top bar / status) ---
# Glyph icons (⚙ ▶ ⏸ …) are not stored in the locale; they are separate code segments (see README).
shell.settings_btn: "Ajustes"
status.connecting: "conectando…"
status.disconnected: "desconectado"
# Translate the entire status-bar label, including its colon; word order and punctuation belong to
# the translation rather than code concatenation. %{value} is either "OK" or a "ready/total" pair.
status.connection: "Conexión: %{value}"
# Report history still downloading on one or more ready cores. %{value} is a percent ("43%"),
# prefixed with the core count when there are several ("2 · 43%"), or "…" before the first page.
status.reports_sync: "Informes ↓ %{value}"
status.reports_sync_tip: "Descargando el historial de informes:"
status.reports_sync_row: "%{name}: %{percent} · %{rows} filas"
status.license: "Licencia: %{value}"
# Tooltip on the status bar's version readout. The readout itself is the bare `v0.34.2` (or `dev`
# for a build with no release tag reachable from HEAD) — a value, not prose, so it is not stored
# here. This is the full build line a tester is asked to quote, matching what startup.rs logs.
status.version_tooltip: "Versión %{release} · compilación %{build} · MoonUI %{moonui}"
# Active trading-core selector in the header: text shown when the group has no cores.
header.no_cores: "sin núcleos"
# Visible core's emulator vs real mode, in the header cluster beside the core pill.
# Both states stay on the chrome so the operator does not have to open core settings.
header.trade_emu: "Emulador"
header.trade_real: "Real"
header.trade_emu_tip: "Modo emulador. Se cambia en ajustes del núcleo (el engranaje)."
header.trade_real_tip: "Modo real. Se cambia en ajustes del núcleo (el engranaje)."
# Header balance double-click: Auto reveals the group Assets surface; Classic opens the window.
header.balance_tip: "Doble clic abre Activos"
# Price ticker in the header, on the right beside the clock.
header.ticker_tip: "Precio y deltas 1h / 24h. Clic abre el gráfico, doble clic elige moneda y núcleo"
header.ticker_pick: "Moneda del ticker (búsqueda por núcleos)"
# Ticker delta-window labels distinguish the periods of two adjacent percentages.
header.delta_1h: "1h"
header.delta_24h: "24h"
# Application-wide display zone in the header's right corner.
header.clock_tip: "Reloj de la zona horaria elegida. Clic para cambiarla; el horario de verano se ajusta solo"
header.clock_pick: "Zona horaria"
header.clock_system: "Sistema · %{zone}"

# --- Toolbar ---
# Tooltips for preset strips. The group label itself is a literal (Size/Sell), like the adjacent
# Lev/SL/TP labels; the prose tooltip is translated because it is not a technical token.
# `unit` is the fixed USDT-equivalent label and preserves it in narrow windows where the full
# "Size, USDT eq." group caption has collapsed.
toolbar.size_hint: "Tamaño de orden B%{n} en %{unit} · clic para seleccionar · doble clic para editar · Ctrl+rueda para cambiar"
toolbar.sell_hint: "Venta fija S%{n} · clic para activar · doble clic para editar · Ctrl+rueda para cambiar"
toolbar.lev_unset_no_core: "Selecciona un servidor para ver el apalancamiento."
toolbar.lev_unset_no_market: "Selecciona una moneda en el gráfico principal."
toolbar.lev_unset_unreported: "La bolsa no informa del apalancamiento para este mercado."
toolbar.sl_unset_tip: "La estrategia controla el stop, pero su valor no está disponible del núcleo ahora mismo."
toolbar.tp_main_active_hint: "El TP principal está activo. Al seleccionar una casilla S, el resaltado azul pasa a ella."
toolbar.tp_fixed_active_hint: "S%{n} está activa. Pulsa TP para volver al take profit principal."
toolbar.scale: "Escala"
toolbar.scale_auto: "Auto"
# The scale-dropdown trigger has room for about one character: the first letter of "Auto".
toolbar.scale_auto_short: "A"
# `Live` is an untranslated domain term; code prepends the `●` status indicator and keeps label text in a neighboring segment.
toolbar.live: "Live"
toolbar.pause: "Pausa"
toolbar.live_tip: "Live: el gráfico sigue al mercado. Pausa: congelado, puedes desplazarte (arrastrar con clic izquierdo, rueda)."
toolbar.strategies: "Estrategias"
toolbar.screener: "Screener"
# Overflow button at the right end of a narrow toolbar: holds the launchers that did not fit.
toolbar.more_launchers: "Más"
# Manual strategy (MS toggle and header picker): the unselected pill.
header.ms_none: "— estrategia —"
# Quick-select strategy buttons: tooltip for a slot nothing is assigned to yet, and the menu entry
# that unassigns one. Right click opens that menu.
header.ms_slot_empty: "Casilla vacía — clic derecho para asignar una estrategia"
header.ms_slot_clear: "Vaciar casilla"
# Quick-select settings popup: the gear beside the strategy buttons, its rows, the core-side
# sell-price flag it exposes, and the action that replaces the local slots with the core's.
header.ms_slots_gear: "Ajustes de los botones de estrategia"
header.ms_slots_hint: "La casilla muestra el botón. Las listas: su estrategia y el hook de esa estrategia (se escribe en el núcleo). Los robots los abren en Estrategias"
# The per-core switch that decides whether the terminal touches a manual order's stop at all.
header.ms_mb_logic: "Lógica de Moonbot"
header.ms_mb_logic_hint: "El stop viene de la estrategia (o de su hook), como en Moonbot: el SL de la barra queda bloqueado y no se envía nada. Desmarque para enviar su propio stop tras colocar la orden"
# Link out of the popup to where the bindings listed in it are actually edited.
header.ms_slots_hotkeys: "Atajos"
header.ms_slots_hotkeys_tip: "Abrir los ajustes en la pestaña de atajos"
# Names the MoonHook a strategy defers its exits to. Two readers: the header's parameter summary
# shows it INSTEAD of Buy/Sell/SL/TS, whose numbers would mislead, and a quick-select button whose
# strategy is hooked carries it as a tooltip.
header.ms_summary_hook: "Vía hook %{name}"
# The empty option in the hook picker: the strategy keeps its own exits.
header.ms_hook_none: "sin hook"
# Tooltip on the robot button after the hook field: it opens the hook strategy, not the manual one.
header.ms_hook_goto_tip: "Ir a la estrategia hook"
header.ms_slot_unassigned: "sin asignar"
header.ms_slots_pull: "Traer del núcleo"
header.ms_slots_pull_tip: "Reemplazar el conjunto de botones con lo que tiene el propio núcleo"
# Moonbot's own checkbox, stored in the CORE: while it is off the core sells a manual-strategy
# order at that strategy's own price and the toolbar's TP/S never reach it.
header.ms_ignore_strat_sell: "Ignorar el precio de venta propio de la estrategia manual"
# Trading-metric popup titles for the slider and input field.
toolbar.tp_title: "Take profit"
toolbar.sl_title: "Stop loss"
toolbar.lev_title: "Apalancamiento"
# Extended TP-range checkbox (`x_tmode` / "s9" flag): 100..900% instead of 0..100%.
toolbar.tp_ext: "×10 (100–900%)"
# Fine TP slider: 0..=1.99% in 0.01% steps through scalp; the hedge-mode toggle controls dual-side positions.
toolbar.tp_fine: "Fino (0.01%)"
toolbar.hedge: "Hedge Mode"
# Stop-market checkbox in the SL popup: sell at the stop with a market order, not a stop-limit order.
toolbar.stop_market: "Stop market"
# Leverage Apply button in the popup; leverage is an exchange action sent only through this button.
toolbar.apply: "Aplicar"

# Toolbar switch beside the order-size strip: whether this core keeps its OWN sizes/TP/SL set or
# shares its group's. Two texts, because the tooltip states what a click would do next.
toolbar.own_trade_on: "Este núcleo mantiene sus propios tamaños y TP/SL — desactívalo para volver al conjunto común"
toolbar.own_trade_off: "Este núcleo usa el conjunto común — actívalo para darle el suyo propio"
# The hovered chart's core differs from the group's active trading core (or their per-core opt-in
# disagrees), so a click, wheel, or edit here would write somewhere other than the values shown.
# Disabled on purpose rather than silently mutating the wrong core (goal A2 FIX-3).
toolbar.core_manual_mismatch: "Mostrando otro núcleo bajo el cursor — la edición está desactivada para no cambiar el núcleo activo"

# Coarse-area rejection (CoreConfigRejection::Areas) the display core's edit carries; %{areas} is
# a comma-joined list built from the toolbar.core_config_area_* keys below.
toolbar.core_config_areas_rejected: "El núcleo rechazó: %{areas}"
toolbar.core_config_area_auto_start: "Inicio automático"
toolbar.core_config_area_btc_blink: "Parpadeo de BTC"
toolbar.core_config_area_general: "General"
toolbar.core_config_area_gestures: "Atajos: ratón"
toolbar.core_config_area_special: "Especiales"
toolbar.core_config_area_telegram: "Telegram"
toolbar.core_config_area_auto_buy: "Compra automática"
# The marked-markets list, which no settings page draws: the chart's star writes it.
toolbar.core_config_area_fav_markets: "Mercados favoritos"
toolbar.core_config_area_interface: "Interfaz"
toolbar.core_config_area_signals: "Sonidos de alerta"
toolbar.core_config_area_leverage: "Apalancamiento"
toolbar.core_config_area_manual: "Trading manual"

# --- Exchange limits for the coin on the Main chart (leverage popup + toolbar readout) ---
# Row label for the exchange's maximum order size, denominated in the market's quote currency.
toolbar.max_order: "Orden máx."
# Toolbar caption for the same figure, where the row competes for width with every trading control.
# Deliberately untranslated: it is the industry abbreviation, like BUY/SELL and LONG/SHORT in
# `locales/README.md`'s untranslated list, and a translated word here would be the longest thing on
# the row. The full label above stays in the popover, where there is room to say it properly.
toolbar.max_order_short: "MAX"
# Row label for the coin's maximum leverage as stated by the exchange.
toolbar.lev_max: "Apalancamiento máx."
# Row label for the exchange's cap on the whole position at the current leverage (MoonBot's <max. N>).
toolbar.position_cap: "Límite de posición"
# Hover text for the position cap row.
toolbar.position_cap_tip: "Límite del exchange para TODA la posición en esta moneda con el apalancamiento APLICADO. Menos apalancamiento lo eleva. Orden máx. es un límite aparte por orden."
# Hover text when the exchange stated the order cap directly: a fixed figure that does not drift.
toolbar.max_order_tip: "Tamaño máximo de orden de la bolsa. No depende del apalancamiento elegido."
# Hover text when no notional cap was stated and the figure was converted from the quantity cap.
toolbar.max_order_derived: "La bolsa no indicó un límite en dinero: es el límite de cantidad convertido al ask actual, por lo que varía con el precio."
# Hover text when the exchange stated no maximum order size at all for this market.
toolbar.max_order_none: "La bolsa no define un tamaño máximo de orden para este mercado."
# Hover text while nothing has loaded yet: no provider, no snapshot, or no such market.
toolbar.limits_unknown: "Los límites de la bolsa aún no se han cargado para este mercado."
# Hover text when the header scope is the whole group: an order cap belongs to one exchange
# account, so there is no single figure to state until a server is chosen.
toolbar.max_order_no_core: "Resumen completo: el límite de orden pertenece a una cuenta de la bolsa: elige un servidor para verlo."
# Hover text on a known maximum leverage.
toolbar.lev_max_tip: "Apalancamiento máximo de esta moneda según la bolsa."
# Hover text on the dash when the exchange stated no maximum leverage for this market.
toolbar.lev_max_none: "La bolsa no define un apalancamiento máximo para este mercado."
# Shown when the coin's maximum is unknown: the 1..125 range is a terminal default, not a limit.
toolbar.lev_max_unknown: "Se desconoce el máximo de esta moneda: el rango 1-125 es un valor por defecto, no su límite."
# Shown when the value about to be applied is above the coin's stated cap. Not corrected silently.
toolbar.lev_max_exceeded: "Por encima del límite de la bolsa (x%{max}): rechazará este apalancamiento."
# Shown when the exchange revised the cap while the popup stood open; the slider range is frozen.
toolbar.lev_range_stale: "La bolsa cambió el límite de esta moneda: reabre para actualizar la escala."
# Hover text on an available leverage preset. It only fills the field; Apply sends it.
toolbar.lev_preset_tip: "Fijar apalancamiento en x%{x}. Solo Aplicar lo envía."
# Hover text on a preset above the coin's maximum, which is offered as unavailable.
toolbar.lev_preset_blocked: "x%{x} no está disponible: el máximo de esta moneda es x%{max}."

