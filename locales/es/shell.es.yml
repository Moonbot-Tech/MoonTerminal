chart.hvol.caption_pf: "Ventana de precio: %{pf}%"
chart.hvol.caption_max: "Máx"
# The "Volumes" popup (the V button): the chart's two volume indicators — the bottom band
# (vertical) and Moonbot's `HVol` (horizontal). The band's rows keep their `chart.graphics.*`
# keys from the popup they came out of.
chart.volumes.tip: "Volúmenes"
