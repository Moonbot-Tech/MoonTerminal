# Security block of the General settings tab and the startup login window.
# rust-i18n `_version: 2` format: key → locale-to-string map. Interpolation: %{var}.
_version: 2

# --- Settings → General → Security ---
security.title:
  ru: "Безопасность"
  en: "Security"
  es: "Seguridad"
security.preview_notice:
  ru: "Предпросмотр: пароли пока не сохраняются"
  en: "Preview: passwords are not stored yet"
  es: "Vista previa: las contraseñas aún no se guardan"
security.login_preview:
  ru: "Окно входа"
  en: "Login window"
  es: "Ventana de acceso"
security.password:
  ru: "Пароль"
  en: "Password"
  es: "Contraseña"
security.confirm:
  ru: "Ещё раз"
  en: "Repeat"
  es: "Repetir"
security.mismatch:
  ru: "Пароли не совпадают"
  en: "Passwords do not match"
  es: "Las contraseñas no coinciden"

# --- Launch gate ---
security.launch:
  ru: "Пароль при запуске"
  en: "Password on launch"
  es: "Contraseña al iniciar"
security.launch_hint:
  ru: "Локальная защёлка: спрашивается при каждом старте. Длина любая. Ключи ядер она НЕ шифрует — тот, кто имеет доступ к файлам, читает их и без неё."
  en: "A local latch asked for at every start. Any length. It does NOT encrypt the core keys — anyone with file access still reads them."
  es: "Un pestillo local que se pide en cada inicio. Cualquier longitud. NO cifra las claves de los núcleos: quien acceda a los archivos las lee igual."

# --- servers.enc encryption password ---
security.file:
  ru: "Пароль шифрования servers.enc"
  en: "servers.enc encryption password"
  es: "Contraseña de cifrado de servers.enc"
security.file_hint:
  ru: "Спрашивается только там, где файл не открывается ключом машины: на новой машине или после потери хранилища ключей ОС. Введённый верно — он запоминается для этой машины, больше спрашивать не будем."
  en: "Asked only where the file cannot be opened with the machine key: on a new machine, or after the OS keyring is lost. Once entered correctly it is remembered for this machine and not asked again."
  es: "Se pide solo donde el archivo no se abre con la clave de la máquina: en una máquina nueva o tras perder el llavero del sistema. Una vez introducida correctamente se recuerda para esta máquina."
security.file_warning:
  ru: "Этот пароль восстановить нельзя. Забыв его вместе с ключом машины, ядра теряются."
  en: "This password cannot be recovered. Losing it together with the machine key loses the cores."
  es: "Esta contraseña no se puede recuperar. Perderla junto con la clave de la máquina significa perder los núcleos."
security.rule:
  ru: "Минимум %{min} символов и два разных класса символов."
  en: "At least %{min} characters and two different character classes."
  es: "Al menos %{min} caracteres y dos clases de caracteres distintas."
security.bits:
  ru: "≈%{bits} бит"
  en: "≈%{bits} bits"
  es: "≈%{bits} bits"

# --- Strength meter ---
security.level.empty:
  ru: "—"
  en: "—"
  es: "—"
security.level.weak:
  ru: "Слабый"
  en: "Weak"
  es: "Débil"
security.level.fair:
  ru: "Средний"
  en: "Fair"
  es: "Regular"
security.level.good:
  ru: "Хороший"
  en: "Good"
  es: "Buena"
security.level.strong:
  ru: "Надёжный"
  en: "Strong"
  es: "Fuerte"
security.issue.none:
  ru: "Подходит"
  en: "Accepted"
  es: "Aceptada"
security.issue.short:
  ru: "Слишком короткий: нужно минимум %{min} символов"
  en: "Too short: at least %{min} characters"
  es: "Demasiado corta: mínimo %{min} caracteres"
security.issue.common:
  ru: "Содержит известное слово — подбирается целиком"
  en: "Contains a well-known word — guessed as one chunk"
  es: "Contiene una palabra conocida: se adivina de una vez"
security.issue.repeats:
  ru: "Слишком много повторов одного символа"
  en: "Too much of it is one repeated character"
  es: "Demasiada repetición del mismo carácter"
security.issue.sequence:
  ru: "Подряд идущие символы подбираются мгновенно"
  en: "Runs of consecutive characters are guessed instantly"
  es: "Las secuencias de caracteres consecutivos se adivinan al instante"
security.issue.one_class:
  ru: "Только один класс символов — добавьте цифру, заглавную или знак"
  en: "Only one character class — add a digit, a capital, or a symbol"
  es: "Solo una clase de caracteres: añada un dígito, una mayúscula o un símbolo"
security.issue.low_entropy:
  ru: "Слишком предсказуемый — сделайте длиннее и разнообразнее"
  en: "Too predictable — make it longer and more varied"
  es: "Demasiado predecible: hágala más larga y variada"

