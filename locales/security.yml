  ru: "Машин с доступом: — из %{max}"
  en: "Machines with access: — of %{max}"
  es: "Máquinas con acceso: — de %{max}"
security.forget_machines:
  ru: "Забыть остальные"
  en: "Forget the others"
  es: "Olvidar las demás"
security.machines_forgotten:
  ru: "Доступ остальных машин отозван"
  en: "Access revoked for the other machines"
  es: "Acceso revocado para las demás máquinas"

