# Панель «Статус ядер»: системные метрики ядер (CPU/память из Event::KernelHealth) + статус.
# Формат rust-i18n `_version: 2`: ключ → карта локаль→строка. Интерполяция: %{var}.
_version: 2

# --- Верхняя полоса / футер ---
core_status.all_cores:
  ru: "Все ядра"
  en: "All cores"
  es: "Todos los núcleos"
core_status.cores_n:
