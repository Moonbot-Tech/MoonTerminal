  en: "Cores: %{n}"
  es: "Núcleos: %{n}"
core_status.cores:
  ru: "Ядра"
  en: "Cores"
  es: "Núcleos"
core_status.empty:
  ru: "Нет данных по ядрам"
  en: "No core data"
  es: "Sin datos de núcleos"

# --- Колонки таблицы ---
core_status.col.core:
  ru: "Ядро"
  en: "Core"
  es: "Núcleo"
core_status.col.status:
