# --- Startup telemetry (polled MoonProto StartupStatus) ---
# The column caption doubles as the By-IP heading and the hover title.
core_status.col.startup:
  ru: "Старт"
  en: "Startup"
  es: "Inicio"
# Completed init steps out of the total, while the core is still coming up.
core_status.startup.progress:
  ru: "%{done}/%{total}"
  en: "%{done}/%{total}"
  es: "%{done}/%{total}"
# Seconds with one decimal. The unit is here so the number and its unit stay one token.
core_status.startup.secs:
  ru: "%{t} с"
  en: "%{t} s"
  es: "%{t} s"
# The FROZEN figure once the core is up. The past-tense preposition is what stops a settled
