core_status.fault.next.key:
  ru: "Ключ создаётся в MoonBot, не на сайте. В MoonBot: зелёный кружок слева внизу (окно Info) → строка Moon Kernel → Settings → окно Moon Proto, вкладка Settings → Key: → Copy Key (ключа нет — New Key). Вставьте его в поле «Ключ» кнопкой «Вставить» целиком и нажмите «Сохранить» — ядро подключится само"
  en: "The key is made in MoonBot, not on the website. In MoonBot: the green dot at the bottom left (the Info window) → the Moon Kernel row → Settings → the Moon Proto window, Settings tab → Key: → Copy Key (no key yet — New Key). Paste the whole of it into the Key field with the Paste button and press Save — the core connects by itself"
  es: "La clave se crea en MoonBot, no en el sitio web. En MoonBot: el punto verde abajo a la izquierda (ventana Info) → fila Moon Kernel → Settings → ventana Moon Proto, pestaña Settings → Key: → Copy Key (sin clave: New Key). Pégala entera en el campo Clave con el botón Pegar y pulsa Guardar: el núcleo se conecta solo"
