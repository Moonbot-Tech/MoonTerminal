# --- Clock offset (measured core-vs-UTC skew) --------------------------------------------------
# The column caption doubles as the By-IP heading and the hover title.
core_status.col.tz_off:
  ru: "Смещ. UTC"
  en: "UTC offset"
  es: "Desfase UTC"
# The never-measured cell, and the collapsed-group cell when no core on the server ever measured
# an offset. Deliberately never "UTC": a core that runs on UTC and a core nobody has measured must
