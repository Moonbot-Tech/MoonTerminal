  es: "Estado"
core_status.col.cpu_proc:
  ru: "CPU проц."
  en: "CPU proc"
  es: "CPU proc."
core_status.col.cpu_sys:
  ru: "CPU сис."
  en: "CPU sys"
  es: "CPU sist."
core_status.col.mem_used:
