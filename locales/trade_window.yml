_version: 2

# Окно детали сделки: открывается по двойному клику на закрытой сделке в «Отчёте».
# Свой файл, а не блок в report.yml: это отдельная область интерфейса (см. README).

trade_window.open:
  ru: "Открыть окно сделки"
  en: "Open trade window"
  es: "Abrir ventana de la operación"

trade_window.blocked.unresolved:
  ru: "Окно сделки недоступно — ядро не подключено"
  en: "Trade window unavailable - the core is not connected"
  es: "Ventana de la operación no disponible: el core no está conectado"

trade_window.retry:
  ru: "Повторить"
  en: "Retry"
  es: "Reintentar"

trade_window.state.loading:
  ru: "Загружаю рынок вокруг сделки…"
  en: "Loading the market around this trade…"
  es: "Cargando el mercado alrededor de la operación…"

trade_window.state.failed:
  ru: "Не удалось получить данные с биржи. Можно повторить."
  en: "Could not fetch data from the exchange. You can retry."
  es: "No se pudieron obtener los datos del exchange. Puedes reintentar."

trade_window.state.rate_limited:
  ru: "Биржа ограничила запросы. Повтор через %{secs} с."
  en: "The exchange is rate-limiting requests. Retry in %{secs} s."
  es: "El exchange está limitando las solicitudes. Reintenta en %{secs} s."

trade_window.state.unknown_symbol:
  ru: "Биржа не знает такого рынка."
  en: "The exchange does not know this market."
  es: "El exchange no conoce este mercado."

trade_window.source.ticks:
  ru: "тики с биржи"
  en: "exchange ticks"
  es: "ticks del exchange"

trade_window.source.ticks_bucketed:
  ru: "тики с биржи, шаг %{secs} с"
  en: "exchange ticks, %{secs} s step"
  es: "ticks del exchange, paso de %{secs} s"

# Присоединяется к одной из двух строк выше через " - " прямо в коде — глиф-разделитель в
# словаре не хранится.
trade_window.source.ticks_edges:
  ru: "края закрыты свечами %{min} мин"
  en: "edges filled by %{min}-minute candles"
  es: "bordes cubiertos por velas de %{min} min"

# Таймфрейм подставляется из САМИХ строк, а не заявляется константой: раньше здесь стояла
# фиксированная «минутные свечи», пока панель пересобирала минутки в пятиминутки. Свечи теперь
# всегда называют причину, по которой окно показывает их вместо тиков.
trade_window.source.candles_ticks_pending:
  ru: "свечи %{min} мин, тики ещё грузятся"
  en: "%{min}-minute candles, still fetching ticks"
  es: "velas de %{min} min, cargando ticks todavía"

trade_window.source.candles_no_route:
  ru: "свечи %{min} мин — у %{brand} нет тиков"
  en: "%{min}-minute candles - %{brand} has no public ticks"
  es: "velas de %{min} min - %{brand} no ofrece ticks"

trade_window.source.candles_retention:
  ru: "свечи %{min} мин — биржа хранит тики только %{hours} ч"
  en: "%{min}-minute candles - the exchange keeps ticks for only %{hours} h"
  es: "velas de %{min} min - el exchange guarda ticks solo %{hours} h"

trade_window.source.candles_no_trades:
  ru: "свечи %{min} мин — сделок за это время не было"
  en: "%{min}-minute candles - the exchange had no trades here"
  es: "velas de %{min} min - el exchange no tuvo operaciones aquí"

trade_window.source.candles_failed:
  ru: "свечи %{min} мин — тики не загрузились"
  en: "%{min}-minute candles - could not load ticks"
  es: "velas de %{min} min - no se pudieron cargar los ticks"

trade_window.empty.no_data:
  ru: "За это время по рынку нет данных."
  en: "The market has no data for this period."
  es: "El mercado no tiene datos para este período."

trade_window.empty.no_endpoint:
  ru: "У %{brand} нет публичного источника истории, который умеет терминал."
  en: "%{brand} has no public history source this build can use."
  es: "%{brand} no tiene una fuente pública de historial que esta versión pueda usar."

trade_window.empty.unknown_venue:
  ru: "Биржа ядра неизвестна этой версии терминала."
  en: "This build does not recognise the core's exchange."
  es: "Esta versión no reconoce el exchange del core."

trade_window.empty.core_offline:
  ru: "Ядро сделки не подключено — биржу и рынок не определить."
  en: "The trade's core is not connected, so its exchange and market cannot be identified."
  es: "El core de la operación no está conectado, así que no se puede identificar su exchange ni su mercado."

trade_window.empty.bad_window:
  ru: "У сделки некорректное время открытия или закрытия."
  en: "The trade's open or close time is not usable."
  es: "La hora de apertura o cierre de la operación no es utilizable."

