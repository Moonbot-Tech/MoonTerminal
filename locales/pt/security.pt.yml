# Security block of the General settings tab and the startup login window.
# rust-i18n `_version: 1` format: one language per file, flat dotted keys. Interpolation: %{var}.
_version: 1

# --- Settings → General → Security ---
security.title: "Segurança"
security.password: "Senha"
security.confirm: "Repetir"
security.mismatch: "As senhas não coincidem"

# --- Launch gate ---
security.launch: "Senha ao abrir"
security.launch_hint: "Uma trava local pedida em cada início. Qualquer tamanho. Ela NÃO criptografa as chaves dos núcleos — quem tem acesso aos arquivos ainda as lê."

# --- servers.enc encryption password ---
security.file: "Senha de criptografia do servers.enc"
security.file_hint: "Pedida só quando o arquivo não abre com a chave da máquina: numa máquina nova, ou depois que o cofre de chaves do sistema se perde. Depois de digitada corretamente, fica memorizada nesta máquina e não é pedida de novo."
security.file_warning: "Esta senha não pode ser recuperada. Se você perdê-la junto com a chave da máquina, perderá os núcleos."
security.rule: "Pelo menos %{min} caracteres e duas classes de caracteres diferentes."
security.bits: "≈%{bits} bits"

