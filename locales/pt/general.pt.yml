# General tab of the Settings window.
# rust-i18n `_version: 1` format: one language per file, flat dotted keys. Interpolation: %{var}.
_version: 1

general.language: "Idioma da interface"
general.valuation_mode: "Cotação usada na conversão para USDT"
general.valuation_mode.historical: "No momento da operação"
general.valuation_mode.current: "Cotação atual"
general.charts_split_by_core: "Aba de gráfico separada por núcleo"
general.charts_split_by_core_hint: "AddToChart padrão: ligado — uma aba por núcleo, desligado — todos os núcleos do grupo em uma. A coluna “Gráficos” do núcleo (Conexões) substitui isto: núcleos com o mesmo nome de conjunto se juntam em uma aba."
general.main_idle_close: "Fechar gráficos da Main ao ficar ocioso"
general.main_idle_close_hint: "Ocioso = a janela Main não está em foco OU está em foco, mas o mouse não se move. Cada gráfico fecha após N segundos da própria inatividade (o aberto por último fecha por último); um gráfico em tela cheia também fecha e sai da tela cheia. As assinaturas do livro de ofertas são canceladas na hora."
general.log_to_file: "Gravar log em arquivos"
general.log_to_file_hint: "Os logs do app e dos núcleos são gravados em logs/<data>_<fonte>.log (um arquivo por fonte por dia)."
general.log_retention: "Manter o log"
general.log_retention_hint: "Arquivos mais antigos que isto são excluídos na inicialização e uma vez por dia. 0 — manter tudo."

# Settings redesign (phases 3-5)
general.sec.lang_money: "Idioma e dinheiro"
general.sec.charts: "Gráficos"
general.sec.logs: "Logs"
general.language.hint: "Aplica-se ao salvar."
general.valuation.label: "Conversão para USDT"
general.valuation.hint: "Para o Relatório e a Análise."
general.valuation.more: "«No momento do negócio»: o valor não muda com o tempo, à taxa do minuto em que fechou. «Atual»: todos os valores são recalculados à taxa de hoje.\n\nMude isto só de propósito: “Cotação atual” usa a última cotação conhecida do spot da Binance/Bybit, e não da corretora em que a operação foi feita, atualiza a cada poucos minutos e nunca a grava. Também muda o ajuste: os limites passam a ser calculados sobre o histórico reavaliado. Aplicado depois de salvar."
general.tab_per_core.hint: "Caso contrário, os núcleos do grupo dividem uma aba."
general.book_pan.label: "Mover o gráfico na área do livro"
general.book_pan.hint: "Arrastar sobre o livro desloca o gráfico."
general.book_pan.more: "Desligue se na área do livro você clica mais em preços: aí arrastar não move nada e os cliques em preços funcionam normalmente."
general.live_scope.label: "Live e Pausa"
general.live_scope.hint: "Como mover um gráfico afeta os outros."
general.live_scope.more: "«Todos juntos»: ao arrastar um gráfico para o histórico, todos pausam, e o botão Live da barra mostra isso. «Cada gráfico separado»: o arraste afeta só esse gráfico; ele volta ao Live sozinho ao ser levado à borda direita ou após 3 minutos sem mexer. A Pausa da barra para todos os gráficos e o Live leva todos de volta ao momento atual."
general.live_scope.all: "Todos juntos"
general.live_scope.each: "Cada gráfico separado"
general.idle_close.label: "Fechar gráficos Main inativos"
general.idle_close.hint: "Se a janela estiver sem foco ou o mouse parado."
general.idle_close.after: "após"
general.unit.sec: "s"
general.unit.days: "dias"
general.log_files.label: "Gravar o log em arquivos"
general.log_files.hint: "A pasta logs, um arquivo por fonte por dia."
general.log_retention.label: "Manter"
general.log_retention.hint: "Arquivos antigos são apagados ao iniciar e uma vez por dia."
