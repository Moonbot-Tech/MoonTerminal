# Core Status panel: per-core update-queue phase badges/tooltips and the fleet-wide footer
# counters. Separate from `update.yml`, which is the TERMINAL's own self-update namespace.
_version: 1

# --- Per-core phase, shown as a badge beside the reported build and as its hover text ---
core_update.phase.queued: "Na fila"
core_update.phase.held: "Em espera — faixa ocupada"
core_update.phase.sent: "Comando enviado"
core_update.phase.waiting: "Atualizando"
core_update.phase.verifying: "Verificando a build"
core_update.phase.succeeded: "Atualizado"
core_update.phase.installed: "Instalado"
core_update.phase.unchanged: "Versão inalterada"
core_update.phase.other_build: "Compilação diferente instalada: %{got} em vez de %{expected}"
core_update.phase.failed.not_sent: "Falha ao enviar o comando"
core_update.phase.failed.never_dropped: "O núcleo não se desconectou para a atualização"
core_update.phase.failed.not_ready: "Não voltou a ficar pronto a tempo de receber a atualização"
core_update.phase.failed.timeout: "Não voltou depois da atualização — tempo esgotado"
core_update.phase.failed.gone: "O endereço do núcleo ficou desconhecido"
core_update.phase.failed.abandoned: "Abandonado quando o aplicativo fechou"
core_update.phase.failed.rejected: "O núcleo recusou o nome de build pedido"

# --- Unverified: the update finished but the terminal could not confirm the returned build ---
core_update.phase.unverified.unavailable: "Build não verificada — reconexão indisponível"
core_update.phase.unverified.timeout: "Build não verificada — o núcleo não voltou a tempo"

# --- Fleet-wide footer counters, drawn only while a campaign is active ---
core_update.summary.updating: "atualizando"
core_update.summary.queued: "na fila"
core_update.summary.failed: "com falha"

# --- Updates list (Core Status "Updates" mode): columns, empty state, target wording ---
core_update.col.time: "Hora"
core_update.col.core: "Núcleo"
core_update.col.server: "Servidor"
core_update.col.from_to: "De → para"
core_update.col.target: "Alvo"
core_update.col.outcome: "Resultado"
core_update.col.duration: "Duração"
core_update.list_empty: "Sem histórico de atualização"
core_update.target.release: "Release"
core_update.target.named: "Beta %{name}"
# --- Hover-revealed row/server update control (shared control, controls/core_update) ---
core_update.row.action: "Atualizar este núcleo para o release"
core_update.server.action_one: "Atualizar %{n} núcleo deste servidor para o release"
core_update.server.action_few: "Atualizar %{n} núcleos deste servidor para o release"
core_update.server.action_many: "Atualizar %{n} núcleos deste servidor para o release"
core_update.retry: "Repetir a atualização"
core_update.skipped_offline: "offline: %{n}"
core_update.skipped_already_one: "já atualizando: %{n}"
core_update.skipped_already_few: "já atualizando: %{n}"
core_update.skipped_already_many: "já atualizando: %{n}"
# A release press replaces a lettered (test) build; builds lists the distinct letters.
core_update.release_replaces_test_one: "%{n} núcleo está na build de teste %{builds} — o release vai substituí-la"
core_update.release_replaces_test_few: "%{n} núcleos estão na build de teste %{builds} — o release vai substituí-la"
core_update.release_replaces_test_many: "%{n} núcleos estão na build de teste %{builds} — o release vai substituí-la"
# A press that queued nothing at all; reasons joins the skipped_* phrases above.
core_update.notice.none: "Nada foi para a fila: %{reasons}."
