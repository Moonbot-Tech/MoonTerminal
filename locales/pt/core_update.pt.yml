core_update.confirm.cores_one: "%{n} núcleo"
core_update.confirm.cores_few: "%{n} núcleos"
core_update.confirm.cores_many: "%{n} núcleos"
core_update.confirm.servers_one: "em %{n} servidor"
core_update.confirm.servers_few: "em %{n} servidores"
core_update.confirm.servers_many: "em %{n} servidores"
core_update.confirm.q_release: "Atualizar %{cores} %{servers} para o release?"
core_update.confirm.q_named: "Atualizar %{cores} %{servers} para a build indicada abaixo?"
