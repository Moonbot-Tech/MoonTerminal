# --- Problems mode: the three diagnostic actions ---
# The reset and the re-read mirror MoonBot's own Problems window; the test is ours.
#
# A test publishes a `test` fact through the core's own detector worker (~2 s) and PROVES the
# channel end to end. It leaves a row behind that only the reset removes, which is why that pair
# ships together.
core_status.problems_test: "Testar o canal"
# Deliberately NOT MoonBot's "reset all", though it is the same command on the wire. MoonBot's
# window belongs to one core, so "all" there means all of that core's findings; this panel spans a
# fleet, where the same word reads as "all cores" and would be a lie the moment the operator has
# picked one. The button acts on the panel's scope, and the tooltip and the confirm both say how
# many cores that is.
core_status.problems_clear: "Redefinir"
core_status.problems_test_tip: "Publica um fato de teste pelo detector do próprio núcleo — cerca de dois segundos. Prova o caminho inteiro: detector, fio, projeção, painel."
core_status.problems_refresh: "Atualizar"
# Said out loud because the label promises a round trip the protocol cannot make: a core pushes its
# list, nothing can ask for one. Saying so here is cheaper than an operator concluding the button is
# broken when a stale row does not move.
core_status.problems_refresh_tip: "Relê o que os núcleos conectados (%{cores}) enviaram até agora. Clique numa linha para reler só aquele núcleo. Uma lista nova não pode ser pedida: o protocolo não tem esse comando — o núcleo envia uma sozinho, na conexão e sempre que os detectores a mudam. Vale pressionar depois de reiniciar um núcleo, quando as linhas velhas já não são sobre ele."
# The blast radius, stated BEFORE the dialog: an operator who picked no core is acting on the whole
# scope, and that is the difference between a tidy-up and a fleet-wide loss.
# The one-core forms, for when a clicked finding has narrowed the action. The scope-wide wording
# would state a falsehood about the panel ("connected cores: 1" for a scope of twenty-six) and would
# keep advising a click that, in this state, cancels the pick instead of making one.
core_status.problems_clear_tip_one: "Redefine o diagnóstico do núcleo selecionado — sem volta, e para todo terminal. Clique na linha de novo para voltar ao escopo inteiro"
core_status.problems_refresh_tip_one: "Relê o que o núcleo selecionado enviou até agora. Uma lista nova não pode ser pedida: o protocolo não tem esse comando. Clique na linha de novo para voltar ao escopo inteiro"
core_status.problems_clear_tip: "Redefine o diagnóstico. Núcleos conectados: %{cores}. Sem volta, e para todo terminal. Clique numa linha para redefinir só aquele núcleo"
# The test is per-core on the wire and has no fleet-wide form worth having: publishing a test fact
# on two hundred cores litters two hundred cores. So it alone needs one core named.
core_status.problems_pick_core: "O teste vai para um núcleo: clique no achado daquele núcleo na tabela — ou estreite o escopo do painel a um único núcleo"
core_status.problems_picked_offline: "O núcleo selecionado está offline — o comando esperaria ele voltar"
core_status.problems_no_online: "Nenhum núcleo no escopo do painel está conectado"
# Guards the TEST alone. The command channel outlives the connection, so a queued test would fire on
# the next reconnect and publish its fact at some unannounced later moment, on a core the operator
# stopped looking at hours ago.
core_status.problems_core_offline: "O núcleo está offline — o teste esperaria a reconexão e publicaria o fato num momento posterior, sem aviso"
core_status.problems_test_title: "Enviar um diagnóstico de teste?"
# The consequence is the whole reason this action is confirmed at all.
core_status.problems_test_q: "O núcleo %{core} vai publicar um fato de teste pelo próprio detector — cerca de dois segundos. A linha fica no núcleo, e a ÚNICA forma de removê-la é a redefinição, que também apaga os achados reais daquele núcleo."
core_status.problems_test_sent: "Teste enviado a %{core} — a linha aparece em alguns segundos"
core_status.problems_clear_sent: "Redefinição enviada a %{core} — as linhas somem quando o núcleo enviar a próxima lista"
core_status.problems_clear_sent_many: "Redefinição enviada (núcleos: %{cores}) — as linhas somem quando esses núcleos enviarem as próximas listas"
# Says what it re-read, not "done": the honest outcome of a re-read that found nothing new is an
# unchanged table, and a message claiming more would make that look like a failure.
core_status.problems_refreshed: "Núcleos relidos: %{cores}"
# The shortfall, never a bare success: a fleet action that reached nine of twelve cores has failed
# on three, and only the toast can say so.
core_status.problems_fleet_none: "Nenhum núcleo alcançado (de %{cores}) — offline, ou o canal de comando está fechado"
core_status.problems_fleet_partial: "Alcançados: %{sent} de %{cores} — o resto está offline ou o canal está fechado"
core_status.problems_not_sent: "Não enviado: o canal de comando do núcleo está fechado"
core_status.problems_not_sent_offline: "Não enviado: o núcleo está offline"
core_status.problems_clear_title: "Redefinir o diagnóstico do núcleo?"
# Blunt on purpose: the protocol's own warning is that cleared real diagnostics cannot be restored.
core_status.problems_clear_q: "O núcleo %{core} vai descartar todo problema confirmado e toda hipótese pendente — para todos os terminais, sem volta. Não corrige nenhuma causa: se uma permanecer, o núcleo confirma o problema de novo."
core_status.problems_clear_title_many: "Redefinir o diagnóstico de vários núcleos?"
# The core NAMES, not just how many: a count is nothing an operator can check, and this dialog is
# the last place the mistake is still cheap.
core_status.problems_clear_q_many: "Cada um destes núcleos (%{cores}) descarta todo problema confirmado e toda hipótese pendente — para todos os terminais, sem volta. Não corrige nenhuma causa: o que permanecer será confirmado de novo."
