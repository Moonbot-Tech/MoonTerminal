analytics.tuner.compose_help: "Compara três caminhos iguais: um conjunto distinto de campos, a busca conjunta em todo campo admitido e nenhum filtro extra. Até %{seeds} seeds independentes conferem cada dobra de tempo; as seeds votam dentro da dobra, depois as dobras votam. O beam mantém 8 ramos numa fronteira clara e abre para 16 quando está ambíguo. O número decisivo é o LIFT: lucro fora da amostra menos o que o mesmo número de operações sem filtro teria rendido, então sem filtros não ganha só por ficar com toda operação; o lift só conta acima de um piso de operações retidas. Resultados próximos também usam PF, drawdown menor e lucro absoluto. Quando as dobras reservadas não separam nada, o resultado diz isso. As caixas continuam sendo a fronteira da busca. É preciso escolher uma estratégia."
