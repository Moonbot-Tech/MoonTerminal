analytics.ticks.est_tip: "Estimativa pela amostra, campos marcados, grades, reinícios e passadas. O tempo usa os inícios concluídos da última busca em andamento ou terminada nesta sessão. Antes da primeira busca, mostra uma estimativa conservadora. Buscar entrada e saída multiplica o trabalho. A carga da CPU e a convergência podem alterar o tempo real."
analytics.ticks.acc_tip_base: "A fatia das operações com tape (%{n}) que o modelo repetiu pelas próprias regras. Um erro ✗ e uma operação que ele não pode julgar · os dois contam contra: a busca não fala por essas operações."
