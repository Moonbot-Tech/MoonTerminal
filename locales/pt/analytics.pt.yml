analytics.ticks.cfg_screen_entry_help: "Quando a entrada e a saída são buscadas: cada movimento de entrada é primeiro pontuado por um replay sob a saída encontrada para o melhor ponto, e a busca inteira da saída roda só sob os três melhores movimentos de cada passo. Várias vezes mais rápido; um movimento que perde sob a saída antiga e só ganha com a própria pode passar batido. Desligado, a saída é buscada sob todo movimento — mais lento, nada é filtrado."
