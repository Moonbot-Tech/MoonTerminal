analytics.ticks.acc_tip_assumptions: "O modelo assume: sem livro de ofertas — a fila à frente da nossa ordem não é modelada, um fill é um print que toca; um stop que vigia o livro vê o preço do ticker a cada %{ticker} s, o último print no lugar dele; uma recolocação de entrada leva o round trip arquivado do próprio núcleo para chegar à corretora, %{latency} ms para um núcleo sem um e para a venda; um match é um preço dentro de %{price} % e um instante dentro de %{time} s; campos de saída fora do modelo (SellShot, SellSpread e outros) deixam essas operações sem julgamento; o meio de uma posição longa não é guardado — uma variante cuja linha ou stop ficou mais perto do preço ali do que o fato não é julgada nessa operação."
