analytics.ticks.suggest_one_tip: "Busca só o campo selecionado %{field}, marcado ou não. O campo é buscado de novo a partir dos valores da estratégia, o que quer que o V1 tenha; os outros campos ficam como o V1 os tem. A resposta vai para a célula %{field} do V1 (esvaziada quando é o valor da própria estratégia) — e para os campos que uma chave que ela liga precisa (UseTakeProfit → TakeProfit)"
analytics.ticks.suggest_all_tip: "Busca todo campo marcado dos grupos buscáveis (um modelo, e pelo menos uma operação reproduzida) — %{n} agora. Um campo marcado é buscado de novo a partir dos valores da estratégia, o que quer que o V1 tenha; a célula V1 dele recebe a resposta, e é esvaziada quando a resposta é o valor da própria estratégia. Um campo desmarcado fica como o V1 o tem e a célula é deixada, salvo um valor que uma chave que a busca liga precisa (UseTakeProfit → TakeProfit): um valor para toda estratégia"
