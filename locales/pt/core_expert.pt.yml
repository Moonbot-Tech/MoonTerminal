core_expert.waiting: "Aguardando as configurações do núcleo — ele as envia em segundo plano depois de conectar."
core_expert.replaced: "Outro processo do Moonbot agora responde nesta conexão. A página anterior foi descartada em vez de gravada no processo novo; as mudanças preparadas ficam e serão aplicadas na página nova quando ela chegar."
