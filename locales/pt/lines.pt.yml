lines.end_cross: "cruz no fim"
lines.knots: "nós"
lines.thickness: "espessura"
lines.cross_size: "tamanho da cruz"
lines.cross_thickness: "espessura da cruz"
lines.knot_size: "tamanho do nó"
lines.pending_group: "Colocada (não executada):"
lines.pending_alpha: "opacidade"
lines.path_title: "Rastro de reajustes (caminho)"
lines.path_line_color: "na cor da própria linha"
lines.path_alpha: "opacidade"
lines.path_hint: "Os degraus pelos quais o preço da ordem foi movido — enviados pelo núcleo ou reconstruídos aqui. O trecho do próprio movimento do stop sempre é desenhado."
lines.global: "Global"
lines.active_alpha: "Opacidade ativa"
lines.closed_visibility: "Visibilidade canceladas/fechadas"
