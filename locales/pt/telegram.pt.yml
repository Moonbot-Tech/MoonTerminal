telegram.server.section: "Estação num servidor Linux"
telegram.server.intro: "O bot, o Mini App e os relatórios rodam no seu próprio servidor Linux o tempo todo, mesmo com o terminal fechado. O terminal configura o servidor por SSH: fecha logins por senha, instala o serviço, entrega as chaves de cada núcleo ativo e move o bot."
