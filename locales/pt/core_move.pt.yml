# A core moved onto a Linux server: the card button, the move's steps, warnings and outcomes.
_version: 1

core_move.card_button: "Mover para VPS…"
core_move.save_first: "Salve o núcleo primeiro: a mudança precisa da chave salva e do histórico."

# --- Outcomes ---
core_move.lost: "A mudança parou sem resposta: a thread terminou."
core_move.switched: "Este terminal agora se conecta ao novo núcleo."
core_move.switch_failed: "O novo núcleo roda em %{address}, mas este terminal não conseguiu passar para ele: %{reason}. Defina esse endereço no núcleo em Conexões."
