core_move.failed_old_stopped: "A mudança falhou: %{reason}. O núcleo antigo está parado e o novo está instalado em %{dir}, mas não iniciado: inicie um deles antes de operar."
core_move.logged_in: "Conectado como %{user}."
core_move.old_stopped_by_hand: "O núcleo antigo está parado."

