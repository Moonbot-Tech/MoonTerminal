core_move.step.strategies_read: "Estratégias lidas: %{n}, pastas: %{folders}."
core_move.step.checked: "O servidor pode rodar o MoonBot; a porta está livre."
core_move.step.uploaded: "Configurações enviadas."
core_move.step.installed: "O novo núcleo está instalado, não iniciado."
core_move.step.stop_requested: "Pedindo ao núcleo antigo que pare…"
core_move.step.old_stopped: "O núcleo antigo está parado."
core_move.step.old_refused: "O núcleo antigo não para: operações não concluídas: %{n}."
core_move.step.old_refused_unknown: "O núcleo antigo não para."
core_move.step.started: "O novo núcleo iniciou e escuta."
