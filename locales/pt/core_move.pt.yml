core_move.warn.strategies_written: "As estratégias no novo núcleo não foram confirmadas: %{detail}"

# --- The station ---
core_move.station.same: "A estação já tem o novo endereço."
core_move.station.not_followed: "A estação não acompanha este núcleo."
core_move.station.sent: "O novo endereço foi enviado à estação."
core_move.station.failed: "A estação não aceitou o novo endereço: %{reason}"
core_move.station.none: "Nenhuma estação foi configurada a partir deste terminal."

