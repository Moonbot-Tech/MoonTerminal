# Storage tab of the Settings window: local databases for reports, strategies, the kline cache
# and the trade prints of replays.
# rust-i18n `_version: 1` format: one language per file, flat dotted keys. Interpolation: %{var}.
_version: 1

tab.storage: "Armazenamento"

storage.data_dir: "Pasta de dados"
storage.open_folder: "Abrir pasta"
storage.refresh: "Atualizar"
storage.total_size: "Total: %{size}"
storage.size: "Tamanho: %{size}"
storage.size_wal: "Tamanho: %{size} (+ WAL %{wal})"
storage.no_file: "ainda sem arquivo"

storage.reports_title: "Relatórios — reports.sqlite"
storage.reports_rows: "Operações na réplica: %{rows}"
storage.reports_hint: "Réplica tipada do banco de relatórios dos núcleos. Recuperável: sincroniza de novo a partir do servidor."

storage.strategies_title: "Estratégias — strategies.sqlite"
storage.strategies_enabled: "Manter um banco local de estratégias"
storage.strategies_enabled_hint: "Histórico de versões das edições reais de parâmetros (cosmético e start-stop não criam versões). Aplicado na hora. A lista de campos ignorados é editada à mão em cfg/storage.toml."
storage.strategies_rows: "Estratégias: %{live} (excluídas: %{deleted}) · Versões: %{versions}"
storage.version_limit: "Limite de versões por estratégia"
storage.version_limit_off: "sem limite"
storage.version_limit_hint: "0 — guardar todas as versões (recomendado: o histórico não se recupera). Um limite corta as antigas quando as novas são gravadas."
storage.strategies_hint: "A única cópia do histórico — uma nova sincronização não restaura. Use Backup para guardá-la."

storage.klines_title: "Cache de candles — klines.sqlite"
storage.klines_hint: "Cache recuperável do histórico de candles: o arquivo pode ser excluído com o terminal fechado."

storage.trades_title: "Prints de operações — trades.sqlite"
storage.trades_enabled: "Guardar prints de operações"
storage.trades_enabled_hint: "Os prints baixados ficam no disco e não são baixados de novo. Desligado — só na memória, até o terminal fechar."
storage.trades_max_mb: "Limite do arquivo"
storage.trades_mb: "%{mb} MB"
storage.trades_max_mb_hint: "Passado o limite, os registros mais antigos saem primeiro; 0 — sem limite."
storage.trades_margin: "Prints em volta da operação"
storage.trades_sec: "%{s} s"
storage.trades_min: "%{min} min"
storage.trades_margin_hint: "Em cada ponta da operação; numa longa, em volta da entrada e da saída, candles no meio. No mínimo 30 s — o que o ajuste precisa; ele julga a saída de uma variante no máximo até esse tempo depois do fechamento."
storage.trades_long_position: "Operação longa a partir de"
storage.trades_long_position_hint: "Mais longa — prints só em volta da entrada e da saída. O ajuste não vê o meio: uma variante que possa ter saído ali não é julgada nessa operação."
storage.trades_autoload_cores: "Buscar nos núcleos os negócios que faltam ao iniciar"
storage.trades_autoload_cores_hint: "Prints de operações de estratégia que fecharam enquanto o terminal não estava rodando — do acervo do núcleo, que guarda os últimos milhares de prints de cada mercado (minutos numa moeda quente, até um dia numa quieta), em qualquer corretora, Bybit e Hyperliquid inclusive. Não gasta o orçamento de pedidos da corretora; operações com mais de 48 h são puladas."
storage.trades_autoload: "Buscar na corretora os negócios que faltam ao iniciar"
storage.trades_autoload_hint: "O que o acervo do núcleo não tem — da corretora, até onde ela ainda serve (Binance Futures 48 h, as outras até 30 dias; Bybit e Hyperliquid não servem histórico). Gasta o orçamento de pedidos; para com o botão do ajuste."
storage.trades_cleanup_at_startup: "Limpar ao iniciar"
storage.trades_cleanup_at_startup_hint: "O mesmo que o botão \"Limpar\", antes de buscar os negócios. A partir da próxima abertura."
storage.trades_cleanup: "Limpar"
storage.trades_cleanup_hint: "Mantém os prints das operações de estratégia que a própria estratégia fechou (o que o ajuste lê), dentro do passo \"Prints em volta da operação\". Vendas manuais, funding, liquidações e prints sem operação no relatório saem. O arquivo é compactado na hora."
storage.trades_cleanup_preview: "≈ %{prints} prints saem, ≈ %{size} liberados"
storage.trades_cleanup_empty: "nada a excluir"
storage.trades_cleanup_pending: "contando…"
storage.trades_cleanup_failed: "não foi possível contar — %{err}"
storage.trades_cleanup_done: "%{prints} prints excluídos, ≈ %{size} liberados"
storage.op_cleanup: "Limpeza"
storage.trades_hint: "O arquivo pode ser excluído com o terminal fechado."

