common.strategy_query_syntax: "Vírgula = OU, espaço = E, !palavra = excluir. Não diferencia maiúsculas.\nEMA, Hook — nomes com EMA ou Hook\ndrops 1m — nomes com drops e 1m\nshort !test — nomes com short, sem test"

