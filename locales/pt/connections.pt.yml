conn.col.key: "Chave"
conn.col.endpoint: "Endereço:porta"
conn.tip.endpoint: "O endereço e a porta em que o terminal se conecta ao núcleo. Vazio — vêm da chave (em cinza). Digite os seus se o núcleo está na sua rede local, o endereço da chave está errado ou ausente, ou o provedor mudou o IP: endereço, endereço:porta, :porta ou um nome de host. Uma chave nova não sobrescreve este campo; o X volta ao endereço da chave. O ícone de nuvem ao lado de um campo preenchido decide se a estação também recebe este endereço."
conn.endpoint_duplicate: "Este endereço e porta já são usados pelo núcleo %{name}"
conn.address_ph: "da chave"
conn.endpoint_hint: "Vazio — o endereço da chave. Você pode digitar um endereço, endereço:porta, :porta ou um nome de host; uma chave nova não sobrescreve este campo."
conn.endpoint_invalid: "Isto não é um endereço. Aceito: 192.168.1.5, 192.168.1.5:5017, :5017, [2001:db8::1]:5017 ou um nome de host. Enquanto o campo estiver vermelho, o núcleo não se conecta."
conn.endpoint_no_address: "A chave não traz endereço — o terminal se conecta a 127.0.0.1, este computador. Se o núcleo roda em outra máquina, digite o endereço dela aqui ou exporte a chave de novo no MoonBot: marque Kernel (VPS) e pressione Apply (ou digite o IP do servidor no campo IP), depois Copy Key."
conn.endpoint_to_station_on: "A estação também se conecta ao núcleo por este endereço. Clique para que ela volte a usar o endereço da chave."
conn.endpoint_to_station_off: "A estação se conecta ao núcleo pelo endereço da chave. Clique para passar também este endereço a ela — se o servidor da estação consegue alcançá-lo (um endereço da sua rede local, não). Chega à estação quando você enviar os núcleos."
