# Connections tab in Settings: cores, groups, statuses, columns, and tooltips.
# rust-i18n `_version: 1` format: one language per file, flat dotted keys. Interpolation: %{var}.
# Table columns use short labels; translations should remain short as well.
_version: 1

conn.market_src: "Fonte dos dados de mercado"
conn.market_src_tip: "De onde vêm as cruzes e o livro de ofertas. Dedup: um núcleo provedor por corretora serve o mercado para todos (barato com muitos núcleos). Por núcleo: cada gráfico lê o mercado do próprio núcleo (sem dedup)."
conn.market_dedup: "Dados compartilhados — um núcleo por corretora"
conn.market_percore: "Separado — cada gráfico no próprio núcleo"
conn.core_sort: "Ordem dos núcleos"
conn.core_sort_tip: "A ordem dos núcleos em TODAS as listas do app: cabeçalho, Ordens, Ativos, Relatório, Análise, Screener, Estratégias, Log. Núcleos desconectados mantêm o lugar — o estado aparece no ponto de status."
