conn.endpoint_invalid: "Isto não é um endereço. Aceito: 192.168.1.5, 192.168.1.5:5017, :5017, [2001:db8::1]:5017 ou um nome de host. Enquanto o campo estiver vermelho, o núcleo não se conecta."
conn.endpoint_no_address: "A chave não traz endereço — o terminal se conecta a 127.0.0.1, este computador. Se o núcleo roda em outra máquina, digite o endereço dela aqui ou exporte a chave de novo no MoonBot: marque Kernel (VPS) e pressione Apply (ou digite o IP do servidor no campo IP), depois Copy Key."


# Tooltips.
conn.tip.key: "A chave é feita no MoonBot, não no site, e é copiada DEPOIS que o núcleo está configurado — ela leva host, porta e modo; o endereço e a porta podem ser trocados na coluna Endereço:porta quando preciso. Ordem: 1) no servidor do MoonBot, abra a porta UDP do núcleo para tráfego de entrada; 2) no MoonBot: o ponto verde embaixo à esquerda (janela Info) → Moon Kernel → Settings → janela Moon Proto, aba Settings: marque Kernel (VPS), defina Port, escolha V0/V1/V2 (padrão V0), pressione Apply; 3) ali, Key: → Copy Key (ainda sem chave — New Key); 4) cole aqui com o botão Colar e pressione Salvar. O olho mostra/oculta."
conn.key_ph: "Copy Key no MoonBot"
# Placeholder of the "Charts" cell. The field holds a bundle NAME, not a count (see
# `conn.tip.bundle` and `ServerConfig::chart_bundle`), so the placeholder has to say "name".
conn.bundle_ph: "nome do conjunto"
conn.tip.proto: "Modo de transporte MoonProto — o mesmo trio V0/V1/V2 das configurações Moon Proto do núcleo; os dois lados precisam estar no MESMO. Vem da chave UMA vez, enquanto nenhum modo está definido; depois disso é seu, e uma chave nova não substitui mais — então não é preciso reemitir a chave só para mudar o modo. Um traço significa que a chave não nomeou nada (uma exportação antiga) e a conexão roda como V0. Aplicado ao Salvar: o núcleo reconecta sozinho. Então pressione Copy Key só DEPOIS que Port e a versão estejam definidos no núcleo com os botões V0/V1/V2 (o MoonBot cria chaves V0 por padrão): a chave leva os dois."
conn.tip.preset: "Qual modo de espaço de trabalho mostra este núcleo em cada lista: os dois, só MANUAL ou só AUTO. Só exibição — um núcleo oculto ainda conecta e ainda grava."
conn.tip.total: "Como este núcleo entra no total do rodapé de Ativos. Auto: núcleos na mesma conta da corretora contam uma vez. Excluir: o núcleo fica fora do total. Separado: o núcleo sempre conta sozinho, nunca fundido."
conn.preset.both: "Ambos"
# The same two mode NAMES the header dropdown lists (`workspace.mode.*`): this column picks which
# of them shows the core, so a name that drifted apart here would read as a third mode.
conn.preset.classic: "MANUAL"
conn.preset.auto: "AUTO"
conn.total.auto: "Auto (pela conta)"
conn.total.exclude: "Excluir"
conn.total.separate: "Separado"
conn.tip.group: "Grupo = uma janela principal SEPARADA. Todos os núcleos com o mesmo nome de grupo vivem numa janela; um nome novo → uma janela principal nova."
conn.tip.bundle: "Nome do conjunto de gráficos: detecções AddToChart de VÁRIOS núcleos de um grupo com o mesmo nome se fundem num SÓ gráfico (uma aba, o nome no título). Vazio = conforme a configuração global (uma aba por núcleo / todos numa)."
