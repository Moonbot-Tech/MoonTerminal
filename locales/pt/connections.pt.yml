conn.groups_panel_heading: "Núcleos por grupo e corretora"
conn.groups_panel_tip: "Um grupo = uma janela principal separada. Em cada grupo, os núcleos se juntam automaticamente pela corretora que a conexão informa. A coluna “Gráficos” funde detecções de vários núcleos do grupo num gráfico."
conn.pending_cores: "Núcleos novos — configure antes de salvar"
