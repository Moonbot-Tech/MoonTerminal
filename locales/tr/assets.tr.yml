assets.actions.unavailable_market_catalog: "%{market} piyasası çekirdek kataloğunda yok"

# --- Position action buttons ---
assets.open_global_hint: "Varlıkları ayrı pencerede aç (tüm çekirdekler)"
assets.market_sell: "Piyasadan sat"
assets.market_sell_confirm: "Piyasadan sat"
assets.market_sell_no_price: "Satış iptal: piyasanın güncel fiyatı yok ve emir bir fiyat ister."
assets.market_sell_q: "%{coin} gerçekten piyasadan satılsın mı?"
assets.market_sell_scope_changed: "Satış iptal: çekirdek artık geçerli Varlıklar kapsamında değil."
assets.order: "Order"
# Tooltip of the Order button on a position row: the core cancels its own sells on the market and
# re-places a limit close for the WHOLE position at its own offset from the price — Moonbot's
# `Order` gesture for a limit that was left behind by the market.
assets.order_hint: "Satışı yeniden koy: kendi %{coin} emirlerini iptal et ve tüm pozisyon için limit kapanış koy (Moonbot'taki Order gibi)"
# Tooltip of the same button on a spot holding: Moonbot's Pending Order window in SELL mode.
assets.order_hint_spot: "%{coin} için limit satış koy: fiyat ve Size ile emir penceresi (spotta Moonbot'taki Order gibi)"
# --- The spot Order dialog (Moonbot's Pending Order window, SELL type) ---
assets.order_dialog.title: "%{coin} sat"
assets.order_dialog.side: "Emir"
assets.order_dialog.size: "Size, %{coin}"
assets.order_dialog.max: "Max"
assets.order_dialog.price: "Satış fiyatı"
# The "Current:" label welded to the live price figure (MIXED NODE, mono).
assets.order_dialog.current: "Güncel: %{p}"
assets.order_dialog.bad_size: "Miktar pozitif bir sayı olmalı"
assets.order_dialog.bad_price: "Fiyat pozitif bir sayı olmalı"
# Toasts of the position press. Said on enqueue only: the terminal knows the command left for the
# core, not what the core did with it (a market it does not hold or a position already gone is a
# silent no-op on its side).
assets.order_sent: "%{coin} için Order komutu çekirdeğe gönderildi — sonucu Emirler'de ve çekirdek günlüğünde kontrol edin"
assets.order_failed: "%{coin} pozisyonunun limit kapanışı gönderilmedi: çekirdeğe ulaşılamıyor"

