assets.window_title: "MoonTerminal — Varlıklar"
# Hint for the top-bar dust-threshold slider; 0 shows everything.
assets.min_value_hint: "N $ altındaki varlıkları gizle (0 — tümünü göster; fare tekerleği değiştirir)"
assets.cores_free_total: "Çekirdek · serbest/toplam"
assets.no_cores: "çekirdek yok"
assets.empty: "varlık yok"
# Futures balances are quote-denominated and absent from the table, so its empty state describes
# open positions rather than account equity; the balance surfaces carry the account figure.
assets.empty_no_positions: "açık pozisyon yok"
# --- Footer: account balances across the in-scope cores ---
# Tooltip on the LEFT footer group. The row carries two different sums side by side, so each
# group states what it covers — a trader must never read Σ as the account equity.
assets.footer_table_hint: "Toz filtresinden sonraki tablo satırları; Σ bunların toplam değeri"
# Appended to the tooltip above when some visible rows have no valid value: the row count
# includes them but Σ cannot, so a shortened sum must say what it left out.
assets.footer_rows_unpriced: "%{n} satırın geçerli değeri yok — Σ onları saymaz"
assets.balances_total: "Toplam"
assets.balances_free: "serbest"
# The retained figure is not confirmed current for the connection.
assets.balance_stale: "çevrimdışı"
# A snapshot exists, but its USD valuation is incomplete or invalid rather than zero.
assets.balance_unpriced: "kur yok"
# Cores whose snapshot has not arrived yet: excluded from the total, but the state clears itself.
assets.balances_awaiting: "bekleniyor: %{n}"
# Cores with a snapshot but no conversion rate: also excluded, and — unlike awaiting — it will
# not resolve on its own, so it is counted separately rather than told to keep waiting.
assets.balances_unpriced_n: "kur yok: %{n}"
# Some cores were summed from a retained snapshot, so the total is not "as of now".
assets.balances_stale_n: "çevrimdışı: %{n}"
# Cores the user set to stay out of the total (per-core setting).
assets.balances_excluded_n: "dışarıda: %{n}"
# Appended to a Hyperliquid fold line: the account mode is invisible to the terminal.
assets.balances_folded_hl_caveat: "(Hyperliquid: terminal hesap kipini göremez, birleşik veya standart; cüzdanlar ayrıysa çekirdeği Ayarlar → Bağlantılar → Toplamda altında “Ayrı” yapın)"
# Tooltip line naming the cores excluded by their own setting.
assets.balances_excluded_list: "Çekirdek ayarıyla dışarıda: %{cores}"
# Footer row: every core in the window (not the number of accounts the sum covers).
assets.balances_cores_n: "çekirdek: %{n}"
# Footer tooltip labels, beside the amounts: free, then (reusing `assets.balances_total`) total,
# then money in wallets no core trades from. Below them, after the existing `assets.cores_n`, one
# line per exchange account several cores share (`core-1 + core-2`; the `+` joiner is built in
# code), then two notes on that money: how old its figure is, and that it is not judged while
# cores have not identified themselves.
assets.balances_tip_free: "Serbest"
assets.balances_tip_idle: "İşlem dışı"
assets.balances_tip_shared: "%{cores} — ortak %{brand} hesabı, bir kez sayıldı"
assets.balances_tip_shared_unknown: "%{cores} — ortak borsa hesabı, bir kez sayıldı"
assets.balances_tip_idle_as_of: "İşlem dışı: %{t} itibarıyla"
assets.balances_tip_idle_withheld: "İşlem dışı: çevrimdışı veya tanınmamış çekirdek varken değerlendirilmez (beklenen: %{n})"
assets.section_positions: "Pozisyonlar"
# Core-selection field, matching `orders.all_cores` and `orders.cores_n`.
assets.all_cores: "Tüm çekirdekler"
assets.cores_n: "Çekirdek: %{n}"

