# Assets window/panel: controls, table columns, and wallets.
# rust-i18n `_version: 1` format: one language per file, flat dotted keys. Interpolation: %{var}.
_version: 1

# Per-core dust conversion; the existing Engine result supplies completion feedback.
assets.dust.button: "Tozu %{token} yap"
assets.dust.title: "Tozu dönüştür"
assets.dust.hint: "Bu çekirdekteki uygun tüm küçük bakiyeleri %{token} birimine dönüştür"
assets.dust.question: "%{core} çekirdeğindeki (%{venue}) uygun tüm toz bakiyeler %{token} birimine dönüştürülsün mü? Bu işlem geri alınamaz. Uygun bakiyeleri borsa belirler."
