telegram.server.key_browse: "Gözat…"
telegram.server.passphrase: "Anahtar parolası"
telegram.server.key_hint: "Bir ed25519, ECDSA veya RSA özel anahtarının yolu (OpenSSH, PuTTY .ppk, PKCS#8 veya RSA PEM / PKCS#1). Parola yalnızca anahtar şifreliyse."
telegram.server.sudo_password: "sudo parolası"
telegram.server.password: "Parola"
telegram.server.first_login_hint: "Sağlayıcınızın erişimi (IP, giriş, root parolası veya anahtar) bir kez kullanılır ve hiçbir yere yazılmaz. Kurulumdan sonra parola girişleri kapanır ve terminal kendi anahtarıyla girer."
telegram.server.old_admin: "moon'un eski parolası"
telegram.server.release_hint: "Hizmet, sunucunun mimarisi için GitHub'daki son MoonTerminal sürümünden kurulur (SHA-256 denetlenir)."
telegram.server.transfer_hint: "Terminalin botu sunucuya taşınır: token'ı, sohbetleri ve erişimleri. Bot orada çalışınca terminal kendi token'ını siler; yerel bir bot başka token ister. Taşıma başarısız olursa bot terminalde kalır."
