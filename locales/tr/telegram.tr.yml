# Settings -> Telegram -> the bot's segment -> "Station on a Linux server".
telegram.server.section: "Linux sunucusundaki istasyon"
telegram.server.intro: "Bot, Mini App ve raporlar kendi Linux sunucunuzda gece gündüz çalışır, terminal kapalıyken de. Terminal sunucuyu SSH ile kurar ve botu oraya taşır."
telegram.server.intro_more: "Kurulumda terminal parola girişlerini kapatır, hizmeti kurar ve ona her aktif çekirdeğin anahtarını verir. Yaklaşık 25 çekirdek, burstable olmayan bir makinenin kabaca üçte birini ve 1 GB'lık bir sunucuda birkaç yüz MB boş alan ister. Burstable bir t3.micro'nun %10 taban çizgisi bunun altındadır; durum \"0 dk\" ile dönerse CPUCreditBalance (AWS) değerine ve hizmet günlüğündeki killed / oom satırlarına bakın."
