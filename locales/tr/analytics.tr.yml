analytics.tuner.compose_help: "Üç eşit yolu karşılaştırır: ayrı bir alan kümesi, kabul edilen her alanda ortak arama ve ek filtresiz hali. Her zaman katını en çok %{seeds} bağımsız seed denetler; katın içinde seedler oy verir, sonra katlar oy verir. Işın net bir sınırda 8 dal tutar, belirsizde 16'ya açılır. Karar LIFT'tedir: ayrılmış katlardaki kâr eksi aynı sayıda süzülmemiş işlemin kazandıracağı kâr; bu yüzden filtresiz hali her işlemi tuttuğu için kazanamaz; lift yalnızca tutulan işlem sayısı alt sınırın üstündeyse sayılır. Yakın sonuçlarda PF, daha düşük düşüş ve mutlak kâr da kullanılır. Ayrılan katlar hiçbir şeyi ayırmazsa sonuç bunu söyler. Onay kutuları arama sınırı olarak kalır. Bir strateji seçili olmalıdır."
