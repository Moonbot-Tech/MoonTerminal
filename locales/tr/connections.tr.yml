# Tooltips.
conn.tip.key: "Anahtar sitede değil MoonBot'ta üretilir ve çekirdek kurulduktan SONRA kopyalanır — adres, port ve kipi kendisi taşır; adres ve port gerekirse Adres:port sütununda değiştirilir. Sıra: 1) MoonBot sunucusunda çekirdeğin UDP portunu gelen trafiğe açın; 2) MoonBot'ta: sol alttaki yeşil nokta (Info penceresi) → Moon Kernel → Settings → Moon Proto penceresi, Settings sekmesi: Kernel (VPS) işaretleyin, Port verin, V0/V1/V2 seçin (varsayılan V0), Apply'a basın; 3) orada Key: → Copy Key (anahtar yoksa New Key); 4) Yapıştır düğmesiyle buraya yapıştırın ve Kaydet'e basın. Göz gösterir/gizler."
conn.key_ph: "MoonBot'ta Copy Key"
# Placeholder of the "Charts" cell. The field holds a bundle NAME, not a count (see
# `conn.tip.bundle` and `ServerConfig::chart_bundle`), so the placeholder has to say "name".
conn.bundle_ph: "bağ adı"
conn.tip.proto: "MoonProto taşıma kipi — çekirdeğin Moon Proto ayarlarındaki V0/V1/V2 üçlüsüyle aynı; iki taraf da AYNI kipte olmalı. Anahtardan BİR kez alınır, henüz kip yokken; sonra sizindir ve yeni anahtar onu ezmez — kipi değiştirmek için anahtar yenilemek gerekmez. Tire, anahtarın bir şey söylemediği anlamına gelir (eski dışa aktarma) ve bağlantı V0 olarak çalışır. Kaydet'te uygulanır: çekirdek kendisi yeniden bağlanır. Bu yüzden Copy Key'e, çekirdekte Port ve sürüm V0/V1/V2 seçicileriyle ayarlandıktan SONRA basın (MoonBot varsayılan olarak V0 anahtarı üretir): anahtar onları taşır."
conn.tip.preset: "Çekirdeğin her listede hangi çalışma alanı kipinde görüneceği: ikisi, yalnızca MANUAL veya yalnızca AUTO. Yalnızca görünüm — gizli çekirdek yine bağlanır ve kaydeder."
conn.tip.total: "Bu çekirdeğin Varlıklar alt toplamına nasıl girdiği. Otomatik: aynı borsa hesabındaki çekirdekler bir kez sayılır. Hariç: çekirdek toplama girmez. Ayrı: çekirdek her zaman kendi başına sayılır, birleştirilmez."
conn.preset.both: "İkisi"
# The same two mode NAMES the header dropdown lists (`workspace.mode.*`): this column picks which
# of them shows the core, so a name that drifted apart here would read as a third mode.
conn.preset.classic: "MANUAL"
conn.preset.auto: "AUTO"
conn.total.auto: "Otomatik (hesaba göre)"
conn.total.exclude: "Hariç"
conn.total.separate: "Ayrı"
conn.tip.group: "Grup = AYRI bir ana pencere. Aynı grup adındaki tüm çekirdekler tek pencerede yaşar; yeni grup adı → yeni ana pencere."
conn.tip.bundle: "Grafik bağının adı: bir grubun AYNI adı paylaşan BİRKAÇ çekirdeğinden gelen AddToChart tespitleri TEK grafikte birleşir (tek sekme, ad başlığında). Boş = genel ayara göre (çekirdek başına sekme / hepsi tek sekmede)."
