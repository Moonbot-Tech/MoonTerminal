# Screener window with a Moonbot-style coin table.
# Column headers (Vol./ASK/Funding/…) are Moonbot domain tokens and remain untranslated in code.
_version: 1

screener.window_title: "MoonTerminal — Tarayıcı"
# Three different reasons the coin table can be empty, three different sentences. `screener.empty`
# is the only one that asks for an action, so it is reserved for the only case where that action
# helps: no core is connected at all. A connected core that has not published a book yet gets
# `screener.empty_no_data`, and a core hidden by the workspace preset gets the shared
# `workspace.scope.all_hidden` instead of either.
screener.empty: "Piyasa verisi yok — bir çekirdek bağlayın"
screener.empty_no_data: "Henüz piyasa verisi gelmedi"
# A fourth: rows WERE published and the bottom bar's controls — the Type and Listed lists, a text
# or volume filter — left none of them.
screener.empty_filtered: "Geçerli filtrelere uyan satır yok"
# A fifth: the Listed list emptied the table while its answers are still on their way — the
# cores connected under a minute ago. `%{n}` is the whole seconds left; `Listed` is the column's
# title and stays as it is.
screener.listed_collecting: "Listed hâlâ toplanıyor: %{n} sn kaldı"
screener.coins: "coin"
screener.all_cores: "Tüm çekirdekler"
screener.cores_n: "Çekirdek: %{n}"
screener.columns: "Sütunlar"
# The cross-listing column and the list that filters it. The three values are Moonbot's own words for its
# `ListedType` strategy filter and stay English in every language, like the market kinds.
screener.listed_both: "Both"
screener.listed_spot_only: "Spot Only"
screener.listed_futures_only: "Futures Only"
# The auto-figures column (docs-internal/AUTO_FIGURES.md 13.4): its filter list and approach box,
# the Calculate button with its progress (`%{done}` of `%{total}` markets) and tooltips, the words a
# cell shows, and what an empty table says while the filter has nothing to go by. The column's own
# name is `auto_figures.title`, the event names are `auto_figures.event.*`.
screener.af_approach: "Yaklaşma ≤"
screener.af_calculate: "Hesapla"
screener.af_progress: "Hesaplanıyor %{done} / %{total}"
screener.af_calculate_tip: "Tarayıcıdaki tüm piyasalarda otomatik şekilleri yerel 5 dakikalık mum önbelleğinden, Main setinin satırlarıyla bul"
screener.af_restart_tip: "Hesaplanıyor — baştan başlatmak için basın"
screener.af_no_rows_tip: "Main otomatik şekil setinde etkin satır yok"
screener.af_nothing: "hiçbir şey"
screener.af_short: "geçmiş az"
screener.af_no_cache: "önbellek yok"
screener.af_unread: "önbellek okunamadı"
screener.af_press_calculate: "Coinleri otomatik şekillere göre seçmek için Hesapla düğmesine basın"
screener.af_running: "Otomatik şekiller hesaplanıyor…"
