# --- Problems mode: the three diagnostic actions ---
# The reset and the re-read mirror MoonBot's own Problems window; the test is ours.
#
# A test publishes a `test` fact through the core's own detector worker (~2 s) and PROVES the
# channel end to end. It leaves a row behind that only the reset removes, which is why that pair
# ships together.
core_status.problems_test: "Kanalı dene"
# Deliberately NOT MoonBot's "reset all", though it is the same command on the wire. MoonBot's
# window belongs to one core, so "all" there means all of that core's findings; this panel spans a
# fleet, where the same word reads as "all cores" and would be a lie the moment the operator has
# picked one. The button acts on the panel's scope, and the tooltip and the confirm both say how
# many cores that is.
core_status.problems_clear: "Sıfırla"
core_status.problems_test_tip: "Çekirdeğin kendi tespitçisi üzerinden bir deneme olgusu yayımlar — yaklaşık iki saniye. Tüm yolu kanıtlar: tespitçi, hat, izdüşüm, panel."
core_status.problems_refresh: "Yenile"
# Said out loud because the label promises a round trip the protocol cannot make: a core pushes its
# list, nothing can ask for one. Saying so here is cheaper than an operator concluding the button is
# broken when a stale row does not move.
core_status.problems_refresh_tip: "Şimdiye kadar bağlı çekirdeklerin (%{cores}) gönderdiğini yeniden okur. Yalnızca o çekirdeği okumak için bir satıra tıklayın. Taze liste istenemez: protokolde böyle bir komut yok — çekirdek listeyi kendisi gönderir, bağlanırken ve tespitçileri onu değiştirince. Çekirdek yeniden başladıktan sonra, eski satırlar artık ona ait değilken basmaya değer."
# The blast radius, stated BEFORE the dialog: an operator who picked no core is acting on the whole
# scope, and that is the difference between a tidy-up and a fleet-wide loss.
# The one-core forms, for when a clicked finding has narrowed the action. The scope-wide wording
# would state a falsehood about the panel ("connected cores: 1" for a scope of twenty-six) and would
# keep advising a click that, in this state, cancels the pick instead of making one.
core_status.problems_clear_tip_one: "Seçili çekirdeğin tanılarını sıfırlar — geri alınamaz ve her terminal için. Tüm kapsama dönmek için satırına yeniden tıklayın"
core_status.problems_refresh_tip_one: "Seçili çekirdeğin şimdiye kadar gönderdiğini yeniden okur. Taze liste istenemez: protokolde böyle bir komut yok. Tüm kapsama dönmek için satırına yeniden tıklayın"
core_status.problems_clear_tip: "Tanıları sıfırlar. Bağlı çekirdek: %{cores}. Geri alınamaz ve her terminal için. Yalnızca o çekirdeği sıfırlamak için bir satıra tıklayın"
# The test is per-core on the wire and has no fleet-wide form worth having: publishing a test fact
# on two hundred cores litters two hundred cores. So it alone needs one core named.
core_status.problems_pick_core: "Deneme tek çekirdeğe gider: tabloda o çekirdeğin bulgusuna tıklayın — veya panel kapsamını tek çekirdeğe daraltın"
core_status.problems_picked_offline: "Seçili çekirdek çevrimdışı — komut onun dönmesini beklerdi"
core_status.problems_no_online: "Panel kapsamında bağlı çekirdek yok"
# Guards the TEST alone. The command channel outlives the connection, so a queued test would fire on
# the next reconnect and publish its fact at some unannounced later moment, on a core the operator
# stopped looking at hours ago.
core_status.problems_core_offline: "Çekirdek çevrimdışı — deneme yeniden bağlanmasını bekler ve olguyu haber verilmeyen bir anda yayımlardı"
core_status.problems_test_title: "Deneme tanısı gönderilsin mi?"
# The consequence is the whole reason this action is confirmed at all.
core_status.problems_test_q: "%{core} çekirdeği kendi tespitçisi üzerinden bir deneme olgusu yayımlayacak — yaklaşık iki saniye. Satır çekirdekte kalır ve onu kaldırmanın TEK yolu sıfırlamadır; o da bu çekirdeğin gerçek bulgularını siler."
core_status.problems_test_sent: "Deneme %{core} çekirdeğine gönderildi — satır bir iki saniye içinde görünür"
core_status.problems_clear_sent: "Sıfırlama %{core} çekirdeğine gönderildi — satırlar çekirdek sonraki listeyi gönderince gider"
core_status.problems_clear_sent_many: "Sıfırlama %{cores} çekirdeğe gönderildi — satırlar o çekirdekler sonraki listelerini gönderince gider"
# Says what it re-read, not "done": the honest outcome of a re-read that found nothing new is an
# unchanged table, and a message claiming more would make that look like a failure.
core_status.problems_refreshed: "Yeniden okunan çekirdek: %{cores}"
# The shortfall, never a bare success: a fleet action that reached nine of twelve cores has failed
# on three, and only the toast can say so.
core_status.problems_fleet_none: "%{cores} çekirdeğin hiçbirine ulaşılmadı — çevrimdışı veya komut kanalları kapalı"
core_status.problems_fleet_partial: "%{cores} çekirdekten %{sent} tanesine ulaşıldı — kalanı çevrimdışı veya kanalları kapalı"
core_status.problems_not_sent: "Gönderilmedi: çekirdeğin komut kanalı kapalı"
core_status.problems_not_sent_offline: "Gönderilmedi: çekirdek çevrimdışı"
core_status.problems_clear_title: "Çekirdeğin tanıları sıfırlansın mı?"
# Blunt on purpose: the protocol's own warning is that cleared real diagnostics cannot be restored.
core_status.problems_clear_q: "%{core} çekirdeği onaylı her sorunu ve bekleyen her hipotezi bırakacak — tüm terminaller için, geri dönüş yok. Bu bir nedeni düzeltmez: neden duruyorsa çekirdek sorunu yeniden onaylar."
core_status.problems_clear_title_many: "Birkaç çekirdeğin tanıları sıfırlansın mı?"
# The core NAMES, not just how many: a count is nothing an operator can check, and this dialog is
# the last place the mistake is still cheap.
core_status.problems_clear_q_many: "Bu %{cores} çekirdeğin her biri onaylı her sorunu ve bekleyen her hipotezi bırakır — tüm terminaller için, geri dönüş yok. Bu nedenleri düzeltmez: duranlar yeniden onaylanır."
