general.valuation.more: "«İşlem anında»: tutar zamanla değişmez, işlemin kapandığı dakikanın kuruyla. «Güncel»: tüm tutarlar bugünkü kurla yeniden hesaplanır.\n\nBunu yalnızca bilinçli değiştirin: “Güncel kur” son bilinen kuru işlemin yapıldığı borsadan değil Binance/Bybit spotundan alır, birkaç dakikada bir yeniler ve hiçbir yere kaydetmez. Eşik ayarını da değiştirir: eşikler yeniden değerlenmiş geçmişe göre bulunur. Kaydettikten sonra uygulanır."
