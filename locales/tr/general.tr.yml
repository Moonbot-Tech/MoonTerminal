general.live_scope.more: "«Tüm grafikler birlikte»: bir grafiği geçmişe sürüklediğinizde hepsi duraklar ve araç çubuğundaki Live düğmesi bunu gösterir. «Her grafik ayrı»: sürükleme yalnızca o grafiği etkiler; sağ kenara geri getirildiğinde ya da 3 dakika dokunulmadığında kendiliğinden Live'a döner. Araç çubuğundaki Duraklat tüm grafikleri durdurur, Live hepsini şimdiye geri getirir."
