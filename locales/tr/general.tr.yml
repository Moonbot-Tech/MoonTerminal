general.charts_scroll_hint: "Açık — her grafiğin sabit yüksekliği ve dikey kaydırması vardır. Kapalı (eskisi gibi) — grafikler pencere yüksekliğini paylaşır (dikey ölçeklenir)."
general.chart_height: "Grafik yüksekliği, px"
general.compress_fill: "Sığdırarak sıkıştır (kaydırma yok)"
