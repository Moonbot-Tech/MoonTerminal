header.ms_slots_pull: "Çekirdekten al"
header.ms_slots_pull_tip: "Düğme takımını çekirdeğin kendi takımıyla değiştir"
# Moonbot's own checkbox, stored in the CORE: while it is off the core sells a manual-strategy
