toolbar.lev_unset_no_market: "Main grafikte bir coin seçin."
toolbar.lev_unset_unreported: "Borsa bu piyasa için kaldıraç bildirmiyor."
toolbar.sl_unset_tip: "Stopu strateji belirler, ama değeri şu an çekirdekten gelmiyor."
toolbar.tp_main_active_hint: "Ana TP açık. Bir S yuvası seçmek mavi vurguyu o yuvaya taşır."
toolbar.tp_fixed_active_hint: "S%{n} açık. Ana kâr al seviyesine dönmek için TP'ye tıklayın."
toolbar.scale: "Ölçek"
toolbar.scale_auto: "Otomatik"
# The scale-dropdown trigger has room for about one character: the first letter of "Auto".
toolbar.scale_auto_short: "O"
# `Live` is an untranslated domain term; code prepends the `●` status indicator and keeps label text in a neighboring segment.
toolbar.live: "Live"
toolbar.pause: "Duraklat"
toolbar.live_tip: "Live: grafik piyasayı izler. Duraklat: donuk, kaydırabilirsiniz (sol sürükleme, tekerlek)."
toolbar.strategies: "Stratejiler"
toolbar.screener: "Tarayıcı"
# Overflow button at the right end of a narrow toolbar: holds the launchers that did not fit.
toolbar.more_launchers: "Diğer"
# Manual strategy (MS toggle and header picker): the unselected pill.
header.ms_none: "— strateji —"
# Quick-select strategy buttons: tooltip for a slot nothing is assigned to yet, and the menu entry
# that unassigns one. Right click opens that menu.
header.ms_slot_empty: "Boş yuva — strateji atamak için sağ tık"
header.ms_slot_clear: "Yuvayı temizle"
# Quick-select settings popup: the gear beside the strategy buttons, its rows, the core-side
# sell-price flag it exposes, and the action that replaces the local slots with the core's.
header.ms_slots_gear: "Strateji düğmesi ayarları"
header.ms_slots_hint: "Kutu düğmeyi gösterir. Listeler onun stratejisi ve o stratejinin kancasıdır (çekirdeğe yazılır). Robotlar onları Stratejiler penceresinde açar"
