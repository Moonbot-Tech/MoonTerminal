header.ms_mb_logic: "Moonbot'un kendi mantığı"
header.ms_mb_logic_hint: "Stop stratejiden (ya da kancasından) gelir, Moonbot'un yaptığı gibi: araç çubuğundaki SL kilitlidir ve emirden sonra bir şey gönderilmez. Emir yerleşince kendi stopunuzu göndermek için işareti kaldırın"
