# Expert core-settings window: Moonbot's own Settings dialog reproduced over the wire.
# Tab labels deliberately repeat Moonbot's own wording, so a trader reads the same strip here —
# including `tab_hotkeys`, which Moonbot itself writes in Latin script in every language.
# The two pages the compact gear popup also draws (Основные, Автостарт), and the OK/Cancel pair,
# are NOT repeated here: the window reads `core_settings.*` for those, so one Moonbot page cannot
# end up named differently by the two faces of the same gear.
# rust-i18n `_version: 2` format: key -> locale-to-string map. Interpolation: %{var}.
_version: 2

core_expert.window_title:
  ru: "Настройки ядра — экспертный режим"
  en: "Core settings — expert mode"
  es: "Ajustes del núcleo: modo experto"
