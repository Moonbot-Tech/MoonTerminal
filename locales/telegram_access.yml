  ru: "Например, Иван — клиент"
  en: "For example, Alex — client"
  es: "Por ejemplo, Alex — cliente"
telegram.access_transfer_hint:
  ru: "Этот чат получит полный доступ ко всем ядрам. Прежний владелец станет наблюдателем без назначенных ядер. Изменение вступит в силу после сохранения."
  en: "This chat will get full access to all cores. The previous owner will become a viewer with no assigned cores. The change takes effect after saving."
  es: "Este chat tendrá acceso completo a todos los núcleos. El propietario anterior pasará a ser observador sin núcleos asignados. El cambio se aplicará al guardar."
telegram.access_transfer_confirm:
  ru: "Подтвердить смену владельца"
  en: "Confirm owner change"
  es: "Confirmar cambio de propietario"
