# Telegram owner and read-only viewer assignments.
_version: 2

telegram.access_title:
  ru: "Чаты и доступ к ядрам"
  en: "Chats and core access"
  es: "Chats y acceso a núcleos"
telegram.access_roles_hint:
  ru: "Один владелец имеет полный доступ ко всем ядрам. Наблюдатели видят только данные и отчёты выбранных ядер."
  en: "One owner has full access to all cores. Viewers see only data and reports for their assigned cores."
  es: "Un propietario tiene acceso completo a todos los núcleos. Los observadores solo ven datos e informes de los núcleos asignados."
telegram.access_first_owner:
  ru: "Первый привязанный чат станет владельцем. Следующие чаты добавляются как наблюдатели без доступа к данным до назначения ядер."
  en: "The first paired chat becomes the owner. Later chats are viewers with no data access until cores are assigned."
  es: "El primer chat vinculado será el propietario. Los siguientes serán observadores sin acceso a datos hasta que se les asignen núcleos."
telegram.access_chat:
  ru: "Чат %{id}"
  en: "Chat %{id}"
  es: "Chat %{id}"
telegram.access_owner_summary:
  ru: "Владелец: все ядра, полный доступ"
  en: "Owner: all cores, full access"
  es: "Propietario: todos los núcleos, acceso completo"
telegram.access_viewer_summary:
  ru: "Наблюдатель: ядер %{count}, только просмотр"
  en: "Viewer: %{count} cores, read only"
  es: "Observador: %{count} núcleos, solo lectura"
telegram.access_waiting:
  ru: "Наблюдатель: ядра не назначены, доступа к данным нет"
  en: "Viewer: no cores assigned, no data access"
  es: "Observador: sin núcleos asignados ni acceso a datos"
telegram.access_no_cores:
  ru: "Для этого чата ещё не назначены ядра. Попросите владельца выбрать их в MoonTerminal: Настройки → Telegram."
  en: "No cores have been assigned to this chat yet. Ask the owner to select them in MoonTerminal: Settings → Telegram."
  es: "Aún no se han asignado núcleos a este chat. Pide al propietario que los seleccione en MoonTerminal: Ajustes → Telegram."
