telegram.access_save_hint:
  ru: "Названия, роли и доступ к ядрам применяются кнопкой «Сохранить». Новые ядра наблюдателям автоматически не добавляются."
  en: "Names, roles and core access take effect when you press Save. New cores are not automatically assigned to viewers."
  es: "Los nombres, roles y permisos se aplican al pulsar Guardar. Los núcleos nuevos no se asignan automáticamente a los observadores."
