# Report panel (trades): filters, totals, and cell values.
# rust-i18n `_version: 1` format: one language per file, flat dotted keys. Interpolation: %{var}.
# Table headers come from `report.col.<runtime DB column name>` (`columns::header_label`).
# Columns with no such key, the technical columns deliberately kept raw (see `locales/README.md`),
# and dynamically added core fields all fall through to the raw name (`columns::header_for`).
# Exports and the clipboard always use the raw name via `header_for`, never a `report.col.*` value.
_version: 1

# --- Column headers ---
# In `crates/moon-core/src/db/report_read.rs::DISPLAY_COLUMNS` order. Every column NOT listed here
# keeps its raw DB name as its header: the six `locales/README.md` deliberately-untranslated
# technical columns (id, taskid, exorderid, strategyid, basecurrency, sellsetdate), plus `lev` and
# `fname` — kept raw per this goal's own spec, not the README six — and every `*delta`/`*ratio`
# metric column. This list is one decision mirrored in `columns::header_label`'s `matches!` guard —
# keep both in sync, in the same `DISPLAY_COLUMNS` order.
