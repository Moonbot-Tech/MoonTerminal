storage.trades_autoload_cores_hint: "Принти угод стратегій, закритих поки термінал не працював, — з архіву ядра: для кожного ринку він тримає останні кілька тисяч принтів (хвилини в гарячої монети, до доби в тихої), будь-які біржі, включно з Bybit і Hyperliquid. Ліміт запитів біржі не витрачає; угоди старші за 48 год пропускає."
storage.trades_autoload: "Підвантажувати відсутню стрічку з біржі під час запуску"
storage.trades_autoload_hint: "Чого немає в архіві ядра — з біржі, наскільки вона ще віддає (ф'ючерси Binance 48 год, решта до 30 днів; Bybit і Hyperliquid історії не дають). Витрачає ліміт запитів; зупиняється кнопкою тюнера."
storage.trades_cleanup_at_startup: "Очищення під час запуску"
