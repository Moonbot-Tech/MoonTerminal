storage.trades_cleanup: "Очищення"
storage.trades_cleanup_hint: "Лишає принти угод стратегій, які стратегія закрила сама (те, що читає тюнер), у межах кроку \"Принти навколо угоди\". Ручні продажі, фандинг, ліквідації і принти без угоди у звіті зникають. Файл стискається одразу."
