general.valuation_mode_hint: "Звіт і Аналітика перераховують у USDT за курсом тієї хвилини, коли угоду закрито. Змінюйте це лише свідомо: “Поточний курс” бере останній відомий курс зі споту Binance/Bybit, а не з біржі, де йшла торгівля, оновлює його раз на кілька хвилин і ніде не зберігає. Це також змінює підбір порогів: їх підганяють за переоціненою історією. Застосовується після збереження."
general.charts_split_by_core: "Окрема вкладка графіка на ядро"
general.charts_split_by_core_hint: "AddToChart за замовчуванням: увімкнено — своя вкладка на ядро, вимкнено — усі ядра групи в одній. Стовпець “Зв'язка” ядра (Підключення) перекриває це: ядра з однаковим ім'ям зв'язки зводяться в одну вкладку."
general.separate_control_zones: "Панорама графіка в зоні стакана"
general.separate_control_zones_hint: "Увімкнено — ліве перетягування, що не потрапило в лінію ордера, панорамить графік із зони стакана; клік без руху й далі ставить, переносить або скасовує ордер. Вимкнено — зона стакана лише для ордерів: ні панорами, ні масштабу. Жести ордерів завжди лише в зоні стакана, на будь-якій вкладці, включно з Add і винесеними вікнами; клік по полю графіка ордер не ставить, не переносить і не скасовує. Коліщатко над стаканом і далі належить стеку / стакану. Коли стакан приховано, зона ордерів — смуга вздовж правого краю з рискою, доки у вкладці увімкнено “Зона ордерів при прихованому стакані”; вимкніть її разом зі стаканом — і вкладка стане графіком від краю до краю: жодного жесту ордера, а подвійний клік будь-де відкриває монету на Main. Графік, згорнутий мітлою порівняння до стакана, не ділиться зовсім: стакан займає всю його площу, і жестів графіка — панорами, подвійного кліку на Main, виходу з повноекранного режиму — на ньому не лишається."
general.main_idle_close: "Автозакриття графіків Main у простої"
general.main_idle_close_secs: "Закрити через"
general.main_idle_close_hint: "Простій = вікно Main не у фокусі АБО у фокусі, але миша не рухається. Кожен графік закривається через N секунд власної неактивності (нещодавно відкритий — останнім); повноекранний теж закриється і режим вимкнеться. Підписки на стакан знімаються одразу."
