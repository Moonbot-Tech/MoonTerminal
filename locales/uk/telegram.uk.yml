telegram.server.section: "Станція на сервері Linux"
telegram.server.intro: "Бот, Mini App і звіти працюють на вашому власному сервері Linux цілодобово, навіть коли термінал вимкнено. Термінал налаштовує сервер через SSH: закриває вхід за паролем, встановлює службу, передає їй ключі кожного активного ядра і переносить бота."
