telegram.server.passphrase: "Пароль ключа"
telegram.server.key_hint: "Шлях до приватного ключа ed25519, ECDSA або RSA (OpenSSH, PuTTY .ppk, PKCS#8 або RSA PEM / PKCS#1). Пароль лише якщо ключ зашифровано."
telegram.server.sudo_password: "Пароль sudo"
telegram.server.password: "Пароль"
