# --- Problems mode: the three diagnostic actions ---
# The reset and the re-read mirror MoonBot's own Problems window; the test is ours.
#
# A test publishes a `test` fact through the core's own detector worker (~2 s) and PROVES the
# channel end to end. It leaves a row behind that only the reset removes, which is why that pair
# ships together.
core_status.problems_test: "Перевірити канал"
# Deliberately NOT MoonBot's "reset all", though it is the same command on the wire. MoonBot's
# window belongs to one core, so "all" there means all of that core's findings; this panel spans a
# fleet, where the same word reads as "all cores" and would be a lie the moment the operator has
# picked one. The button acts on the panel's scope, and the tooltip and the confirm both say how
# many cores that is.
core_status.problems_clear: "Скинути"
core_status.problems_test_tip: "Публікує тестовий факт через власний детектор ядра — близько двох секунд. Доводить увесь шлях: детектор, дріт, проєкція, панель."
core_status.problems_refresh: "Оновити"
# Said out loud because the label promises a round trip the protocol cannot make: a core pushes its
# list, nothing can ask for one. Saying so here is cheaper than an operator concluding the button is
# broken when a stale row does not move.
core_status.problems_refresh_tip: "Перечитує те, що встигли надіслати підключені ядра (%{cores}). Клацни рядок, щоб перечитати лише те ядро. Свіжий список запитати не можна: у протоколі немає такої команди — ядро надсилає його саме, під час підключення і коли його детектори змінюють список. Варто натиснути після перезапуску ядра, коли старі рядки вже не про нього."
# The blast radius, stated BEFORE the dialog: an operator who picked no core is acting on the whole
# scope, and that is the difference between a tidy-up and a fleet-wide loss.
# The one-core forms, for when a clicked finding has narrowed the action. The scope-wide wording
# would state a falsehood about the panel ("connected cores: 1" for a scope of twenty-six) and would
# keep advising a click that, in this state, cancels the pick instead of making one.
core_status.problems_clear_tip_one: "Скине діагностику вибраного ядра — незворотно і для всіх терміналів. Клацни його рядок ще раз, щоб повернутися до всієї області"
core_status.problems_refresh_tip_one: "Перечитує те, що встигло надіслати вибране ядро. Свіжий список запитати не можна: у протоколі немає такої команди. Клацни його рядок ще раз, щоб повернутися до всієї області"
core_status.problems_clear_tip: "Скине діагностику. Ядер на зв'язку: %{cores}. Незворотно і для всіх терміналів. Клацни рядок, щоб скинути лише його ядро"
# The test is per-core on the wire and has no fleet-wide form worth having: publishing a test fact
# on two hundred cores litters two hundred cores. So it alone needs one core named.
core_status.problems_pick_core: "Тест іде на одне ядро: клацни знахідку цього ядра в таблиці — або звузь область панелі до одного ядра"
core_status.problems_picked_offline: "Вибране ядро офлайн — команда чекала б, поки воно повернеться"
core_status.problems_no_online: "В області панелі немає підключених ядер"
# Guards the TEST alone. The command channel outlives the connection, so a queued test would fire on
# the next reconnect and publish its fact at some unannounced later moment, on a core the operator
# stopped looking at hours ago.
core_status.problems_core_offline: "Ядро офлайн — тест чекав би на перепідключення і опублікував би факт невідомо коли"
core_status.problems_test_title: "Надіслати тестову діагностику?"
# The consequence is the whole reason this action is confirmed at all.
core_status.problems_test_q: "Ядро %{core} опублікує тестовий факт через власний детектор — близько двох секунд. Рядок лишиться на ядрі, і ЄДИНИЙ спосіб прибрати його — скидання, яке також знищить справжні знахідки цього ядра."
core_status.problems_test_sent: "Тест надіслано на %{core} — рядок з'явиться за пару секунд"
core_status.problems_clear_sent: "Скидання надіслано на %{core} — рядки зникнуть, коли ядро надішле наступний список"
core_status.problems_clear_sent_many: "Скидання надіслано на %{cores} ядер — рядки зникнуть, коли ці ядра надішлють наступні списки"
# Says what it re-read, not "done": the honest outcome of a re-read that found nothing new is an
# unchanged table, and a message claiming more would make that look like a failure.
core_status.problems_refreshed: "Перечитано ядер: %{cores}"
# The shortfall, never a bare success: a fleet action that reached nine of twelve cores has failed
# on three, and only the toast can say so.
core_status.problems_fleet_none: "Не дійшло до жодного з %{cores} ядер — офлайн або їхній канал команд закрито"
core_status.problems_fleet_partial: "Дійшло до %{sent} із %{cores} ядер — решта офлайн або їхній канал закрито"
core_status.problems_not_sent: "Не надіслано: канал команд ядра закрито"
core_status.problems_not_sent_offline: "Не надіслано: ядро офлайн"
core_status.problems_clear_title: "Скинути діагностику ядра?"
# Blunt on purpose: the protocol's own warning is that cleared real diagnostics cannot be restored.
core_status.problems_clear_q: "Ядро %{core} відкине кожну підтверджену проблему і незавершену гіпотезу — для всіх терміналів, без шляху назад. Причину це не лікує: якщо вона лишиться, ядро підтвердить проблему знову."
core_status.problems_clear_title_many: "Скинути діагностику кількох ядер?"
# The core NAMES, not just how many: a count is nothing an operator can check, and this dialog is
# the last place the mistake is still cheap.
core_status.problems_clear_q_many: "Кожне з цих %{cores} ядер відкине кожну підтверджену проблему і незавершену гіпотезу — для всіх терміналів, без шляху назад. Причину це не лікує: ті, що лишаться, буде підтверджено знову."
