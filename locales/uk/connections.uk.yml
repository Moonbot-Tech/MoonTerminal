conn.col.endpoint: "Адреса:порт"
conn.tip.endpoint: "Адреса і порт, за якими термінал підключається до ядра. Порожньо — беруться з ключа (показано сірим). Впишіть свої, якщо ядро у вашій локальній мережі, адреса в ключі хибна чи її немає, або провайдер змінив IP: адреса, адреса:порт, :порт або ім'я хоста. Новий ключ це поле не затирає; хрестик повертає адресу з ключа. Значок хмари біля заповненого поля вирішує, чи отримає цю адресу і станція."
conn.endpoint_duplicate: "Цю адресу і порт уже використовує ядро %{name}"
conn.address_ph: "з ключа"
conn.endpoint_hint: "Порожньо — адреса з ключа. Можна вписати адресу, адреса:порт, :порт або ім'я хоста; новий ключ це поле не затирає."
conn.endpoint_invalid: "Це не адреса. Підходить: 192.168.1.5, 192.168.1.5:5017, :5017, [2001:db8::1]:5017 або ім'я хоста. Поки поле червоне, ядро не підключається."
conn.endpoint_no_address: "У ключі немає адреси — термінал підключається до 127.0.0.1, тобто до цього комп'ютера. Якщо ядро на іншій машині, впишіть її адресу сюди або перевипустіть ключ у MoonBot: увімкніть Kernel (VPS) і натисніть Apply (або впишіть IP сервера в поле IP), потім Copy Key."
conn.endpoint_to_station_on: "Станція теж підключається до ядра за цією адресою. Натисніть, щоб станція знову брала адресу з ключа."
conn.endpoint_to_station_off: "Станція підключається до ядра за адресою з ключа. Натисніть, щоб передати їй і цю адресу — якщо до неї можна дістатися з сервера станції (до адреси вашої локальної мережі — ні). Дійде до станції, коли надішлете їй ядра."
