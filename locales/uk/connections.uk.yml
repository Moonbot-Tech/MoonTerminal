# Tooltips.
conn.tip.act: "Підключатися до ядра"
conn.tip.name: "Ім'я ядра (довільне, для показу в терміналі)"
conn.tip.key: "Ключ створюється в MoonBot, не на сайті, і копіюється ПІСЛЯ налаштування ядра — він несе адресу, порт і режим із собою; адресу й порт за потреби змінюють у колонці «Адреса:порт». Порядок: 1) на сервері з MoonBot відкрити UDP-порт ядра для вхідних; 2) у MoonBot: зелений кружок ліворуч унизу (вікно Info) → Moon Kernel → Settings → вікно Moon Proto, вкладка Settings: увімкнути Kernel (VPS), задати Port, вибрати версію V0/V1/V2 (за замовчуванням V0), натиснути Apply; 3) там само Key: → Copy Key (ключа ще немає — New Key); 4) вставити сюди кнопкою Вставити і натиснути Зберегти. Око показує або ховає його."
conn.key_ph: "Copy Key у MoonBot"
conn.key_unreadable: "Це не ключ MoonBot — термінал не може його прочитати. Скопіюйте ключ у MoonBot кнопкою Copy Key (вікно Moon Proto → Settings → Key:) і вставте його сюди цілком кнопкою Вставити"
# Placeholder of the "Charts" cell. The field holds a bundle NAME, not a count (see
# `conn.tip.bundle` and `ServerConfig::chart_bundle`), so the placeholder has to say "name".
conn.bundle_ph: "ім'я зв'язки"
conn.paste_key_tip: "Вставити ключ із буфера обміну"
conn.tip.color: "Колір ядра: ним підсвічуються його угоди і мітки на графіку."
conn.tip.flags: "Прийом даних від ядра. Сіра = приймаємо все; кольорова = частину категорій вимкнено. Клік — налаштувати."
conn.tip.proto: "Режим транспорту MoonProto - та сама трійка V0/V1/V2, що й у налаштуваннях ядра Moon Proto; обидві сторони мають стояти на ОДНОМУ. Береться з ключа ОДИН раз, доки режим ще не задано; далі він ваш, і новий ключ його вже не перебиває - тож ключ не треба випускати наново лише щоб змінити режим. Прочерк означає, що ключ нічого не назвав (старіший експорт), і з'єднання йде як V0. Застосовується після Зберегти: ядро перепідключиться саме. Тож Copy Key натискайте вже ПІСЛЯ того, як на ядрі виставлено Port і версію перемикачами V0/V1/V2 (MoonBot за замовчуванням створює ключі V0): ключ несе їх із собою."
conn.tip.preset: "У якому режимі робочого простору ядро видно в кожному списку: в обох, лише в MANUAL чи лише в AUTO. Лише показ — приховане ядро все одно підключається і записує."
conn.tip.total: "Як це ядро входить у підсумок унизу Активів. Авто: ядра на одному біржовому рахунку рахуються один раз. Не враховувати: ядро не входить у підсумок. Окремо: ядро завжди рахується саме, без злиття."
conn.preset.both: "Обидва"
