core_expert.waiting: "Чекаємо на налаштування ядра — ядро надсилає їх у фоні після підключення."
core_expert.replaced: "На цьому підключенні відповідає вже інший процес Moonbot. Попередню сторінку відкинуто, щоб не записати її в новий процес; зміни збережено і їх буде накладено на нову сторінку, коли вона надійде."
core_expert.stale: "Зв'язок із ядром не готовий: ця сторінка — збережений знімок, і її не буде надіслано, поки ядро не відповість знову."
