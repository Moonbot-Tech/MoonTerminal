# --- The server's key, before anything is sent ---
core_move.review.fingerprint: "Сервер %{addr} пред'являє ключ %{fingerprint}. Звірте його з ключем, який показує провайдер."
core_move.review.what: "Перенесення увійде з цим логіном, встановить MoonBot для Linux у теку, завантажить налаштування ядра та базу звітів і відкриє UDP-порт у файрволі."
core_move.review.secrets: "У налаштуваннях ядра лежать його API-ключі біржі: вони підуть на цей сервер."
