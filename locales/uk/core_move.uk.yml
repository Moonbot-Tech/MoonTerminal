core_move.form.intro: "Ядро переїжджає зі своїми налаштуваннями, стратегіями та історією угод. Ключ MoonProto лишається тим самим, змінюється лише адреса."
core_move.form.host: "Адреса сервера"
core_move.form.login: "Логін"
core_move.form.by_key: "Вхід за ключем"
core_move.form.key_path: "Файл ключа"
core_move.form.key_browse: "Огляд…"
core_move.form.passphrase: "Пароль ключа"
core_move.form.sudo_password: "Пароль sudo"
core_move.form.password: "Пароль"
core_move.form.dir: "Тека на сервері"
core_move.form.port: "UDP-порт MoonProto"
core_move.form.order: "Нове ядро встановлюється, але не запускається. Потім старе ядро просять зупинитися, і нове запускається лише після того, як старе зупинилося. Після цього термінал і станція самі перемикаються на нове ядро."
core_move.form.check: "Перевірити сервер"
core_move.form.need_host: "Вкажіть адресу сервера."
