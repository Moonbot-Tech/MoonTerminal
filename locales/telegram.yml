# Settings -> Telegram -> the bot's segment -> "Station on a Linux server".
telegram.server.section:
  ru: "Станция на сервере Linux"
  en: "Station on a Linux server"
  es: "Estación en un servidor Linux"
telegram.server.intro:
  ru: "Бот, Mini App и отчёты работают на вашем Linux-сервере круглосуточно, даже когда терминал выключен. Терминал сам настраивает сервер по SSH: закрывает вход по паролю, ставит службу, передаёт ей ключи всех включённых ядер и переносит бота."
  en: "The bot, the Mini App and the reports run on your own Linux server around the clock, even while the terminal is off. The terminal sets the server up over SSH: closes password logins, installs the service, hands it the keys of every active core and moves the bot."
  es: "El bot, la Mini App y los informes funcionan en tu propio servidor Linux las 24 horas, incluso con el terminal apagado. El terminal configura el servidor por SSH: cierra el acceso por contraseña, instala el servicio, le pasa las claves de todos los núcleos activos y traslada el bot."
telegram.server.host:
  ru: "IP сервера"
  en: "Server IP"
  es: "IP del servidor"
telegram.server.login:
  ru: "Логин"
  en: "Login"
  es: "Usuario"
telegram.server.by_key:
  ru: "Вход по SSH-ключу"
  en: "Log in with an SSH key"
  es: "Entrar con una clave SSH"
telegram.server.key_path:
  ru: "Файл ключа"
  en: "Key file"
  es: "Archivo de clave"
telegram.server.passphrase:
  ru: "Пароль ключа"
  en: "Key passphrase"
  es: "Contraseña de la clave"
telegram.server.key_hint:
  ru: "Путь к приватному ключу ed25519 или ECDSA (OpenSSH, PuTTY .ppk или PKCS#8). Ключи RSA не поддерживаются. Пароль ключа — только если ключ зашифрован."
  en: "Path to an ed25519 or ECDSA private key (OpenSSH, PuTTY .ppk or PKCS#8). RSA keys are not supported. The passphrase only if the key is encrypted."
  es: "Ruta a una clave privada ed25519 o ECDSA (OpenSSH, PuTTY .ppk o PKCS#8). Las claves RSA no son compatibles. La contraseña solo si la clave está cifrada."
telegram.server.sudo_password:
  ru: "Пароль sudo"
  en: "sudo password"
  es: "Contraseña de sudo"
telegram.server.password:
  ru: "Пароль"
  en: "Password"
  es: "Contraseña"
telegram.server.first_login_hint:
  ru: "Доступ от провайдера (IP, логин, пароль root или ключ) нужен один раз и нигде не сохраняется. После установки вход по паролю закрыт, терминал входит своим ключом."
  en: "The access from your provider (IP, login, root password or key) is used once and stored nowhere. After the install, password logins are closed and the terminal logs in with its own key."
  es: "El acceso del proveedor (IP, usuario, contraseña de root o clave) se usa una vez y no se guarda. Tras la instalación, el acceso por contraseña queda cerrado y el terminal entra con su propia clave."
telegram.server.old_admin:
  ru: "Старый пароль moon"
  en: "Old password of moon"
  es: "Contraseña anterior de moon"
telegram.server.release_hint:
  ru: "Служба ставится из последнего релиза MoonTerminal на GitHub под архитектуру сервера (проверка SHA-256)."
  en: "The service is installed from the latest MoonTerminal release on GitHub, for the server's architecture (SHA-256 checked)."
  es: "El servicio se instala desde la última versión de MoonTerminal en GitHub, para la arquitectura del servidor (SHA-256 comprobado)."
telegram.server.transfer_hint:
  ru: "Бот терминала переносится на сервер: токен, чаты и доступы. Когда бот на сервере заработает, терминал удалит токен у себя; для локального бота понадобится другой токен. Если перенос не удастся, бот останется в терминале."
  en: "The terminal's bot moves to the server: its token, chats and their access. Once the bot runs there, the terminal deletes its own token; a local bot will need another token. If the move fails, the bot stays in the terminal."
  es: "El bot del terminal se traslada al servidor: su token, los chats y sus accesos. Cuando el bot funcione allí, el terminal borra su propio token; un bot local necesitará otro token. Si el traslado falla, el bot se queda en el terminal."
telegram.server.mini_app:
  ru: "Mini App на сервере"
  en: "Mini App on the server"
  es: "Mini App en el servidor"
telegram.server.mini_app_hint:
  ru: "Вход в Mini App идёт через туннель Cloudflare: где Cloudflare заблокирован, Mini App не откроется — тогда выключите. Переключение перезапускает станцию."
  en: "The Mini App is reached through a Cloudflare tunnel: where Cloudflare is blocked it will not open, so switch it off there. Switching restarts the station."
  es: "La Mini App se abre a través de un túnel de Cloudflare: donde Cloudflare está bloqueado no se abrirá, así que desactívala. Cambiarlo reinicia la estación."
telegram.server.access_title:
  ru: "Доступ к боту на сервере"
  en: "Access to the bot on the server"
  es: "Acceso al bot en el servidor"
telegram.server.access_apply:
  ru: "Применить на сервере"
  en: "Apply on the server"
  es: "Aplicar en el servidor"
telegram.server.access_revert:
  ru: "Отменить правки"
  en: "Discard edits"
  es: "Descartar cambios"
telegram.server.access_apply_hint:
  ru: "Правки чатов уходят на сервер кнопкой «Применить на сервере»; «Сохранить» их не касается."
  en: "Chat edits go to the server with «Apply on the server»; Save does not touch them."
  es: "Los cambios de chats van al servidor con «Aplicar en el servidor»; Guardar no los toca."
telegram.server.bot_no_api:
  ru: "Станция не отвечает: запускается или её служба старше этого терминала — нажмите «Обновить службу»."
  en: "The station does not answer: it is starting, or its service is older than this terminal — press «Update the service»."
  es: "La estación no responde: está arrancando o su servicio es más antiguo que este terminal; pulsa «Actualizar el servicio»."
telegram.server.cores_hint:
  ru: "На сервер уходят зашифрованными ключи всех включённых ядер; с ними сервер может торговать."
  en: "The keys of every active core go to the server encrypted; with them the server can trade."
  es: "Las claves de todos los núcleos activos van al servidor cifradas; con ellas el servidor puede operar."
