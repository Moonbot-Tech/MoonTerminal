telegram.station.update_requested:
  ru: "Обновление запущено: станция скачает последний релиз, проверит его и перезапустится — около минуты. Если новая версия не удержится, вернётся прежняя. Затем нажмите «Статус» — там будет версия."
  en: "Update started: the station downloads the latest release, checks it and restarts — about a minute. If the new version does not stay up, the previous one comes back. Then press Status to see the version."
  es: "Actualización iniciada: la estación descarga la última versión, la comprueba y se reinicia — alrededor de un minuto. Si la nueva versión no se mantiene, vuelve la anterior. Después pulsa Estado para ver la versión."
telegram.station.update_not_requested:
  ru: "Обновление не запущено: %{reason}"
  en: "The update did not start: %{reason}"
  es: "La actualización no se inició: %{reason}"
telegram.server.tape_title:
  ru: "Лента вокруг сделок на станции"
  en: "The station's tape around trades"
  es: "La cinta de la estación alrededor de las operaciones"
telegram.server.tape_hint:
  ru: "У станции свои значения — те, с которыми она пишет сейчас. Терминал сам их не меняет: поменяй и нажми «Установить»."
  en: "The station has values of its own — the ones it records with now. The terminal never changes them by itself: change them and press “Set”."
  es: "La estación tiene sus propios valores: los que usa ahora. El terminal no los cambia por su cuenta: cámbialos y pulsa «Establecer»."
telegram.server.tape_unknown:
  ru: "Значения станции ещё не прочитаны: станция не запущена или её служба старше этого терминала («Обновить службу»)."
  en: "The station's values are not read yet: the station is not running, or its service is older than this terminal (“Update the service”)."
  es: "Aún no se leyeron los valores de la estación: no está en marcha o su servicio es anterior a este terminal («Actualizar el servicio»)."
