  en: "/pair %{code}\nSend this command to your bot in a private chat. The code works once and expires after 10 minutes."
  es: "/pair %{code}\nEnvía este comando a tu bot en un chat privado. El código es de un solo uso y caduca a los 10 minutos."

telegram.pair_new:
  ru: "Получить код привязки"
