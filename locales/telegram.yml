# Telegram Settings tab and later bot/Mini App strings.
# rust-i18n `_version: 2` format: key → locale-to-string map. Interpolation: %{var}.
_version: 2

telegram.intro:
  ru: "Подключите своего бота, разрешите доступ своему чату и открывайте Mini App из Telegram."
  en: "Connect your bot, authorize your chat, and open Mini App from Telegram."
  es: "Conecta tu bot, autoriza tu chat y abre Mini App desde Telegram."
telegram.section_access:
  ru: "Доступ к терминалу"
  en: "Terminal access"
  es: "Acceso al terminal"
telegram.access_hint:
  ru: "Только привязанные чаты получают доступ. Для нового чата создайте код и отправьте команду своему боту."
  en: "Only paired chats have access. For a new chat, generate a code and send the command to your bot."
  es: "Solo los chats vinculados tienen acceso. Para un chat nuevo, genera un código y envía el comando a tu bot."
telegram.state.connected:
  ru: "Бот подключён"
  en: "Bot connected"
  es: "Bot conectado"
telegram.pair_copy:
  ru: "Скопировать команду"
  en: "Copy command"
  es: "Copiar comando"
telegram.mini_copy_url:
  ru: "Скопировать адрес Mini App"
  en: "Copy Mini App address"
  es: "Copiar dirección de Mini App"
telegram.mini_disabled:
  ru: "Mini App выключено"
  en: "Mini App is off"
  es: "Mini App está desactivada"
telegram.mini_ready:
  ru: "Готово. Откройте Mini App кнопкой в своём боте."
  en: "Ready. Open Mini App using the button in your bot."
  es: "Lista. Abre Mini App con el botón de tu bot."
telegram.mini_starting:
  ru: "Подготавливаем Mini App. Дождитесь готовности, затем нажмите «Открыть Mini App» в боте."
  en: "Preparing Mini App. Once ready, press Open Mini App in the bot."
  es: "Preparando Mini App. Cuando esté lista, pulsa Abrir Mini App en el bot."
telegram.mini_failed:
  ru: "Не удалось открыть доступ к Mini App. Проверьте интернет; повторная попытка выполняется автоматически."
  en: "Could not make Mini App available. Check your internet connection; retrying automatically."
  es: "No se pudo habilitar Mini App. Comprueba tu conexión a internet; se reintentará automáticamente."
telegram.bot_welcome:
  ru: "MoonTerminal\n\nЭтот чат подключён к вашему терминалу. Выберите действие на клавиатуре внизу.\n\nКнопка «Открыть Mini App» запрашивает актуальную ссылку для входа. Терминал должен оставаться запущенным."
  en: "MoonTerminal\n\nThis chat is connected to your terminal. Choose an action on the keyboard below.\n\nOpen Mini App requests a fresh launch link. Keep the terminal running."
  es: "MoonTerminal\n\nEste chat está conectado a tu terminal. Elige una acción en el teclado de abajo.\n\nAbrir Mini App solicita un enlace de acceso actualizado. Mantén el terminal abierto."
telegram.button_help:
  ru: "Помощь"
  en: "Help"
  es: "Ayuda"
telegram.bot_ready:
  ru: "Mini App готово к открытию. Нажмите кнопку ниже."
  en: "Mini App is ready. Tap the button below."
  es: "Mini App está lista. Pulsa el botón de abajo."
telegram.bot_mini_disabled:
  ru: "Mini App выключено. В MoonTerminal откройте «Настройки → Telegram», включите Mini App и сохраните изменения. Затем отправьте /miniapp."
  en: "Mini App is off. In MoonTerminal, open Settings → Telegram, enable Mini App and save. Then send /miniapp."
  es: "Mini App está desactivada. En MoonTerminal, abre Ajustes → Telegram, activa Mini App y guarda. Después envía /miniapp."
telegram.bot_mini_wait:
  ru: "Mini App пока недоступно. Проверьте его состояние в «Настройки → Telegram» и повторите /miniapp, когда оно будет готово."
  en: "Mini App is not available yet. Check its status in Settings → Telegram and send /miniapp again when ready."
  es: "Mini App aún no está disponible. Comprueba su estado en Ajustes → Telegram y vuelve a enviar /miniapp cuando esté lista."

telegram.tab:
  ru: "Telegram"
  en: "Telegram"
  es: "Telegram"

telegram.section_bot:
  ru: "Бот"
  en: "Bot"
  es: "Bot"
telegram.section_mini_app:
  ru: "Mini App"
  en: "Mini App"
  es: "Mini App"

telegram.token:
  ru: "Токен бота"
  en: "Bot token"
  es: "Token del bot"
telegram.token_hint:
  ru: "Хранится только в зашифрованном конфиге. Пустой токен полностью выключает Telegram."
  en: "Stored only in the encrypted config. An empty token turns Telegram off completely."
  es: "Se guarda solo en la configuración cifrada. Un token vacío desactiva Telegram por completo."

telegram.onboarding:
  ru: "Создайте бота: отправьте /newbot в @BotFather. Вставьте полученный токен сюда и нажмите «Сохранить». Затем подключите свой чат в блоке «Доступ к терминалу»."
  en: "Create a bot: send /newbot to @BotFather. Paste the token here and press Save. Then pair your chat in Terminal access."
  es: "Crea un bot: envía /newbot a @BotFather. Pega el token aquí y pulsa Guardar. Después vincula tu chat en Acceso al terminal."

telegram.mini_app:
  ru: "Включить Mini App"
  en: "Enable Mini App"
  es: "Activar Mini App"
telegram.mini_app_hint:
  ru: "После сохранения откройте своего бота и отправьте /start. Бот покажет кнопку входа. Терминал должен оставаться запущенным."
  en: "After saving, open your bot and send /start to get the launch button. Keep the terminal running."
  es: "Después de guardar, abre tu bot y envía /start para obtener el botón de acceso. Mantén el terminal abierto."

telegram.paired_none:
  ru: "Нет привязанных чатов"
  en: "No paired chats"
  es: "Sin chats vinculados"
telegram.paired_count:
  ru: "Привязанных чатов: %{count}"
  en: "Paired chats: %{count}"
  es: "Chats vinculados: %{count}"

telegram.state.disabled:
  ru: "Выключено: задайте токен бота, чтобы включить Telegram."
  en: "Disabled: set a bot token to turn Telegram on."
  es: "Desactivado: indica un token de bot para activar Telegram."
telegram.state.unsaved:
  ru: "Есть изменения. Нажмите «Сохранить», чтобы применить их."
  en: "Changes pending. Press Save to apply them."
  es: "Hay cambios pendientes. Pulsa Guardar para aplicarlos."
telegram.state.starting:
  ru: "Запускается…"
  en: "Starting…"
  es: "Iniciando…"
telegram.state.unavailable:
  ru: "Нет соединения с Telegram. Проверьте токен и подключение к интернету."
  en: "Cannot connect to Telegram. Check the token and your internet connection."
  es: "No se puede conectar con Telegram. Comprueba el token y tu conexión a internet."

telegram.pair_success:
  ru: "Чат подключён к MoonTerminal.\n\nТеперь можно открыть Mini App или помощь кнопками внизу."
  en: "Chat connected to MoonTerminal.\n\nUse the buttons below to open Mini App or get help."
  es: "Chat conectado a MoonTerminal.\n\nUsa los botones de abajo para abrir Mini App u obtener ayuda."

telegram.refusal:
  ru: "Доступ запрещён."
  en: "Access denied."
  es: "Acceso denegado."

telegram.mini_open:
  ru: "Открыть Mini App"
  en: "Open Mini App"
  es: "Abrir Mini App"

telegram.invalid:
  ru: "Команда не распознана.\n\n/start — главное меню\n/miniapp — открыть Mini App\n/help — помощь"
  en: "Command not recognized.\n\n/start — main menu\n/miniapp — open Mini App\n/help — help"
  es: "Comando no reconocido.\n\n/start — menú principal\n/miniapp — abrir Mini App\n/help — ayuda"

