  ru: "Скопировать адрес Mini App"
  en: "Copy Mini App address"
  es: "Copiar dirección de Mini App"
telegram.mini_disabled:
  ru: "Mini App выключено"
  en: "Mini App is off"
  es: "Mini App está desactivada"
telegram.mini_ready:
  ru: "Готово. Откройте Mini App кнопкой в своём боте."
  en: "Ready. Open Mini App using the button in your bot."
  es: "Lista. Abre Mini App con el botón de tu bot."
telegram.mini_starting:
  ru: "Подготавливаем Mini App. Дождитесь готовности, затем нажмите «Открыть» в боте."
  en: "Preparing Mini App. Once ready, press Open in the bot."
  es: "Preparando Mini App. Cuando esté lista, pulsa Abrir en el bot."
telegram.mini_failed:
  ru: "Не удалось открыть доступ к Mini App. Проверьте интернет; повторная попытка выполняется автоматически."
  en: "Could not make Mini App available. Check your internet connection; retrying automatically."
  es: "No se pudo habilitar Mini App. Comprueba tu conexión a internet; se reintentará automáticamente."
telegram.bot_welcome:
  ru: "MoonTerminal\n\nЧат подключён. Отчёты доступны прямо здесь; включать Mini App для них не нужно.\n\n/miniapp — отдельный запуск Mini App."
  en: "MoonTerminal\n\nChat connected. Reports are available here without enabling Mini App.\n\n/miniapp — launch Mini App separately."
  es: "MoonTerminal\n\nChat conectado. Los informes están disponibles aquí sin activar Mini App.\n\n/miniapp — abrir Mini App por separado."
telegram.button_help:
  ru: "Помощь"
  en: "Help"
  es: "Ayuda"
telegram.button_status:
  ru: "Статус"
  en: "Status"
  es: "Estado"
telegram.bot_ready:
  ru: "Mini App готово к открытию. Нажмите «Открыть»."
  en: "Mini App is ready. Tap Open."
  es: "Mini App está lista. Pulsa Abrir."
telegram.bot_mini_disabled:
  ru: "Mini App выключено. В MoonTerminal откройте «Настройки → Telegram», включите Mini App и сохраните изменения. Затем отправьте /miniapp."
  en: "Mini App is off. In MoonTerminal, open Settings → Telegram, enable Mini App and save. Then send /miniapp."
  es: "Mini App está desactivada. En MoonTerminal, abre Ajustes → Telegram, activa Mini App y guarda. Después envía /miniapp."
telegram.bot_mini_wait:
  ru: "Mini App пока недоступно. Проверьте его состояние в «Настройки → Telegram» и повторите /miniapp, когда оно будет готово."
  en: "Mini App is not available yet. Check its status in Settings → Telegram and send /miniapp again when ready."
  es: "Mini App aún no está disponible. Comprueba su estado en Ajustes → Telegram y vuelve a enviar /miniapp cuando esté lista."
telegram.bot_mini_disabled_station:
  ru: "Mini App на станции выключено. Его включает владелец в терминале: «Настройки → Telegram», галка «Mini App на сервере». Затем отправьте /miniapp."
  en: "Mini App is off on the station. Its owner turns it on in the terminal: Settings → Telegram, the «Mini App on the server» box. Then send /miniapp."
  es: "Mini App está desactivada en la estación. La activa su propietario en el terminal: Ajustes → Telegram, la casilla «Mini App en el servidor». Después envía /miniapp."
telegram.bot_mini_wait_station:
  ru: "Mini App пока недоступно: станция ещё открывает к нему доступ. Повторите /miniapp через минуту."
  en: "Mini App is not available yet: the station is still opening access to it. Send /miniapp again in a minute."
  es: "Mini App aún no está disponible: la estación todavía está abriendo el acceso. Vuelve a enviar /miniapp en un minuto."

