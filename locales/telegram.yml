telegram.token:
  ru: "Токен бота"
  en: "Bot token"
  es: "Token del bot"
telegram.token_hint:
  ru: "Хранится только в зашифрованном конфиге. Пустой токен полностью выключает Telegram."
  en: "Stored only in the encrypted config. An empty token turns Telegram off completely."
  es: "Se guarda solo en la configuración cifrada. Un token vacío desactiva Telegram por completo."

telegram.onboarding:
  ru: "Создайте бота: отправьте /newbot в @BotFather. Вставьте полученный токен сюда и нажмите «Сохранить». Затем подключите свой чат в блоке «Доступ к терминалу»."
  en: "Create a bot: send /newbot to @BotFather. Paste the token here and press Save. Then pair your chat in Terminal access."
  es: "Crea un bot: envía /newbot a @BotFather. Pega el token aquí y pulsa Guardar. Después vincula tu chat en Acceso al terminal."

telegram.mini_app:
  ru: "Включить Mini App"
  en: "Enable Mini App"
  es: "Activar Mini App"
telegram.mini_app_hint:
  ru: "После сохранения отправьте боту /miniapp для кнопки входа. /start открывает меню отчётов. Терминал должен оставаться запущенным."
  en: "After saving, send /miniapp for the launch button. /start opens report navigation. Keep the terminal running."
  es: "Después de guardar, envía /miniapp para obtener el botón de acceso. /start abre los informes. Mantén el terminal abierto."

