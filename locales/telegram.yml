  ru: "Статус"
  en: "Status"
  es: "Estado"
telegram.server.move_bot:
  ru: "Перенести бота на сервер"
  en: "Move the bot to the server"
  es: "Mover el bot al servidor"
telegram.server.bot_off:
  ru: "Снять бота с сервера"
  en: "Take the bot off the server"
  es: "Quitar el bot del servidor"
telegram.server.bot_off_hint:
  ru: "Вернуть бота в терминал вместе с чатами и правами доступа. Если в терминале уже есть бот, он сохранится, а серверный бот будет только снят."
  en: "Return the bot to the terminal with its chats and access. If the terminal already has a bot, keep it and only remove the server bot."
  es: "Devolver el bot al terminal con sus chats y permisos. Si el terminal ya tiene un bot, conservarlo y solo quitar el bot del servidor."
telegram.server.return_done:
  ru: "Бот возвращён в терминал вместе с чатами и правами доступа."
  en: "The bot is back in the terminal with its chats and access."
  es: "El bot ha vuelto al terminal con sus chats y permisos."
telegram.server.return_skipped:
  ru: "Бот снят с сервера, но не восстановлен: в терминале уже есть свой бот."
  en: "The server bot was removed but not restored: the terminal already has its own bot."
  es: "El bot se quitó del servidor, pero no se restauró: el terminal ya tiene su propio bot."
telegram.server.return_old_helper:
  ru: "Бот остался на сервере: его помощник ещё не умеет возвращать токен. Сначала нажмите «Настроить заново», затем попробуйте снова."
  en: "The bot remains on the server: its helper cannot return the token yet. Press Set up again first, then retry."
  es: "El bot sigue en el servidor: su asistente aún no puede devolver el token. Pulsa primero Configurar de nuevo y vuelve a intentarlo."
telegram.server.return_read_failed:
  ru: "Не удалось прочитать токен или права бота. Бот не снят с сервера; проверьте SSH-соединение и повторите попытку."
  en: "Could not read the bot token or access. The bot was not removed; check the SSH connection and retry."
  es: "No se pudo leer el token o los permisos del bot. El bot no se quitó; comprueba la conexión SSH y vuelve a intentarlo."
telegram.server.return_save_failed:
  ru: "Бот снят с сервера, но сохранить его в терминале не удалось. Токен временно сохранён в памяти: не закрывайте терминал, устраните ошибку и снова нажмите «Снять бота с сервера»."
  en: "The server bot was removed, but saving it locally failed. Its token is retained in memory: keep the terminal open, resolve the error and press Take the bot off the server again."
  es: "El bot se quitó del servidor, pero no pudo guardarse en el terminal. Su token se conserva en memoria: mantén el terminal abierto, resuelve el error y pulsa Quitar el bot del servidor otra vez."
telegram.server.return_remove_failed:
  ru: "Возврат бота не завершён. Прочитанный токен сохранён в памяти: не закрывайте терминал, устраните ошибку и снова нажмите «Снять бота с сервера»."
  en: "The bot return is incomplete. The recovered token is retained in memory: keep the terminal open, resolve the error and press Take the bot off the server again."
  es: "La devolución del bot no ha terminado. El token recuperado se conserva en memoria: mantén el terminal abierto, resuelve el error y pulsa Quitar el bot del servidor otra vez."
telegram.server.update:
  ru: "Обновить службу"
  en: "Update the service"
  es: "Actualizar el servicio"
telegram.server.older_service:
  ru: "Служба %{station} старше этого терминала %{terminal}: нажмите «%{button}»."
  en: "The service %{station} is older than this terminal %{terminal}: press «%{button}»."
  es: "El servicio %{station} es anterior a este terminal %{terminal}: pulsa «%{button}»."
telegram.server.update_hint:
  ru: "Ставит станцию из последнего релиза MoonTerminal на GitHub (проверка SHA-256), перезапускает и проверяет; не удержалась — возвращает прежнюю. Новее установленной нет — ничего не меняет."
  en: "Installs the station from the latest MoonTerminal release on GitHub (SHA-256 checked), restarts and checks it; if it does not stay up, the previous one comes back. Nothing newer than the installed one — nothing changes."
  es: "Instala la estación desde la última versión de MoonTerminal en GitHub (SHA-256 comprobado), la reinicia y la comprueba; si no se mantiene, vuelve la anterior. Si no hay nada más nuevo que lo instalado, no cambia nada."
telegram.server.resetup:
  ru: "Настроить заново"
  en: "Set up again"
  es: "Configurar de nuevo"
telegram.server.resetup_hint:
  ru: "Повторяет настройку сервера: обновляет служебные скрипты и юнит. Сервер, настроенный старой версией, попросит один раз старый пароль moon."
  en: "Runs the server setup again: updates the helper scripts and the unit. A server set up by an older version asks once for the old password of moon."
  es: "Repite la configuración del servidor: actualiza los scripts auxiliares y la unidad. Un servidor configurado por una versión anterior pedirá una vez la contraseña anterior de moon."
telegram.server.logs:
  ru: "Журнал"
  en: "Log"
  es: "Registro"
telegram.server.forget:
  ru: "Забыть сервер"
  en: "Forget the server"
  es: "Olvidar el servidor"
telegram.server.forget_hint:
  ru: "Терминал забывает сервер и его ключ хоста; на самом сервере ничего не меняется. Нужно после переустановки сервера — чтобы поставить станцию заново."
  en: "The terminal forgets the server and its host key; nothing changes on the server itself. Needed after the server was reinstalled, to install the station anew."
  es: "El terminal olvida el servidor y su clave de host; en el servidor no cambia nada. Hace falta tras reinstalar el servidor, para instalar la estación de nuevo."
telegram.server.forgotten:
  ru: "Сервер %{addr} забыт."
  en: "Server %{addr} is forgotten."
  es: "Servidor %{addr} olvidado."
telegram.server.running:
  ru: "Выполняется…"
  en: "Working…"
  es: "Trabajando…"
telegram.server.done:
  ru: "Готово."
  en: "Done."
  es: "Hecho."
telegram.server.needs_old_admin:
  ru: "Сервер настроен старой версией: у moon ещё есть пароль. Введите его один раз и повторите — после этого вход будет только по ключу."
  en: "The server was set up by an older version: moon still has a password. Enter it once and retry — after that the login is by key only."
  es: "El servidor fue configurado por una versión anterior: moon aún tiene contraseña. Introdúcela una vez y repite; después el acceso será solo por clave."
telegram.server.erase_failed:
  ru: "Бот работает на сервере, но токен в терминале удалить не удалось"
  en: "The bot runs on the server, but deleting the terminal's token failed"
  es: "El bot funciona en el servidor, pero no se pudo borrar el token del terminal"
telegram.server.handover_save_failed:
  ru: "Не удалось сохранить передачу бота. Задача не запущена; сначала устраните ошибку записи или завершите предыдущую передачу."
  en: "Could not save the bot hand-over. The job was not started; resolve the write failure or the previous hand-over first."
  es: "No se pudo guardar la transferencia del bot. La tarea no se inició; resuelve el error de escritura o la transferencia anterior."
telegram.server.need_host:
  ru: "Укажите IP сервера (можно с портом: 1.2.3.4:2222)."
  en: "Enter the server IP (a port may follow: 1.2.3.4:2222)."
  es: "Indica la IP del servidor (puede llevar puerto: 1.2.3.4:2222)."
telegram.server.job_lost:
  ru: "Задача прервалась, не сообщив результат."
  en: "The job stopped without reporting its result."
  es: "La tarea se detuvo sin informar su resultado."
telegram.server.local_bot_held:
  ru: "Бот терминала остаётся выключенным: сервер может всё ещё опрашивать этот токен. Нажмите «Снять бота с сервера» — после этого бот терминала включится сам."
  en: "The terminal's bot stays off: the server may still poll this token. Press «Take the bot off the server» — the terminal's bot then starts again by itself."
  es: "El bot del terminal sigue apagado: el servidor puede seguir consultando este token. Pulsa «Quitar el bot del servidor»: después el bot del terminal se activará solo."
telegram.server.bot_title:
  ru: "Бот на сервере %{addr}"
  en: "Bot on server %{addr}"
  es: "Bot en el servidor %{addr}"
telegram.server.bot_unknown:
  ru: "Состояние бота ещё не получено."
  en: "The bot's state is not known yet."
  es: "El estado del bot aún no se conoce."
telegram.server.bot_none:
  ru: "Бот на сервере не задан: укажите токен."
  en: "No bot on the server: enter a token."
  es: "No hay bot en el servidor: indica un token."
telegram.server.bot_paired:
  ru: "Работает, привязано чатов: %{count}."
  en: "Running, paired chats: %{count}."
  es: "Funcionando, chats vinculados: %{count}."
telegram.server.bot_unpaired:
  ru: "Работает, чат не привязан."
  en: "Running, no chat paired."
  es: "Funcionando, ningún chat vinculado."
telegram.server.bot_conflict:
  ru: "Этот токен опрашивается в другом месте (другой терминал или сервер)."
  en: "This token is polled elsewhere (another terminal or server)."
  es: "Este token se consulta en otro lugar (otro terminal o servidor)."
telegram.server.bot_starting:
  ru: "Запускается…"
  en: "Starting…"
  es: "Iniciando…"
telegram.server.token_hint:
  ru: "Токен бота от @BotFather. Новый токен — это новый бот: чаты старого снимаются, привязка — заново кодом /pair."
  en: "The bot token from @BotFather. A new token is a new bot: the old one's chats are dropped, pair again with /pair."
  es: "El token del bot de @BotFather. Un token nuevo es un bot nuevo: se quitan los chats del anterior, vincula de nuevo con /pair."
telegram.server.token_set:
  ru: "Поставить"
  en: "Set"
  es: "Poner"
telegram.server.token_replace:
  ru: "Заменить"
  en: "Replace"
  es: "Reemplazar"
telegram.server.refresh:
  ru: "Обновить"
  en: "Refresh"
  es: "Actualizar"
telegram.server.local_bot:
  ru: "Также бот в терминале"
  en: "Also a bot in the terminal"
  es: "También un bot en el terminal"
telegram.server.local_bot_hint:
  ru: "Второй бот со своим токеном работает, пока открыт терминал. Токен должен быть другим: один токен — один бот."
  en: "A second bot with its own token runs while the terminal is open. The token must differ: one token, one bot."
  es: "Un segundo bot con su propio token funciona mientras el terminal está abierto. El token debe ser otro: un token, un bot."
telegram.server.need_server_token:
  ru: "Укажите токен бота для сервера."
  en: "Enter the bot token for the server."
  es: "Indica el token del bot para el servidor."
telegram.server.token_is_local:
  ru: "Этот токен уже у бота терминала: один токен — один бот. Перенесите бота терминала или укажите другой токен."
  en: "The terminal's bot already uses this token: one token, one bot. Move the terminal's bot or enter another token."
  es: "El bot del terminal ya usa este token: un token, un bot. Mueve el bot del terminal o indica otro token."
telegram.server.bot_unreadable:
  ru: "Состояние бота не получено: %{error}"
  en: "The bot's state could not be read: %{error}"
  es: "No se pudo leer el estado del bot: %{error}"
telegram.server.no_active_cores:
  ru: "Нет включённых ядер: ключи на станции не изменены."
  en: "No active core: the station's keys are left as they are."
  es: "No hay núcleos activos: las claves de la estación no cambian."
telegram.server.auto_cores:
  ru: "Ядра изменены — ключи уходят на станцию…"
  en: "The cores changed — their keys go to the station…"
  es: "Los núcleos cambiaron: sus claves van a la estación…"
telegram.server.auto_cores_done:
  ru: "Ключи ядер на станции обновлены."
  en: "The station's core keys are updated."
  es: "Las claves de los núcleos en la estación están actualizadas."
