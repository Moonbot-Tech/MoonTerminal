  en: "Could not save the update request. Check disk space and service permissions."
  es: "No se pudo guardar la solicitud. Comprueba el espacio en disco y los permisos del servicio."
station.update.release_timeout:
  ru: "GitHub не ответил вовремя. Повторите проверку позже."
  en: "GitHub did not answer in time. Check again later."
  es: "GitHub no respondió a tiempo. Vuelve a comprobarlo más tarde."
station.update.release_failed:
  ru: "Не удалось прочитать релизы. Проверьте сеть и повторите проверку позже."
  en: "Could not read releases. Check the network and try again later."
  es: "No se pudieron leer las versiones. Comprueba la red y vuelve a intentarlo más tarde."
station.update.arch:
  ru: "Для архитектуры %{arch} нет релиза станции."
  en: "No station release is available for architecture %{arch}."
  es: "No hay una versión de la estación para la arquitectura %{arch}."
station.update.healthy:
  ru: "Обновлено; служба работает."
  en: "Updated; the service is healthy."
  es: "Actualizado; el servicio funciona."
station.update.rolled_back:
  ru: "Возвращена прежняя версия; служба работает."
  en: "Previous version restored; the service is healthy."
  es: "Versión anterior restaurada; el servicio funciona."
station.update.auto_rolled_back:
  ru: "Новая версия не удержалась; прежняя версия восстановлена и работает."
  en: "The new version failed; previous version restored and healthy."
  es: "La nueva versión falló; versión anterior restaurada y funcionando."
station.update.next_start:
  ru: "Установлено; будет применено при следующем запуске службы."
  en: "Installed; applies at the next service start."
  es: "Instalado; se aplicará al iniciar el servicio."
station.update.health_failed:
  ru: "Новая версия не удержалась. Проверьте журнал станции."
  en: "The new version did not stay up. Check the station log."
  es: "La nueva versión no se mantuvo activa. Comprueba el registro de la estación."
station.update.refused:
  ru: "Обновление отклонено. Проверьте журнал станции."
  en: "The update was refused. Check the station log."
  es: "La actualización fue rechazada. Comprueba el registro de la estación."
station.update.current:
  ru: "Более нового релиза службы нет."
  en: "No newer service release is available."
  es: "No hay una versión más reciente del servicio."
station.update.failed:
  ru: "Обновление не удалось. Проверьте сеть и журнал станции."
  en: "The update failed. Check the network and station log."
  es: "La actualización falló. Comprueba la red y el registro de la estación."
station.update.unknown:
  ru: "Результат обновления не распознан. Проверьте журнал станции."
