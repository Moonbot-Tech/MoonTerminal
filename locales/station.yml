  es: "No se instaló nada: esta compilación no procede de una versión publicada."
station.progress.ValuationSend:
  ru: "Отправка кеша оценки в USDT."
  en: "Sending the USDT valuation cache."
  es: "Enviando la caché de valoración en USDT."
station.progress.ValuationKept:
  ru: "Станция сохранила собственный кеш оценки."
  en: "The station kept its own valuation cache."
  es: "La estación conservó su propia caché de valoración."
station.progress.ValuationWritten:
  ru: "Кеш оценки отправлен на станцию."
  en: "Valuation cache sent to the station."
  es: "Caché de valoración enviada a la estación."
station.progress.ChatsTransferred:
  ru: "Привязки чатов переданы на станцию."
  en: "Chat pairings transferred to the station."
  es: "Vinculaciones de chats transferidas a la estación."
station.progress.BotStarted:
  ru: "Станция запущена с ботом."
  en: "Station started with the bot."
  es: "Estación iniciada con el bot."
station.progress.UndoHandover:
  ru: "Передача не удалась: убираем бота со станции."
  en: "Handover failed: removing the bot from the station."
  es: "La transferencia falló: retirando el bot de la estación."
station.progress.BotRemoved:
  ru: "Бот станции выключен; токен и привязки чатов удалены."
  en: "Station bot stopped; its token and chat pairings removed."
  es: "Bot de la estación detenido; token y vinculaciones eliminados."
station.progress.BotReady:
  ru: "Бот станции готов."
  en: "Station bot ready."
  es: "Bot de la estación listo."
station.progress.pair_issued:
  ru: "Код привязки выдан: /pair %{code}"
  en: "Pairing code issued: /pair %{code}"
  es: "Código de vinculación emitido: /pair %{code}"
station.progress.chats_saved:
  ru: "Привязанных чатов на станции: %{count}"
  en: "Paired chats on the station: %{count}"
  es: "Chats vinculados en la estación: %{count}"
station.progress.bot_settling:
  ru: "Изменение сохранено; бот ещё не готов. %{reason}"
  en: "The change is saved; the bot is not ready yet. %{reason}"
  es: "El cambio está guardado; el bot aún no está listo. %{reason}"
station.progress.valuation_none:
  ru: "Кеша оценки в терминале нет; станция рассчитает оценку сама."
  en: "The terminal has no valuation cache; the station will calculate it."
  es: "El terminal no tiene caché de valoración; la estación la calculará."
station.progress.valuation_failed:
  ru: "Кеш оценки не отправлен; станция рассчитает оценку сама. %{reason}"
  en: "Valuation cache not sent; the station will calculate it. %{reason}"
  es: "Caché de valoración no enviada; la estación la calculará. %{reason}"
station.progress.logs:
  ru: "Журнал станции:"
  en: "Station journal:"
  es: "Registro de la estación:"
station.update.updater_missing:
  ru: "На сервере ещё нет помощника обновления. Нажмите «Обновить службу» на вкладке «Станция» в настройках терминала."
  en: "The server has no updater yet. Press Update the service in the Station tab of the terminal Settings."
  es: "El servidor aún no tiene actualizador. Pulsa Actualizar el servicio en la pestaña Estación de los ajustes del terminal."
station.update.request_stale:
  ru: "Предыдущий запрос не обработан. Нажмите «Обновить службу» на вкладке «Станция» в настройках терминала."
  en: "The previous request was not handled. Press Update the service in the Station tab of the terminal Settings."
  es: "La solicitud anterior no se atendió. Pulsa Actualizar el servicio en la pestaña Estación de los ajustes del terminal."
station.update.running:
  ru: "Обновление уже выполняется."
  en: "An update is already running."
  es: "Ya hay una actualización en curso."
station.update.write_failed:
