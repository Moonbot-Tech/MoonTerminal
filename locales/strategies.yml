# The tree pane's empty states. Four reasons, four sentences, because the recovery differs in each:
# connect something, switch the preset, clear the filter, or simply wait. Lowercase to match
# `strat.no_selection` and `strat.no_schema` in the same window. The hidden-by-preset case is NOT
# here — it is the shared `workspace.scope.all_hidden`, rendered with the marker's own counts.
strat.tree_empty_no_cores:
  ru: "нет подключённых ядер"
  en: "no cores connected"
  es: "no hay núcleos conectados"
# Separate from `strat.tree_empty_no_strategies`: a core is connected but has not sent its first
# strategy snapshot yet, and an empty snapshot has not been ruled out. Promising nothing is the
# point — the two are indistinguishable until `strategies_rev` moves off zero.
strat.tree_empty_loading:
  ru: "загрузка стратегий…"
  en: "loading strategies…"
  es: "cargando estrategias…"
