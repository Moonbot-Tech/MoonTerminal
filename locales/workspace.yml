# Auto-trading workspace selector, navigation rail, and availability labels.
_version: 2

workspace.mode.auto:
  ru: "Авто"
  en: "Auto"
  es: "Auto"
workspace.mode.classic:
  ru: "Классик"
  en: "Classic"
  es: "Clásico"
workspace.mode.classic_tip:
  ru: "Обычное рабочее пространство с редактируемой раскладкой"
  en: "Standard workspace with an editable layout"
  es: "Espacio de trabajo estándar con un diseño editable"
workspace.mode.auto_tip:
  ru: "Рабочее пространство для автоторговли; раскладка общая для всех серверов, открепление окон выключено"
  en: "Auto-trading workspace; layout is shared across servers and window detachment is disabled"
  es: "Espacio de autotrading; el diseño se comparte entre servidores y no permite separar ventanas"
workspace.summary:
  ru: "Ядер: %{configured} · готово: %{ready} · проблем: %{problem}"
  en: "Cores: %{configured} · ready: %{ready} · problems: %{problem}"
  es: "Núcleos: %{configured} · listos: %{ready} · problemas: %{problem}"
# The rail's first row is a MODE, not a core: it aggregates every core at once, while every row
# below it selects exactly one. The label says "full" so the two readings cannot be confused.
workspace.overview:
  ru: "Полная сводка"
  en: "Full summary"
  es: "Resumen completo"
workspace.overview_tip:
  ru: "Все доступные ядра группы %{group}"
  en: "All available cores in group %{group}"
  es: "Todos los núcleos disponibles del grupo %{group}"
workspace.core_tip:
  ru: "%{name} · группа %{group} · %{status}"
  en: "%{name} · group %{group} · %{status}"
  es: "%{name} · grupo %{group} · %{status}"
workspace.status.disabled:
  ru: "Отключено"
  en: "Disabled"
  es: "Deshabilitado"
workspace.status.unavailable:
  ru: "Недоступно"
  en: "Unavailable"
  es: "No disponible"
workspace.status.problem:
  ru: "Проблема"
  en: "Problem"
  es: "Problema"
workspace.status.ready:
  ru: "Готово"
  en: "Ready"
  es: "Listo"
# The scope marker every membership-filtered aggregate renders when the active preset hides at
# least one configured core (`workspace::scope_marker::ScopeMarker`). Two facts, deliberately, so
# the count survives when the preset name clips: "режим: авто · 12 из 20 ядер".
workspace.scope.preset:
  ru: "режим: %{mode}"
  en: "mode: %{mode}"
  es: "modo: %{mode}"
workspace.scope.cores_n_of_m:
  ru: "%{n} из %{total} ядер"
  en: "%{n} of %{total} cores"
  es: "%{n} de %{total} núcleos"
workspace.scope.hint:
  ru: "Часть ядер скрыта активным режимом рабочего пространства — переключите режим или проверьте видимость в Настройках → Подключения"
  en: "Some cores are hidden by the active workspace preset — switch the preset or check visibility in Settings → Connections"
  es: "Algunos núcleos están ocultos por el modo de espacio de trabajo activo — cambie el modo o revise la visibilidad en Ajustes → Conexiones"
# The empty state of a surface the preset emptied COMPLETELY, shared by every such surface
# (`workspace::scope_marker::scope_empty_text`). Deliberately not per-surface and deliberately not
# the surface's own "no orders" / "no data" / "connect a core" line: those assert that nothing
# exists, and would send the user to fix a connection that is already fine. This one asserts that
# the data exists and names what is withholding it, and it is read alongside the marker's own
# "· 0 из 56 ядер" fact in the footer directly below.
workspace.scope.all_hidden:
  ru: "Все ядра скрыты активным режимом рабочего пространства"
  en: "Every core is hidden by the active workspace preset"
  es: "Todos los núcleos están ocultos por el modo de espacio de trabajo activo"
