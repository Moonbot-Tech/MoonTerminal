# Auto-trading workspace selector, navigation rail, and availability labels.
_version: 2

# The two workspace modes. AUTO and MANUAL are NAMES, not words: they stay Latin capitals in every
# locale, like BUY/SELL/ON/OFF above in README's "намеренно НЕ переводим" list, so the mode a user
# names in a screenshot or a chat is the same string everywhere.
#
# Two key shapes per mode, deliberately. The SHORT name is what an aggregate's scope marker
# interpolates ("режим: MANUAL"), where the word "режим" is already the sentence. The `_item` label
# is what the header dropdown lists, where the row must say what KIND of thing it selects.
workspace.mode.auto:
  ru: "AUTO"
  en: "AUTO"
  es: "AUTO"
workspace.mode.classic:
  ru: "MANUAL"
  en: "MANUAL"
  es: "MANUAL"
workspace.mode.auto_item:
  ru: "AUTO режим"
  en: "AUTO mode"
  es: "Modo AUTO"
workspace.mode.classic_item:
  ru: "MANUAL режим"
  en: "MANUAL mode"
  es: "Modo MANUAL"
workspace.mode.classic_tip:
  ru: "Ручной режим: раскладка своя у каждого сервера и редактируется, окна можно откреплять"
  en: "Manual mode: the layout is per-server and editable, and windows can be detached"
  es: "Modo manual: el diseño es propio de cada servidor y editable, y las ventanas se pueden separar"
workspace.mode.auto_tip:
  ru: "Рабочее пространство для автоторговли; раскладка общая для всех серверов, открепление окон выключено"
  en: "Auto-trading workspace; layout is shared across servers and window detachment is disabled"
  es: "Espacio de autotrading; el diseño se comparte entre servidores y no permite separar ventanas"
workspace.summary:
  ru: "Ядер: %{configured} · готово: %{ready} · проблем: %{problem}"
  en: "Cores: %{configured} · ready: %{ready} · problems: %{problem}"
  es: "Núcleos: %{configured} · listos: %{ready} · problemas: %{problem}"
# The three segments of the rail summary, rendered separately so the problem count can carry its
# own colour. `workspace.summary` above stays byte-identical and remains the tooltip / tour string.
workspace.summary_cores:
  ru: "Ядер: %{n}"
  en: "Cores: %{n}"
  es: "Núcleos: %{n}"
workspace.summary_ready:
  ru: "готово: %{n}"
  en: "ready: %{n}"
  es: "listos: %{n}"
workspace.summary_problem:
  ru: "проблем: %{n}"
  en: "problems: %{n}"
  es: "problemas: %{n}"
# The rail's first row is a MODE, not a core: it aggregates every core at once, while every row
# below it selects exactly one. The label says "full" so the two readings cannot be confused.
workspace.overview:
  ru: "Полная сводка"
  en: "Full summary"
  es: "Resumen completo"
workspace.overview_tip:
  ru: "Все доступные ядра группы %{group}"
  en: "All available cores in group %{group}"
  es: "Todos los núcleos disponibles del grupo %{group}"
workspace.core_tip:
  ru: "%{name} · группа %{group} · %{status}"
  en: "%{name} · group %{group} · %{status}"
  es: "%{name} · grupo %{group} · %{status}"
workspace.status.disabled:
  ru: "Отключено"
  en: "Disabled"
  es: "Deshabilitado"
workspace.status.unavailable:
  ru: "Недоступно"
  en: "Unavailable"
  es: "No disponible"
workspace.status.problem:
  ru: "Проблема"
  en: "Problem"
  es: "Problema"
workspace.status.ready:
  ru: "Готово"
  en: "Ready"
  es: "Listo"
# The scope marker every membership-filtered aggregate renders when the active preset hides at
# least one configured core (`workspace::scope_marker::ScopeMarker`). Two facts, deliberately, so
# the count survives when the preset name clips: "режим: AUTO · 12 из 20 ядер".
workspace.scope.preset:
  ru: "режим: %{mode}"
  en: "mode: %{mode}"
  es: "modo: %{mode}"
workspace.scope.cores_n_of_m:
  ru: "%{n} из %{total} ядер"
  en: "%{n} of %{total} cores"
  es: "%{n} de %{total} núcleos"
workspace.scope.hint:
  ru: "Часть ядер скрыта активным режимом рабочего пространства — переключите режим или проверьте видимость в Настройках → Подключения"
  en: "Some cores are hidden by the active workspace preset — switch the preset or check visibility in Settings → Connections"
  es: "Algunos núcleos están ocultos por el modo de espacio de trabajo activo — cambie el modo o revise la visibilidad en Ajustes → Conexiones"
# The same recovery advice for the case where the preset hid EVERY core, so the opening clause
# cannot say "some". Only the first clause differs from `workspace.scope.hint`; the two are one
# choice inside `ScopeMarker::tooltip`, gated on `hides_everything`.
workspace.scope.all_hidden_hint:
  ru: "Все ядра скрыты активным режимом рабочего пространства — переключите режим или проверьте видимость в Настройках → Подключения"
  en: "Every core is hidden by the active workspace preset — switch the preset or check visibility in Settings → Connections"
  es: "Todos los núcleos están ocultos por el modo de espacio de trabajo activo — cambie el modo o revise la visibilidad en Ajustes → Conexiones"
# The empty state of a surface the preset emptied COMPLETELY, shared by every such surface
# (`workspace::scope_marker::scope_empty_text`). Deliberately not per-surface and deliberately not
# the surface's own "no orders" / "no data" / "connect a core" line: those assert that nothing
# exists, and would send the user to fix a connection that is already fine. This one asserts that
# the data exists and names what is withholding it, and it is read alongside the marker's own
# "· 0 из 56 ядер" fact in the footer directly below.
workspace.scope.all_hidden:
  ru: "Все ядра скрыты активным режимом рабочего пространства"
  en: "Every core is hidden by the active workspace preset"
  es: "Todos los núcleos están ocultos por el modo de espacio de trabajo activo"
# The tooltip a pinned scope chip shows in place of the picker menu it replaces — the picker is
# disabled by the active workspace, and this is the only place that says why (`panels::common`).
workspace.scope.pinned_hint:
  ru: "Область задана рабочим пространством: %{scope}. Сменить её можно в панели слева"
  en: "The scope is set by the workspace: %{scope}. Change it from the panel on the left"
  es: "El ámbito lo define el espacio de trabajo: %{scope}. Puede cambiarlo en el panel izquierdo"
