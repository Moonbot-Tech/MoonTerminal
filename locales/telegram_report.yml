telegram.help_intro:
  ru: "Выберите период в нижнем меню. Повторное нажатие обновляет отчёт. Нажмите биржу, чтобы открыть её ядра."
  en: "Choose a period in the bottom menu. Tap again for a fresh report. Select an exchange to open its cores."
  es: "Elige un período en el menú inferior. Pulsa de nuevo para actualizar. Selecciona un exchange para ver sus núcleos."

telegram.help_commands:
  ru: "Команды и свой период"
  en: "Commands and custom dates"
  es: "Comandos y fechas propias"

telegram.help_limits:
  ru: "Даты включительно, максимум 366 дней. Часовой пояс: %{zone}. Терминал должен быть запущен."
  en: "Dates are inclusive, up to 366 days. Time zone: %{zone}. Keep the terminal running."
  es: "Fechas inclusive, máximo 366 días. Zona horaria: %{zone}. Mantén el terminal abierto."

telegram.help_custom:
  ru: "Свой период / по дням"
  en: "Custom period / by day"
  es: "Período propio / por día"

telegram.help_mini:
  ru: "Для отчётов в чате Mini App не нужен. Команда /miniapp открывает приложение, если оно включено в настройках терминала."
  en: "Chat reports do not require Mini App. Use /miniapp to open it when enabled in terminal settings."
  es: "Los informes del chat no necesitan Mini App. /miniapp lo abre si está habilitado en los ajustes del terminal."

telegram.report_total:
  ru: "Итого"
  en: "Total"
  es: "Total"

telegram.report_calculation_extra:
  ru: "Итого охватывает всю выбранную группу и период, включая другие страницы. Средний ордер считается по сделкам с подходящими данными; исключения указаны в деталях отчёта."
  en: "Total covers the entire selected group and period, including other pages. Average order uses trades with suitable data; exclusions are listed in report details."
  es: "El total incluye todo el grupo y período, también otras páginas. La orden media usa operaciones con datos adecuados; las exclusiones figuran en los detalles."

