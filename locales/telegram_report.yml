telegram.report_navigation_hint:
  ru: "Период выбирайте в нижнем меню. Повторное нажатие запросит свежий отчёт. Под отчётом — переходы к ядрам и дням."
  en: "Choose the period in the bottom menu. Tap again for a fresh report. Buttons beneath the report open cores or days."
  es: "Elige el período en el menú inferior. Pulsa de nuevo para obtener un informe actualizado. Los botones del informe abren núcleos o días."

