  en: "The previous report is still being calculated. Please try again shortly."
  es: "El informe anterior aún se está calculando. Inténtalo de nuevo en breve."

telegram.report_failed:
  ru: "Не удалось прочитать историю сделок. Повторите запрос; ошибка чтения не означает нулевой результат."
  en: "Could not read trade history. Please retry; a read error does not mean zero profit."
  es: "No se pudo leer el historial. Reinténtalo; un error de lectura no significa resultado cero."

telegram.report_help:
  ru: "Выберите период кнопками. В отчёте доступны вид по ботам/дням — для свежих данных повторно нажмите период в нижнем меню.\n\n/hour — этот час\n/today — сегодня\n/daily — по дням за этот месяц\n/report 2026-09-01 2026-09-10 — свой период\n/daily 2026-09-01 2026-09-10 — свой период по дням\nДаты включительно, максимум 366 дней; часовой пояс — из часов терминала. Терминал должен быть запущен."
  en: "Choose a period below. Reports have bot/day views. Tap a period again for fresh data.\n\n/hour — this hour\n/today — today\n/daily — daily results this month\n/report 2026-09-01 2026-09-10 — custom period\n/daily 2026-09-01 2026-09-10 — custom daily results\nDates are inclusive, up to 366 days; time zone follows the terminal clock. Keep the terminal running."
  es: "Elige un período. Cada informe permite cambiar bot/día. Pulsa de nuevo un período para actualizar.\n\n/hour — esta hora\n/today — hoy\n/daily — resultados diarios del mes\n/report 2026-09-01 2026-09-10 — período personalizado\n/daily 2026-09-01 2026-09-10 — resultados diarios personalizados\nFechas inclusive, máximo 366 días; zona del reloj del terminal. El terminal debe estar abierto."
