  es: "Grupo seleccionado del historial · operaciones reales cerradas · tipos al operar. Historial local; los bots desconectados no se actualizan."

telegram.report_missing_rates:
  ru: "Если не все сделки оценены, итог в USDT недоступен. Детали сохраняют суммы по известным валютам; неизвестные валюты в них не включены."
  en: "If any trades lack valuation, the complete USDT total is unavailable. Details retain known currency subtotals; unknown currencies are excluded."
  es: "Si faltan valoraciones, el total completo en USDT no está disponible. Los detalles conservan los subtotales por divisa conocida; las desconocidas se excluyen."

telegram.report_busy:
