# Storage tab of the Settings window: local databases for reports, strategies, the kline cache
# and the trade prints of replays.
# rust-i18n `_version: 2` format: key → locale-to-string map. Interpolation: %{var}.
_version: 2

tab.storage:
  ru: "Хранилище"
  en: "Storage"
  es: "Almacén"

storage.data_dir:
  ru: "Папка данных"
  en: "Data folder"
  es: "Carpeta de datos"
storage.open_folder:
  ru: "Открыть папку"
  en: "Open folder"
  es: "Abrir carpeta"
storage.refresh:
  ru: "Обновить"
  en: "Refresh"
  es: "Actualizar"
storage.total_size:
  ru: "Всего: %{size}"
  en: "Total: %{size}"
  es: "Total: %{size}"
storage.size:
  ru: "Размер: %{size}"
  en: "Size: %{size}"
  es: "Tamaño: %{size}"
storage.size_wal:
  ru: "Размер: %{size} (+ WAL %{wal})"
  en: "Size: %{size} (+ WAL %{wal})"
  es: "Tamaño: %{size} (+ WAL %{wal})"
storage.no_file:
  ru: "файла ещё нет"
  en: "no file yet"
  es: "aún no hay archivo"

storage.reports_title:
  ru: "Отчёты — reports.sqlite"
  en: "Reports — reports.sqlite"
  es: "Informes — reports.sqlite"
storage.reports_rows:
  ru: "Сделок в реплике: %{rows}"
  en: "Trades in replica: %{rows}"
  es: "Operaciones en la réplica: %{rows}"
storage.reports_hint:
  ru: "Типизированная реплика БД отчёта ядер. Восстановима: пересинхронизируется с сервера."
  en: "Typed replica of the cores' report DB. Recoverable: re-syncs from the server."
  es: "Réplica tipada de la BD de informes de los núcleos. Recuperable: se resincroniza desde el servidor."

storage.strategies_title:
  ru: "Стратегии — strategies.sqlite"
  en: "Strategies — strategies.sqlite"
  es: "Estrategias — strategies.sqlite"
storage.strategies_enabled:
  ru: "Вести локальную БД стратегий"
  en: "Keep a local strategy DB"
  es: "Mantener una BD local de estrategias"
storage.strategies_enabled_hint:
  ru: "История версий по реальным правкам параметров (косметика/старт-стоп версий не плодят). Применяется сразу. Игнор-лист полей — руками в cfg/storage.toml."
  en: "Version history of real parameter edits (cosmetics/start-stop don't spawn versions). Applies immediately. The field ignore list is hand-edited in cfg/storage.toml."
  es: "Historial de versiones de cambios reales de parámetros (la cosmética/inicio-parada no crea versiones). Se aplica al instante. La lista de campos ignorados se edita a mano en cfg/storage.toml."
storage.strategies_rows:
  ru: "Стратегий: %{live} (удалённых: %{deleted}) · Версий: %{versions}"
  en: "Strategies: %{live} (deleted: %{deleted}) · Versions: %{versions}"
  es: "Estrategias: %{live} (eliminadas: %{deleted}) · Versiones: %{versions}"
storage.version_limit:
  ru: "Лимит версий на стратегию"
  en: "Version limit per strategy"
  es: "Límite de versiones por estrategia"
storage.version_limit_off:
  ru: "без лимита"
  en: "unlimited"
  es: "sin límite"
storage.version_limit_hint:
  ru: "0 — хранить все версии (рекомендуется: история невосстановима). Лимит обрезает старые при записи новых."
  en: "0 — keep all versions (recommended: the history is unrecoverable). A limit trims old ones as new are written."
  es: "0 — conservar todas las versiones (recomendado: el historial es irrecuperable). Un límite recorta las antiguas al escribir nuevas."
storage.strategies_hint:
  ru: "Единственный экземпляр истории — пересинхроном не восстанавливается. Для сохранности — «Бэкап»."
  en: "The only copy of the history — a re-sync cannot restore it. Use Backup to keep it safe."
  es: "La única copia del historial — una resincronización no lo restaura. Usa «Copia» para conservarlo."

storage.klines_title:
  ru: "Кэш свечей — klines.sqlite"
  en: "Kline cache — klines.sqlite"
  es: "Caché de velas — klines.sqlite"
storage.klines_hint:
  ru: "Восстановимый кэш истории свечей: можно удалить файл при закрытом терминале."
  en: "Recoverable kline history cache: the file can be deleted while the terminal is closed."
  es: "Caché recuperable del historial de velas: el archivo puede borrarse con el terminal cerrado."

storage.trades_title:
  ru: "Трейды сделок — trades.sqlite"
  en: "Trade prints — trades.sqlite"
  es: "Operaciones de las posiciones — trades.sqlite"
storage.trades_enabled:
  ru: "Сохранять трейды сделок"
  en: "Keep trade prints"
  es: "Guardar las operaciones"
storage.trades_enabled_hint:
  ru: "Скачанные трейды остаются на диске и второй раз не качаются. Выключено — только в памяти до закрытия терминала."
  en: "Fetched prints stay on disk and are not fetched twice. Off — in memory only, until the terminal closes."
  es: "Las operaciones descargadas quedan en disco y no se descargan dos veces. Apagado — solo en memoria hasta cerrar el terminal."
storage.trades_max_mb:
  ru: "Лимит файла"
  en: "File limit"
  es: "Límite del archivo"
storage.trades_mb:
  ru: "%{mb} МБ"
  en: "%{mb} MB"
  es: "%{mb} MB"
storage.trades_max_mb_hint:
  ru: "Сверх лимита удаляются самые старые записи; 0 — без лимита."
  en: "Past the limit the oldest records go first; 0 — no limit."
  es: "Superado el límite se borran primero los registros más antiguos; 0 — sin límite."
storage.trades_margin:
  ru: "Трейды вокруг сделки"
  en: "Prints around a trade"
  es: "Operaciones alrededor de una posición"
storage.trades_sec:
  ru: "%{s} с"
  en: "%{s} s"
  es: "%{s} s"
storage.trades_min:
  ru: "%{min} мин"
  en: "%{min} min"
  es: "%{min} min"
storage.trades_margin_hint:
  ru: "Сколько трейдов брать с каждого конца сделки: у короткой — до входа и после выхода, у долгой (дольше 5 мин) — столько же вокруг входа и вокруг выхода, середина свечами. Ступени от 5 с до 120 мин; тюнер берёт не меньше 30 с с каждого края."
  en: "Prints taken at each end of a trade: before the entry and after the exit of a short one; the same stretch centred on the entry and on the exit of a long one (over 5 min), candles between. Steps from 5 s to 120 min; the tuner takes at least 30 s at each end."
  es: "Operaciones tomadas en cada extremo de una posición: antes de la entrada y después de la salida en una corta; el mismo tramo centrado en la entrada y en la salida en una larga (más de 5 min), velas entre ambas. Pasos de 5 s a 120 min; el afinador toma al menos 30 s en cada extremo."
storage.trades_autoload:
  ru: "Подгружать недостающую ленту при старте"
  en: "Fetch the missing tape at startup"
  es: "Descargar la cinta que falta al arrancar"
storage.trades_autoload_hint:
  ru: "Когда ядра поднялись, терминал сам запрашивает у бирж трейды недавних закрытых сделок стратегий с мс-штампами — тех, что закрылись, пока терминал не работал и захват при закрытии их не застал. Только сделки, по которым тюнер может считать: без фандинга, ликвидаций, объединённых и ручных продаж. Окно — сколько биржа ещё отдаёт (Binance фьючерсы 48 ч, Gate spot 30 дней, OKX и Bitget 90, не дальше 30 дней). Bybit и Hyperliquid публичной истории трейдов не дают. Тратит лимит публичных запросов; идёт той же очередью, что «Прогрузить трейды» в тюнере, и останавливается той же кнопкой."
  en: "Once the cores are up the terminal asks the venues for the prints of recent closed strategy trades with millisecond stamps — the ones that closed while it was not running and the close-time capture missed. Only trades the tuner can be run on: no funding, liquidations, joined or manual sells. The window is what the venue still serves (Binance futures 48 h, Gate spot 30 days, OKX and Bitget 90, never past 30 days). Bybit and Hyperliquid serve no public trade history. Spends the public request budget; runs in the same queue as \"Fetch trades\" in the tuner and stops with the same button."
  es: "Cuando los núcleos están arriba, el terminal pide a las bolsas las operaciones de las posiciones de estrategias cerradas recientes con marcas de milisegundos — las que cerraron mientras no estaba en marcha y la captura al cierre no vio. Solo operaciones sobre las que el ajustador puede calcular: sin funding, liquidaciones, ventas unidas ni manuales. La ventana es lo que la bolsa aún sirve (futuros Binance 48 h, Gate spot 30 días, OKX y Bitget 90, nunca más de 30 días). Bybit e Hyperliquid no dan historial público. Gasta el límite de peticiones públicas; va en la misma cola que «Cargar trades» del ajustador y se para con el mismo botón."
storage.trades_hint:
  ru: "Файл можно удалить при закрытом терминале."
  en: "The file can be deleted while the terminal is closed."
  es: "El archivo puede borrarse con el terminal cerrado."

