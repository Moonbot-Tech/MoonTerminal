# Top bar, status bar, toolbar, and detached chart window.
# rust-i18n `_version: 2` format: key → locale-to-string map. Interpolation: %{var}.
# Intentionally untranslated: BUY · SELL · LONG · SHORT · ON · OFF · Live · the status-bar metrics line.
_version: 2

# --- Shell (top bar / status) ---
# Glyph icons (⚙ ▶ ⏸ …) are not stored in the locale; they are separate code segments (see README).
shell.settings_btn:
  ru: "Настройки"
  en: "Settings"
  es: "Ajustes"
status.connecting:
  ru: "подключение…"
  en: "connecting…"
  es: "conectando…"
status.live:
  ru: "онлайн"
  en: "live"
  es: "en vivo"
status.disconnected:
  ru: "отключено"
  en: "disconnected"
  es: "desconectado"
status.connected_count:
  ru: "подключено"
  en: "connected"
  es: "conectado"
# Translate the entire status-bar label, including its colon; word order and punctuation belong to
# the translation rather than code concatenation. %{value} is either "OK" or a "ready/total" pair.
status.connection:
  ru: "Соединение: %{value}"
  en: "Connection: %{value}"
  es: "Conexión: %{value}"
status.license:
  ru: "Лицензия: %{value}"
  en: "License: %{value}"
  es: "Licencia: %{value}"
# Active trading-core selector in the header: text shown when the group has no cores.
header.no_cores:
  ru: "нет ядер"
  en: "no cores"
  es: "sin núcleos"
# Header balance double-click: Auto reveals the group Assets surface; Classic opens the window.
header.balance_tip:
  ru: "Двойной клик — открыть Активы"
  en: "Double-click opens Assets"
  es: "Doble clic abre Activos"
# Price ticker in the header, on the right beside the clock.
header.ticker_tip:
  ru: "Курс и дельты за 1ч / 24ч. Клик — открыть график, двойной — выбрать монету и ядро"
  en: "Price and 1h / 24h deltas. Click opens the chart, double-click picks coin and core"
  es: "Precio y deltas 1h / 24h. Clic abre el gráfico, doble clic elige moneda y núcleo"
header.ticker_pick:
  ru: "Монета тикера (поиск по ядрам)"
  en: "Ticker coin (search across cores)"
  es: "Moneda del ticker (búsqueda por núcleos)"
# Ticker delta-window labels distinguish the periods of two adjacent percentages.
header.delta_1h:
  ru: "1ч"
  en: "1h"
  es: "1h"
header.delta_24h:
  ru: "24ч"
  en: "24h"
  es: "24h"
# Application-wide display zone in the header's right corner.
header.clock_tip:
  ru: "Часы выбранного часового пояса. Клик — сменить пояс; переход на летнее время автоматический"
  en: "Clock in the selected time zone. Click to change it; daylight-saving changes are automatic"
  es: "Reloj de la zona horaria elegida. Clic para cambiarla; el horario de verano se ajusta solo"
header.clock_pick:
  ru: "Часовой пояс"
  en: "Time zone"
  es: "Zona horaria"
header.clock_system:
  ru: "Системный · %{zone}"
  en: "System · %{zone}"
  es: "Sistema · %{zone}"

# --- Toolbar ---
# Tooltips for preset strips. The group label itself is a literal (Size/Sell), like the adjacent
# Lev/SL/TP labels; the prose tooltip is translated because it is not a technical token.
# `unit` is the fixed USDT-equivalent label and preserves it in narrow windows where the full
# "Size, USDT eq." group caption has collapsed.
toolbar.size_hint:
  ru: "Размер ордера F%{n} в %{unit} · клик — выбрать · двойной клик — правка · Ctrl+колесо — изменить"
  en: "Order size F%{n} in %{unit} · click to select · double-click to edit · Ctrl+wheel to change"
  es: "Tamaño de orden F%{n} en %{unit} · clic para seleccionar · doble clic para editar · Ctrl+rueda para cambiar"
toolbar.sell_hint:
  ru: "Фиксированная продажа S%{n} · клик — задействовать · двойной клик — правка · Ctrl+колесо — изменить"
  en: "Fixed sell S%{n} · click to engage · double-click to edit · Ctrl+wheel to change"
  es: "Venta fija S%{n} · clic para activar · doble clic para editar · Ctrl+rueda para cambiar"
toolbar.scale:
  ru: "Масштаб"
  en: "Scale"
  es: "Escala"
toolbar.scale_auto:
  ru: "Авто"
  en: "Auto"
  es: "Auto"
# The scale-dropdown trigger has room for about one character: the first letter of "Auto".
toolbar.scale_auto_short:
  ru: "А"
  en: "A"
  es: "A"
# `Live` is an untranslated domain term; code prepends the `●` status indicator and keeps label text in a neighboring segment.
toolbar.live:
  ru: "Live"
  en: "Live"
  es: "Live"
toolbar.pause:
  ru: "Пауза"
  en: "Pause"
  es: "Pausa"
toolbar.live_tip:
  ru: "Live: график бежит за рынком. Пауза: заморожен, можно листать (ЛКМ-перетаскивание, колесо)."
  en: "Live: the chart follows the market. Pause: frozen, you can scroll (LMB drag, wheel)."
  es: "Live: el gráfico sigue al mercado. Pausa: congelado, puedes desplazarte (arrastrar con clic izquierdo, rueda)."
toolbar.strategies:
  ru: "Стратегии"
  en: "Strategies"
  es: "Estrategias"
toolbar.screener:
  ru: "Скринер"
  en: "Screener"
  es: "Screener"
# Manual strategy (MS toggle and header picker): the unselected pill.
header.ms_none:
  ru: "— стратегия —"
  en: "— strategy —"
  es: "— estrategia —"
# Trading-metric popup titles for the slider and input field.
toolbar.tp_title:
  ru: "Тейк-профит"
  en: "Take profit"
  es: "Take profit"
toolbar.sl_title:
  ru: "Стоп-лосс"
  en: "Stop loss"
  es: "Stop loss"
toolbar.lev_title:
  ru: "Плечо"
  en: "Leverage"
  es: "Apalancamiento"
# Extended TP-range checkbox (`x_tmode` / "s9" flag): 100..900% instead of 0..100%.
toolbar.tp_ext:
  ru: "×10 (100–900%)"
  en: "×10 (100–900%)"
  es: "×10 (100–900%)"
# Fine TP slider: 0..=1.99% in 0.01% steps through scalp; the hedge-mode toggle controls dual-side positions.
toolbar.tp_fine:
  ru: "Точно (0.01%)"
  en: "Fine (0.01%)"
  es: "Fino (0.01%)"
toolbar.hedge:
  ru: "Hedge Mode"
  en: "Hedge Mode"
  es: "Hedge Mode"
# Stop-market checkbox in the SL popup: sell at the stop with a market order, not a stop-limit order.
toolbar.stop_market:
  ru: "Стоп-маркет"
  en: "Stop market"
  es: "Stop market"
# Leverage Apply button in the popup; leverage is an exchange action sent only through this button.
toolbar.apply:
  ru: "Применить"
  en: "Apply"
  es: "Aplicar"

# --- Exchange limits for the coin on the Main chart (leverage popup + toolbar readout) ---
# Row label for the exchange's maximum order size, denominated in the market's quote currency.
toolbar.max_order:
  ru: "Макс. ордер"
  en: "Max order"
  es: "Orden máx."
# Toolbar caption for the same figure, where the row competes for width with every trading control.
# Deliberately untranslated: it is the industry abbreviation, like BUY/SELL and LONG/SHORT in
# `locales/README.md`'s untranslated list, and a translated word here would be the longest thing on
# the row. The full label above stays in the popover, where there is room to say it properly.
toolbar.max_order_short:
  ru: "MAX"
  en: "MAX"
  es: "MAX"
# Row label for the coin's maximum leverage as stated by the exchange.
toolbar.lev_max:
  ru: "Макс. плечо"
  en: "Max leverage"
  es: "Apalancamiento máx."
# Hover text when the exchange stated the order cap directly: a fixed figure that does not drift.
toolbar.max_order_tip:
  ru: "Максимальный размер ордера по правилам биржи. Не зависит от выбранного плеча."
  en: "Exchange maximum order size. It does not depend on the selected leverage."
  es: "Tamaño máximo de orden de la bolsa. No depende del apalancamiento elegido."
# Hover text when no notional cap was stated and the figure was converted from the quantity cap.
toolbar.max_order_derived:
  ru: "Биржа не назвала предел в деньгах: величина пересчитана из лимита количества по текущему аску, поэтому меняется вместе с ценой."
  en: "The exchange stated no cash cap: this is the quantity limit converted at the current ask, so it moves with the price."
  es: "La bolsa no indicó un límite en dinero: es el límite de cantidad convertido al ask actual, por lo que varía con el precio."
# Hover text when the exchange stated no maximum order size at all for this market.
toolbar.max_order_none:
  ru: "Биржа не задала максимальный размер ордера для этого рынка."
  en: "The exchange states no maximum order size for this market."
  es: "La bolsa no define un tamaño máximo de orden para este mercado."
# Hover text while nothing has loaded yet: no provider, no snapshot, or no such market.
toolbar.limits_unknown:
  ru: "Лимиты биржи ещё не загружены для этого рынка."
  en: "Exchange limits have not loaded for this market yet."
  es: "Los límites de la bolsa aún no se han cargado para este mercado."
# Hover text on a known maximum leverage.
toolbar.lev_max_tip:
  ru: "Максимальное плечо этой монеты по данным биржи."
  en: "This coin's maximum leverage as stated by the exchange."
  es: "Apalancamiento máximo de esta moneda según la bolsa."
# Hover text on the dash when the exchange stated no maximum leverage for this market.
toolbar.lev_max_none:
  ru: "Биржа не задала максимальное плечо для этого рынка."
  en: "The exchange states no maximum leverage for this market."
  es: "La bolsa no define un apalancamiento máximo para este mercado."
# Shown when the coin's maximum is unknown: the 1..125 range is a terminal default, not a limit.
toolbar.lev_max_unknown:
  ru: "Максимум для этой монеты неизвестен — диапазон 1–125 взят по умолчанию и не является её пределом."
  en: "This coin's maximum is unknown — the 1-125 range is a default, not its limit."
  es: "Se desconoce el máximo de esta moneda: el rango 1-125 es un valor por defecto, no su límite."
# Shown when the value about to be applied is above the coin's stated cap. Not corrected silently.
toolbar.lev_max_exceeded:
  ru: "Значение выше предела биржи (×%{max}) — она такое плечо отклонит."
  en: "Above the exchange limit (x%{max}) — it will reject this leverage."
  es: "Por encima del límite de la bolsa (x%{max}): rechazará este apalancamiento."
# Shown when the exchange revised the cap while the popup stood open; the slider range is frozen.
toolbar.lev_range_stale:
  ru: "Биржа изменила предел этой монеты — откройте окно заново, чтобы обновить шкалу."
  en: "The exchange revised this coin's limit — reopen to refresh the slider range."
  es: "La bolsa cambió el límite de esta moneda: reabre para actualizar la escala."
# Hover text on an available leverage preset. It only fills the field; Apply sends it.
toolbar.lev_preset_tip:
  ru: "Подставить плечо ×%{x}. Отправит его только «Применить»."
  en: "Set leverage to x%{x}. Only Apply sends it."
  es: "Fijar apalancamiento en x%{x}. Solo Aplicar lo envía."
# Hover text on a preset above the coin's maximum, which is offered as unavailable.
toolbar.lev_preset_blocked:
  ru: "×%{x} недоступно: максимум этой монеты — ×%{max}."
  en: "x%{x} is unavailable: this coin's maximum is x%{max}."
  es: "x%{x} no está disponible: el máximo de esta moneda es x%{max}."

