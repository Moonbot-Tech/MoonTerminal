# Top bar, status bar, toolbar, and detached chart window.
# rust-i18n `_version: 2` format: key → locale-to-string map. Interpolation: %{var}.
# Intentionally untranslated: BUY · SELL · LONG · SHORT · ON · OFF · Live · the status-bar metrics line.
_version: 2

# --- Shell (top bar / status) ---
# Glyph icons (⚙ ▶ ⏸ …) are not stored in the locale; they are separate code segments (see README).
shell.settings_btn:
  ru: "Настройки"
  en: "Settings"
  es: "Ajustes"
status.connecting:
  ru: "подключение…"
  en: "connecting…"
  es: "conectando…"
status.live:
  ru: "онлайн"
  en: "live"
  es: "en vivo"
status.disconnected:
  ru: "отключено"
  en: "disconnected"
  es: "desconectado"
status.connected_count:
  ru: "подключено"
  en: "connected"
  es: "conectado"
# Translate the entire status-bar label, including its colon; word order and punctuation belong to
# the translation rather than code concatenation. %{value} is either "OK" or a "ready/total" pair.
status.connection:
  ru: "Соединение: %{value}"
  en: "Connection: %{value}"
  es: "Conexión: %{value}"
status.license:
  ru: "Лицензия: %{value}"
  en: "License: %{value}"
  es: "Licencia: %{value}"
# Active trading-core selector in the header: text shown when the group has no cores.
header.no_cores:
  ru: "нет ядер"
  en: "no cores"
  es: "sin núcleos"
# Price ticker in the header, on the right beside the clock.
header.ticker_tip:
  ru: "Курс и дельты за 1ч / 24ч. Клик — открыть график, двойной — выбрать монету и ядро"
  en: "Price and 1h / 24h deltas. Click opens the chart, double-click picks coin and core"
  es: "Precio y deltas 1h / 24h. Clic abre el gráfico, doble clic elige moneda y núcleo"
header.ticker_pick:
  ru: "Монета тикера (поиск по ядрам)"
  en: "Ticker coin (search across cores)"
  es: "Moneda del ticker (búsqueda por núcleos)"
# Ticker delta-window labels distinguish the periods of two adjacent percentages.
header.delta_1h:
  ru: "1ч"
  en: "1h"
  es: "1h"
header.delta_24h:
  ru: "24ч"
  en: "24h"
  es: "24h"
# Clock in the header's right corner.
header.clock_tip:
  ru: "Часы выбранного города. Клик — сменить город; переход на летнее время автоматический"
  en: "Clock of the selected city. Click to change it; summer time switches automatically"
  es: "Reloj de la ciudad elegida. Clic para cambiarla; el horario de verano se ajusta solo"
header.clock_pick:
  ru: "Город часов"
  en: "Clock city"
  es: "Ciudad del reloj"

# --- Toolbar ---
# Tooltips for preset strips. The group label itself is a literal (Size/Sell), like the adjacent
# Lev/SL/TP labels; the prose tooltip is translated because it is not a technical token.
# `unit` is the fixed USDT-equivalent label and preserves it in narrow windows where the full
# "Size, USDT eq." group caption has collapsed.
toolbar.size_hint:
  ru: "Размер ордера F%{n} в %{unit} · клик — выбрать · двойной клик — правка · Ctrl+колесо — изменить"
  en: "Order size F%{n} in %{unit} · click to select · double-click to edit · Ctrl+wheel to change"
  es: "Tamaño de orden F%{n} en %{unit} · clic para seleccionar · doble clic para editar · Ctrl+rueda para cambiar"
