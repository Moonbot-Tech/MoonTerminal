strat.dist_white_trading_tip: "第一个数字是点击“应用”后白名单中的币种数。括号内是其中核心实际交易的数量：不含同时在黑名单中的（⊘——黑名单优先），也不含交易所已下架的（灰色）。黄色的币种——另一个核心也在交易——计入其中。这与白名单为空的核心上的“在交易”是同一个数字。"
strat.dist_skip_common_tip: "开启：公共黑名单的币种不进入任何白名单。关闭：它们同样被平均分配并写入白名单（在黑名单中时带 ⊘ 标记）：将币种从黑名单移除后，它就会在白名单包含它的那个核心上开始交易（在“黑名单在首个核心”模式下，首个核心的份额没有白名单：它交易黑名单之外的一切）。"
