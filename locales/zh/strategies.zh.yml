strat.dist_distribute_tip: "按名称顺序将交易所的币种在各行之间平均分配：可交易的币种与公共黑名单的币种分开分配，使每个核心交易的数量相同（±1）。余数逐个分给最上方的行。旧的黑名单合并为一个公共黑名单并写入每一行。不发送任何内容，只生成草稿；点击“应用”后发送。在所有行的核心都收到市场列表之前不可用。"
