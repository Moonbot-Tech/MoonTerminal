# Settings -> Telegram -> the bot's segment -> "Station on a Linux server".
telegram.server.section: "Linux 服务器上的服务站"
telegram.server.intro: "机器人、Mini App 和报告在你自己的 Linux 服务器上全天候运行，即使终端已关闭。终端会通过 SSH 自动配置服务器，并将机器人迁移过去。"
telegram.server.intro_more: "安装时，终端会关闭密码登录、安装服务，并把所有已启用核心的密钥交给它。约 25 个核心大致需要一台非突发型（non-burstable）整机的三分之一，以及 1 GB 服务器上几百 MB 的可用内存。突发型 t3.micro 的 10% 基准低于这一要求；如果状态再次显示“0 分钟”，请检查 CPUCreditBalance (AWS) 以及服务日志中的 killed / oom。"
telegram.server.host: "服务器 IP"
telegram.server.login: "登录名"
telegram.server.by_key: "使用 SSH 密钥登录"
telegram.server.key_path: "密钥文件"
telegram.server.key_browse: "浏览…"
telegram.server.passphrase: "密钥密码"
telegram.server.key_hint: "ed25519、ECDSA 或 RSA 私钥的路径（OpenSSH、PuTTY .ppk、PKCS#8 或 RSA PEM / PKCS#1）。仅当密钥已加密时才需要密钥口令。"
telegram.server.sudo_password: "sudo 密码"
telegram.server.password: "密码"
telegram.server.first_login_hint: "服务商提供的访问信息（IP、登录名、root 密码或密钥）只使用一次，不会保存在任何地方。安装后密码登录将关闭，终端使用自己的密钥登录。"
telegram.server.old_admin: "moon 的旧密码"
telegram.server.release_hint: "服务从 GitHub 上最新的 MoonTerminal 正式版安装，匹配服务器架构（校验 SHA-256）。"
telegram.server.transfer_hint: "终端的机器人将迁移到服务器：令牌、聊天及其访问权限。机器人在服务器上运行后，终端会删除自己保存的令牌；本地机器人需要另一个令牌。如果迁移失败，机器人将留在终端中。"
telegram.server.mini_app: "服务器上的 Mini App"
telegram.server.mini_app_hint: "Mini App 通过 Cloudflare 隧道访问：在 Cloudflare 被屏蔽的地区无法打开，此时请将其关闭。切换会重启服务站。"
telegram.server.access_apply: "应用到服务器"
telegram.server.groups_same: "服务站上的核心分组与终端一致：%{names}。"
