# that a core is healthy.
core_status.problems_unknown: "未上报：%{n}——核心版本较旧，或列表尚未到达"
# Shown when the row list hit its cap, so a shortened view never reads as the complete picture.
core_status.problems_truncated: "仅显示前 %{n} 条"
# Shown above the table when the panel's scope covers no cores at all: an empty table then says
# nothing about anyone's health.
core_status.problems_no_cores: "范围内没有核心"
# Neutral empty state used whenever the notice above the table already explains the gap. It must not
# contradict that notice by claiming a clean bill.
core_status.problems_nothing_listed: "未上报任何内容"
core_status.problem_cat.machine: "机器"
core_status.problem_cat.exchange: "交易所"
core_status.problem_cat.network: "网络"
core_status.problem_cat.other: "其他"

# --- Problems mode: the three diagnostic actions ---
# The reset and the re-read mirror Moonbot's own Problems window; the test is ours.
#
# A test publishes a `test` fact through the core's own detector worker (~2 s) and PROVES the
# channel end to end. It leaves a row behind that only the reset removes, which is why that pair
# ships together.
core_status.problems_test: "测试通道"
# Deliberately NOT Moonbot's "reset all", though it is the same command on the wire. Moonbot's
# window belongs to one core, so "all" there means all of that core's findings; this panel spans a
# fleet, where the same word reads as "all cores" and would be a lie the moment the operator has
# picked one. The button acts on the panel's scope, and the tooltip and the confirm both say how
# many cores that is.
core_status.problems_clear: "重置"
core_status.problems_test_tip: "通过核心自身的检测器发布一条测试事实——大约两秒。可验证整条链路：检测器、传输、投影、面板。"
core_status.problems_refresh: "刷新"
# Said out loud because the label promises a round trip the protocol cannot make: a core pushes its
# list, nothing can ask for one. Saying so here is cheaper than an operator concluding the button is
# broken when a stale row does not move.
core_status.problems_refresh_tip: "重新读取在线核心（%{cores}）目前已发来的内容。点击某一行可只重读该行的核心。无法请求新的列表：协议中没有这样的命令——核心会在连接时以及其检测器更改列表时自行发送。适合在核心重启后使用，那时旧的行已不再反映它的状态。"
# The blast radius, stated BEFORE the dialog: an operator who picked no core is acting on the whole
# scope, and that is the difference between a tidy-up and a fleet-wide loss.
# The one-core forms, for when a clicked finding has narrowed the action. The scope-wide wording
# would state a falsehood about the panel ("connected cores: 1" for a scope of twenty-six) and would
# keep advising a click that, in this state, cancels the pick instead of making one.
core_status.problems_clear_tip_one: "将重置所选核心的诊断——不可恢复，且对所有终端生效。再次点击它所在的行可回到整个范围"
core_status.problems_refresh_tip_one: "重新读取所选核心目前已发来的内容。无法请求新的列表：协议中没有这样的命令。再次点击它所在的行可回到整个范围"
core_status.problems_clear_tip: "将重置诊断。在线核心：%{cores}。不可恢复，且对所有终端生效。点击某一行可只重置该行的核心"
# The test is per-core on the wire and has no fleet-wide form worth having: publishing a test fact
# on two hundred cores litters two hundred cores. So it alone needs one core named.
core_status.problems_pick_core: "测试只发往一个核心：在表格中点击该核心的问题行——或将面板范围缩小到单个核心"
core_status.problems_picked_offline: "所选核心不在线——命令会一直等到它恢复连接"
core_status.problems_no_online: "面板范围内没有在线的核心"
# Guards the TEST alone. The command channel outlives the connection, so a queued test would fire on
# the next reconnect and publish its fact at some unannounced later moment, on a core the operator
# stopped looking at hours ago.
core_status.problems_core_offline: "核心不在线——测试会等到重新连接后才执行，并在无法预知的时刻发布事实"
core_status.problems_test_title: "发送测试诊断？"
# The consequence is the whole reason this action is confirmed at all.
core_status.problems_test_q: "核心 %{core} 将通过它的常规检测器发布一条测试事实——大约两秒。该行会留在核心上，而且只能通过重置来移除，而重置会同时清除该核心的真实诊断结果。"
core_status.problems_test_sent: "测试已发送到 %{core}——该行将在几秒后出现"
core_status.problems_clear_sent: "重置已发送到 %{core}——核心发来新列表后这些行就会消失"
core_status.problems_clear_sent_many: "重置已发送到 %{cores} 个核心——这些核心发来新列表后相应的行就会消失"
# Says what it re-read, not "done": the honest outcome of a re-read that found nothing new is an
# unchanged table, and a message claiming more would make that look like a failure.
core_status.problems_refreshed: "已重读的核心：%{cores}"
# The shortfall, never a bare success: a fleet action that reached nine of twelve cores has failed
# on three, and only the toast can say so.
core_status.problems_fleet_none: "%{cores} 个核心一个也未送达——不在线，或命令通道已关闭"
core_status.problems_fleet_partial: "已送达 %{cores} 个核心中的 %{sent} 个——其余不在线或其通道已关闭"
core_status.problems_not_sent: "未发送：核心的命令通道已关闭"
core_status.problems_not_sent_offline: "未发送：核心不在线"
core_status.problems_clear_title: "重置该核心的诊断？"
# Blunt on purpose: the protocol's own warning is that cleared real diagnostics cannot be restored.
core_status.problems_clear_q: "核心 %{core} 将清除所有已确认的问题和未确认的假设——对所有终端生效，且无法恢复。这并不能消除原因：如果原因仍在，核心会再次确认该问题。"
core_status.problems_clear_title_many: "重置多个核心的诊断？"
# The core NAMES, not just how many: a count is nothing an operator can check, and this dialog is
# the last place the mistake is still cheap.
core_status.problems_clear_q_many: "这 %{cores} 个核心都将清除所有已确认的问题和未确认的假设——对所有终端生效，且无法恢复。这并不能消除原因：如果原因仍在，核心会再次确认这些问题。"
