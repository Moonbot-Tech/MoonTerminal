# Exchange API-key lifetime column (flat table). The unit is in the heading, so the cells hold a
# bare number.
# Moonbot build the core reported. The product noun IS the heading, so the cells hold
# a bare number; it is a proper name and is not translated. BOTH views read this one key --
# they would never legitimately differ, and two identical values are one translator edit away
# from disagreeing. `core_status.col.startup` is shared the same way.
core_status.col.version: "Moonbot"
# Hover on a Moonbot cell whose core runs an older build than the newest one currently reported
# across the user's cores. The reference is the FLEET, not a release feed: the terminal asks no
# server what the latest Moonbot is. Both numbers arrive as typed builds and are dotted by
# `util::fmt::core_build` at the call site.
