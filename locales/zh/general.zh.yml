# Settings redesign (phases 3-5)
general.sec.lang_money: "语言与金额"
general.sec.charts: "图表"
general.sec.logs: "日志"
general.language.hint: "保存后生效。"
general.valuation.label: "折算为 USDT"
general.valuation.hint: "用于报告和分析。"
general.valuation.more: "“按交易时”：金额不随时间变化，采用交易结束那一分钟的汇率。“当前”：所有金额都按今天的汇率折算。\n\n请只在明确需要时更改：“当前汇率”取的是 Binance/Bybit 现货的最新已知汇率，而不是实际进行交易的那家交易所的汇率；它每隔几分钟刷新一次，并且不会保存。它还会改变调优器中的阈值调优：阈值将按重新估值后的历史来拟合。保存后生效。"
general.tab_per_core.hint: "否则同组的核心共用一个标签页。"
general.book_pan.label: "在订单簿区域拖动图表"
general.book_pan.hint: "在订单簿上方拖动鼠标会移动图表。"
general.book_pan.more: "如果在订单簿区域更常点击价格，请关闭此项：这样在订单簿上方拖动不会移动任何内容，点击价格照常生效。"
general.live_scope.label: "Live 与暂停"
general.live_scope.hint: "移动一个图表时如何影响其他图表。"
general.live_scope.more: "“所有图表一起”：把一个图表拖向历史，所有图表都会暂停，工具栏上的 Live 按钮会显示这一状态。“每个图表独立”：拖动只影响该图表；把它拖回右边缘，或 3 分钟不操作，它会自行回到 Live。工具栏上的“暂停”会停住所有图表，Live 则让它们全部回到当前时刻。"
general.live_scope.all: "所有图表一起"
general.live_scope.each: "每个图表独立"
general.idle_close.label: "关闭空闲的 Main 图表"
general.idle_close.hint: "当窗口未获得焦点或鼠标没有移动时。"
general.idle_close.after: "延时"
