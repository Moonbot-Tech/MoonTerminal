general.log_files.hint: "logs 文件夹，每个来源每天一个文件。"
general.log_retention.label: "保留"
general.log_retention.hint: "较旧的文件会在启动时以及每天一次被删除。"
general.notation.label: "数字缩写"
general.notation.hint: "保存后生效。"
general.notation.more: "终端在成交量和金额中如何书写千、百万和十亿。“与 MoonBot 一致”：空格后加小写字母，12.3 k、1.2 m、1.5 b。“紧凑”：大写字母，不加空格，12.3K、1.2M、1.5B。\n\n保留几位数字由所在位置决定：表格列始终保留一位小数，使小数点上下对齐；图表标注保留三位有效数字。在报告中，排序、导出 CSV 和 Excel 以及复制行都使用完整数字。"
general.notation.moonbot: "与 MoonBot 一致"
general.notation.compact: "紧凑"
