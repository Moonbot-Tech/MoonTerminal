# Core Status panel: per-core update-queue phase badges/tooltips and the fleet-wide footer
# counters. Separate from `update.yml`, which is the TERMINAL's own self-update namespace.
_version: 1

# --- Per-core phase, shown as a badge beside the reported build and as its hover text ---
core_update.phase.queued: "排队中"
core_update.phase.held: "等待中 — 通道被占用"
core_update.phase.sent: "命令已发送"
core_update.phase.waiting: "更新中"
core_update.phase.verifying: "正在验证版本"
core_update.phase.succeeded: "已更新"
core_update.phase.installed: "已安装"
core_update.phase.unchanged: "版本未变"
core_update.phase.other_build: "装上的是另一个版本：%{got}，而不是 %{expected}"
core_update.phase.failed.not_sent: "命令发送失败"
core_update.phase.failed.never_dropped: "核心没有为更新而断开"
core_update.phase.failed.not_ready: "未能等到核心就绪，更新命令无法发送"
core_update.phase.failed.timeout: "更新后没有恢复连接 — 超时"
core_update.phase.failed.gone: "核心地址变为未知"
core_update.phase.failed.abandoned: "因退出应用而中断"
core_update.phase.failed.rejected: "核心拒绝了所请求的版本"

# --- Unverified: the update finished but the terminal could not confirm the returned build ---
core_update.phase.unverified.unavailable: "未能验证版本 — 无法重新连接"
