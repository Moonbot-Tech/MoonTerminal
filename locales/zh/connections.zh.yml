conn.endpoint_duplicate: "该地址和端口已被核心 %{name} 使用"
conn.address_ph: "取自密钥"
conn.endpoint_invalid: "这不是有效地址。可接受：192.168.1.5、192.168.1.5:5017、:5017、[2001:db8::1]:5017 或主机名。字段为红色时核心不会连接。"
conn.endpoint_no_address: "密钥中没有地址——终端将连接 127.0.0.1，即本机。如果核心在另一台机器上，请在此填写其地址，或在 Moonbot 中重新导出密钥：勾选 Kernel (VPS) 并点击 Apply（或在 IP 字段中填入服务器 IP），然后点击 Copy Key。"


# Tooltips.
conn.tip.key: "密钥在 Moonbot 中生成，而不是在网站上，并且要在核心设置完成之后再复制——它自带地址、端口和模式；必要时可在“地址:端口”列中修改地址和端口。步骤：1) 在运行 Moonbot 的服务器上开放核心的 UDP 端口入站；2) 在 Moonbot 中：左下角的绿色圆点（Info 窗口）→ Moon Kernel → Settings → Moon Proto 窗口的 Settings 标签页：勾选 Kernel (VPS)，设置 Port，选择 V0/V1/V2（默认 V0），点击 Apply；3) 在同一处 Key: → Copy Key（还没有密钥则点 New Key）；4) 用“粘贴”按钮粘贴到这里，然后点击“保存”。眼睛图标用于显示/隐藏密钥。"
conn.key_ph: "在 Moonbot 中 Copy Key"
# Placeholder of the "Charts" cell. The field holds a bundle NAME, not a count (see
# `conn.tip.bundle` and `ServerConfig::chart_bundle`), so the placeholder has to say "name".
conn.bundle_ph: "组合名称"
conn.tip.proto: "MoonProto 传输模式——与核心“Moon Proto”设置中的 V0/V1/V2 三种相同；两端必须使用同一种。仅在尚未设置模式时从密钥读取一次；此后只在这里修改，新密钥不会再覆盖它——因此无需为更换模式而重新签发密钥。短横线表示密钥未提供模式（旧版导出），连接按 V0 运行。点击“保存”后生效：核心会自行重新连接。因此请在核心上用 V0/V1/V2 单选按钮设置好 Port 和版本之后再点击 Copy Key（Moonbot 默认创建 V0 密钥）：密钥会带上这些信息。"
conn.tip.preset: "此核心在哪种工作区模式下显示于各列表：两种都显示、仅 MANUAL 或仅 AUTO。只影响显示——隐藏的核心仍会连接并记录数据。"
conn.tip.total: "此核心如何计入“资产”底部的总计。自动：同一交易所账户上的核心只计一次。不计入：核心不计入总计。单独：核心始终单独计算，不合并。"
conn.preset.both: "两种"
# The same two mode NAMES the header dropdown lists (`workspace.mode.*`): this column picks which
# of them shows the core, so a name that drifted apart here would read as a third mode.
conn.preset.classic: "MANUAL"
conn.preset.auto: "AUTO"
conn.total.auto: "自动（按账户）"
conn.total.exclude: "不计入"
conn.total.separate: "单独"
conn.tip.group: "分组 = 一个独立的主窗口。分组名称相同的所有核心位于同一个窗口；新的分组名称 → 新的主窗口。"
conn.tip.bundle: "图表组合名称：同一分组中组合名称相同的多个核心的 AddToChart 检测会合并到同一个图表（一个标签页，名称显示在其标题中）。留空 = 按全局设置（每个核心一个标签页 / 全部合一）。"
conn.tip.orders: "挂单"
conn.tip.detects: "检测"
conn.tip.reports: "已平仓订单的报告 → SQLite"
