# The + glyph is prepended in code; the locale entry contains only text.
# Shared by BOTH the group header and the pending/exchange subsection headings, where a count of
# 1..4 is ordinary -- so the abbreviated form stays: Russian has no single plural form that is
# right at 1, 2 and 56, and this file has no plural-selection convention to reach for.
