# Every preset here is named by its FAMILY: a calendar one says which period it is current within,
# a rolling one is labelled by its day count. A bare week or year cannot be told apart from its
# rolling counterpart once both are offered, which is why the rolling three are numeric. The same
# wording is carried in analytics.period.* so the two windows do not disagree; analytics.period.*
# has its own cur_year but no calendar-week key — the Profit Monitor borrows this cur_week key
# directly instead of duplicating it.
# A rolling 7-day window ending today.
report.period.week: "7 天"
# Calendar week from Monday.
report.period.cur_week: "本周"
# Calendar month from the 1st.
report.period.cur_month: "本月"
# Previous calendar month, 1st to last day inclusive.
report.period.last_month: "上月"
# Calendar year from January 1st.
report.period.cur_year: "今年"
# A rolling 30-day window — NOT a calendar month, which is why it is labelled by number.
report.period.month: "30 天"
# A rolling 365-day window — NOT a calendar year.
report.period.year: "365 天"
