# keeps its raw DB name as its header: the six `locales/README.md` deliberately-untranslated
# technical columns (id, taskid, exorderid, strategyid, basecurrency, sellsetdate), plus `fname`.
# This list is one decision mirrored in `columns::header_label`'s `matches!` guard — keep both in
# sync, in the same `DISPLAY_COLUMNS` order.
