assets.pnl.spot_unavailable: "现货余额没有未实现 PnL"
assets.actions.unavailable_qty: "没有可卖出的 %{coin} 数量"
assets.actions.unavailable_market_identity: "%{coin} 没有市场标识"
assets.actions.unavailable_market_catalog: "核心的目录中没有市场 %{market}"

# --- Position action buttons ---
assets.open_global_hint: "在独立窗口中打开“资产”（全部核心）"
assets.market_sell: "Market sell"
assets.market_sell_confirm: "市价卖出"
assets.market_sell_no_price: "卖出已取消：该市场没有当前价格，而下单需要价格。"
