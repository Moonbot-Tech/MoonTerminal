# Shared core RUN control: whether a core is up, detecting and trading, and the buttons that
# change all three.
# Used by every surface that lists cores; see `controls::core_run`.
# rust-i18n `_version: 1` format: one language per file, flat dotted keys. Interpolation: %{var}.
_version: 1

# --- Runtime status slot ---
core_run.status_started: "核心运行中"
# Shown for a single stopped core and for a group where at least one core reported a stop.
core_run.status_stopped: "核心已停止"
# A caption stands for many cores, so it names how many of them reported a stop.
core_run.status_stopped_group: "已停止的核心：%{n}"
core_run.status_offline: "无法连接核心"
core_run.status_unknown: "核心尚未报告状态"
# `restart_now` is Moonbot's own Restart Now: it starts the market runtime, leaves passive mode AND
# starts the checked strategies. The tooltip says so — this button can begin trading.
core_run.restart: "启动核心（将退出被动模式并启动已勾选的策略）"

# --- Trading slot: Moonbot's own Start/Stop of the strategy engine ---
core_run.trading_start: "启动自动交易"
core_run.trading_stop: "停止自动交易"
# A scope where some cores trade and some do not: the button starts the remaining ones.
# RU counts follow `core_run.status_stopped_group`'s idiom — the noun BEFORE the number, in a form
# that does not decline with it. «на %{n} ядрах» reads wrong at n=1 and n=21, and this project has
# no plural-form mechanism to select between them. EN/ES keep their own «core(s)» / «núcleo(s)»:
# neither language declines the noun after the number.
core_run.trading_start_partial: "在另外 %{n} 个核心上启动自动交易"
# The same two actions when the control stands for a whole group or exchange row.
core_run.trading_start_group: "在 %{n} 个核心上启动自动交易"
core_run.trading_stop_group: "在 %{n} 个核心上停止自动交易"
# --- AutoDetect slot: Moonbot's AutoDetect, the inverse of passive mode ---
# The face shows the STATE (green ring detecting, red ring passive); the tooltip says what the
# press will do, so the two never say the same thing twice.
core_run.auto_on: "开启自动检测"
core_run.auto_off: "关闭自动检测"
# A scope where some cores detect and some are passive: the press turns the remaining ones on.
core_run.auto_on_partial: "为另外 %{n} 个核心开启自动检测"
# The same two actions when the control stands for a whole group, an exchange row or the table.
core_run.auto_on_group: "为 %{n} 个核心开启自动检测"
core_run.auto_off_group: "为 %{n} 个核心关闭自动检测"

# Wrapper for any state the CURRENT connection has not re-reported. The feed re-publishes both
# halves from MoonProto's retained snapshot when a core returns, so this is usually a short window;
# it lasts when the client itself was replaced. Shown faded rather than hidden — the value is still
# the last thing the core said.
core_run.unconfirmed: "%{state} · 重连前的数据，暂无更新"
# The same note without a state to wrap, for a surface that shows several dots at once.
core_run.unconfirmed_short: "重连前的数据，暂无更新"
core_run.waiting: "命令已发送，正在等待核心响应"
