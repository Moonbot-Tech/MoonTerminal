analytics.tuner.compose_run: "挑选组合"
analytics.tuner.compose_help: "比较三条地位平等的路径：独立的字段组合、对所有允许字段的联合调优，以及不加任何额外过滤器。最多 %{seeds} 个独立 seed 检验每个时间分段；先在分段内由多数 seed 表决，再由多数分段表决。Beam 在边界清晰时保留 8 个分支，在边界有争议时扩展到 16 个。决定性指标是增益：留出分段的盈利减去相同数量的未过滤交易本应带来的盈利，因此“不加过滤器”的方案不会仅因保留了全部交易而胜出；只有保留的交易数足够时才计算增益。增益接近时，还会参考 PF、更小的回撤和绝对盈利。如果留出分段没能区分出任何结果，结论中会如实说明。复选框仍是调优的边界。必须先选择策略。"
