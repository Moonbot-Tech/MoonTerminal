# Cursor volume readout: per-trade prints near the cursor, plus the hovered candle's own bucket
# turnover. The two are labelled separately on purpose — a bucket total is not a trade.
_version: 1

tick_volume.nearby: "光标附近逐笔"
tick_volume.side_values: "%{side} (%{count}): %{value} %{unit}"

tick_volume.nearby_unit: "附近逐笔（%{unit}）"
tick_volume.side_count: "%{side} (%{count})"
tick_volume.minimum: "最小：%{value}"
tick_volume.maximum: "最大：%{value}"

# The hovered candle's whole-bucket turnover. `%{tf}` is the bucket width as the chart's own
# timeframe controls spell it (`1m`, `4h`, `1d`) and stays untranslated, like every other market
# token. The `_untimed` pair covers a bucket whose width cannot be named.
tick_volume.candle_values: "K线 %{tf}：%{value} %{unit}"
tick_volume.candle_values_untimed: "K线：%{value} %{unit}"
tick_volume.candle_head: "K线 %{tf}"
tick_volume.candle_head_untimed: "K线"

# Stacked with no tick heading above to carry the unit: the candle's own heading carries it, so a
# narrow pane can still show the amount on its own line instead of losing the block.
tick_volume.candle_head_unit: "K线 %{tf}（%{unit}）"
tick_volume.candle_head_unit_untimed: "K线（%{unit}）"

# The hovered sides-half sample (`candle_volume_sides`): bought and sold over the band's rolling
# interval ending at the pointer, spelled `Bv`/`Sv` like the chart captions. `%{tf}` stays
# untranslated as above.
tick_volume.sides_values: "近 %{tf}：Bv %{buy} · Sv %{sell} %{unit}"
tick_volume.sides_head: "近 %{tf} 成交量"
tick_volume.sides_head_unit: "近 %{tf} 成交量（%{unit}）"
tick_volume.sides_buy: "Bv: %{value}"
tick_volume.sides_sell: "Sv: %{value}"
