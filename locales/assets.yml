# Assets window/panel: controls, table columns, and wallets.
# rust-i18n `_version: 2` format: key -> locale-to-string map. Interpolation: %{var}.
_version: 2

assets.window_title:
  ru: "MoonTerminal — Активы"
  en: "MoonTerminal — Assets"
  es: "MoonTerminal — Activos"
assets.show_all:
  ru: "показать всё"
  en: "show all"
  es: "mostrar todo"
# Hint for the top-bar dust-threshold slider; 0 shows everything.
assets.min_value_hint:
  ru: "Скрывать активы дешевле N $ (0 — показать всё; колесо мыши меняет)"
  en: "Hide assets worth less than N $ (0 — show all; mouse wheel changes)"
  es: "Ocultar activos por debajo de N $ (0 — mostrar todo; la rueda del ratón lo cambia)"
assets.cores_free_total:
  ru: "Ядра · своб/итого"
  en: "Cores · free/total"
  es: "Núcleos · libre/total"
assets.cores_count:
  ru: "Ядра (%{n})"
  en: "Cores (%{n})"
  es: "Núcleos (%{n})"
assets.no_cores:
  ru: "нет ядер"
  en: "no cores"
  es: "sin núcleos"
assets.empty:
  ru: "нет активов"
  en: "no assets"
  es: "sin activos"
# Futures balances are quote-denominated and absent from the table, so its empty state describes
# open positions rather than account equity; the balance surfaces carry the account figure.
assets.empty_no_positions:
  ru: "нет открытых позиций"
  en: "no open positions"
  es: "sin posiciones abiertas"
# --- Footer: account balances across the in-scope cores ---
# Tooltip on the LEFT footer group. The row carries two different sums side by side, so each
# group states what it covers — a trader must never read Σ as the account equity.
assets.footer_table_hint:
  ru: "Строки таблицы после фильтра пыли; Σ — их суммарная стоимость"
  en: "Table rows after the dust filter; Σ is their combined value"
  es: "Filas de la tabla tras el filtro de polvo; Σ es su valor combinado"
# Appended to the tooltip above when some visible rows have no valid value: the row count
# includes them but Σ cannot, so a shortened sum must say what it left out.
assets.footer_rows_unpriced:
  ru: "У %{n} строк нет корректной стоимости — Σ их не учитывает"
  en: "%{n} rows have no valid value — Σ excludes them"
  es: "%{n} filas sin valor válido — Σ las excluye"
# Closing line of the RIGHT group's tooltip — the counterpart to the hint above.
assets.balances_scope_hint:
  ru: "Средства по ядрам охвата — это не сумма таблицы"
  en: "Equity across the in-scope cores — not the table sum"
  es: "Fondos de los núcleos en alcance — no es la suma de la tabla"
assets.balances_total:
  ru: "Итого"
  en: "Total"
  es: "Total"
assets.balances_free:
  ru: "своб"
  en: "free"
  es: "libre"
# The retained figure is not confirmed current for the connection.
assets.balance_stale:
  ru: "нет связи"
  en: "offline"
  es: "sin conexión"
# A snapshot exists, but its USD valuation is incomplete or invalid rather than zero.
assets.balance_unpriced:
  ru: "нет курса"
  en: "no rate"
  es: "sin cotización"
# Cores whose snapshot has not arrived yet: excluded from the total, but the state clears itself.
assets.balances_awaiting:
  ru: "ждём: %{n}"
  en: "awaiting: %{n}"
  es: "esperando: %{n}"
# Cores with a snapshot but no conversion rate: also excluded, and — unlike awaiting — it will
# not resolve on its own, so it is counted separately rather than told to keep waiting.
assets.balances_unpriced_n:
  ru: "нет курса: %{n}"
  en: "no rate: %{n}"
  es: "sin cotización: %{n}"
# Some cores were summed from a retained snapshot, so the total is not "as of now".
assets.balances_stale_n:
  ru: "нет связи: %{n}"
  en: "offline: %{n}"
  es: "sin conexión: %{n}"
assets.section_positions:
  ru: "Позиции"
  en: "Positions"
  es: "Posiciones"
# Core-selection field, matching `orders.all_cores` and `orders.cores_n`.
assets.all_cores:
  ru: "Все ядра"
  en: "All cores"
  es: "Todos los núcleos"
assets.cores_n:
  ru: "Ядер: %{n}"
  en: "Cores: %{n}"
  es: "Núcleos: %{n}"

# --- Asset table columns ---
assets.col.core:
  ru: "Ядро"
  en: "Core"
  es: "Núcleo"
assets.col.coin:
  ru: "Актив"
  en: "Asset"
  es: "Activo"
assets.col.qty:
  ru: "Кол-во"
  en: "Qty"
  es: "Cant."
assets.col.price:
  ru: "Цена"
  en: "Price"
  es: "Precio"
assets.col.value:
  ru: "Стоим.$"
  en: "Value $"
  es: "Valor $"
assets.col.pos:
  ru: "Поз."
  en: "Pos."
  es: "Pos."
assets.col.pos_price:
  ru: "Поз.цена"
  en: "Pos. price"
  es: "Precio pos."
assets.col.profit:
  ru: "Профит"
  en: "Profit"
  es: "Beneficio"
assets.col.kind:
  ru: "Рынок"
  en: "Market"
  es: "Mercado"
# Unrealized PnL of the row's position, computed by the feed from the mark price and the entry
# price of each leg. "PnL" is a trading term kept untranslated across the terminal.
assets.col.pnl:
  ru: "PnL"
  en: "PnL"
  es: "PnL"
# Field-selector entry for the Market Sell / Order button column. The column header itself is
# blank, so this name exists only in the menu.
assets.col.actions:
  ru: "Кнопки"
  en: "Buttons"
  es: "Botones"
# Tooltip of the table field selector, matching the Orders and Report wording.
assets.columns:
  ru: "Поля"
  en: "Fields"
  es: "Campos"

# Tooltip labels for unavailable table values; the dash glyph itself remains in Rust.
assets.pnl.spot_unavailable:
  ru: "Спотовый баланс не имеет нереализованного PnL"
  en: "Spot balances have no unrealized PnL"
  es: "Los saldos Spot no tienen PnL no realizado"
assets.actions.unavailable_qty:
  ru: "Нет доступного для продажи количества %{coin}"
  en: "No sellable %{coin} quantity"
  es: "No hay cantidad vendible de %{coin}"
assets.actions.unavailable_market_identity:
  ru: "Нет идентификатора рынка для %{coin}"
  en: "No market identity for %{coin}"
  es: "No hay identidad de mercado para %{coin}"
assets.actions.unavailable_market_catalog:
  ru: "Рынок %{market} отсутствует в каталоге ядра"
  en: "Market %{market} is absent from the core catalog"
  es: "El mercado %{market} no está en el catálogo del núcleo"

# --- Position action buttons ---
assets.open_global_hint:
  ru: "Открыть Активы отдельным окном (все ядра)"
  en: "Open Assets in a separate window (all cores)"
  es: "Abrir Activos en ventana aparte (todos los núcleos)"
assets.market_sell:
  ru: "Market sell"
  en: "Market sell"
  es: "Venta mercado"
assets.market_sell_confirm:
  ru: "Продажа по маркету"
  en: "Market sell"
  es: "Venta a mercado"
assets.market_sell_no_price:
  ru: "Продажа отменена: у рынка нет текущей цены, а без неё ордер выставить нельзя."
  en: "Sale cancelled: the market has no current price, and the order needs one."
  es: "Venta cancelada: el mercado no tiene precio actual y la orden lo necesita."
assets.market_sell_q:
  ru: "Точно продать %{coin} по маркету?"
  en: "Really market-sell %{coin}?"
  es: "¿Vender %{coin} a mercado?"
assets.market_sell_scope_changed:
  ru: "Продажа отменена: ядро больше не входит в текущую область активов."
