hotkeys.panic_sell_one_hint:
  ru: "Закрыть позицию рынка по рынку. Moonbot-дефолт: Alt+5."
  en: "Close the market's position at market. Moonbot default: Alt+5."
  es: "Cierra a mercado la posición del mercado. Valor por defecto de Moonbot: Alt+5."
