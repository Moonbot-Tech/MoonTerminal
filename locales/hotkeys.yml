  en: "Unassigned"
  es: "Sin asignar"
hotkeys.recording:
  ru: "Нажмите сочетание..."
  en: "Press shortcut..."
  es: "Pulsa el atajo..."
hotkeys.todo:
  ru: "нет команды в протоколе"
  en: "no protocol command"
