hotkeys.group.manual_strategy:
  ru: "Ручные стратегии"
  en: "Manual strategies"
  es: "Estrategias manuales"
hotkeys.group.manual_strategy_hint:
  ru: "10 хоткеев ManualStratsConfig.hotKeys из Moonbot: хоткей N выбирает N-ю manual-стратегию активного ядра (порядок — как в пикере MS шапки) и включает режим. По умолчанию пустые."
  en: "10 Moonbot ManualStratsConfig.hotKeys: hotkey N selects the Nth manual strategy of the active core (same order as the header MS picker) and enables the mode. Empty by default."
  es: "10 ManualStratsConfig.hotKeys de Moonbot: la tecla N selecciona la N-ésima estrategia manual del núcleo activo (mismo orden que el selector MS) y activa el modo. Vacíos por defecto."
hotkeys.manual_strategy:
  ru: "Ручная стратегия %{n}"
  en: "Manual strategy %{n}"
  es: "Estrategia manual %{n}"
hotkeys.manual_strategy_hint:
  ru: "Выбрать %{n}-ю стратегию списка MS и включить режим."
  en: "Select the %{n}th strategy of the MS list and enable the mode."
  es: "Selecciona la estrategia %{n} de la lista MS y activa el modo."

# --- Figure drawing layer ---
hotkeys.group.draw:
  ru: "Рисование"
  en: "Drawing"
  es: "Dibujo"
hotkeys.group.draw_hint:
  ru: "Фигуры на чарте (как в Moonbot). Хоткей выбирает инструмент, повтор того же — снимает его. Ctrl+ЛКМ рисует и захватывает фигуру, простой ЛКМ торгует, как обычно. В полоске вкладок: список инструментов («Курсор» — не рисовать) и ⚙ — стиль выбранного инструмента. ПКМ по нарисованной фигуре — те же настройки для неё."
  en: "Chart figures (as in Moonbot). A hotkey arms its tool; the same key again disarms it. Ctrl+LMB draws and grabs a figure, plain LMB keeps trading as usual. In the tab strip: the tool list (\"Cursor\" draws nothing) and ⚙ for the armed tool's style. Right-clicking a drawn figure opens the same settings for it."
  es: "Figuras en el gráfico (como en Moonbot). La tecla activa su herramienta; la misma tecla la desactiva. Ctrl+clic izq. dibuja y agarra una figura; el clic izq. normal sigue operando. En la barra de pestañas: la lista de herramientas («Cursor» no dibuja) y ⚙ para el estilo de la herramienta activa. Clic derecho sobre una figura abre esos mismos ajustes para ella."
hotkeys.draw_hline:
  ru: "Горизонтальная линия"
  en: "Horizontal line"
