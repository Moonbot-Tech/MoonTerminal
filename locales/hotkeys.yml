hotkeys.group.order_move:
  ru: "Сдвиг ордеров"
  en: "Order shift"
  es: "Desplazamiento de órdenes"
hotkeys.group.order_move_hint:
  ru: "Сдвиг живых ордеров рынка активного чарта на 1%, как в Moonbot: одна команда на сторону, ордера отбирает и считает ядро."
  en: "Shift the active chart market's live orders by 1%, as Moonbot does: one command per side, with the core selecting the orders and doing the arithmetic."
  es: "Desplaza un 1% las órdenes vivas del mercado del gráfico activo, como en Moonbot: un comando por lado; el núcleo elige las órdenes y hace el cálculo."
hotkeys.shift_buy_up:
  ru: "Shift Buy Up"
  en: "Shift Buy Up"
  es: "Shift Buy Up"
hotkeys.shift_buy_up_hint:
  ru: "Сдвинуть входы рынка (buy-фаза) на 1% вверх. Moonbot-дефолт: Shift+Up."
  en: "Shift the market's entries (buy phase) 1% up. Moonbot default: Shift+Up."
  es: "Desplaza las entradas del mercado (fase buy) un 1% arriba. Valor por defecto de Moonbot: Shift+Up."
hotkeys.shift_buy_down:
  ru: "Shift Buy Down"
  en: "Shift Buy Down"
  es: "Shift Buy Down"
hotkeys.shift_buy_down_hint:
  ru: "Сдвинуть входы рынка (buy-фаза) на 1% вниз. Moonbot-дефолт: Shift+Down."
  en: "Shift the market's entries (buy phase) 1% down. Moonbot default: Shift+Down."
  es: "Desplaza las entradas del mercado (fase buy) un 1% abajo. Valor por defecto de Moonbot: Shift+Down."
hotkeys.shift_sell_up:
  ru: "Shift Sell Up"
  en: "Shift Sell Up"
  es: "Shift Sell Up"
hotkeys.shift_sell_up_hint:
  ru: "Сдвинуть выходы рынка (sell-фаза, у шорта это покупки) на 1% вверх. Moonbot-дефолт: Alt+Up."
  en: "Shift the market's exits (sell phase; on a short these are buys) 1% up. Moonbot default: Alt+Up."
  es: "Desplaza las salidas del mercado (fase sell; en un short son compras) un 1% arriba. Valor por defecto de Moonbot: Alt+Up."
hotkeys.shift_sell_down:
  ru: "Shift Sell Down"
  en: "Shift Sell Down"
  es: "Shift Sell Down"
hotkeys.shift_sell_down_hint:
  ru: "Сдвинуть выходы рынка (sell-фаза, у шорта это покупки) на 1% вниз. Moonbot-дефолт: Alt+Down."
  en: "Shift the market's exits (sell phase; on a short these are buys) 1% down. Moonbot default: Alt+Down."
  es: "Desplaza las salidas del mercado (fase sell; en un short son compras) un 1% abajo. Valor por defecto de Moonbot: Alt+Down."

hotkeys.group.mouse:
  ru: "Мышь на стакане"
  en: "Order book mouse"
  es: "Ratón en libro"
hotkeys.group.mouse_hint:
  ru: "Живой Moonbot-путь из ChartFrameUnit: постановка ордеров кликами в зоне стакана. Move-жесты тянут линию своей стороны (вход/выход, long/short) и добавляются к обычному перетаскиванию ЛКМ за линию, которое работает всегда. Средняя и правая кнопки и дабл-клики доступны только через жесты."
  en: "Live Moonbot ChartFrameUnit path: place orders by clicking inside the book area. Move gestures drag the line of their own side (entry/exit, long/short) and are added on top of the plain left-button drag, which always works. The middle and right buttons and double clicks are available through gestures only."
  es: "Ruta viva de Moonbot ChartFrameUnit: crear órdenes con clics en el libro. Los gestos Move arrastran la línea de su lado (entrada/salida, long/short) y se suman al arrastre normal con el botón izquierdo, que siempre funciona. Los botones central y derecho y los dobles clics solo están disponibles mediante gestos."
