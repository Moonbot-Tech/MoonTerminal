hotkeys.group.manual_strategy:
  ru: "Ручные стратегии"
  en: "Manual strategies"
  es: "Estrategias manuales"
hotkeys.group.manual_strategy_hint:
  ru: "10 хоткеев ManualStratsConfig.hotKeys из Moonbot: хоткей N выбирает N-ю manual-стратегию активного ядра (порядок — как в пикере MS шапки) и включает режим. По умолчанию пустые."
  en: "10 Moonbot ManualStratsConfig.hotKeys: hotkey N selects the Nth manual strategy of the active core (same order as the header MS picker) and enables the mode. Empty by default."
  es: "10 ManualStratsConfig.hotKeys de Moonbot: la tecla N selecciona la N-ésima estrategia manual del núcleo activo (mismo orden que el selector MS) y activa el modo. Vacíos por defecto."
hotkeys.manual_strategy:
  ru: "Ручная стратегия %{n}"
  en: "Manual strategy %{n}"
  es: "Estrategia manual %{n}"
hotkeys.manual_strategy_hint:
  ru: "Выбрать %{n}-ю стратегию списка MS и включить режим."
  en: "Select the %{n}th strategy of the MS list and enable the mode."
  es: "Selecciona la estrategia %{n} de la lista MS y activa el modo."

# --- Figure drawing layer (pencil) ---
hotkeys.group.draw:
  ru: "Рисование"
  en: "Drawing"
  es: "Dibujo"
hotkeys.group.draw_hint:
  ru: "Фигуры на чарте (как карандаш Moonbot). Хоткей выбирает инструмент и включает режим рисования (повтор/Esc — выкл). В режиме: Ctrl+ЛКМ рисует, простой ЛКМ выделяет/двигает фигуру. Кнопка-карандаш в полоске вкладок: ЛКМ — режим, ПКМ — стиль (цвет/толщина/Solid-Dash)."
  en: "Chart figures (Moonbot-style pencil). Hotkey selects the tool and enters draw mode (again/Esc turns it off). In draw mode: Ctrl+LMB draws, plain LMB selects/moves a figure. Pencil button in the tab strip: LMB — mode, RMB — style (color/thickness/Solid-Dash)."
  es: "Figuras en el gráfico: la tecla activa la herramienta (repetir o Esc la desactiva), clic izquierdo coloca nodos. Clic en una figura fuera del modo la selecciona; arrastre nodos/cuerpo para editar."
hotkeys.draw_hline:
  ru: "Горизонтальная линия"
  en: "Horizontal line"
  es: "Línea horizontal"
hotkeys.draw_hline_hint:
  ru: "Инструмент: один клик ставит горизонталь на цене курсора."
  en: "Tool: one click places a horizontal line at the cursor price."
  es: "Herramienta: un clic coloca una horizontal en el precio del cursor."
hotkeys.draw_segment:
  ru: "Линия (отрезок)"
  en: "Line (segment)"
  es: "Línea (segmento)"
hotkeys.draw_segment_hint:
  ru: "Инструмент: два клика — начало и конец линии."
  en: "Tool: two clicks — line start and end."
  es: "Herramienta: dos clics — inicio y fin de la línea."
hotkeys.draw_triangle:
  ru: "Треугольник"
  en: "Triangle"
  es: "Triángulo"
hotkeys.draw_triangle_hint:
  ru: "Инструмент: три клика — три вершины треугольника (△ Moonbot)."
  en: "Tool: three clicks — the triangle's three vertices (Moonbot △)."
  es: "Herramienta: tres clics — los tres vértices del triángulo (△ Moonbot)."
hotkeys.draw_channel:
  ru: "Параллельный канал"
  en: "Parallel channel"
  es: "Canal paralelo"
hotkeys.draw_channel_hint:
  ru: "Инструмент: два клика по ценам — горизонтальный канал (коридор, как канал Moonbot)."
  en: "Tool: two clicks at prices — a horizontal channel (band, like Moonbot channel)."
  es: "Herramienta: dos clics en precios — un canal horizontal (banda, como el canal de Moonbot)."
hotkeys.fig_delete:
  ru: "Удалить выделенную фигуру"
  en: "Delete selected figure"
  es: "Eliminar figura seleccionada"
hotkeys.fig_delete_hint:
  ru: "Удаляет фигуру, выделенную кликом на чарте."
  en: "Deletes the figure selected by clicking on the chart."
  es: "Elimina la figura seleccionada con un clic en el gráfico."
hotkeys.fig_alert:
  ru: "Alert на выделенной фигуре"
  en: "Alert on selected figure"
  es: "Alerta en la figura seleccionada"
hotkeys.fig_alert_hint:
  ru: "Заармить/разоружить chart-алерт по выделенной фигуре (ядро следит за пересечением цены)."
  en: "Arm/disarm a chart alert on the selected figure (the core watches for a price cross)."
  es: "Armar/desarmar una alerta de gráfico en la figura seleccionada (el núcleo vigila el cruce de precio)."
