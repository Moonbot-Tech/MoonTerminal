# Hotkeys tab of the Settings window.
_version: 2

hotkeys.unassigned:
  ru: "Не задано"
  en: "Unassigned"
  es: "Sin asignar"
hotkeys.recording:
  ru: "Нажмите сочетание..."
  en: "Press shortcut..."
  es: "Pulsa el atajo..."
hotkeys.todo:
  ru: "нет команды в протоколе"
  en: "no protocol command"
  es: "sin comando en el protocolo"

hotkeys.group.builtin:
  ru: "Встроенные хоткеи"
  en: "Built-in hotkeys"
  es: "Atajos integrados"
hotkeys.group.builtin_hint:
  ru: "Фиксированные сочетания (не настраиваются), работают на графике и в окнах."
  en: "Fixed shortcuts (not configurable), active on the chart and in windows."
  es: "Atajos fijos (no configurables), activos en el gráfico y las ventanas."
hotkeys.builtin.wheel_zoom:
  ru: "[Колёсико] на графике — зум по времени"
  en: "[Wheel] on the chart — zoom by time"
  es: "[Rueda] en el gráfico — zoom por tiempo"
hotkeys.builtin.wheel_pan:
  ru: "[Shift или Alt + Колёсико] двигает график влево/вправо"
  en: "[Shift or Alt + Wheel] moves the chart left/right"
  es: "[Shift o Alt + Rueda] mueve el gráfico a izquierda/derecha"
hotkeys.builtin.esc_close:
  ru: "[Esc] закрыть активный чарт Main (режим рисования не выключает)"
  en: "[Esc] close the active Main chart (does not exit draw mode)"
  es: "[Esc] cerrar el gráfico activo de Main (no sale del modo dibujo)"
hotkeys.builtin.reset_windows:
  ru: "[Ctrl+Shift+F10] сброс позиций всех окон на экран"
  en: "[Ctrl+Shift+F10] reset all window positions onscreen"
  es: "[Ctrl+Shift+F10] restablecer las posiciones de todas las ventanas"
hotkeys.builtin.cancel_hover:
  ru: "[Tab или Del] навести на линию ордера — отменить этот ордер (Del при выделенной фигуре удаляет фигуру)"
  en: "[Tab or Del] hover an order line — cancel that order (Del deletes the figure when one is selected)"
  es: "[Tab o Del] sobre una línea de orden — cancelar esa orden (Del elimina la figura si hay una seleccionada)"
hotkeys.builtin.close_all:
  ru: "[Shift+Esc] закрыть все графики Main во всех группах"
  en: "[Shift+Esc] close all Main charts in every group"
  es: "[Shift+Esc] cerrar todos los gráficos Main de todos los grupos"

hotkeys.group.presets:
  ru: "Пресеты ордера"
  en: "Order presets"
  es: "Preajustes de orden"
hotkeys.group.presets_hint:
  ru: "Те же F1-F6 и S1-S6, что в Moonbot: размер ручного ордера и фикс. Sell."
  en: "The same F1-F6 and S1-S6 as Moonbot: manual order size and fixed sell."
  es: "Los mismos F1-F6 y S1-S6 que Moonbot: tamaño de orden manual y venta fija."
hotkeys.order_size:
  ru: "Выбрать размер ручного ордера %{n}"
  en: "Select manual order size %{n}"
  es: "Seleccionar tamaño de orden manual %{n}"
hotkeys.sell_preset:
