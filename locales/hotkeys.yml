hotkeys.group.manual_strategy:
  ru: "Ручные стратегии"
  en: "Manual strategies"
  es: "Estrategias manuales"
hotkeys.group.manual_strategy_hint:
  ru: "10 хоткеев ManualStratsConfig.hotKeys из Moonbot: хоткей N выбирает N-ю manual-стратегию активного ядра (порядок — как в пикере MS шапки) и включает режим. По умолчанию пустые."
  en: "10 Moonbot ManualStratsConfig.hotKeys: hotkey N selects the Nth manual strategy of the active core (same order as the header MS picker) and enables the mode. Empty by default."
  es: "10 ManualStratsConfig.hotKeys de Moonbot: la tecla N selecciona la N-ésima estrategia manual del núcleo activo (mismo orden que el selector MS) y activa el modo. Vacíos por defecto."
hotkeys.manual_strategy:
  ru: "Ручная стратегия %{n}"
