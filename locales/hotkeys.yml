hotkeys.panic_sell_one_hint:
  ru: "Закрыть позицию рынка по рынку. Moonbot-дефолт: Alt+5."
  en: "Close the market's position at market. Moonbot default: Alt+5."
  es: "Cierra a mercado la posición del mercado. Valor por defecto de Moonbot: Alt+5."
hotkeys.cancel_all_buys:
  ru: "Cancel All Buys"
  en: "Cancel All Buys"
  es: "Cancel All Buys"
hotkeys.cancel_all_buys_hint:
  ru: "Снять все buy активного ядра по всем рынкам. Moonbot-дефолт: Alt+A."
  en: "Cancel every buy of the active core across all markets. Moonbot default: Alt+A."
  es: "Cancela todas las compras del núcleo activo en todos los mercados. Valor por defecto de Moonbot: Alt+A."
hotkeys.join_sells:
  ru: "Join Sells"
