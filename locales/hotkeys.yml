hotkeys.group.draw:
  ru: "Рисование"
  en: "Drawing"
  es: "Dibujo"
hotkeys.group.draw_hint:
  ru: "Фигуры на чарте (как карандаш MoonBot). Хоткей выбирает инструмент и включает режим рисования (повтор/Esc — выкл). В режиме: Ctrl+ЛКМ рисует, простой ЛКМ выделяет/двигает фигуру. Кнопка-карандаш в полоске вкладок: ЛКМ — режим, ПКМ — стиль (цвет/толщина/Solid-Dash)."
  en: "Chart figures (MoonBot-style pencil). Hotkey selects the tool and enters draw mode (again/Esc turns it off). In draw mode: Ctrl+LMB draws, plain LMB selects/moves a figure. Pencil button in the tab strip: LMB — mode, RMB — style (color/thickness/Solid-Dash)."
  es: "Figuras en el gráfico: la tecla activa la herramienta (repetir o Esc la desactiva), clic izquierdo coloca nodos. Clic en una figura fuera del modo la selecciona; arrastre nodos/cuerpo para editar."
