  ru: "Cancel All Buys"
  en: "Cancel All Buys"
  es: "Cancel All Buys"
hotkeys.cancel_all_buys_hint:
  ru: "Снять все buy активного ядра по всем рынкам. Moonbot-дефолт: Alt+A."
  en: "Cancel every buy of the active core across all markets. Moonbot default: Alt+A."
  es: "Cancela todas las compras del núcleo activo en todos los mercados. Valor por defecto de Moonbot: Alt+A."
hotkeys.join_sells:
  ru: "Join Sells"
  en: "Join Sells"
  es: "Join Sells"
hotkeys.join_sells_hint:
  ru: "Объединить sell-ордера активного рынка."
  en: "Join sell orders for the active market."
  es: "Une órdenes sell del mercado activo."
hotkeys.new_long:
  ru: "New Long"
  en: "New Long"
  es: "New Long"
hotkeys.new_long_hint:
  ru: "Создать long-сценарий, если поддержано активным ядром."
  en: "Create a long scenario when the active core supports it."
  es: "Crea escenario long si el núcleo activo lo admite."
hotkeys.new_short:
  ru: "New Short"
  en: "New Short"
  es: "New Short"
hotkeys.new_short_hint:
  ru: "Создать short-сценарий, если поддержано активным ядром."
  en: "Create a short scenario when the active core supports it."
  es: "Crea escenario short si el núcleo activo lo admite."
hotkeys.split_order:
  ru: "Split Order"
  en: "Split Order"
  es: "Split Order"
hotkeys.split_order_hint:
  ru: "Разбить ордер под курсором на %{n} части. Курсор не на ордере — берётся единственный активный sell рынка."
  en: "Split the order under the cursor into %{n} parts. With the cursor off any order, the market's only active sell is used."
  es: "Divide en %{n} partes la orden bajo el cursor. Sin orden bajo el cursor, se usa la única venta activa del mercado."
hotkeys.split_order_x:
  ru: "Split Order X"
  en: "Split Order X"
  es: "Split Order X"
hotkeys.split_order_x_hint:
  ru: "То же самое, но на число частей из поля ниже (Moonbot SplitParts)."
  en: "The same, but into the part count from the field below (Moonbot SplitParts)."
  es: "Lo mismo, pero con el número de partes del campo inferior (Moonbot SplitParts)."
hotkeys.sells_to_rect:
  ru: "Sells to rectangle"
  en: "Sells to rectangle"
  es: "Sells to rectangle"
hotkeys.sells_to_rect_hint:
  ru: "Включает режим зоны: у курсора виден значок ✎, в панели инструментов написано «Продажа в зону», и каждая пара Ctrl+кликов (или Ctrl+протяжка) задаёт границы очередной зоны. По второму клику зона исчезает, а продажи рынка раскладывает ядро — и можно рисовать следующую. Пока режим включён, левый клик по графику не торгует. Выход: повторное нажатие, Escape, выбор инструмента в панели или закрытие графика. Уже нарисованная Зона или прямоугольник — пункт «Вписать продажи в зону» по правому клику на фигуре."
  en: "Arms the zone mode: the cursor carries a ✎ mark, the toolbar reads \"Sells to zone\", and every pair of Ctrl+clicks (or a Ctrl+drag) sets the bounds of one more zone. The second click makes the zone disappear and the core spreads the market's sells across it, ready for the next one. While the mode is on, a left click on the chart does not trade. Leave it with the key again, Escape, by picking a tool, or by closing the chart. For a Zone or rectangle already drawn, use the figure's right-click entry."
  es: "Activa el modo zona: el cursor muestra la marca ✎, la barra indica «Ventas a zona» y cada par de Ctrl+clic (o un Ctrl+arrastre) fija los límites de una zona más. Con el segundo clic la zona desaparece y el núcleo reparte las ventas del mercado, listo para la siguiente. Mientras el modo está activo, el clic izquierdo en el gráfico no opera. Salir: pulsar de nuevo, Escape, elegir una herramienta o cerrar el gráfico. Para una Zona o rectángulo ya dibujado, use la entrada del clic derecho sobre la figura."
hotkeys.split_parts:
  ru: "Частей для Split Order X"
  en: "Parts for Split Order X"
  es: "Partes para Split Order X"
hotkeys.split_parts_hint:
  ru: "Moonbot SplitParts. В меню ордера с этим числом появляется второй пункт Split order рядом с обычным на 3."
  en: "Moonbot SplitParts. The order menu shows a second Split order entry with this count next to the plain 3."
  es: "Moonbot SplitParts. El menú de la orden muestra una segunda entrada Split order con este número junto a la de 3."

