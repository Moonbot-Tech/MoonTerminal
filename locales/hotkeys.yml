hotkeys.group.order_move:
  ru: "Сдвиг ордеров"
  en: "Order shift"
  es: "Desplazamiento de órdenes"
hotkeys.group.order_move_hint:
  ru: "Сдвиг живых ордеров рынка активного чарта на один шаг цены (move_order, как перетаскивание линии). Вход двигается только пока не залит."
  en: "Shift live orders of the active chart's market by one price step (move_order, same as dragging the line). Entry moves only while unfilled."
  es: "Desplaza las órdenes vivas del mercado del gráfico activo un paso de precio (move_order, como arrastrar la línea). La entrada solo mientras no esté ejecutada."
hotkeys.shift_buy_up:
  ru: "Shift Buy Up"
  en: "Shift Buy Up"
  es: "Shift Buy Up"
hotkeys.shift_buy_up_hint:
  ru: "Сдвинуть вход (buy) на шаг цены вверх."
  en: "Move the entry (buy) one price step up."
