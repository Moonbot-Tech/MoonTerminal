  en: "Trading commands"
  es: "Comandos de trading"
hotkeys.group.trading_hint:
  ru: "Команды, которые в Moonbot назначаются через HotkeysConfig и работают с активным рынком."
  en: "Moonbot HotkeysConfig commands that operate on the active market."
  es: "Comandos de HotkeysConfig de Moonbot que operan sobre el mercado activo."
hotkeys.cancel_buy:
  ru: "Cancel Buy"
  en: "Cancel Buy"
  es: "Cancel Buy"
hotkeys.cancel_buy_hint:
