  en: "Select the %{n}th strategy of the MS list and enable the mode."
  es: "Selecciona la estrategia %{n} de la lista MS y activa el modo."

# --- Figure drawing layer ---
hotkeys.group.draw:
  ru: "Рисование"
  en: "Drawing"
  es: "Dibujo"
hotkeys.group.draw_hint:
  ru: "Фигуры на чарте (как в Moonbot). Хоткей выбирает инструмент, повтор того же — снимает его. Ctrl+ЛКМ рисует и захватывает фигуру, простой ЛКМ торгует, как обычно. В полоске вкладок: список инструментов («Курсор» — не рисовать) и ⚙ — стиль выбранного инструмента. ПКМ по нарисованной фигуре — те же настройки для неё."
  en: "Chart figures (as in Moonbot). A hotkey arms its tool; the same key again disarms it. Ctrl+LMB draws and grabs a figure, plain LMB keeps trading as usual. In the tab strip: the tool list (\"Cursor\" draws nothing) and ⚙ for the armed tool's style. Right-clicking a drawn figure opens the same settings for it."
  es: "Figuras en el gráfico (como en Moonbot). La tecla activa su herramienta; la misma tecla la desactiva. Ctrl+clic izq. dibuja y agarra una figura; el clic izq. normal sigue operando. En la barra de pestañas: la lista de herramientas («Cursor» no dibuja) y ⚙ para el estilo de la herramienta activa. Clic derecho sobre una figura abre esos mismos ajustes para ella."
hotkeys.draw_hline:
  ru: "Горизонтальная линия"
  en: "Horizontal line"
  es: "Línea horizontal"
hotkeys.draw_hline_hint:
  ru: "Инструмент: один клик ставит горизонталь на цене курсора."
  en: "Tool: one click places a horizontal line at the cursor price."
  es: "Herramienta: un clic coloca una horizontal en el precio del cursor."
hotkeys.draw_segment:
  ru: "Линия (отрезок)"
  en: "Line (segment)"
  es: "Línea (segmento)"
hotkeys.draw_segment_hint:
  ru: "Инструмент: два клика — начало и конец линии."
  en: "Tool: two clicks — line start and end."
  es: "Herramienta: dos clics — inicio y fin de la línea."
hotkeys.draw_triangle:
  ru: "Треугольник"
  en: "Triangle"
  es: "Triángulo"
hotkeys.draw_triangle_hint:
  ru: "Инструмент: три клика — три вершины треугольника (△ Moonbot)."
  en: "Tool: three clicks — the triangle's three vertices (Moonbot △)."
  es: "Herramienta: tres clics — los tres vértices del triángulo (△ Moonbot)."
hotkeys.draw_channel:
  ru: "Параллельный канал"
  en: "Parallel channel"
  es: "Canal paralelo"
hotkeys.draw_channel_hint:
  ru: "Инструмент: два клика по ценам — горизонтальный канал (коридор, как канал Moonbot)."
  en: "Tool: two clicks at prices — a horizontal channel (band, like Moonbot channel)."
  es: "Herramienta: dos clics en precios — un canal horizontal (banda, como el canal de Moonbot)."
hotkeys.fig_delete:
  ru: "Удалить выделенную фигуру"
  en: "Delete selected figure"
