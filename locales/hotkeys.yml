hotkeys.mouse.pending_long:
  ru: "Pending Long"
  en: "Pending Long"
  es: "Pending Long"
hotkeys.mouse.pending_long_hint:
  ru: "PendingOrderSetClick. Moonbot-дефолт: None_Click. Отложенных ордеров нет в moonproto — слать нечего, жест сохраняется на будущее."
  en: "PendingOrderSetClick. Moonbot default: None_Click. moonproto has no pending order, so there is nothing to send; the gesture is stored for later."
  es: "PendingOrderSetClick. Valor por defecto: None_Click. moonproto no tiene órdenes pendientes, así que no hay nada que enviar; el gesto se guarda para más adelante."
hotkeys.mouse.pending_short:
