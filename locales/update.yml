# Header update button: Windows self-update, macOS installer image download.
_version: 2

update.available:
  ru: "Обновить до %{version}"
  en: "Update to %{version}"
  es: "Actualizar a %{version}"
update.tooltip:
  ru: "Скачать, установить и перезапустить MoonTerminal"
  en: "Download, install, and restart MoonTerminal"
  es: "Descargar, instalar y reiniciar MoonTerminal"
update.tooltip_image:
  ru: "Скачать установщик MoonTerminal в Загрузки и открыть его"
  en: "Download the MoonTerminal installer to Downloads and open it"
  es: "Descargar el instalador de MoonTerminal en Descargas y abrirlo"
update.opened:
  ru: "Установщик открыт"
  en: "Installer opened"
  es: "Instalador abierto"
update.opened_tooltip:
  ru: "Установщик открыт — перетащите MoonTerminal в «Программы». Нажмите, чтобы открыть его снова"
  en: "Installer opened — drag MoonTerminal into Applications. Click to open it again"
  es: "Instalador abierto: arrastre MoonTerminal a Aplicaciones. Haga clic para abrirlo de nuevo"
update.installing:
  ru: "Установка обновления..."
  en: "Installing update..."
  es: "Instalando actualización..."
update.retry:
  ru: "Повторить обновление"
  en: "Retry update"
  es: "Reintentar actualización"
update.failed:
  ru: "Не удалось обновить: %{error}"
  en: "Update failed: %{error}"
  es: "Error de actualización: %{error}"
update.recovered:
  ru: "Обновление не запустилось. Предыдущая версия восстановлена и снова открыта."
  en: "The update did not start. The previous version was restored and reopened."
  es: "La actualización no se inició. La versión anterior fue restaurada y reabierta."
