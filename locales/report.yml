# Report panel (trades): filters, totals, and cell values.
# rust-i18n `_version: 2` format: key → locale-to-string map. Interpolation: %{var}.
# Column headers are not localized. `columns::header_for` uses raw DB names except for the legacy
# `profitbtc`/`spentbtc`/`gainedbtc` names, which display as `profit`/`spent`/`gained`.
_version: 2

# --- Side/emulator cell values ---
report.side.short:
  ru: "Шорт"
  en: "Short"
  es: "Corto"
report.side.long:
  ru: "Лонг"
  en: "Long"
  es: "Largo"
report.cell.emu:
  ru: "эму"
  en: "emu"
  es: "emu"

# --- Filters and combo boxes ---
report.filter.all:
  ru: "Все"
  en: "All"
  es: "Todas"
report.all_strategies:
  ru: "Все стратегии"
  en: "All strategies"
  es: "Todas las estrategias"
report.search_strategies:
  ru: "Поиск стратегии..."
  en: "Search strategies..."
  es: "Buscar estrategias..."
# Separate Auto-workspace report filter. Unlike the exact picker search above, this value narrows the
# report itself by a literal, case-insensitive strategy-name substring.
report.filter.strategy_mask_ph:
  ru: "Маска стратегии"
  en: "Strategy mask"
  es: "Máscara de estrategia"
report.filter.strategy_mask_tip:
  ru: "Фильтр отчёта по части названия стратегии без учёта регистра. Например, EMA_."
  en: "Filter the report by a case-insensitive part of the strategy name. For example, EMA_."
  es: "Filtra el informe por una parte del nombre de la estrategia, sin distinguir mayúsculas. Por ejemplo, EMA_."
report.filter.core:
  ru: "Ядро:"
  en: "Core:"
  es: "Núcleo:"
report.filter.side:
  ru: "Сторона:"
  en: "Side:"
  es: "Lado:"
report.filter.from:
  ru: "С:"
  en: "From:"
  es: "Desde:"
report.filter.to:
  ru: "По:"
  en: "To:"
  es: "Hasta:"
# Doubles as the field's caption: there is no label beside it, so the placeholder names it.
report.filter.coin_ph:
  ru: "монета"
  en: "coin"
  es: "moneda"
report.filter.date_ph:
  ru: "дата и время"
  en: "date and time"
  es: "fecha y hora"
# Deleted row of the merged scope field. Off (default) hides trades soft-deleted in the core's
# report; on shows ONLY them. Export follows the same filter.
report.filter.deleted:
  ru: "Только удалённые"
  en: "Deleted only"
  es: "Solo eliminadas"
# Lifecycle row of the merged scope field, an axis independent of the real/emulator group above:
# that one is a trade's ORIGIN, this one is whether it has closed. On (default) shows still-running
# positions alongside closed trades, in the table AND in the totals; off removes them from both,
# and the export follows the same filter. Disabled on an Analytics-scoped Report, which forces
# closed rows regardless. Wording matches `report.open_positions_tip` so the switch and the footer
# figure it governs use one vocabulary.
report.filter.open_rows:
  ru: "Открытые позиции"
  en: "Open positions"
  es: "Posiciones abiertas"
# Full-width comment pane between the table and the totals: `show` is its row in the scope field.
# The pane carries no caption and no placeholder — the comment uses the panel's whole width, and
# with no row selected the strip is simply empty.
report.comment.show:
  ru: "Комментарий сделки"
  en: "Trade comment"
  es: "Comentario de la operación"
# Shown when a trade IS selected and its comment is empty. With no trade selected the pane stays
# blank instead — the two states must not read alike.
report.comment.empty:
  ru: "без комментария"
  en: "no comment"
  es: "sin comentario"
# Tooltip of the merged scope field. It states the two switch semantics the row labels alone
# cannot: the deleted one is EXCLUSIVE (on shows only those), the open-positions one is INCLUSIVE
# (off removes them from the table and the totals alike).
report.filter.scope_tip:
  ru: "Сторона, тип сделок, удалённые, открытые позиции и показ комментария. «Только удалённые» выкл — удалённые скрыты, вкл — показаны только они. «Открытые позиции» выкл — в таблице и в итогах только закрытые сделки."
  en: "Direction, trade kind, deleted trades, open positions and the comment pane. “Deleted only” off — deleted trades are hidden; on — only they are shown. “Open positions” off — the table and the totals show closed trades only."
  es: "Lado, tipo de operaciones, eliminadas, posiciones abiertas y el panel de comentarios. «Solo eliminadas» desactivado: se ocultan; activado: solo se muestran ellas. «Posiciones abiertas» desactivado: la tabla y los totales muestran solo operaciones cerradas."
# Abbreviation appended to the scope trigger while the row above is on.
report.filter.deleted_short:
  ru: "удал."
  en: "del."
  es: "elim."
# First row of the scope field's direction group. Named "all sides" rather than a bare "all" so it
# does not read as the same option as the kind group's own first row.
report.filter.all_sides:
  ru: "Все стороны"
  en: "All sides"
  es: "Todos los lados"
# Error toast when a soft-delete/restore could not be sent (the core is offline or gone). The
# affected rows stay selected so nothing is silently lost.
report.delete_send_failed:
  ru: "Не удалось отправить изменение: ядро недоступно. Строки остались выбранными."
  en: "Could not send the change: the core is unavailable. Rows remain selected."
  es: "No se pudo enviar el cambio: el núcleo no está disponible. Las filas siguen seleccionadas."
# Selection commands shown in the totals row only while report rows are selected.
report.selection.count:
  ru: "Выбрано: %{n}"
  en: "Selected: %{n}"
  es: "Seleccionadas: %{n}"
report.selection.clear:
  ru: "Снять"
  en: "Clear"
  es: "Limpiar"
report.selection.copy:
  ru: "Копировать"
  en: "Copy"
  es: "Copiar"
report.selection.delete:
  ru: "Удалить (%{n})"
  en: "Delete (%{n})"
  es: "Eliminar (%{n})"
report.selection.restore:
  ru: "Восстановить (%{n})"
  en: "Restore (%{n})"
  es: "Restaurar (%{n})"
report.selection.copied:
  ru: "Сделки скопированы: %{n}"
  en: "Copied trades: %{n}"
  es: "Operaciones copiadas: %{n}"
report.selection.delete_queued:
  ru: "Поставлено на удаление: %{n}. Выбор снимется после ответа ядра."
  en: "Queued for deletion: %{n}. Selection clears after the core response."
  es: "En cola para eliminar: %{n}. La selección se borra tras la respuesta del núcleo."
report.selection.restore_queued:
  ru: "Поставлено на восстановление: %{n}. Выбор снимется после ответа ядра."
  en: "Queued for restore: %{n}. Selection clears after the core response."
  es: "En cola para restaurar: %{n}. La selección se borra tras la respuesta del núcleo."
# The trigger draws a MoonUI icon asset, added in code; the dictionary contains text only.
report.columns_menu:
  ru: "Колонки"
  en: "Columns"
  es: "Columnas"
# Menu for saving the report to a file (the ⇩ button left of Columns). The query period comes from
# the panel's current filter (preset or From/To dates). CSV and Excel remain untranslated.
report.export_menu:
  ru: "Сохранить отчёт в файл (CSV / Excel)"
  en: "Save report to a file (CSV / Excel)"
  es: "Guardar informe en archivo (CSV / Excel)"
report.export.ok:
  ru: "Экспортировано строк: %{n}"
  en: "Exported %{n} rows"
  es: "Exportadas %{n} filas"
report.export.fail:
  ru: "Экспорт не выполнен — файл не сохранён"
  en: "Export failed — no file was saved"
  es: "Exportación fallida: no se guardó ningún archivo"
report.export.csv:
  ru: "CSV"
  en: "CSV"
  es: "CSV"
report.export.csv_all:
  ru: "CSV — все колонки"
  en: "CSV — all columns"
  es: "CSV — todas las columnas"
report.export.xlsx:
  ru: "Excel (XLSX)"
  en: "Excel (XLSX)"
  es: "Excel (XLSX)"
report.export.xlsx_all:
  ru: "Excel — все колонки"
  en: "Excel — all columns"
  es: "Excel — todas las columnas"

# --- Empty states and totals ---
report.all_cols_hidden:
  ru: "Все колонки скрыты — включите в «Колонки»."
  en: "All columns are hidden — enable some in “Columns”."
  es: "Todas las columnas están ocultas — actívalas en «Columnas»."
report.empty:
  ru: "Нет отчётов под фильтр (или БД пуста)."
  en: "No reports match the filter (or the DB is empty)."
  es: "Ningún informe coincide con el filtro (o la BD está vacía)."
# Footer caption while no snapshot is renderable, when there is no order count to state.
report.totals:
  ru: "Итого:"
  en: "Total:"
  es: "Total:"
# Footer caption over a loaded snapshot: the bracketed number is the orders the total sums.
report.totals_n:
  ru: "Итого (%{n}):"
  en: "Total (%{n}):"
  es: "Total (%{n}):"
# The same caption in the row tooltip, which has room to say what the number counts.
report.totals_n_tip:
  ru: "Итого (%{n} ордеров)"
  en: "Total (%{n} orders)"
  es: "Total (%{n} órdenes)"
# Still-running positions under the same filter. The amount is UNREALIZED and is deliberately NOT
# part of the total above it, which covers closed trades only.
report.open_positions:
  ru: "открыто: %{n} (%{amount})"
  en: "open: %{n} (%{amount})"
  es: "abiertas: %{n} (%{amount})"
# The same fact when no open row has a known currency, so there is no amount to state.
report.open_positions_bare:
  ru: "открыто: %{n}"
  en: "open: %{n}"
  es: "abiertas: %{n}"
# Fully spelled recovery text used by the shared footer tooltip when the compact fact is clipped.
report.open_positions_tip:
  ru: "Открытых позиций: %{n}. Плавающая прибыль, в итог не входит"
  en: "Open positions: %{n}. Floating P&L, not included in the total"
  es: "Posiciones abiertas: %{n}. P&L flotante, no incluido en el total"
# The same tooltip when some open rows carry no known currency and are absent from the amount.
report.open_positions_tip_unknown:
  ru: "Открытых позиций: %{n}. Плавающая прибыль, в итог не входит; без известной валюты: %{unknown}"
  en: "Open positions: %{n}. Floating P&L, not included in the total; unknown quote: %{unknown}"
  es: "Posiciones abiertas: %{n}. P&L flotante, no incluido en el total; moneda desconocida: %{unknown}"
# Unsigned entry-plus-exit notional over the exact loaded Report filter.
report.traded_volume:
  ru: "Объём: %{amount}"
  en: "Volume: %{amount}"
  es: "Volumen: %{amount}"
# Fully spelled recovery text used by the shared footer tooltip when the compact fact is clipped.
report.traded_volume_tip:
  ru: "Общий торговый объём: %{amount}"
  en: "Total traded volume: %{amount}"
  es: "Volumen total negociado: %{amount}"
# A unified mixed-quote amount converted with the loaded snapshot's current-rate mode.
report.traded_volume_current:
  ru: "Объём по текущему курсу: %{amount}"
  en: "Volume at the current rate: %{amount}"
  es: "Volumen a la tasa actual: %{amount}"
report.traded_volume_current_tip:
  ru: "Общий торговый объём по текущему курсу: %{amount}"
  en: "Total traded volume at the current rate: %{amount}"
  es: "Volumen total negociado a la tasa actual: %{amount}"
# An amount over the reconstructed quote buckets only. The qualifier shares the fact with the
# figure so a narrow dock cannot clip one without the other.
report.traded_volume_partial:
  ru: "Объём (частично): %{amount}"
  en: "Volume (partial): %{amount}"
  es: "Volumen (parcial): %{amount}"
# The recovery text has room for the shortfall itself: how many orders are excluded, and from where.
report.traded_volume_partial_tip:
  ru: "Торговый объём по восстановленным сделкам: %{amount}. Не учтено ордеров: %{n} (%{currencies})"
  en: "Traded volume over the reconstructed trades: %{amount}. Orders not accounted for: %{n} (%{currencies})"
  es: "Volumen negociado de las operaciones reconstruidas: %{amount}. Órdenes no contabilizadas: %{n} (%{currencies})"
# Names the excluded rows that have no quote ticker of their own to be named by.
report.traded_volume_unknown_quote:
  ru: "валюта неизвестна"
  en: "unknown quote"
  es: "moneda desconocida"
# Realized profit as a percentage of the average order, single-core scope only. %{pct} arrives
# pre-signed from signed_pct, e.g. "+11.6%".
report.avg_order_pct:
  ru: "%{pct} от ср. ордера"
  en: "%{pct} of avg order"
  es: "%{pct} de la orden media"
# Some counted rows were excluded from both sums (unknown quote, Funding, non-positive spend).
report.avg_order_pct_partial:
  ru: "%{pct} от ср. ордера (частично)"
  en: "%{pct} of avg order (partial)"
  es: "%{pct} de la orden media (parcial)"
# The count is stated as a LABEL ("orders counted: N"), never as a noun the number must agree
# with, so it reads correctly at n=1 in every locale without a plural form - the same shape
# report.traded_volume_partial_tip already uses for its shortfall.
report.avg_order_pct_tip:
  ru: "Прибыль к среднему ордеру: %{pct}. Средний ордер: %{avg}, ордеров учтено: %{n}"
  en: "Profit to average order: %{pct}. Average order: %{avg}, orders counted: %{n}"
  es: "Beneficio sobre la orden media: %{pct}. Orden media: %{avg}, órdenes contadas: %{n}"
report.avg_order_pct_partial_tip:
  ru: "Прибыль к среднему ордеру: %{pct}. Средний ордер: %{avg}, ордеров учтено: %{n}; не учтено: %{excluded}"
  en: "Profit to average order: %{pct}. Average order: %{avg}, orders counted: %{n}; not accounted for: %{excluded}"
  es: "Beneficio sobre la orden media: %{pct}. Orden media: %{avg}, órdenes contadas: %{n}; no contabilizadas: %{excluded}"
# The unified arm under ValuationMode::Current only. A unified scope CAN still be partial - Funding,
# non-positive-spend and unknown-quote rows shrink the counted scope independently of valuation - and
# in that case the partial wording above wins and this key is not reached, because the shortfall is
# the more important signal.
report.avg_order_pct_current_tip:
  ru: "Прибыль к среднему ордеру по текущему курсу: %{pct}. Средний ордер: %{avg}, ордеров учтено: %{n}"
  en: "Profit to average order at the current rate: %{pct}. Average order: %{avg}, orders counted: %{n}"
  es: "Beneficio sobre la orden media a la tasa actual: %{pct}. Orden media: %{avg}, órdenes contadas: %{n}"
report.unknown_quote_orders:
  ru: "валюта неизвестна: %{n}"
  en: "unknown quote: %{n}"
  es: "moneda desconocida: %{n}"
# The unified figure needs no "in USDT" prefix: the ticker is already on the amount.
report.valuation_total:
  ru: "%{amount} USDT"
  en: "%{amount} USDT"
  es: "%{amount} USDT"
report.valuation_progress:
  ru: "пересчёт в USDT: %{ready}/%{total}"
  en: "USDT valuation: %{ready}/%{total}"
  es: "valoración en USDT: %{ready}/%{total}"
report.valuation_unavailable:
  ru: "нет исторического курса: %{n}"
  en: "historical rate unavailable: %{n}"
  es: "tasa histórica no disponible: %{n}"
report.valuation_retrying:
  ru: "пересчёт: повторная попытка"
  en: "valuation: retrying"
  es: "valoración: reintentando"
report.valuation_stalled:
  ru: "пересчёт остановился"
  en: "valuation stalled"
  es: "valoración detenida"
report.valuation_stalled_tip:
  ru: "Пересчёт в USDT не продвигается уже %{minutes} мин. Этап: %{stage}. Причина: %{kind}. [%{codes}] %{detail}"
  en: "USDT valuation has made no progress for %{minutes} min. Stage: %{stage}. Cause: %{kind}. [%{codes}] %{detail}"
  es: "La valoración en USDT no avanza desde hace %{minutes} min. Etapa: %{stage}. Causa: %{kind}. [%{codes}] %{detail}"
# Keeps its qualifier: this figure is what the period would be worth TODAY, not what it earned,
# and dropping the words would make the two conversions render identically.
report.valuation_total_current:
  ru: "по текущему курсу: %{amount} USDT"
  en: "at the current rate: %{amount} USDT"
  es: "a la tasa actual: %{amount} USDT"
report.valuation_current_progress:
  ru: "текущий курс: %{ready}/%{total}"
  en: "current rate: %{ready}/%{total}"
  es: "tasa actual: %{ready}/%{total}"
report.valuation_current_unavailable:
  ru: "нет текущего курса: %{n}"
  en: "current rate unavailable: %{n}"
  es: "tasa actual no disponible: %{n}"
report.shown_top:
  ru: "показано: %{n}"
  en: "shown: %{n}"
  es: "mostrado: %{n}"

report.filter.emu:
  ru: "Эмулятор"
  en: "Emulator"
  es: "Emulador"
report.period.today:
  ru: "Сегодня"
  en: "Today"
  es: "Hoy"
report.period.yesterday:
  ru: "Вчера"
  en: "Yesterday"
  es: "Ayer"
# Every preset here is named by its FAMILY: a calendar one says which period it is current within,
# a rolling one is labelled by its day count. A bare week or year cannot be told apart from its
# rolling counterpart once both are offered, which is why the rolling three are numeric. The same
# wording is carried in analytics.period.* so the two windows do not disagree; analytics.period.*
# has its own cur_year but no calendar-week key — the Profit Monitor borrows this cur_week key
# directly instead of duplicating it.
# A rolling 7-day window ending today.
report.period.week:
  ru: "7 дней"
  en: "7 days"
  es: "7 días"
# Calendar week from Monday.
report.period.cur_week:
  ru: "Тек. неделя"
  en: "This week"
  es: "Semana actual"
# Calendar month from the 1st.
report.period.cur_month:
  ru: "Тек. месяц"
  en: "This month"
  es: "Mes actual"
# Previous calendar month, 1st to last day inclusive.
report.period.last_month:
  ru: "Прош. мес."
  en: "Last month"
  es: "Mes pasado"
# Calendar year from January 1st.
report.period.cur_year:
  ru: "Тек. год"
  en: "This year"
  es: "Año actual"
# A rolling 30-day window — NOT a calendar month, which is why it is labelled by number.
report.period.month:
  ru: "30 дней"
  en: "30 days"
  es: "30 días"
# A rolling 365-day window — NOT a calendar year.
report.period.year:
  ru: "365 дней"
  en: "365 days"
  es: "365 días"
report.cores_n:
  ru: "Ядер: %{n}"
  en: "Cores: %{n}"
  es: "Núcleos: %{n}"
report.strategies_n:
  ru: "Стратегий: %{n}"
  en: "Strategies: %{n}"
  es: "Estrategias: %{n}"
# The core-list field label matches Orders (orders.all_cores).
report.all_cores:
  ru: "Все ядра"
  en: "All cores"
  es: "Todos los núcleos"
# Order-type list field, matching orders.kind.*. `report.kind.all` is the Analytics toolbar wording;
# the Report scope field uses `all_kinds` so its row differs from the direction group's "all".
report.kind.all:
  ru: "Все"
  en: "All"
  es: "Todas"
report.kind.all_kinds:
  ru: "Все типы"
  en: "All kinds"
  es: "Todos los tipos"
report.kind.real:
  ru: "Реальные"
  en: "Real"
  es: "Reales"
report.kind.emu:
  ru: "Эмуляторные"
  en: "Emulator"
  es: "Emulador"
# Abbreviations for the scope trigger — the full words do not fit the field ("Все/реал.").
report.kind.all_short:
  ru: "все"
  en: "all"
  es: "todas"
report.kind.real_short:
  ru: "реал."
  en: "real"
  es: "real"
report.kind.emu_short:
  ru: "эмул."
  en: "emu"
  es: "emu"

# --- Trade log (the core's own log lines for one trade, matched by its task number) ---
report.trade_log.open:
  ru: "Лог сделки"
  en: "Trade log"
  es: "Registro de la operación"
# Shown DISABLED when the row carries no core task number: a log line has no other identity, so
# there is nothing the scan could look for.
report.trade_log.no_task:
  ru: "Лог сделки — нет номера задачи"
  en: "Trade log — no task number"
  es: "Registro de la operación — sin número de tarea"
# Shown DISABLED when the row's core cannot be named, so no log file can be located.
report.trade_log.no_core:
  ru: "Лог сделки — ядро не определено"
  en: "Trade log — core cannot be identified"
  es: "Registro de la operación — núcleo no identificado"
report.trade_log.title:
  ru: "Лог сделки"
  en: "Trade log"
  es: "Registro de la operación"
report.trade_log.loading:
  ru: "Читаю файлы логов..."
  en: "Reading log files..."
  es: "Leyendo archivos de registro..."
report.trade_log.count:
  ru: "Строк: %{n}"
  en: "Lines: %{n}"
  es: "Líneas: %{n}"
report.trade_log.truncated:
  ru: "Показаны первые %{n} строк — остальные обрезаны"
  en: "First %{n} lines shown — the rest were cut"
  es: "Se muestran las primeras %{n} líneas; el resto se cortó"
report.trade_log.copy_all:
  ru: "Копировать всё"
  en: "Copy all"
  es: "Copiar todo"
report.trade_log.empty:
  ru: "Лог не найден: файл за эти сутки удалён по сроку хранения, или у ядра был выключен приём лога"
  en: "No log found: the day's file is past its retention, or log relaying was off for this core"
  es: "Sin registro: el archivo del día ya expiró, o la retransmisión del registro estaba apagada para este núcleo"
