# Report panel (trades): filters, totals, and cell values.
# rust-i18n `_version: 2` format: key → locale-to-string map. Interpolation: %{var}.
# Column headers are not localized. `columns::header_for` uses raw DB names except for the legacy
# `profitbtc`/`spentbtc`/`gainedbtc` names, which display as `profit`/`spent`/`gained`.
_version: 2

# --- Side/emulator cell values ---
report.side.short:
  ru: "Шорт"
  en: "Short"
  es: "Corto"
report.side.long:
  ru: "Лонг"
  en: "Long"
  es: "Largo"
report.cell.emu:
  ru: "эму"
  en: "emu"
  es: "emu"

