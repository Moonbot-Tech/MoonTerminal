# Bare checkbox between the order-kind combo and export. Off (default) hides trades
# soft-deleted in the core's report; on shows ONLY them. Export follows the same filter.
report.filter.deleted_tip:
  ru: "Только удалённые из отчёта сделки. Выкл — удалённые скрыты."
  en: "Only trades deleted from the report. Off — deleted trades are hidden."
  es: "Solo operaciones eliminadas del informe. Desactivado: se ocultan."
# Error toast when a soft-delete/restore could not be sent (the core is offline or gone). The
# affected rows stay selected so nothing is silently lost.
report.delete_send_failed:
  ru: "Не удалось отправить изменение: ядро недоступно. Строки остались выбранными."
  en: "Could not send the change: the core is unavailable. Rows remain selected."
  es: "No se pudo enviar el cambio: el núcleo no está disponible. Las filas siguen seleccionadas."
# Bottom action bar shown only while report rows are selected.
report.selection.count:
  ru: "Выбрано: %{n}"
  en: "Selected: %{n}"
  es: "Seleccionadas: %{n}"
report.selection.clear:
  ru: "Снять"
  en: "Clear"
  es: "Limpiar"
report.selection.copy:
  ru: "Копировать"
  en: "Copy"
  es: "Copiar"
report.selection.delete:
  ru: "Удалить (%{n})"
  en: "Delete (%{n})"
  es: "Eliminar (%{n})"
report.selection.restore:
  ru: "Восстановить (%{n})"
  en: "Restore (%{n})"
  es: "Restaurar (%{n})"
report.selection.copied:
  ru: "Сделки скопированы: %{n}"
  en: "Copied trades: %{n}"
  es: "Operaciones copiadas: %{n}"
report.selection.delete_queued:
  ru: "Поставлено на удаление: %{n}. Выбор снимется после ответа ядра."
  en: "Queued for deletion: %{n}. Selection clears after the core response."
  es: "En cola para eliminar: %{n}. La selección se borra tras la respuesta del núcleo."
report.selection.restore_queued:
  ru: "Поставлено на восстановление: %{n}. Выбор снимется после ответа ядра."
  en: "Queued for restore: %{n}. Selection clears after the core response."
  es: "En cola para restaurar: %{n}. La selección se borra tras la respuesta del núcleo."
# The ▦ glyph is added separately in code; the dictionary contains text only.
report.columns_menu:
  ru: "Колонки"
  en: "Columns"
  es: "Columnas"
# Menu for saving the report to a file (the ⇩ button left of Columns). The query period comes from
# the panel's current filter (preset or From/To dates). CSV and Excel remain untranslated.
report.export_menu:
  ru: "Сохранить отчёт в файл (CSV / Excel)"
  en: "Save report to a file (CSV / Excel)"
  es: "Guardar informe en archivo (CSV / Excel)"
report.export.ok:
  ru: "Экспортировано строк: %{n}"
  en: "Exported %{n} rows"
  es: "Exportadas %{n} filas"
report.export.fail:
  ru: "Экспорт не выполнен — файл не сохранён"
  en: "Export failed — no file was saved"
  es: "Exportación fallida: no se guardó ningún archivo"
report.export.csv:
