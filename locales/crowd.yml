# Crowd statistics on an empty Main: the rolling minute and the service's two boards for the day.
# rust-i18n `_version: 2` format: key → locale-to-string map. Interpolation: %{var}.
# Column headings are upper-case in every locale: they are a table's own chrome, read as a block
# rather than as words, and a mixed-case column among upper-case ones reads as a different table.
_version: 2

# --- The minute, top right ---
crowd.minute.title:
  ru: "РЫНОК · МИНУТА"
  en: "MARKET · MINUTE"
  es: "MERCADO · MINUTO"
crowd.minute.empty:
  ru: "ни одной монеты в минуте"
  en: "no coin traded this minute"
  es: "ninguna moneda en este minuto"

# The only word the wire still needs. Live, connecting and down are said by the COLOUR of the
# service's name beside the heading; "synthetic" cannot be, because there the figures are invented
# and no colour carries that.
crowd.wire.synthetic:
  ru: "синтетика"
  en: "synthetic"
  es: "sintético"

# --- The service's boards for the rolling day ---
crowd.day.coins:
  ru: "МОНЕТЫ · СУТКИ"
  en: "COINS · 24H"
  es: "MONEDAS · 24H"
crowd.day.traders:
  ru: "ТОП ЗА СУТКИ"
  en: "TOP 24H"
  es: "TOP 24H"
# The service's own day total, shown beside the trader board's caption: the board is a TOP of
# fifty, this counts everybody.
crowd.day.total:
  ru: "(всего %{money}, сделок %{trades})"
  en: "(total %{money}, %{trades} trades)"
  es: "(total %{money}, %{trades} operaciones)"
crowd.day.silent:
  ru: "сервис молчит"
  en: "the service is silent"
  es: "el servicio no responde"

# --- Column headings ---
# PROFIT and LOSS are two separate columns, never a net figure: a coin that made $9k and lost $8k
# had a loud minute, and one number would report it as a quiet one.
crowd.col.coin:
  ru: "МОНЕТА"
  en: "COIN"
  es: "MONEDA"
crowd.col.profit:
  ru: "ПРОФИТ"
  en: "PROFIT"
  es: "GANANCIA"
crowd.col.loss:
  ru: "УБЫТОК"
  en: "LOSS"
  es: "PÉRDIDA"
# The rank the service itself assigns, shown as a bare number sign.
crowd.col.rank:
  ru: "#"
  en: "#"
  es: "#"
# The service's own account number: the only name half this board has, since an anonymous row has
# no handle at all.
crowd.col.id:
  ru: "ID"
  en: "ID"
  es: "ID"
crowd.col.who:
  ru: "КТО"
  en: "WHO"
  es: "QUIÉN"
crowd.col.trades:
  ru: "СДЕЛОК"
  en: "TRADES"
  es: "OPERAC."

# --- The switch on the empty screen ---
crowd.settings.btn:
  ru: "Настройки пустого экрана"
  en: "Empty-screen settings"
  es: "Ajustes de la pantalla vacía"
crowd.settings.title:
  ru: "Пустой экран"
  en: "Empty screen"
  es: "Pantalla vacía"
# Five independent layers, in the order the popup lists them. Each names what it shows rather than
# what it hides, and the three tables also decide what is READ: an unshown table opens no connection
# to the statistics service. The LOGO is the one that is not only about this screen — it governs the
# same brand on an empty AddToChart stack and on a chart slot waiting for data, which is why its
# label says "the logo" and not "the logo here".
crowd.settings.logo:
  ru: "Показывать логотип"
  en: "Show the logo"
  es: "Mostrar el logotipo"
crowd.settings.hint:
  ru: "Показывать помощь"
  en: "Show the hint"
  es: "Mostrar la ayuda"
crowd.settings.minute:
  ru: "Показывать минутные сделки"
  en: "Show the trading minute"
  es: "Mostrar el minuto de operaciones"
crowd.settings.traders:
  ru: "Показывать топ 24ч по ID"
  en: "Show the 24h trader top"
  es: "Mostrar el top 24h de traders"
crowd.settings.coins:
  ru: "Показывать топ 24ч по монетам"
  en: "Show the 24h coin top"
  es: "Mostrar el top 24h de monedas"

# --- The rule, which is not a layer of this screen ---
# It draws nothing here: it puts a card in the Detects panel when a coin's minute crosses both
# lines. Its two thresholds are dead while it is off, which is why they are captioned as
# comparisons rather than as settings — the switch above says WHETHER, and these say WHAT.
crowd.settings.detect:
  ru: "Детект по статистике"
  en: "Detect on the statistics"
  es: "Detección por las estadísticas"
crowd.settings.detect_profit:
  ru: "Профит за минуту >"
  en: "Profit for the minute >"
  es: "Ganancia del minuto >"
crowd.settings.detect_trades:
  ru: "Сделок за минуту ≥"
  en: "Trades in the minute ≥"
  es: "Operaciones del minuto ≥"
crowd.settings.detect_keep:
  ru: "Держать, сек"
  en: "Keep, seconds"
  es: "Mantener, s"
# What happens when the rule fires and every seat is already taken. Off, the newcomer is dropped and
# what is on screen lives out its time; on, the oldest gives up its seat. The count is interpolated
# so one number in the code answers for the label, the rule's own burst and the feed's trim.
crowd.settings.detect_evict:
  ru: "Заменять самый старый (максимум %{max})"
  en: "Replace the oldest (at most %{max})"
  es: "Reemplazar el más antiguo (máximo %{max})"
# A zero is not a line at zero — it switches that line off, and neither the caption nor the number
# beside it can say so on its own. Both at zero asks nothing, and then nothing is read at all.
crowd.settings.detect_hint:
  ru: "0 — линия не учитывается; обе нулевые — детектов не будет"
  en: "0 switches a line off; both at zero and nothing fires"
  es: "0 desactiva una línea; ambas en cero y no se detecta nada"

# --- The card the rule fires ---
# Where a core detect prints the core that reported it, this prints what noticed: the crowd's own
# pulse, on a card that has no core and no strategy behind it. Named for what it measures rather
# than for whose numbers they are — the card already says the figures are a minute of the market.
crowd.detect.source:
  ru: "ПУЛЬС"
  en: "PULSE"
  es: "PULSO"
