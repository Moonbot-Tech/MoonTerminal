  en: "Copy \"%{name}\" sent to core %{core} → root"
  es: "Copia «%{name}» enviada al núcleo %{core} → raíz"
# Partial copy result: at least one core accepted the command and at least one rejected it.
analytics.copy_partial:
  ru: "Копия создана не на всех ядрах: %{err}"
  en: "The copy was not created on every core: %{err}"
  es: "La copia no se creó en todos los núcleos: %{err}"
