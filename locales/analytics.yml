  ru: "Подобрать состав"
  en: "Compose set"
  es: "Componer conjunto"
analytics.tuner.compose_help:
  ru: "Подбирает не только пороги, но и сам состав полей. Кандидаты проверяются на отрезках периода, которых поиск не видел: поле входит, только если помогает на большинстве отрезков, и выбрасывается, если без него не хуже. Галочки полей остаются границей — состав берётся только из разрешённых. Нужна выбранная стратегия."
  en: "Chooses the field set as well as the thresholds. Candidates are scored on stretches of the period the search never saw: a field joins only if it helps in most of them, and is dropped when the set does no worse without it. The field checkboxes stay the boundary — the set is drawn only from what they admit. A strategy must be selected."
  es: "Elige el conjunto de campos además de los umbrales. Los candidatos se evalúan en tramos del periodo que la búsqueda no vio: un campo entra solo si ayuda en la mayoría de ellos, y se descarta si el conjunto no empeora sin él. Las casillas de campos siguen siendo el límite: el conjunto se toma solo de las admitidas. Debe haber una estrategia seleccionada."
analytics.tuner.compose_budget:
