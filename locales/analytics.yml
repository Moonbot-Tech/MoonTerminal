# Train/holdout split: the share the search may fit on, and the verdict under the fields grid.
analytics.tuner.train_share:
  ru: "обучение"
  en: "train on"
  es: "entrenar"
analytics.tuner.compose_toggle:
  ru: "Подбирать состав полей"
  en: "Select the field set"
  es: "Seleccionar el conjunto de campos"
analytics.tuner.compose_short:
  ru: "Сравнит сокращённый состав, все поля и вариант без дополнительных фильтров; при близкой прибыли учтёт PF, просадку и число сделок."
  en: "Compares a reduced set, all fields, and no additional filters; close profits also consider PF, drawdown, and trade count."
  es: "Compara un conjunto reducido, todos los campos y ningún filtro adicional; con beneficios cercanos también tiene en cuenta PF, drawdown y número de operaciones."
analytics.tuner.compose_run:
  ru: "Подобрать состав"
  en: "Compose set"
  es: "Componer conjunto"
analytics.tuner.compose_help:
  ru: "Сравнивает три равноправных пути: отдельный состав, совместный поиск по всем разрешённым полям и отсутствие дополнительных фильтров. До %{seeds} независимых seed проверяют каждый временной срез; решает большинство seed внутри среза, затем большинство срезов. Beam держит 8 ветвей при ясной границе и расширяется до 16 при спорной. Большая разница прибыли решает сразу, а при близкой прибыли учитываются PF, меньшая просадка и число сделок. Галочки остаются границей поиска. Нужна выбранная стратегия."
  en: "Compares three equal paths: a distinct field set, joint search across every admitted field, and no additional filters. Up to %{seeds} independent seeds check each time fold; seeds vote inside the fold, then folds vote. The beam keeps 8 branches at a clear boundary and expands to 16 when it is ambiguous. A material profit gap remains decisive; close profits also use PF, lower drawdown, and trade count. The checkboxes remain the search boundary. A strategy must be selected."
  es: "Compara tres caminos equivalentes: un conjunto propio, la búsqueda conjunta en todos los campos permitidos y ningún filtro adicional. Hasta %{seeds} seeds independientes comprueban cada corte temporal; primero votan los seeds dentro del corte y después los cortes. El beam conserva 8 ramas con un límite claro y se amplía hasta 16 cuando es ambiguo. Una diferencia material de beneficio sigue siendo decisiva; con beneficios cercanos también se usan PF, menor drawdown y número de operaciones. Las casillas siguen siendo el límite. Debe seleccionarse una estrategia."
