_version: 1

general.language: "Язык интерфейса"
general.language_hint: "Применяется после сохранения."
general.valuation_mode: "Курс пересчёта в USDT"
general.valuation_mode.historical: "На момент сделки"
general.valuation_mode.current: "Текущий курс"
general.valuation_mode_hint: "Отчёт и Аналитика пересчитывают в USDT по курсу той минуты, когда сделка закрылась. Меняйте это только осознанно: «Текущий курс» берёт последний известный курс со спота Binance/Bybit, а не с биржи, где шла торговля, обновляет его раз в несколько минут и нигде не сохраняет. Он же меняет подбор порогов в тюнере: пороги подбираются по переоценённой истории. Применяется после сохранения."
general.charts_split_by_core: "Отдельная чарт-вкладка на каждое ядро"
general.charts_split_by_core_hint: "AddToChart по умолчанию: вкл — своя вкладка на ядро, выкл — все ядра группы в одной. Колонка «Связка» у ядра (Подключения) переопределяет это: ядра с одинаковым именем связки сводятся в одну вкладку."
general.separate_control_zones: "Панорама графика в зоне стакана"
general.separate_control_zones_hint: "Вкл — левый драг, не попавший в линию ордера, панорамирует график даже над стаканом; клик без движения по-прежнему ставит, двигает или снимает ордер. Выкл — зона стакана только для ордеров: ни панорамы, ни зума. Ордерные жесты ВСЕГДА только в зоне стакана, на любой вкладке, включая Add и выносные окна; клик по полю графика ордер не ставит, не двигает и не снимает. Колесо над стаканом по-прежнему крутит стек / стакан. При скрытом стакане зона ордеров — полоса у правого края с риской, пока во вкладке стоит «Зона ордеров при скрытом стакане»; снимите её вместе со стаканом — и вкладка целиком станет чартом: ни одного ордерного жеста, дабл-клик по всей ширине открывает монету на Main. Чарт, свёрнутый метлой сравнения до стакана, не делится вовсе: стакан занимает всю его площадь, и чартовых жестов — панорамы, дабл-клика на Main, выхода из фуллскрина — на нём не остаётся."
general.main_idle_close: "Автозакрытие графиков Main при неактивности"
general.main_idle_close_secs: "Закрывать через"
general.main_idle_close_hint: "Неактивность = окно Main не в фокусе ЛИБО в фокусе, но мышь не двигается. Каждый график закрывается через N сек своей неактивности (недавно открытый — последним); фулскрин тоже закроется и режим выключится. Подписки на стакан снимаются сразу."
general.seconds: "сек"
general.log_to_file: "Писать лог в файлы"
general.log_to_file_hint: "Лог приложения и ядер пишется в logs/<дата>_<источник>.log (по файлу на источник в день)."
general.log_retention: "Хранить лог"
general.log_retention_hint: "Файлы старше указанного срока удаляются при запуске и раз в сутки. 0 — хранить всё."
