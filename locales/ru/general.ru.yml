general.valuation.label: "Пересчёт в USDT"
general.valuation.hint: "Для Отчёта и Аналитики."
general.valuation.more: "«На момент сделки» — сумма не меняется со временем, курс той минуты, когда сделка закрылась. «Текущий» — все суммы пересчитываются по сегодняшнему курсу.\n\nМеняйте это только осознанно: «Текущий курс» берёт последний известный курс со спота Binance/Bybit, а не с биржи, где шла торговля, обновляет его раз в несколько минут и нигде не сохраняет. Он же меняет подбор порогов в тюнере: пороги подбираются по переоценённой истории. Применяется после сохранения."
general.tab_per_core.hint: "Иначе ядра группы делят одну вкладку."
general.book_pan.label: "Двигать график в зоне стакана"
general.book_pan.hint: "Протяжка мышью над стаканом сдвигает график."
general.book_pan.more: "Выключите, если в зоне стакана вы чаще кликаете по ценам: тогда протяжка над стаканом ничего не двигает, а клики по ценам работают как обычно."
general.live_scope.label: "Live и Пауза"
general.live_scope.hint: "Как сдвиг одного графика влияет на остальные."
general.live_scope.more: "«Все графики сразу»: сдвинули один график в историю — на Паузу встают все, и кнопка Live в панели показывает это. «Каждый график отдельно»: сдвиг касается только этого графика, он сам вернётся в Live, если подвести его к правому краю или не трогать 3 минуты. Пауза в панели останавливает все графики, Live возвращает их все к текущему моменту."
