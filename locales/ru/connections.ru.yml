conn.preset.auto: "AUTO"
conn.total.auto: "Авто (по счёту)"
conn.total.exclude: "Не учитывать"
conn.total.separate: "Отдельно"
conn.tip.group: "Группа = ОТДЕЛЬНОЕ главное окно. Все ядра с одинаковым именем группы живут в одном окне; новое имя группы → новое главное окно."
conn.tip.bundle: "Имя чарт-связки: детекты AddToChart с НЕСКОЛЬКИХ ядер одной группы с одинаковым именем сводятся в ОДИН чарт (одну вкладку, имя — в её заголовке). Пусто = по глобальной настройке (своя вкладка на ядро / все в одной)."
