conn.col.endpoint: "Адрес:порт"
conn.tip.endpoint: "Адрес и порт, по которым терминал подключается к ядру. Пусто — берутся из ключа (показаны серым). Впишите свои, если ядро в вашей локальной сети, в ключе адрес неверный или его нет, или провайдер сменил IP: адрес, адрес:порт, :порт или имя хоста. Новый ключ это поле не затирает; крестик возвращает адрес из ключа. Значок облака рядом с заполненным полем решает, получит ли этот адрес и станция."
conn.endpoint_duplicate: "Этот адрес и порт уже есть у ядра %{name}"
conn.address_ph: "из ключа"
conn.endpoint_hint: "Пусто — адрес из ключа. Можно вписать адрес, адрес:порт, :порт или имя хоста; новый ключ это поле не затирает."
conn.endpoint_invalid: "Это не адрес. Подходит: 192.168.1.5, 192.168.1.5:5017, :5017, [2001:db8::1]:5017 или имя хоста. Пока поле красное, ядро не подключается."
conn.endpoint_no_address: "В ключе нет адреса — терминал подключается к 127.0.0.1, то есть к этому компьютеру. Если ядро на другой машине, впишите её адрес сюда или перевыпустите ключ в MoonBot: включите Kernel (VPS) и нажмите Apply (или впишите IP сервера в поле IP), затем Copy Key."
conn.endpoint_to_station_on: "Станция тоже подключается к ядру по этому адресу. Нажмите, чтобы станция снова брала адрес из ключа."
conn.endpoint_to_station_off: "Станция подключается к ядру по адресу из ключа. Нажмите, чтобы передать ей этот адрес — если до него можно достучаться с сервера станции (до локального адреса вашей сети нельзя). Дойдёт до станции, когда отправите ей ядра."
