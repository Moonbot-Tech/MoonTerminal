# Tooltips.
conn.tip.act: "Подключаться к ядру"
conn.tip.name: "Имя ядра (произвольное, для отображения в терминале)"
conn.tip.key: "Ключ создаётся в MoonBot, не на сайте, и копируется ПОСЛЕ настройки ядра — он несёт адрес, порт и режим с собой; адрес и порт при нужде меняются в колонке «Адрес:порт». Порядок: 1) на сервере с MoonBot открыть UDP-порт ядра для входящих; 2) в MoonBot: зелёный кружок слева внизу (окно Info) → Moon Kernel → Settings → окно Moon Proto, вкладка Settings: включить Kernel (VPS), задать Port, выбрать версию V0/V1/V2 (по умолчанию V0), нажать Apply; 3) там же Key: → Copy Key (ключа нет — New Key); 4) вставить сюда кнопкой «Вставить» и нажать «Сохранить». Глаз — показать/скрыть."
conn.key_ph: "Copy Key в MoonBot"
conn.key_unreadable: "Это не ключ MoonBot — терминал не может его прочитать. Скопируйте ключ в MoonBot кнопкой Copy Key (окно Moon Proto → Settings → Key:) и вставьте сюда целиком кнопкой «Вставить»"
# Placeholder of the "Charts" cell. The field holds a bundle NAME, not a count (see
# `conn.tip.bundle` and `ServerConfig::chart_bundle`), so the placeholder has to say "name".
conn.bundle_ph: "имя связки"
conn.paste_key_tip: "Вставить ключ из буфера обмена"
conn.tip.color: "Цвет ядра: им подсвечиваются его сделки и метки на графике."
conn.tip.flags: "Приём данных от ядра. Серая = принимаем всё; цветная = часть категорий выключена. Клик — настроить."
conn.tip.proto: "Режим транспорта MoonProto — та же тройка V0/V1/V2, что в настройках ядра «Moon Proto»; обе стороны должны стоять на ОДНОМ. Берётся из ключа ОДИН раз — пока режима ещё нет; дальше только отсюда, и новый ключ его уже не перебьёт — так что перевыпускать ключ ради смены режима не нужно. Прочерк = ключ ничего не сообщил (старый экспорт), соединение идёт как V0. Применяется по «Сохранить»: ядро переподключится само. Поэтому Copy Key нажимайте уже ПОСЛЕ того, как на ядре выставлены Port и версия переключателями V0/V1/V2 (MoonBot по умолчанию создаёт ключ V0): ключ несёт их с собой."
conn.tip.preset: "В каком режиме рабочего пространства ядро видно в списках: везде, только в MANUAL или только в AUTO. Это только отображение — скрытое ядро всё равно подключается и записывает данные."
conn.tip.total: "Как ядро входит в итог внизу Активов. Авто: ядра на одном биржевом счёте считаются один раз. Не учитывать: ядро не входит в итог. Отдельно: ядро всегда считается само по себе, без склейки."
conn.preset.both: "Оба"
