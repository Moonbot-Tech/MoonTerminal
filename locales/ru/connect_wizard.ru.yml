# --- The move branch ---
connect_wizard.move.pick_title: "Какое ядро переносим"
connect_wizard.move.pick_sub: "Ключи, стратегии и история сделок переедут на новый сервер. Ключ подключения не меняется — терминал и станция переключатся на новый адрес сами."
connect_wizard.move.all_title: "Переедет всё"
connect_wizard.move.all_settings: "Биржа, ключи и настройки"
connect_wizard.move.all_settings_desc: "Снимок настроек снимается с работающего ядра. Нужна версия ядра 7.72 L2 или новее."
connect_wizard.move.all_strategies: "Стратегии"
connect_wizard.move.all_strategies_desc: "С теми же номерами и папками. Включённые останутся включёнными."
connect_wizard.move.all_history: "История сделок"
connect_wizard.move.all_history_desc: "Из копии отчёта в терминале. Отчёт и аналитика продолжат с того же места, без перезагрузки."
connect_wizard.move.all_stop: "Старое ядро остановим до запуска нового"
connect_wizard.move.all_stop_desc: "Два ядра на одном ключе мешают друг другу, поэтому одновременно они не работают."
connect_wizard.move.pause: "На время переноса (обычно 2–5 минут) ядро не торгует. Открытые позиции остаются на бирже. Пока у старого ядра есть незакрытые сделки, оно не остановится — мастер подождёт."
connect_wizard.move.old_kept: "Старое ядро не удаляется: только останавливается, его папка и файлы остаются на месте."
connect_wizard.move.next: "Далее: сервер"
connect_wizard.move.server_sub: "Сервер, куда переедет ядро. Данные для входа терминал держит только в памяти на время переноса."
connect_wizard.move.egress: "Исходящий IP"
connect_wizard.move.egress_note: "Необязательно. Пусто — ядро ходит на биржу с основного адреса сервера. Другой адрес уже должен быть настроен на сервере: купленный адрес обычно появляется после перезапуска сервера из панели провайдера."
connect_wizard.move.need_egress: "Исходящий IP — это адрес IPv4, например 203.0.113.12, или пустое поле."
connect_wizard.move.secrets: "Снимок настроек содержит ключи API биржи — после подтверждения он уйдёт на этот сервер."
connect_wizard.move.order: "Новое ядро ставится, но не запускается. Затем старое просят остановиться, и новое запускается только после того, как старое встало. После этого терминал и станция переключаются сами."
connect_wizard.move.start: "Перенести"
connect_wizard.move.running_title: "Переносим ядро"
connect_wizard.move.running_sub: "Обычно 2–5 минут. Окно можно закрыть — перенос продолжится, а итог будет здесь, когда откроете мастер снова."
connect_wizard.move.refused_title: "Ждём, пока старое ядро остановится"
connect_wizard.move.refused_sub: "Новое ядро уже установлено и ждёт. Запустим его, только когда старое остановится, — два ядра на одном ключе мешают друг другу."
connect_wizard.move.retry_help: "Проверить сейчас — если вы уже закрыли сделки вручную."
connect_wizard.move.wait_help: "Ждать в фоне — перенос продолжится сам, как только сделки закроются. Окно можно закрыть."
connect_wizard.move.cancel_help: "Отменить перенос — новое ядро удалим с сервера, старое продолжит работать как было."
connect_wizard.move.wait: "Ждать в фоне"
