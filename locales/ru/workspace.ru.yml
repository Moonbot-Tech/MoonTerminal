# Auto-trading workspace selector, navigation rail, and availability labels.
_version: 1

# The two workspace modes. AUTO and MANUAL are NAMES, not words: they stay Latin capitals in every
# locale, like BUY/SELL/ON/OFF above in README's "намеренно НЕ переводим" list, so the mode a user
# names in a screenshot or a chat is the same string everywhere.
#
# Two key shapes per mode, deliberately. The SHORT name is what an aggregate's scope marker
# interpolates ("режим: MANUAL"), where the word "режим" is already the sentence. The `_item` label
# is what the header dropdown lists, where the row must say what KIND of thing it selects.
workspace.mode.auto: "AUTO"
workspace.mode.classic: "MANUAL"
workspace.mode.auto_item: "AUTO режим"
workspace.mode.classic_item: "MANUAL режим"
workspace.mode.classic_tip: "Ручной режим: раскладка своя у каждого сервера и редактируется, окна можно откреплять"
workspace.mode.auto_tip: "Рабочее пространство для автоторговли; раскладка общая для всех серверов, открепление окон выключено"
workspace.summary: "Ядер: %{configured} · готово: %{ready} · проблем: %{problem}"
# The three segments of the rail summary, rendered separately so the problem count can carry its
# own colour. `workspace.summary` above stays byte-identical and remains the tooltip / tour string.
workspace.summary_cores: "Ядер: %{n}"
workspace.summary_ready: "готово: %{n}"
workspace.summary_problem: "проблем: %{n}"
# The rail's first row is a MODE, not a core: it aggregates every core at once, while every row
# below it selects exactly one. The label says "full" so the two readings cannot be confused.
workspace.overview: "Полная сводка"
workspace.overview_tip: "Все доступные ядра группы %{group}"
workspace.core_tip: "%{name} · группа %{group} · %{status}"
workspace.status.disabled: "Отключено"
workspace.status.unavailable: "Недоступно"
workspace.status.problem: "Проблема"
workspace.status.ready: "Готово"
# The scope marker every membership-filtered aggregate renders when the active preset hides at
# least one configured core (`workspace::scope_marker::ScopeMarker`). Two facts, deliberately, so
# the count survives when the preset name clips: "режим: AUTO · 12 из 20 ядер".
workspace.scope.preset: "режим: %{mode}"
workspace.scope.cores_n_of_m: "%{n} из %{total} ядер"
workspace.scope.hint: "Часть ядер скрыта активным режимом рабочего пространства — переключите режим или проверьте видимость в Настройках → Подключения"
# The same recovery advice for the case where the preset hid EVERY core, so the opening clause
# cannot say "some". Only the first clause differs from `workspace.scope.hint`; the two are one
# choice inside `ScopeMarker::tooltip`, gated on `hides_everything`.
workspace.scope.all_hidden_hint: "Все ядра скрыты активным режимом рабочего пространства — переключите режим или проверьте видимость в Настройках → Подключения"
# The empty state of a surface the preset emptied COMPLETELY, shared by every such surface
# (`workspace::scope_marker::scope_empty_text`). Deliberately not per-surface and deliberately not
# the surface's own "no orders" / "no data" / "connect a core" line: those assert that nothing
# exists, and would send the user to fix a connection that is already fine. This one asserts that
# the data exists and names what is withholding it, and it is read alongside the marker's own
# "· 0 из 56 ядер" fact in the footer directly below.
workspace.scope.all_hidden: "Все ядра скрыты активным режимом рабочего пространства"
# The tooltip a pinned scope chip shows in place of the picker menu it replaces — the picker is
# disabled by the active workspace, and this is the only place that says why (`panels::common`).
workspace.scope.pinned_hint: "Область задана рабочим пространством: %{scope}. Сменить её можно в панели слева"
# The rail's ⚙ popup: which core-run controls the rows carry. The checkbox labels reuse
# `profit_monitor.settings.*` — the same controls, the same wording; only the popup title and the
# exchange-scope row are the rail's own.
workspace.settings.title: "Настройки списка ядер"
# One press there reaches every core under the heading, which is why it is its own opt-out.
workspace.settings.exchange_controls: "Эти кнопки — и у биржи, на все её ядра"
