trade_window.strategy.core_offline: "ядро не подключено"
# Строка версии: штамп — тот же, каким панель «Версии» подписывает свои строки, чтобы юзер нашёл
# её глазами; «действует» — то же слово, что стоит там у текущей версии.
trade_window.strategy.version: "версия %{stamp}"
trade_window.strategy.version_current: "версия: действует"
trade_window.strategy.version_unknown: "версия неизвестна"
trade_window.strategy.version_tip: "Версия стратегии, действовавшая на момент входа — по данным терминала: дата отмечает, когда терминал увидел настройки, а не когда ядро их применило. Клик открывает эту версию в панели «Версии»."
trade_window.strategy.version_unknown_tip: "Сделка старше первой сохранённой версии: терминал ещё не наблюдал это ядро"

trade_window.figure.unknown: "нет данных"

