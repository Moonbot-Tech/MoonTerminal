# --- Problems mode: the three diagnostic actions ---
# The reset and the re-read mirror MoonBot's own Problems window; the test is ours.
#
# A test publishes a `test` fact through the core's own detector worker (~2 s) and PROVES the
# channel end to end. It leaves a row behind that only the reset removes, which is why that pair
# ships together.
core_status.problems_test: "Проверить канал"
# Deliberately NOT MoonBot's "reset all", though it is the same command on the wire. MoonBot's
# window belongs to one core, so "all" there means all of that core's findings; this panel spans a
# fleet, where the same word reads as "all cores" and would be a lie the moment the operator has
# picked one. The button acts on the panel's scope, and the tooltip and the confirm both say how
# many cores that is.
core_status.problems_clear: "Сбросить"
core_status.problems_test_tip: "Публикует тестовый факт через собственный детектор ядра — примерно две секунды. Доказывает весь путь: детектор, провод, проекция, панель."
core_status.problems_refresh: "Обновить"
# Said out loud because the label promises a round trip the protocol cannot make: a core pushes its
# list, nothing can ask for one. Saying so here is cheaper than an operator concluding the button is
# broken when a stale row does not move.
core_status.problems_refresh_tip: "Перечитывает то, что успели прислать ядра на связи (%{cores}). Щёлкни строку, чтобы перечитать только её ядро. Запросить свежий список нельзя: в протоколе такой команды нет — ядро присылает его само, при подключении и когда его детекторы список меняют. Помогает после рестарта ядра, когда старые строки уже не про него."
# The blast radius, stated BEFORE the dialog: an operator who picked no core is acting on the whole
# scope, and that is the difference between a tidy-up and a fleet-wide loss.
# The one-core forms, for when a clicked finding has narrowed the action. The scope-wide wording
# would state a falsehood about the panel ("connected cores: 1" for a scope of twenty-six) and would
# keep advising a click that, in this state, cancels the pick instead of making one.
core_status.problems_clear_tip_one: "Сбросит диагностики выбранного ядра — необратимо и для всех терминалов. Щёлкни его строку ещё раз, чтобы вернуться ко всей области"
core_status.problems_refresh_tip_one: "Перечитывает то, что успело прислать выбранное ядро. Запросить свежий список нельзя: в протоколе такой команды нет. Щёлкни его строку ещё раз, чтобы вернуться ко всей области"
core_status.problems_clear_tip: "Сбросит диагностики. Ядер на связи: %{cores}. Необратимо и для всех терминалов. Щёлкни строку, чтобы сбросить только её ядро"
# The test is per-core on the wire and has no fleet-wide form worth having: publishing a test fact
# on two hundred cores litters two hundred cores. So it alone needs one core named.
core_status.problems_pick_core: "Тест шлётся на одно ядро: щёлкни строку его проблемы в таблице — или сузь область панели до одного ядра"
core_status.problems_picked_offline: "Выбранное ядро не на связи — команда дождалась бы его возвращения"
core_status.problems_no_online: "В области панели нет ядер на связи"
# Guards the TEST alone. The command channel outlives the connection, so a queued test would fire on
# the next reconnect and publish its fact at some unannounced later moment, on a core the operator
# stopped looking at hours ago.
core_status.problems_core_offline: "Ядро не на связи — тест дождался бы переподключения и опубликовал бы факт неизвестно когда"
core_status.problems_test_title: "Отправить тестовую диагностику?"
# The consequence is the whole reason this action is confirmed at all.
core_status.problems_test_q: "Ядро %{core} опубликует тестовый факт через свой обычный детектор — примерно две секунды. Строка останется на ядре, и убрать её можно ТОЛЬКО сбросом, который заодно снесёт настоящие находки этого ядра."
core_status.problems_test_sent: "Тест отправлен на %{core} — строка появится через пару секунд"
core_status.problems_clear_sent: "Сброс отправлен на %{core} — строки уйдут, когда ядро пришлёт новый список"
core_status.problems_clear_sent_many: "Сброс отправлен на %{cores} ядер — строки уйдут, когда ядра пришлют новые списки"
# Says what it re-read, not "done": the honest outcome of a re-read that found nothing new is an
# unchanged table, and a message claiming more would make that look like a failure.
core_status.problems_refreshed: "Перечитано ядер: %{cores}"
# The shortfall, never a bare success: a fleet action that reached nine of twelve cores has failed
# on three, and only the toast can say so.
core_status.problems_fleet_none: "Не отправлено ни на одно из %{cores} ядер — не на связи или канал команд закрыт"
core_status.problems_fleet_partial: "Дошло до %{sent} из %{cores} ядер — остальные не на связи или их канал закрыт"
core_status.problems_not_sent: "Не отправлено: канал команд ядра закрыт"
core_status.problems_not_sent_offline: "Не отправлено: ядро не на связи"
core_status.problems_clear_title: "Сбросить диагностики ядра?"
# Blunt on purpose: the protocol's own warning is that cleared real diagnostics cannot be restored.
core_status.problems_clear_q: "Ядро %{core} сбросит все подтверждённые проблемы и неподтверждённые гипотезы — для всех терминалов, без возможности вернуть. Причину это не лечит: если она осталась, ядро подтвердит проблему заново."
core_status.problems_clear_title_many: "Сбросить диагностики на нескольких ядрах?"
# The core NAMES, not just how many: a count is nothing an operator can check, and this dialog is
# the last place the mistake is still cheap.
core_status.problems_clear_q_many: "Каждое из этих %{cores} ядер сбросит все подтверждённые проблемы и неподтверждённые гипотезы — для всех терминалов, без возможности вернуть. Причины это не лечит: если они остались, ядра подтвердят проблемы заново."
