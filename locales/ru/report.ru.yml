report.filter.strategy_mask_tip: "Фильтр отчёта по названию стратегии."
report.filter.core: "Ядро:"
report.filter.side: "Сторона:"
report.filter.from: "С:"
report.filter.to: "По:"
# Doubles as the field's caption: there is no label beside it, so the placeholder names it.
report.filter.coin_ph: "Монета"
# Hover text of the coin field; a `=` beside the field marks the exact mode it describes.
report.filter.coin_tip: "Часть тикера находит все монеты с ним (io: IO, BIO, IOTA). Пробел в конце или выбор из списка ищет точный тикер (io : только IO и его контракты вроде IO_0925), рядом появляется «=»."
report.filter.date_ph: "Дата и время"
# Deleted row of the merged scope field. Off (default) hides trades soft-deleted in the core's
# report; on shows ONLY them. Export follows the same filter.
report.filter.deleted: "Только удалённые"
# Lifecycle row of the merged scope field, an axis independent of the real/emulator group above:
# that one is a trade's ORIGIN, this one is whether it has closed. On (default) shows still-running
# positions alongside closed trades, in the table AND in the totals; off removes them from both,
# and the export follows the same filter. Disabled on an Analytics-scoped Report, which forces
# closed rows regardless. Wording matches `report.open_positions_tip` so the switch and the footer
# figure it governs use one vocabulary.
report.filter.open_rows: "Открытые позиции"
# Full-width comment pane between the table and the totals: `show` is its row in the scope field.
# The pane reuses `show` as its caption; with no row selected the strip is simply empty.
report.comment.show: "Комментарий сделки"
# Shown when a trade IS selected and its comment is empty. With no trade selected the pane stays
# blank instead — the two states must not read alike.
report.comment.empty: "без комментария"
# Tooltip of the merged scope field. It states the two switch semantics the row labels alone
# cannot: the deleted one is EXCLUSIVE (on shows only those), the open-positions one is INCLUSIVE
# (off removes them from the table and the totals alike).
report.filter.scope_tip: "Сторона, тип сделок, удалённые, открытые позиции и показ комментария. «Только удалённые» выкл — удалённые скрыты, вкл — показаны только они. «Открытые позиции» выкл — в таблице и в итогах только закрытые сделки."
# Abbreviation appended to the scope trigger while the row above is on.
report.filter.deleted_short: "удал."
# Fixed title of the scope trigger; the non-default choices follow it after a middle dot.
report.filter.title: "Фильтры"
# Difference appended to the scope trigger while "Open positions" is off.
report.filter.closed_only_short: "закр."
# First row of the scope field's direction group. Named "all sides" rather than a bare "all" so it
# does not read as the same option as the kind group's own first row.
report.filter.all_sides: "Все стороны"
# Error toast when a soft-delete/restore could not be sent (the core is offline or gone). The
