analytics.tuner.compose_run: "Подобрать состав"
analytics.tuner.compose_help: "Сравнивает три равноправных пути: отдельный состав, совместный поиск по всем разрешённым полям и отсутствие дополнительных фильтров. До %{seeds} независимых seed проверяют каждый временной срез; решает большинство seed внутри среза, затем большинство срезов. Beam держит 8 ветвей при ясной границе и расширяется до 16 при спорной. Решает прибавка: прибыль среза минус то, что дало бы то же число сделок без фильтров, поэтому вариант без фильтров не выигрывает просто потому, что собирает все сделки; прибавка считается только при достаточном числе оставленных сделок. При близкой прибавке учитываются PF, меньшая просадка и абсолютная прибыль. Если отложенные срезы ничего не разделили, итог так и напишет. Галочки остаются границей поиска. Нужна выбранная стратегия."
