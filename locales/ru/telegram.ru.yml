telegram.server.section: "Станция на сервере Linux"
telegram.server.intro: "Бот, Mini App и отчёты работают на вашем Linux-сервере круглосуточно, даже когда терминал выключен. Терминал сам настраивает сервер по SSH: закрывает вход по паролю, ставит службу, передаёт ей ключи всех включённых ядер и переносит бота."
telegram.server.host: "IP сервера"
telegram.server.login: "Логин"
telegram.server.by_key: "Вход по SSH-ключу"
telegram.server.key_path: "Файл ключа"
telegram.server.key_browse: "Обзор…"
telegram.server.passphrase: "Пароль ключа"
telegram.server.key_hint: "Путь к приватному ключу ed25519, ECDSA или RSA (OpenSSH, PuTTY .ppk, PKCS#8 или RSA PEM / PKCS#1). Пароль ключа — только если ключ зашифрован."
telegram.server.sudo_password: "Пароль sudo"
telegram.server.password: "Пароль"
telegram.server.first_login_hint: "Доступ от провайдера (IP, логин, пароль root или ключ) нужен один раз и нигде не сохраняется. После установки вход по паролю закрыт, терминал входит своим ключом."
telegram.server.old_admin: "Старый пароль moon"
telegram.server.release_hint: "Служба ставится из последнего релиза MoonTerminal на GitHub под архитектуру сервера (проверка SHA-256)."
telegram.server.transfer_hint: "Бот терминала переносится на сервер: токен, чаты и доступы. Когда бот на сервере заработает, терминал удалит токен у себя; для локального бота понадобится другой токен. Если перенос не удастся, бот останется в терминале."
telegram.server.mini_app: "Mini App на сервере"
telegram.server.mini_app_hint: "Вход в Mini App идёт через туннель Cloudflare: где Cloudflare заблокирован, Mini App не откроется — тогда выключите. Переключение перезапускает станцию."
