# Telegram bot menu: configurable reply-keyboard items and the inline section screens.
# Button keys are `telegram.button_{item id}` — the ids are stable, never rename them.
# `telegram.button_miniapp` names no item any more: it is the text of the keyboard's former Mini App
# button, still matched when a chat presses one installed before it was removed. Keep it.
_version: 1

