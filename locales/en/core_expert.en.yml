# Expert core-settings window: Moonbot's own Settings dialog reproduced over the wire.
# Tab labels deliberately repeat Moonbot's own wording, so a trader reads the same strip here —
# including `tab_hotkeys`, which Moonbot itself writes in Latin script in every language.
# The two pages the compact gear popup also draws (Основные, Автостарт), and the OK/Cancel pair,
# are NOT repeated here: the window reads `core_settings.*` for those, so one Moonbot page cannot
# end up named differently by the two faces of the same gear.
# rust-i18n `_version: 1` format: one language per file, flat dotted keys. Interpolation: %{var}.
_version: 1

core_expert.window_title: "Core settings — expert mode"
core_expert.tab_login: "Login"
core_expert.tab_telegram: "Telegram"
core_expert.tab_autobuy: "AutoBuy"
core_expert.tab_special: "Special"
core_expert.tab_interface: "Interface"
core_expert.tab_hotkeys: "Hotkeys"
core_expert.no_core: "Pick a core in the list on the left. Ctrl+click adds a core to the selection, Shift+click selects a range — OK writes the changed parameters to every selected core."
core_expert.waiting: "Waiting for the core's settings — the core sends them in the background after connecting."
core_expert.replaced: "A different Moonbot process now answers on this connection. The previous page was dropped rather than written into the new process; the staged changes are kept and will be laid over the new page when it arrives."
core_expert.stale: "The link to the core is not ready: this page is a retained snapshot and will not be sent until the core answers again."
core_expert.write_refused: "Sent to %{sent} of %{total} cores: the rest have no page or refused it. The window stays open with the changes staged — narrow the selection or retry."

# --- Core list down the left; a parameter the selected cores disagree on is marked in place. ---
core_expert.cores_title: "Cores"
core_expert.cores_selected: "selected: %{n}"
core_expert.cores_none: "No cores: the terminal is connected to none."
core_expert.core_no_page: "no page"
# --- Banner: a write the session queue gave up on. ---
core_expert.write_gave_up: "The core never confirmed the last write: none of the retries was answered. The values on this page may not be what the core holds."
# --- Footer: what Apply and OK will do, said before the click. ---
core_expert.plan_nothing: "No changes"
core_expert.plan: "Parameters to change: %{params} · cores: %{cores}"
core_expert.plan_skipped: "without a page: %{n} — will be skipped"
# --- Page body: a page not projected, or not drawn yet. ---
core_expert.page_todo: "This page is not ported yet. The frame is in place: tabs, expert mode and the send on OK."
core_expert.page_absent: "These settings never cross the wire: API keys, the password and the licence are outside the safe subset. This page's controls are blocked; OK still sends the rest of the core's settings page."

