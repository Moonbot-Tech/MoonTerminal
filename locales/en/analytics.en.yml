analytics.tuner.compose_run: "Compose set"
analytics.tuner.compose_help: "Compares three equal paths: a distinct field set, joint search across every admitted field, and no additional filters. Up to %{seeds} independent seeds check each time fold; seeds vote inside the fold, then folds vote. The beam keeps 8 branches at a clear boundary and expands to 16 when it is ambiguous. The decisive figure is LIFT: held-out profit minus what the same number of unfiltered trades would have earned, so no-filters cannot win merely by keeping every trade; lift counts only above a retained-trade floor. Close results also use PF, lower drawdown, and absolute profit. When the reserved folds separate nothing, the result says so. The checkboxes remain the search boundary. A strategy must be selected."
