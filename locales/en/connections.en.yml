conn.col.endpoint: "Address:port"
conn.tip.endpoint: "The address and port the terminal connects to the core on. Empty — taken from the key (shown in grey). Type your own when the core is on your local network, the key's address is wrong or missing, or your ISP changed the IP: address, address:port, :port or a host name. A new key does not overwrite this field; the cross returns to the key's address. The cloud glyph beside a filled field decides whether the station gets this address too."
conn.endpoint_duplicate: "This address and port are already used by core %{name}"
conn.address_ph: "from the key"
conn.endpoint_hint: "Empty — the key's address. You can type an address, address:port, :port or a host name; a new key does not overwrite this field."
conn.endpoint_invalid: "This is not an address. Accepted: 192.168.1.5, 192.168.1.5:5017, :5017, [2001:db8::1]:5017 or a host name. While the field is red the core does not connect."
conn.endpoint_no_address: "The key carries no address — the terminal connects to 127.0.0.1, this computer. If the core runs on another machine, type its address here or re-export the key in MoonBot: tick Kernel (VPS) and press Apply (or type the server's IP into the IP field), then Copy Key."
conn.endpoint_to_station_on: "The station connects to the core on this address too. Click to have the station take the key's address again."
conn.endpoint_to_station_off: "The station connects to the core on the key's address. Click to give it this address as well — if the station's server can reach it (an address of your local network cannot). It reaches the station when you send it the cores."
