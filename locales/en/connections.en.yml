# Tooltips.
conn.tip.act: "Connect to the core"
conn.tip.name: "Core name (arbitrary, for display in the terminal)"
conn.tip.key: "The key is made in MoonBot, not on the website, and is copied AFTER the core is set up — it carries host, port and mode with it; the address and port can be changed in the Address:port column when needed. Order: 1) on the MoonBot server, open the core's UDP port for inbound traffic; 2) in MoonBot: the green dot at the bottom left (the Info window) → Moon Kernel → Settings → the Moon Proto window, Settings tab: tick Kernel (VPS), set Port, choose V0/V1/V2 (default V0), press Apply; 3) there, Key: → Copy Key (no key yet — New Key); 4) paste it here with the Paste button and press Save. The eye shows/hides it."
conn.key_ph: "Copy Key in MoonBot"
conn.key_unreadable: "This is not a MoonBot key — the terminal cannot read it. Copy the key in MoonBot with Copy Key (Moon Proto window → Settings → Key:) and paste the whole of it here with the Paste button"
# Placeholder of the "Charts" cell. The field holds a bundle NAME, not a count (see
# `conn.tip.bundle` and `ServerConfig::chart_bundle`), so the placeholder has to say "name".
conn.bundle_ph: "bundle name"
conn.paste_key_tip: "Paste the key from the clipboard"
conn.tip.color: "Core color: it tints this core's trades and chart marks."
conn.tip.flags: "Data received from the core. Gray = all on; colored = some categories off. Click to configure."
conn.tip.proto: "MoonProto transport mode - the same V0/V1/V2 trio as in the core's Moon Proto settings; both sides must be on the SAME one. Taken from the key ONCE, while no mode is set yet; after that it is yours, and a new key no longer overrides it - so no key has to be reissued just to change the mode. A dash means the key named nothing (an older export) and the connection runs as V0. Applied on Save: the core reconnects by itself. So press Copy Key only AFTER Port and the version are set on the core with the V0/V1/V2 radio buttons (MoonBot creates V0 keys by default): the key carries them with it."
conn.tip.preset: "Which workspace mode shows this core in every list: both, MANUAL only, or AUTO only. Display only — a hidden core still connects and still records."
conn.tip.total: "How this core counts toward the Assets footer total. Auto: cores on the same exchange account count once. Exclude: the core is left out of the total. Separate: the core always counts on its own, never merged."
conn.preset.both: "Both"
# The same two mode NAMES the header dropdown lists (`workspace.mode.*`): this column picks which
# of them shows the core, so a name that drifted apart here would read as a third mode.
conn.preset.classic: "MANUAL"
conn.preset.auto: "AUTO"
conn.total.auto: "Auto (by account)"
conn.total.exclude: "Exclude"
conn.total.separate: "Separate"
conn.tip.group: "Group = a SEPARATE main window. All cores with the same group name live in one window; a new group name → a new main window."
conn.tip.bundle: "Chart bundle name: AddToChart detects from SEVERAL cores of one group sharing the same name merge into ONE chart (one tab, the name in its title). Empty = per the global setting (a tab per core / all in one)."
conn.tip.orders: "Open orders"
