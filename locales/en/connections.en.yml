conn.market_percore: "Separate — each chart its own core"
conn.core_sort: "Core order"
conn.core_sort_tip: "The order cores appear in across EVERY list in the app: header, Orders, Assets, Report, Analytics, Screener, Strategies, Log. Disconnected cores keep their place — their state shows in the status dot."
