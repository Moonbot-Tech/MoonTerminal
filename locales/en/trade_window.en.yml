trade_window.figure.quantity: "Quantity"

trade_window.figure.profit: "Profit"

trade_window.figure.profit_pct: "Profit, %"

trade_window.figure.opened: "Opened"

trade_window.figure.closed: "Closed"

trade_window.figure.held: "Held"

# Блок стратегии в начале рейла — только у сделок, у которых стратегия есть (#561).
trade_window.figure.strategy: "Strategy"
# Метки состояния под именем: стратегии на ядре больше нет, но её история сохранена локально /
# нет нигде / ядро, которому она принадлежит, сейчас не подключено.
trade_window.strategy.in_deleted: "in deleted"
trade_window.strategy.deleted: "deleted"
trade_window.strategy.core_offline: "core not connected"
# Строка версии: штамп — тот же, каким панель «Версии» подписывает свои строки, чтобы юзер нашёл
# её глазами; «действует» — то же слово, что стоит там у текущей версии.
trade_window.strategy.version: "version %{stamp}"
trade_window.strategy.version_current: "version: in effect"
trade_window.strategy.version_unknown: "version unknown"
trade_window.strategy.version_tip: "The strategy version in effect at entry — by the terminal's record: the stamp is when the terminal saw the settings, not when the core applied them. Click opens that version in the Versions pane."
trade_window.strategy.version_unknown_tip: "The trade predates the first saved version: the terminal was not observing this core yet"

trade_window.figure.unknown: "unknown"

# LONG / SHORT — отраслевой стандарт, не переводится (см. README), но живёт в словаре,
# чтобы обе подписи правились в одном месте.
trade_window.side.long: "LONG"

trade_window.side.short: "SHORT"

# Блок «Ордера» в рельсе: архивные трассы ордеров этой сделки из ядра (#569). Пустой ответ ядра —
