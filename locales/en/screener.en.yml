# Screener window with a Moonbot-style coin table.
# Column headers (Vol./ASK/Funding/…) are Moonbot domain tokens and remain untranslated in code.
_version: 1

screener.core_group_one: "%{n} core"
screener.core_group_few: "%{n} cores"
screener.core_group_many: "%{n} cores"
screener.core_group_more_one: "+%{n} more"
screener.core_group_more_few: "+%{n} more"
screener.core_group_more_many: "+%{n} more"
screener.footer_cores_one: "%{n} core"
screener.footer_cores_few: "%{n} cores"
screener.footer_cores_many: "%{n} cores"
screener.empty_query_and_vol: "No coins match “%{query}” (Vol. from %{vol})"
screener.empty_vol_filter: "No coins with Vol. from %{vol} — clear the filter"

screener.window_title: "MoonTerminal — Screener"
# Three different reasons the coin table can be empty, three different sentences. `screener.empty`
# is the only one that asks for an action, so it is reserved for the only case where that action
# helps: no core is connected at all. A connected core that has not published a book yet gets
# `screener.empty_no_data`, and a core hidden by the workspace preset gets the shared
# `workspace.scope.all_hidden` instead of either.
screener.empty: "No market data — connect a core"
screener.empty_no_data: "No market data received yet"
# A fourth: rows WERE published and the bottom bar's controls — the Type and Listed lists, a text
# or volume filter — left none of them.
screener.empty_filtered: "No rows match the current filters"
# A fifth: the Listed list emptied the table while its answers are still on their way — the
# cores connected under a minute ago. `%{n}` is the whole seconds left; `Listed` is the column's
# title and stays as it is.
screener.listed_collecting: "Listed is still being collected: %{n} s left"
screener.coins: "coins"
screener.all_cores: "All cores"
screener.cores_n: "Cores: %{n}"
screener.columns: "Columns"
# The cross-listing column and the list that filters it. The three values are Moonbot's own words for its
# `ListedType` strategy filter and stay English in the filter menu.
screener.listed_both: "Both"
screener.listed_spot_only: "Spot Only"
screener.listed_futures_only: "Futures Only"

# Short localized captions for Type and Listed cells.
screener.kind_short_spot: "Spot"
screener.kind_short_futures: "Fut"
screener.kind_short_quarterly: "Quart"
screener.listed_short_both: "Both"
screener.listed_short_spot_only: "Spot"
screener.listed_short_futures_only: "Fut"
screener.default_view: "Default view"
# The auto-figures column (docs-internal/AUTO_FIGURES.md 13.4): its filter list and approach box,
# the Calculate button with its progress (`%{done}` of `%{total}` markets) and tooltips, the words a
# cell shows, and what an empty table says while the filter has nothing to go by. The column's own
# name is `auto_figures.title`, the event names are `auto_figures.event.*`.
screener.af_approach: "Approach ≤"
screener.af_calculate: "Calculate"
screener.af_progress: "Calculating %{done} / %{total}"
screener.af_calculate_tip: "Find auto figures on every Screener market from the local 5-minute candle cache, with the rows of the Main set"
screener.af_restart_tip: "Calculating — press to start over"
screener.af_no_rows_tip: "The Main auto-figure set has no enabled rows"
screener.af_nothing: "nothing"
screener.af_short: "short history"
screener.af_no_cache: "no cache"
screener.af_unread: "cache not read"
screener.af_stale: "cache behind %{age}"
screener.af_press_calculate: "Press Calculate to pick coins by auto figures"
screener.af_running: "Calculating auto figures…"
# The row menu's copy entries (#1164): every listed coin, or those from the top of the current sort
# through the clicked row, as one comma-separated line. The menu shows the count; %{n} in the toast
# is that count.
screener.copy_coins_on_screen: "Copy coins on screen"
screener.copy_coins_through_row: "Copy coins down to this row"
screener.coins_copied: "Coins copied: %{n}"
