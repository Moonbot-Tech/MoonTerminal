# General tab of the Settings window.
# rust-i18n `_version: 1` format: one language per file, flat dotted keys. Interpolation: %{var}.
_version: 1

general.language: "Interface language"
general.valuation_mode: "Rate used for USDT conversion"
general.valuation_mode.historical: "At trade time"
general.valuation_mode.current: "Current rate"
general.charts_split_by_core: "Separate chart tab per core"
general.charts_split_by_core_hint: "AddToChart default: on — a tab per core, off — all cores of a group in one. The core's “Bundle” column (Connections) overrides this: cores sharing a bundle name merge into one tab."
general.main_idle_close: "Auto-close Main charts when idle"
general.main_idle_close_hint: "Idle = the Main window is not focused OR focused but the mouse is not moving. Each chart closes after N seconds of its own inactivity (the most recently opened closes last); a fullscreen chart closes too and exits fullscreen. Order-book subscriptions are dropped immediately."
general.log_to_file: "Write log to files"
general.log_to_file_hint: "App and core logs are written to logs/<date>_<source>.log (one file per source per day)."
general.log_retention: "Keep log"
general.log_retention_hint: "Files older than this are deleted on startup and once a day. 0 — keep everything."

# Settings redesign (phases 3-5)
general.sec.lang_money: "Language and money"
general.sec.charts: "Charts"
general.sec.logs: "Logs"
general.language.hint: "Applies after you save."
general.valuation.label: "Conversion to USDT"
general.valuation.hint: "For the Report and Analytics."
general.valuation.more: "\"At the time of the trade\": the amount never changes, at the rate of the minute the trade closed. \"Current\": every amount is converted at today's rate.\n\nChange this only deliberately: “Current rate” takes the latest known rate from Binance/Bybit spot rather than the exchange the trade was made on, refreshes it every few minutes, and never stores it. It also changes tuning: thresholds are then fitted against re-valued history. Applies after saving."
general.tab_per_core.hint: "Otherwise the group's cores share one tab."
general.book_pan.label: "Pan the chart over the order book"
general.book_pan.hint: "Dragging over the order book moves the chart."
general.book_pan.more: "Turn it off if you mostly click prices in the order book: dragging there then moves nothing, and price clicks work as usual."
general.live_scope.label: "Live and Pause"
general.live_scope.hint: "How moving one chart affects the others."
general.live_scope.more: "\"All charts together\": drag one chart into history and every chart pauses, which the toolbar Live button shows. \"Each chart on its own\": a drag affects that chart only; it returns to Live by itself when brought back to the right edge or left alone for 3 minutes. The toolbar Pause stops every chart, and Live brings them all back to now."
general.live_scope.all: "All charts together"
general.live_scope.each: "Each chart on its own"
general.idle_close.label: "Close idle Main charts"
general.idle_close.hint: "When the window is out of focus or the mouse does not move."
general.idle_close.after: "after"
general.unit.sec: "s"
general.unit.days: "days"
general.log_files.label: "Write the log to files"
general.log_files.hint: "The logs folder, one file per source per day."
general.log_retention.label: "Keep"
general.log_retention.hint: "Older files are deleted at startup and once a day."
