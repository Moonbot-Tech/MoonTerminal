# A core moved onto a Linux server: the card button, the move's steps, warnings and outcomes.
_version: 1

core_move.card_button: "Move to VPS…"
core_move.save_first: "Save the core first: a move needs its saved key and history."

# --- Outcomes ---
core_move.lost: "The move stopped without a word: its thread ended."
core_move.switched: "This terminal now connects to the new core."
core_move.switch_failed: "The new core runs at %{address}, but this terminal could not switch to it: %{reason}. Set that address on the core in Connections."
core_move.probe_failed: "Could not read the server's key: %{reason}"
core_move.failed: "The move failed: %{reason}"
core_move.failed_removed: "The move failed: %{reason}. The new core was never started and is removed from the server."
core_move.failed_left: "The move failed: %{reason}. The new core in %{dir} was never started and could not be removed: %{remove}"
core_move.failed_started: "The move failed: %{reason}. The new core stays in %{dir}, and the old core may be stopped: check both before trading."
core_move.failed_old_stopped: "The move failed: %{reason}. The old core is stopped, and the new one is installed in %{dir} but not started: start one of them before trading."
core_move.logged_in: "Logged in as %{user}."
core_move.old_stopped_by_hand: "The old core is stopped."

# --- Progress lines ---
core_move.step.snapshot: "Settings taken from the core: %{size} MB, exchange %{exchange}."
core_move.step.composed: "Settings archive ready for %{exchange}."
core_move.step.composed_db: "Settings archive ready for %{exchange}, with the report database."
core_move.step.report_db: "Report database rebuilt: %{rows} rows, %{open} open."
core_move.step.report_db_skipped: "This terminal holds no trades of this core: there is nothing to rebuild the report database from."
core_move.step.strategies_read: "Strategies read: %{n}, folders: %{folders}."
core_move.step.checked: "The server can run MoonBot; the port is free."
core_move.step.uploaded: "Settings uploaded."
core_move.step.installed: "The new core is installed, not started."
core_move.step.stop_requested: "Asking the old core to stop…"
core_move.step.old_stopped: "The old core is down."
core_move.step.old_refused: "The old core refuses to stop: %{n} unfinished deals."
core_move.step.old_refused_unknown: "The old core refuses to stop."
core_move.step.started: "The new core started and listens."
core_move.step.strategies_written: "Strategies written to the new core: %{n}; its own removed: %{deleted}."
core_move.step.finished: "First-start switch removed."
core_move.step.removed: "The new core is removed from the server."
core_move.warn.exchange: "The old core's exchange could not be asked: %{detail}"
core_move.warn.strategies_read: "The old core's strategies could not be read; the snapshot's file stands in: %{detail}"
core_move.warn.strategies_refresh: "The strategies could not be read again; the earlier set is carried: %{detail}"
core_move.warn.strategies_written: "The strategies on the new core are not confirmed: %{detail}"

# --- The station ---
core_move.station.same: "The station already has the new address."
core_move.station.not_followed: "The station does not follow this core."
core_move.station.sent: "The new address is sent to the station."
core_move.station.failed: "The station did not take the new address: %{reason}"
core_move.station.none: "No station is set up from this terminal."

# --- The new core's own word after its start ---
core_move.settled: "The new core is logged in to the exchange and listens for MoonProto."
core_move.not_settled: "The new core is not ready yet (%{state}) %{detail} — the move goes on: the old core is already stopped."
core_move.status_unread: "The new core's state was not read: %{reason} — the move goes on."
core_move.settling: "New core: %{state}…"
