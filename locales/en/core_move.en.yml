core_move.step.snapshot: "Settings taken from the core: %{size} MB, exchange %{exchange}."
core_move.step.composed: "Settings archive ready for %{exchange}."
core_move.step.composed_db: "Settings archive ready for %{exchange}, with the report database."
core_move.step.report_db: "Report database rebuilt: %{rows} rows, %{open} open."
core_move.step.report_db_skipped: "This terminal holds no trades of this core: there is nothing to rebuild the report database from."
core_move.step.strategies_read: "Strategies read: %{n}, folders: %{folders}."
core_move.step.checked: "The server can run MoonBot; the port is free."
core_move.step.uploaded: "Settings uploaded."
core_move.step.installed: "The new core is installed, not started."
core_move.step.stop_requested: "Asking the old core to stop…"
core_move.step.old_stopped: "The old core is down."
core_move.step.old_refused: "The old core refuses to stop: %{n} unfinished deals."
core_move.step.old_refused_unknown: "The old core refuses to stop."
core_move.step.started: "The new core started and listens."
core_move.step.strategies_written: "Strategies written to the new core: %{n}; its own removed: %{deleted}."
core_move.step.finished: "First-start switch removed."
core_move.step.removed: "The new core is removed from the server."
core_move.warn.exchange: "The old core's exchange could not be asked: %{detail}"
core_move.warn.strategies_read: "The old core's strategies could not be read; the snapshot's file stands in: %{detail}"
