# The shared core picker, used by Orders, Alerts, Assets, Core Status, Report and Analytics. Its
# strings live here rather than in any one panel's file for the same reason the Analytics
# placeholders do: six panels share the control, so no single namespace owns it.
#
# Saved core groups: a named set of cores the user applies instead of re-picking them. A group row
# ticks when the current selection IS that group, and its trailing count is what a CLICK produces —
# the members the panel showing it can actually select. In the MENU that count is formatted by the
# consumer's own `cores_n`, so it cannot read differently from the trigger right above it;
# `group_cores_n` below serves the two modals, which have no trigger beside them.
# Short "all" word for the shared core selector once a narrow row shrinks it to its icon: the noun
# is what the glyph now says, so only "all" versus a count is left to render. Masculine in Spanish,
# agreeing with núcleos — which is why it is not the strategy filter's own "all" word.
common.core_pick.all_short: "All"
common.core_pick.groups_heading: "Core groups"
common.core_pick.group_cores_n: "%{n} cores"
# Members whose core is no longer configured. They are kept on purpose — a core can come back — so
# this is a warning, not an error.
common.core_pick.group_dead_n: "%{n} missing"
common.core_pick.save_as_group: "Save selection as a group…"
common.core_pick.manage_groups: "Manage groups…"
common.core_pick.save_title: "New core group"
common.core_pick.manage_title: "Core groups"
# Refuses BOTH an empty name and a save blocked by the group ceiling: either way nothing was
# created, and the dialog stays open. `dialogs.name_required` cannot be reused — it names a
# strategy in all three languages.
common.core_pick.group_name_required: "Enter a group name"
common.core_pick.group_name_ph: "Group name"
# Two-step delete rather than a confirmation dialog: MoonUI paints one dialog at a time, so a
# confirm modal opened from the management modal would replace the list being edited. The second
# click reuses the shared `dialogs.delete_q`.
common.core_pick.group_delete: "Delete"

# A control edited for several things at once (strategies, cores) whose values disagree.
common.mixed_values: "mixed values"

# Second part of every strategy-name search tooltip (Strategies tree, Analytics, Report): the one
# shared query syntax with examples.
common.strategy_query_syntax: "Comma = OR, space = AND, !word = exclude. Case-insensitive.\nEMA, Hook — names with EMA or Hook\ndrops 1m — names with drops and 1m\nshort !test — names with short, without test"

# The button that writes a staged change and keeps its surface open.
common.apply: "Apply"
common.size_kb: "%{value} KB"
common.size_mb: "%{value} MB"
common.size_gb: "%{value} GB"
