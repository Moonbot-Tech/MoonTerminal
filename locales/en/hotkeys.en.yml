hotkeys.ruler_drag: "Percent ruler"
hotkeys.ruler_drag_hint: "Hold the modifier and drag with the left button over the chart: it shows how far the price moved in percent, how long it took and how much was bought and sold over that stretch. Release and nothing is left behind. While the drawing magnet (Ctrl, Cmd on macOS) is held, the ends snap to candle prices; with the ruler itself on Ctrl, the magnet works as long as Ctrl is held. Works on the chart only: in the order book the same presses stay trading gestures, and an order line under the pointer still drags as before."
