report.trade_log.no_task: "Trade log — no task number"
# Shown DISABLED when the row's core cannot be named, so no log file can be located.
report.trade_log.no_core: "Trade log — core cannot be identified"
report.trade_log.title: "Trade log"
report.trade_log.loading: "Reading log files..."
report.trade_log.count: "Lines: %{n}"
report.trade_log.truncated: "First %{n} lines shown — the rest were cut"
report.trade_log.copy_all: "Copy all"
report.trade_log.empty: "No log found: the day's file is past its retention, or log relaying was off for this core"

report.access_denied: "Access to the reports replica is unavailable."
