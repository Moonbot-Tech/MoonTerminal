# --- Connection verdict: why a core is not usable, and what to do about it. -------------------
# `core_status.fault.short.*` is the two-word cell form; `reason`/`next` are the hover and the
# status-bar line. The wording never claims a cause the terminal did not observe: `unidentified`
# names every possibility it cannot separate, `unknown` names the raw stage instead of guessing,
# and the key class (`key_empty` / `key_unparsable`) names a field the terminal could not decode
# before any socket existed.
