# Exchange API-key lifetime column (flat table). The unit is in the heading, so the cells hold a
# bare number.
# MoonBot build the core reported. The product noun IS the heading, so the cells hold
# a bare number; it is a proper name and is not translated. BOTH views read this one key --
# they would never legitimately differ, and two identical values are one translator edit away
# from disagreeing. `core_status.col.startup` is shared the same way.
core_status.col.version: "MoonBot"
# Hover on a MoonBot cell whose core runs an older build than the newest one currently reported
# across the user's cores. The reference is the FLEET, not a release feed: the terminal asks no
# server what the latest MoonBot is. Both numbers arrive as typed builds and are dotted by
# `util::fmt::core_build` at the call site.
core_status.version_behind: "Outdated MoonBot build: %{have}. The newest across your cores is %{newest}"
# The same fact on a COLLAPSED server row. It fires ONLY where the group is `Uniform` -- every core
# on the server agreed on one build -- so it CAN name the "have", and that number is the one already
# printed on the row. A `Mixed` group is never marked at all (its ellipsis states no build, so it
# has none to be behind with), which is why this string must not tell the user to expand anything:
# expanding a Uniform group reveals N cores all reporting the number they can already see.
core_status.version_behind_group: "Every core on this server runs %{have}; a newer build exists: %{newest}"
core_status.col.api_key: "API (d)"
# Hover for the infinity glyph this column prints for a key with no expiry date. The glyph itself
# lives in `presentation.rs` (locales/README.md keeps glyphs out of translated values), so this is
# the only place the reader can learn what it claims.
core_status.api_perpetual: "Key with no expiry date"

