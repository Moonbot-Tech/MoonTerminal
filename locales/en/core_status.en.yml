# --- Problems mode: the three diagnostic actions ---
# The reset and the re-read mirror MoonBot's own Problems window; the test is ours.
#
# A test publishes a `test` fact through the core's own detector worker (~2 s) and PROVES the
# channel end to end. It leaves a row behind that only the reset removes, which is why that pair
# ships together.
core_status.problems_test: "Test the channel"
# Deliberately NOT MoonBot's "reset all", though it is the same command on the wire. MoonBot's
# window belongs to one core, so "all" there means all of that core's findings; this panel spans a
# fleet, where the same word reads as "all cores" and would be a lie the moment the operator has
# picked one. The button acts on the panel's scope, and the tooltip and the confirm both say how
# many cores that is.
core_status.problems_clear: "Reset"
core_status.problems_test_tip: "Publishes a test fact through the core's own detector — about two seconds. It proves the whole path: detector, wire, projection, panel."
core_status.problems_refresh: "Refresh"
# Said out loud because the label promises a round trip the protocol cannot make: a core pushes its
# list, nothing can ask for one. Saying so here is cheaper than an operator concluding the button is
# broken when a stale row does not move.
core_status.problems_refresh_tip: "Re-reads whatever the connected cores (%{cores}) have sent so far. Click a row to re-read only that core. A fresh list cannot be requested: the protocol has no such command — a core sends one itself, on connection and whenever its detectors change it. Worth pressing after a core restart, when the old rows are no longer about it."
# The blast radius, stated BEFORE the dialog: an operator who picked no core is acting on the whole
# scope, and that is the difference between a tidy-up and a fleet-wide loss.
# The one-core forms, for when a clicked finding has narrowed the action. The scope-wide wording
# would state a falsehood about the panel ("connected cores: 1" for a scope of twenty-six) and would
# keep advising a click that, in this state, cancels the pick instead of making one.
core_status.problems_clear_tip_one: "Resets the selected core's diagnostics — irreversibly, and for every terminal. Click its row again to go back to the whole scope"
core_status.problems_refresh_tip_one: "Re-reads whatever the selected core has sent so far. A fresh list cannot be requested: the protocol has no such command. Click its row again to go back to the whole scope"
core_status.problems_clear_tip: "Resets the diagnostics. Connected cores: %{cores}. Irreversible, and for every terminal. Click a row to reset only that core"
# The test is per-core on the wire and has no fleet-wide form worth having: publishing a test fact
# on two hundred cores litters two hundred cores. So it alone needs one core named.
core_status.problems_pick_core: "The test goes to one core: click that core's finding in the table — or narrow the panel's scope to a single core"
core_status.problems_picked_offline: "The selected core is offline — the command would wait for it to come back"
core_status.problems_no_online: "No core in the panel's scope is connected"
# Guards the TEST alone. The command channel outlives the connection, so a queued test would fire on
# the next reconnect and publish its fact at some unannounced later moment, on a core the operator
# stopped looking at hours ago.
core_status.problems_core_offline: "The core is offline — the test would wait for its reconnect and publish its fact at some unannounced later moment"
core_status.problems_test_title: "Send a test diagnostic?"
# The consequence is the whole reason this action is confirmed at all.
core_status.problems_test_q: "Core %{core} will publish a test fact through its own detector — about two seconds. The row stays on the core, and the ONLY way to remove it is the reset, which also destroys that core's real findings."
core_status.problems_test_sent: "Test sent to %{core} — the row appears in a couple of seconds"
core_status.problems_clear_sent: "Reset sent to %{core} — the rows go when the core sends its next list"
core_status.problems_clear_sent_many: "Reset sent to %{cores} cores — the rows go when those cores send their next lists"
# Says what it re-read, not "done": the honest outcome of a re-read that found nothing new is an
# unchanged table, and a message claiming more would make that look like a failure.
core_status.problems_refreshed: "Cores re-read: %{cores}"
# The shortfall, never a bare success: a fleet action that reached nine of twelve cores has failed
# on three, and only the toast can say so.
core_status.problems_fleet_none: "Reached none of the %{cores} cores — offline, or their command channel is closed"
core_status.problems_fleet_partial: "Reached %{sent} of %{cores} cores — the rest are offline or their channel is closed"
core_status.problems_not_sent: "Not sent: the core's command channel is closed"
core_status.problems_not_sent_offline: "Not sent: the core is offline"
core_status.problems_clear_title: "Reset the core's diagnostics?"
# Blunt on purpose: the protocol's own warning is that cleared real diagnostics cannot be restored.
core_status.problems_clear_q: "Core %{core} will drop every confirmed problem and pending hypothesis — for all terminals, with no way back. It fixes no cause: if one remains, the core will confirm the problem again."
core_status.problems_clear_title_many: "Reset the diagnostics of several cores?"
# The core NAMES, not just how many: a count is nothing an operator can check, and this dialog is
# the last place the mistake is still cheap.
core_status.problems_clear_q_many: "Each of these %{cores} cores drops every confirmed problem and pending hypothesis — for all terminals, with no way back. It fixes no cause: those that remain will be confirmed again."
