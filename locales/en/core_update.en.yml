core_update.menu.release_n_few: "Update %{n} cores to release"
core_update.menu.release_n_many: "Update %{n} cores to release"
core_update.menu.named_n_one: "Update %{n} core to a named version…"
core_update.menu.named_n_few: "Update %{n} cores to a named version…"
core_update.menu.named_n_many: "Update %{n} cores to a named version…"
core_update.menu.named_prompt_n_one: "Build name for %{n} core:"
core_update.menu.named_prompt_n_few: "Build name for %{n} cores:"
core_update.menu.named_prompt_n_many: "Build name for %{n} cores:"
core_update.confirm.named_prompt: "Build name:"
