# Settings -> Telegram -> the bot's segment -> "Station on a Linux server".
telegram.server.section: "Station on a Linux server"
telegram.server.intro: "The bot, the Mini App and the reports run on your own Linux server around the clock, even while the terminal is off. The terminal sets the server up over SSH and moves the bot there."
telegram.server.intro_more: "When it sets the server up, the terminal closes password logins, installs the service and hands it the keys of every active core. About 25 cores want roughly a third of a whole non-burstable machine and a few hundred MB free on a 1 GB box. A burstable t3.micro's 10% baseline is below that; if status comes back with \"0 min\", check CPUCreditBalance (AWS) and killed / oom in the service journal."
