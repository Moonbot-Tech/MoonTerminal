telegram.server.section: "Station on a Linux server"
telegram.server.intro: "The bot, the Mini App and the reports run on your own Linux server around the clock, even while the terminal is off. The terminal sets the server up over SSH: closes password logins, installs the service, hands it the keys of every active core and moves the bot."
