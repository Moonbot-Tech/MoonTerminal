telegram.server.password: "Password"
telegram.server.first_login_hint: "The access from your provider (IP, login, root password or key) is used once and stored nowhere. After the install, password logins are closed and the terminal logs in with its own key."
telegram.server.old_admin: "Old password of moon"
telegram.server.release_hint: "The service is installed from the latest MoonTerminal release on GitHub, for the server's architecture (SHA-256 checked)."
telegram.server.transfer_hint: "The terminal's bot moves to the server: its token, chats and their access. Once the bot runs there, the terminal deletes its own token; a local bot will need another token. If the move fails, the bot stays in the terminal."
