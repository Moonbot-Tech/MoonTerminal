# Storage tab of the Settings window: local databases for reports, strategies, the kline cache
# and the trade prints of replays.
# rust-i18n `_version: 1` format: one language per file, flat dotted keys. Interpolation: %{var}.
_version: 1

storage.open_folder: "Open folder"
storage.refresh: "Refresh"
storage.size: "Size: %{size}"
storage.size_wal: "Size: %{size} (+ WAL %{wal})"
storage.no_file: "no file yet"

storage.reports_rows: "Trades in replica: %{rows}"
storage.reports_hint: "Typed replica of the cores' report DB. Recoverable: re-syncs from the server."

storage.strategies_enabled: "Keep a local strategy DB"
storage.strategies_enabled_hint: "Version history of real parameter edits (cosmetics/start-stop don't spawn versions). Applies immediately. The field ignore list is hand-edited in cfg/storage.toml."
storage.strategies_rows: "Strategies: %{live} (deleted: %{deleted}) · Versions: %{versions}"
storage.version_limit: "Version limit per strategy"
storage.version_limit_off: "unlimited"
storage.unit_mb: "MB"
storage.unit_min: "min"
storage.version_limit_hint: "0 — keep all versions (recommended: the history is unrecoverable). A limit trims old ones as new are written."
storage.strategies_hint: "The only copy of the history — a re-sync cannot restore it. Use Backup to keep it safe."

storage.klines_hint: "Recoverable kline history cache: the file can be deleted while the terminal is closed."

storage.trades_enabled: "Keep trade prints"
storage.trades_enabled_hint: "Fetched prints stay on disk and are not fetched twice. Off — in memory only, until the terminal closes."
storage.trades_max_mb: "File limit"
storage.trades_max_mb_hint: "Past the limit the oldest records go first; 0 — no limit."
storage.trades_margin: "Prints around a trade"
storage.trades_sec: "%{s} s"
storage.trades_min: "%{min} min"
storage.trades_margin_hint: "At each end of a trade; on a long one, around the entry and around the exit, candles between. At least 30 s — what the tuner needs; it judges a variant's exit no further than this past the close."
storage.trades_long_position: "Long trade from"
storage.trades_long_position_hint: "Held longer — prints around the entry and the exit only. The tuner does not see the middle: a variant that may have closed there is not judged on such a trade."
storage.trades_autoload_cores: "Fetch the missing tape from the cores at startup"
storage.trades_autoload_cores_hint: "Prints of strategy trades that closed while the terminal was not running — from the core's archive, which holds the last few thousand prints of each market (minutes on a hot coin, up to a day on a quiet one), on any venue, Bybit and Hyperliquid included. Spends no venue request budget; trades older than 48 h are skipped."
storage.trades_autoload: "Fetch the missing tape from the venue at startup"
storage.trades_autoload_hint: "What the core's archive does not hold — from the venue, as far back as it still serves (Binance futures 48 h, others up to 30 days; Bybit and Hyperliquid serve no history). Spends the request budget; stops with the tuner's button."
storage.trades_cleanup_at_startup: "Clean up at startup"
storage.trades_cleanup_at_startup_hint: "Same as the \"Clean up\" button, before the tape fetch. From the next launch."
storage.trades_cleanup: "Clean up"
storage.trades_cleanup_run: "Clean now"
storage.trades_cleanup_hint: "Keeps the prints of strategy trades the strategy closed itself (what the tuner reads), within the \"Prints around a trade\" step. Manual sells, funding, liquidations and prints with no trade in the report go. The file is compacted at once."
storage.trades_cleanup_preview: "≈ %{prints} prints go, ≈ %{size} freed"
storage.trades_cleanup_empty: "nothing to delete"
storage.trades_cleanup_pending: "counting…"
storage.trades_cleanup_failed: "could not count — %{err}"
storage.trades_cleanup_done: "%{prints} prints deleted, ≈ %{size} freed"
storage.op_cleanup: "Cleanup"
storage.trades_hint: "The file can be deleted while the terminal is closed."

