sounds.folder_help: "Drop .wav files into this folder — they appear in every sound list (strategies, trade sounds, warnings, alerts). The core's settings store a sound by NUMBER: 1–%{last} are built in; a file claims its own number by name: %{first}_MySound.wav → sound \"MySound\" #%{first}. A file without a number cannot be picked in the core's settings; a file named like a built-in sound (ding1.wav) replaces it."
