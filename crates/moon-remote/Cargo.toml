[package]
name = "moon-remote"
version = "0.1.0"
edition = "2021"
description = "Prepares a Linux server for moon-station over SSH: an administrator reached by the terminal's own key, a closed server, a service user, core keys as systemd credentials."
publish = false

[[bin]]
name = "moon-remote"
path = "src/main.rs"

[dependencies]
# With `desktop`: the terminal's machine key (OS keyring) seals the app's SSH key, and the core
# keys come from the terminal's own `servers.enc`.
moon-core = { path = "../moon-core" }
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The terminal's valuation cache travels gzipped to a new station.
flate2 = "1"
toml = "0.8"
sha2 = "0.10"
zeroize = "1"
getrandom = "0.2"
# The legacy encrypted PKCS#1 PEM envelope: russh only decodes AES-128-CBC itself.
aes = "0.9"
cbc = "0.2"
data-encoding = "2"
md5 = "0.8"
# SSH on `ring`, the crypto the workspace already builds; the default aws-lc-rs needs cmake and
# a C toolchain for every target. Pure-Rust RSA accepts providers' first-login keys;
# the terminal's own app key remains ed25519.
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "macros"] }
rpassword = "7"

[lints]
workspace = true
