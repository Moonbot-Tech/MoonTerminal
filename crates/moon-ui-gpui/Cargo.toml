[package]
name = "moon-ui-gpui"
version = "0.1.0"
edition = "2024"
description = "MoonTerminal GPUI shell over moon-core and MoonUI."

[features]
default = ["linux-x11", "linux-wayland"]
debug-tools = ["moon-core/moonproto-diagnostics"]
linux-x11 = ["gpui_platform/x11"]
linux-wayland = ["gpui_platform/wayland"]

[[bin]]
name = "moonterminal"
path = "src/main.rs"

[build-dependencies]
ico = "0.3"
winresource = "0.1"

[dependencies]
# Shared backend (config/session/market/metrics/...). UI-agnostic.
moon-core = { path = "../moon-core" }
# Platform-neutral chart math/geometry (view/axes/transform/build_order_geometry/instance types,
# constants). chartdx renders the data via DX11 on Windows, Metal on macOS, and wgpu on Linux.
moon-chart = { path = "../moon-chart" }
image = "0.25"
# Not used directly — pinned to hold back a transitive break. zune-core 0.5.2 makes
# zune-jpeg 0.5.15 (pulled in by image and tiff) fail to compile with "macro expansion ends
# with an incomplete expression". Cargo.lock is not committed here, so CI resolves the newer
# one and every job dies; a direct `=` requirement is the only way to hold a transitive
# version without a lock. Drop this once zune-jpeg 0.5.16 ships (only 0.5.16-rc1 exists).
zune-core = "=0.5.1"
bytemuck = { version = "1", features = ["derive"] }
# Embedded coin icon set (assets/coins), so icons ship in the build without a
# separate folder beside the executable; disk files take priority for adding icons without rebuilding.
include_dir = "0.7"

# Canonical Moon UI source: standalone GPUI runtime + Moon components.
# Local development overrides this Git source through untracked `.cargo/config.toml`.
gpui = { package = "moon-gpui", git = "https://github.com/Moonbot-Tech/MoonUI", branch = "master" }
# runtime_shaders: compile Metal shaders at runtime via the OS Metal framework
# instead of the `metal` CLI (ships only with full Xcode). Lets the build work with
# just Command Line Tools on macOS; no-op on Windows/Linux.
gpui_platform = { package = "moon-gpui-platform", git = "https://github.com/Moonbot-Tech/MoonUI", branch = "master", features = ["font-kit", "runtime_shaders"] }
moon-ui = { package = "moon-ui", git = "https://github.com/Moonbot-Tech/MoonUI", branch = "master" }

anyhow = "1"
log = "0.4"
# NaiveDate <-> Unix conversions for the "from"/"to" fields (MoonCalendar in Analytics);
# compatible Cargo resolution with MoonUI shares the NaiveDate type used by MoonDate.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# IANA time zones for the header clock's city picker: summer-time transitions come from the tz
# database instead of rules of our own. The database is compiled INTO the binary, which is what
# makes it work on Windows (no system tzdata) — and what freezes it at build time, so a zone whose
# government moves a transition needs a dependency bump and a release. Zones are compile-time
# constants, so a mistyped zone fails the build rather than falling back to UTC at runtime.
# `filter-by-regex` is deliberately not used: it is driven by a build-time environment variable
# this repo has no tracked mechanism for, and it makes every zone outside the filter unparsable —
# a live hazard, since layout.toml holds a hand-editable zone id.
chrono-tz = "0.10"
env_logger = "0.11"
# UI localization: dictionaries in the root `locales/*.yml` (see locales/README.md).
# Compatible Cargo resolution with MoonUI shares the global locale backend.
rust-i18n = "4.1"
# The Report panel queries the local SQLite database through moon-core. The version and
# bundled feature are unified with moon-core, avoiding a separate SQLite build.
rusqlite = "0.40.1"
# Serialization of dock and detached-window layouts (-> docks.json / detached.json).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Excel (.xlsx) export from the Report panel's save menu (report/export.rs).
rust_xlsxwriter = "0.96.0"

# Local time offset for the chart's hour labels (chartdx/axes.rs) and our own-pass DX11 chart
# renderer (chartdx). Windows only; other platforms use UTC. moon-chart is intentionally
# Windows-free, so tz/DX11 live here.
# Version 0.61 aligns with MoonUI's windows dependency to share the same windows-rs types.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_System_SystemInformation",
    "Win32_Media_Audio",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { git = "https://github.com/zed-industries/wgpu.git", rev = "357a0c56e0070480ad9daea5d2eaa83150b79e88" }
x11 = { version = "2.21", features = ["xlib", "xtest"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"
foreign-types = "0.5"
block = "0.1"
objc = "0.2"
core-graphics = "0.24"
