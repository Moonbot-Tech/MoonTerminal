<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>MoonTerminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <header class="app-header">
        <div class="app-header-row">
            <h1 id="app-title"></h1>
            <p id="app-updated" class="updated" hidden></p>
            <button type="button" id="app-refresh" class="icon-btn" hidden aria-label="">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M19.8 3.8v4.4h-4.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </div>
    </header>
    <div id="startup" class="startup" role="status"></div>
    <main id="app-main" hidden>
        <div id="pane-status" role="status"></div>
        <section data-tab="report" hidden>
            <div id="report-period"></div>
            <div id="report-body"></div>
        </section>
        <section data-tab="cores" hidden></section>
        <div id="deals-switch" hidden></div>
        <section data-tab="orders" hidden></section>
        <section data-tab="trades" hidden></section>
        <section data-tab="strategies" hidden></section>
        <section data-tab="settings" hidden></section>
    </main>
    <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true"></div>
    <nav id="app-nav" hidden>
        <button type="button" data-tab="report">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 14h3v6H4zm6.5-4h3v10h-3zM17 6h3v14h-3z"/></svg>
            <span class="nav-label"></span>
        </button>
        <button type="button" data-tab="cores">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.2" fill="currentColor"/><circle cx="18" cy="7" r="2.2" fill="currentColor"/><circle cx="18" cy="17" r="2.2" fill="currentColor"/><path d="M8.2 12h7.2M16.2 8.4 8.6 11.2M16.2 15.6 8.6 12.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span class="nav-label"></span>
        </button>
        <button type="button" data-tab="deals">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l5-5 4 4 7-8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 8h5v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="nav-label"></span>
        </button>
        <button type="button" data-tab="strategies">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="15" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
            <span class="nav-label"></span>
        </button>
        <button type="button" data-tab="settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.1 5.1l1.7 1.7M17.2 17.2l1.7 1.7M18.9 5.1l-1.7 1.7M6.8 17.2l-1.7 1.7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span class="nav-label"></span>
        </button>
    </nav>
    <script>window.telegramLabels = __TELEGRAM_LABELS__;</script>
    <script src="/app.js"></script>
</body>
</html>
