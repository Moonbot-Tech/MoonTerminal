<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>MoonTerminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <header class="app-header">
        <div class="app-header-row">
            <h1 id="app-title"></h1>
            <p id="app-updated" class="updated" hidden></p>
        </div>
    </header>
    <div id="startup" class="startup" role="status"></div>
    <main id="app-main" hidden>
        <section data-tab="report" hidden>
            <div id="report-period"></div>
            <div id="report-body"></div>
        </section>
        <section data-tab="cores" hidden></section>
        <section data-tab="balances" hidden></section>
        <section data-tab="orders" hidden></section>
    </main>
    <nav id="app-nav" hidden>
        <button type="button" data-tab="report">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 14h3v6H4zm6.5-4h3v10h-3zM17 6h3v14h-3z"/></svg>
            <span class="nav-label"></span>
        </button>
        <button type="button" data-tab="cores">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.2" fill="currentColor"/><circle cx="18" cy="7" r="2.2" fill="currentColor"/><circle cx="18" cy="17" r="2.2" fill="currentColor"/><path d="M8.2 12h7.2M16.2 8.4 8.6 11.2M16.2 15.6 8.6 12.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            <span class="nav-label"></span>
        </button>
        <button type="button" data-tab="balances">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="16.5" cy="14.5" r="1.2" fill="currentColor"/></svg>
            <span class="nav-label"></span>
        </button>
        <button type="button" data-tab="orders">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7h12M8 12h12M8 17h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="4.5" cy="7" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="17" r="1.2" fill="currentColor"/></svg>
            <span class="nav-label"></span>
        </button>
    </nav>
    <script>window.telegramLabels = __TELEGRAM_LABELS__;</script>
    <script src="/app.js"></script>
</body>
</html>
