[package]
name = "moon-core"
version = "0.1.0"
edition = "2021"
description = "MoonTerminal backend core — feed/session/market/config/db, UI-agnostic. Делится между egui-оболочкой и будущей GPUI-оболочкой."

[lib]
name = "moon_core"
path = "src/lib.rs"

[features]
# Explicit debug/test bridge for the terminal debug button. Default builds must
# not enable MoonProto diagnostics; see tests/moonproto_feature_guard.rs.
moonproto-diagnostics = ["moonproto/diagnostics"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
anyhow = "1"
log = "0.4"

# The TeeLogger wrapper (applog.rs) delegates to env_logger and is installed in main.
env_logger = "0.11"

# Language based on the system locale (config/lang.rs::from_system).
sys-locale = "0.3"

# Resolves platform-specific data directories for config/paths.rs.
dirs = "6"

# CPU/RAM metrics (metrics.rs).
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

# Encrypted configuration: AES-256-GCM, with the key in the OS keyring (config/crypto.rs).
# keyring v3 has no default platform features: without an explicit Linux backend, Linux
# uses mock storage in process memory, and servers.enc cannot be read even by the next
# application run.
aes-gcm = "0.10"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent", "crypto-rust"] }
getrandom = "0.2"
base64 = "0.22"
zeroize = "1"

# SoA tick/order-book instances (data/, formerly chart/data) with a Pod layout for the GPU.
bytemuck = { version = "1", features = ["derive"] }

# Local reports database (db/).
rusqlite = { version = "0.40.1", features = ["bundled", "hooks", "trace"] }

# Public historical spot candles used to value mixed report quote currencies in USDT. The
# synchronous client lives on a dedicated worker thread, never on a UI or feed thread.
ureq = { version = "3", features = ["json"] }

# Restart fan-out of the tuner's threshold search (db/tuner/threshold_search/). Already in the
# tree transitively through sysinfo, so this direct edge adds no crate and no build time.
rayon = "1.12"

# Importing MoonBot settings from the MBSC7 buffer (config/moonbot_import/): gzip
# decompression of the payload and CRC32 of the compressed bytes. Both are already in the
# dependency tree transitively.
flate2 = "1"
crc32fast = "1"

# Connection to the Moonbot core (feed/live/mod.rs), the only module that knows the transport.
moonproto = { git = "https://github.com/Moonbot-Tech/MoonProtoBeta" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Performance"] }
