[package]
name = "moon-station"
version = "0.1.0"
edition = "2021"
description = "Headless MoonTerminal station: report replica, order traces and the trade tape around every trade, without a window."
publish = false

[[bin]]
name = "moon-station"
path = "src/main.rs"

[dependencies]
# Without `desktop`: no OS keyring, so no D-Bus on Linux — the station's core keys come from
# its systemd credentials, not from the terminal's `servers.enc`. A desktop host that wants to
# run the probe against a copy of the terminal's `cfg/` turns `terminal-config` on.
moon-core = { path = "../moon-core", default-features = false }
# The bot and the Mini App, as the terminal runs them; built on moon-core without `desktop` too.
moon-tg = { path = "../moon-tg" }
anyhow = "1"
chrono-tz = "0.10"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zeroize = "1"
# MCP uses the official protocol transport; only loopback HTTP reaches this process.
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-streamable-http-server"] }
axum = { version = "0.8", features = ["form", "json", "query", "tokio", "http1"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
tokio-util = "0.7"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
getrandom = "0.2"
url = "2"
ureq = { version = "3", features = ["json"] }
jsonschema = { version = "0.40", default-features = false }

[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.4", default-features = false }
# `statvfs`: the free space of the data root's filesystem, for `status`.
libc = "0.2"

[features]
# Read the cores from a copy of the terminal's `cfg/servers.enc` when no `station.toml` is
# present, or when it lists no `[[core]]` (its `[tape]` and `[update]` still apply) — a development convenience on the terminal's own machine, where the keyring holds
# the file's machine key.
terminal-config = ["moon-core/desktop"]

[lints]
workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
