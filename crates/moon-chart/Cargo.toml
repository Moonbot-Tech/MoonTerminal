[package]
name = "moon-chart"
version = "0.1.0"
edition = "2021"
description = "MoonTerminal chart math/geometry (wgpu-free): axes/view/transform, order-line instance types, build_order_geometry. Данные рисует own-pass DX11 (chartdx)."

[lib]
name = "moon_chart"
path = "src/lib.rs"

[dependencies]
# Domain data, configuration, and sessions (UI-agnostic).
moon-core = { path = "../moon-core" }

# Only for #[derive(Pod/Zeroable)] on instance types and ChartUniform. wgpu is no longer used:
# the wgpu chart engine was removed with the egui binary; own-pass DX11 (chartdx) does the rendering.
bytemuck = { version = "1", features = ["derive"] }
