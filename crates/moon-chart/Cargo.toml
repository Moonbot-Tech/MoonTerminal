[package]
name = "moon-chart"
version = "0.1.0"
edition = "2021"
description = "MoonTerminal chart math/geometry (wgpu-free): axes/view/transform, order-line instance types, build_order_geometry. Данные рисует own-pass DX11 (chartdx)."

[lib]
name = "moon_chart"
path = "src/lib.rs"

[dependencies]
# Domain data, configuration, and sessions (UI-agnostic).
moon-core = { path = "../moon-core" }

# Only for #[derive(Pod/Zeroable)] on instance types and ChartUniform. wgpu is no longer used:
# the wgpu chart engine was removed with the egui binary; own-pass DX11 (chartdx) does the rendering.
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
# The auto-figure detector tests read the committed `chart-ace` candles straight from
# `moon-core/fixtures/chart-ace/klines.sqlite`, read-only. The cache's own reader cannot serve them:
# `KlineCache::open` prunes chunks past their retention on open, and the fixture is dated, so it
# reads nothing (and would empty the committed file). Same version moon-core already builds.
rusqlite = "0.41.1"

[lints]
workspace = true
