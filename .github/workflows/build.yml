name: build

permissions:
  contents: read

# Seven jobs, all of which gate a merge:
#   Windows .exe — the real release binary, uploaded as an artifact.
#   Tests        — `cargo nextest run --workspace` plus doc-tests. Blocking: a red suite is a red PR.
#   Clippy       — `cargo clippy --workspace --all-targets --locked -- -D warnings`. Blocking.
#   Station      — the headless station for Linux (static musl): build, test and clippy of
#                  `moon-station` on the target it ships for. Blocking.
#   Audit        — cargo-deny over the committed lockfile. Blocking.
#   Tour         — deterministic interactive and AI documentation. Blocking.
#   Fmt          — `cargo fmt --all -- --check`. Blocking.
# The diagnostic macOS probe lives in macos-probe.yml so its runner-acquisition cancellation
# cannot override `continue-on-error` and turn this gating workflow red. The diagnostic Linux
# build of the graphical terminal lives in linux-probe.yml for the same reason: that platform is
# not a gate, and its failure must not look like one.
#
# THE LOCKFILE CONTRACT, which the four compiling jobs implement in the same three steps.
# `Cargo.lock` is committed, so third-party versions move only in a deliberate commit. Each job
# then, in this order and no other:
#   1. verifies the committed lock still agrees with the manifests (`cargo fetch --locked`),
#      BEFORE anything can rewrite it — afterwards `--locked` would only prove the lock agrees
#      with itself;
#   2. refreshes the three Moonbot-owned MoonUI crates, and only those, so MoonUI keeps rolling
#      against its master with no human action. `moonproto` is deliberately never named here: it
#      moves only when a human runs `cargo update -p moonproto` and commits the result;
#   3. asserts that step 2 moved MoonUI and nothing else. Selective `cargo update` is conservative
#      rather than surgical — cargo may change a selected package's transitive requirements — so
#      without this a new MoonUI master could pull an uncommitted, unaudited crates.io version into
#      the binary this run ships. That case is meant to be a red PR resolved by a deliberate lock
#      commit, not a silent upgrade.
# The audit job scans the COMMITTED lock, which after step 3 is the same third-party set the other
# jobs compile.
#
# The Rust toolchain is PINNED, not `@stable`, for the same reason the lock now is: taking the
# compiler from a moving target means a green PR can turn red overnight with no change to it. That
# is not theoretical: zune-jpeg 0.5.15 (a transitive dep via image/tiff) once failed to compile
# with "macro expansion ends with an incomplete expression" across every job, and went unnoticed
# only because Swatinem/rust-cache kept restoring a pre-built copy — the breakage surfaced the
# moment that cache key missed. The cause was zune-core 0.5.2, now held back by the `=0.5.1`
# requirement in crates/moon-ui-gpui/Cargo.toml; pinning the compiler in the same commit is what
# left the compiler itself under suspicion.
#
# Keep this equal to what developers run locally (`rustc --version`), and raise it as a
# deliberate commit that can be reverted on its own when a new compiler breaks a dep. Dependabot
# does not propose that raise: it is told to ignore this action in .github/dependabot.yml, because
# the action is versioned by branches its author creates ahead of the Rust releases they name, so
# its "latest" resolves to a toolchain rustup cannot download. Move all twelve sites together —
# four here, one in macos-probe.yml, two in linux-probe.yml, four in release.yml, and
# rust-toolchain.toml, which never re-runs these gates.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # A freeze makes exactly one thing worse: an advisory can be published against a pinned version
  # long after the last PR, and nothing would notice. This weekly run exists for the audit job
  # alone — the four compiling jobs skip it, so it costs a couple of runner-minutes and writes
  # no cache. Side effect worth knowing when you read a commit's checks: each cron run attaches
  # four `Skipped` entries to main's HEAD, so a commit whose gates really did pass can later
  # display them as skipped.
  schedule:
    - cron: "0 6 * * 1"

# Cancel superseded runs for the same ref (e.g. new pushes to an open PR).
# Each tag ("v*") has a unique ref, so release builds are never cancelled.
# The event name is part of the group on purpose: the weekly audit-only run happens on
# `refs/heads/main`, so without it the cron and an ordinary push to main would share a group and
# `cancel-in-progress` would have them kill each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

# Every job restores the cargo cache but only `main` writes it (`save-if` below).
# A cache saved from a branch is readable only by that branch, so on any run whose
# manifest hash is new it is written once and never read again. Four jobs at ~1 GiB
# a piece fill the repository's 10 GB Actions quota fast, and once over it GitHub
# evicts by least-recent-use — which takes the live caches, not the dead ones.
jobs:
  windows:
    name: Windows .exe (x86_64-msvc)
    runs-on: windows-latest
    # The weekly cron is for the audit job only; compiling on a schedule buys nothing.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The lockfile contract — see the header. Placed after the cache restore because
      # Swatinem/rust-cache keys partly on lockfile content, and it must key on the COMMITTED one.
      - name: Verify the committed lockfile agrees with the manifests
        run: cargo fetch --locked
      - name: Refresh MoonUI only
        run: cargo update -p moon-gpui -p moon-gpui-platform -p moon-ui
      - name: Assert the refresh moved MoonUI and nothing else
        shell: bash
        run: bash .github/scripts/assert-only-moonui-moved.sh
      - name: Build release binary
        run: cargo build -p moon-ui-gpui --bin moonterminal --release --target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v7
        with:
          name: moonterminal-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/moonterminal.exe
          if-no-files-found: error

  tests:
    name: Tests (x86_64-msvc)
    runs-on: windows-latest
    if: github.event_name != 'schedule'
    # A gate, not a probe: no `continue-on-error`, so a red suite is a red PR.
    #
    # Its own job rather than a step in the .exe job, because that one builds
    # `--release` and this one the `dev` profile — separate target dirs, so
    # bolting it on would serialise a second full compile onto the exe job
    # instead of running beside it.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `--no-fail-fast`: report every failing test in one run rather than
      # costing a push-and-wait cycle per breakage. Default features only — that
      # is the set that ships; `debug-tools` is opt-in and gated separately.
      # The lockfile contract — see the header.
      - name: Verify the committed lockfile agrees with the manifests
        run: cargo fetch --locked
      - name: Refresh MoonUI only
        run: cargo update -p moon-gpui -p moon-gpui-platform -p moon-ui
      - name: Assert the refresh moved MoonUI and nothing else
        shell: bash
        run: bash .github/scripts/assert-only-moonui-moved.sh
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # The CI profile gives slower hosted runners more time without retrying failures.
      - name: Run test suite
        run: cargo nextest run --workspace --profile ci --no-fail-fast --target x86_64-pc-windows-msvc
      # nextest excludes doc-tests. Preserve --no-fail-fast coverage even when a test fails.
      - name: Run workspace doc-tests
        if: ${{ !cancelled() }}
        run: cargo test --doc --workspace --no-fail-fast --target x86_64-pc-windows-msvc

  clippy:
    name: Clippy (x86_64-msvc)
    runs-on: windows-latest
    # Compiles the workspace, so the weekly audit cron skips it like the other compiling jobs.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The lockfile contract — see the header. `--locked` on the clippy step then refuses any
      # further rewrite after the MoonUI refresh has been checked.
      - name: Verify the committed lockfile agrees with the manifests
        run: cargo fetch --locked
      - name: Refresh MoonUI only
        run: cargo update -p moon-gpui -p moon-gpui-platform -p moon-ui
      - name: Assert the refresh moved MoonUI and nothing else
        shell: bash
        run: bash .github/scripts/assert-only-moonui-moved.sh
      - name: Lint the workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  station-linux:
    name: Station (x86_64-linux-musl)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    # A gate, not a probe. The station is the one binary this workspace ships for Linux — a
    # static musl build the terminal installs on the user's server — and no other GATING job
    # compiles for Linux at all, so a `cfg(unix)` path or a C dependency that breaks there would
    # first show on a user's VPS. Only `moon-station` and what it pulls in: the terminal's GUI
    # crates are built for Linux by the diagnostic linux-probe.yml, which blocks nothing.
    #
    # It stays on `ubuntu-latest` on purpose while the release pins its image: the newest image
    # builds the release's own recipe (the baseline flags below) and meets the smoke on a pull
    # request. The flags override that compiler's default `-march`, so what this can still catch
    # is past-baseline code they do not reach — a dependency that ignores CFLAGS, prebuilt objects.
    env:
      # The station's C at the x86_64 target's own baseline, whatever the image's compiler defaults
      # to — the same flags the release builds with (release.yml, job `station`).
      CFLAGS_x86_64_unknown_linux_musl: -march=x86-64 -mtune=generic
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-unknown-linux-musl
          components: clippy
      # `musl-gcc` for the C inside the station's dependencies (ring, SQLite); `qemu-user` for the
      # baseline smoke.
      - name: Install the musl C toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools qemu-user
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The lockfile contract — see the header.
      - name: Verify the committed lockfile agrees with the manifests
        run: cargo fetch --locked
      - name: Refresh MoonUI only
        run: cargo update -p moon-gpui -p moon-gpui-platform -p moon-ui
      - name: Assert the refresh moved MoonUI and nothing else
        shell: bash
        run: bash .github/scripts/assert-only-moonui-moved.sh
      - name: Build the station
        run: cargo build -p moon-station --locked --target x86_64-unknown-linux-musl
      # The runner's CPU has every extension; the user's server may not. A station whose C came out
      # past baseline x86-64 dies there with SIGILL (v0.67.1) — and here, under an emulated CPU.
      - name: Start the station on a CPU without AVX
        run: bash .github/scripts/station-baseline-smoke.sh target/x86_64-unknown-linux-musl/debug/moon-station
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # A bin-only package has no doc-tests; nextest runs its entire test set.
      - name: Test the station
        run: cargo nextest run -p moon-station --profile ci --locked --target x86_64-unknown-linux-musl
      - name: Lint the station
        run: cargo clippy -p moon-station --all-targets --locked --target x86_64-unknown-linux-musl -- -D warnings

  audit:
    name: Dependency audit (cargo-deny)
    runs-on: ubuntu-latest
    # A gate, not a probe: an advisory against a frozen version, or a git source nobody approved,
    # is exactly what the freeze exists to surface.
    #
    # Deliberately NOT cached. `Swatinem/rust-cache` would make this a fourth writer competing for
    # the repository's 10 GB Actions quota — which has been full once — and evict the live gate
    # caches by least-recent-use. The action ships a prebuilt binary and compiles nothing, so
    # there is nothing here worth caching anyway.
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # `licenses` is deliberately not run: this gate exists for supply-chain safety, and a
          # licence allow-list over a 920-package graph is a separate project that would redden
          # this job for reasons that have nothing to do with a compromised release.
          command: check advisories bans sources

  tour:
    name: Tour and knowledge site
    runs-on: ubuntu-latest
    # The complete site is GENERATED from locales/*/*.yml, tools/tour/content/*.yml and a
    # committed snapshot of MoonUI's theme. This gate proves a clean clone can build the exact
    # artifact that Pages will deploy; no committed Markdown copy needs manual regeneration.
    #
    # What it CANNOT prove: that the committed theme snapshot still matches MoonUI. MoonUI is a
    # cargo git dependency with no file path on a runner, so nothing here can read it. The
    # snapshot is refreshed deliberately by `make tour-theme`, in its own commit.
    #
    # Deliberately NOT cached, for the same reason the audit job is not: it compiles nothing,
    # and a fourth cache writer would evict the live gate caches from the repository's shared
    # 10 GB Actions quota.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: pip install -r tools/requirements.txt
      - run: make tour-check
      - name: Build complete site from sources
        run: make tour-site TOUR_SITE_OUT="${{ runner.temp }}/moonterminal-site"
      - run: make tour-test

  fmt:
    name: Formatting (cargo fmt)
    runs-on: ubuntu-latest
    # Deliberately NOT cached, for the same reason the audit and tour jobs are not:
    # `Swatinem/rust-cache` would become a further writer competing for the repository's
    # 10 GB Actions quota, and this job compiles nothing worth caching.
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: cargo fmt --all -- --check
