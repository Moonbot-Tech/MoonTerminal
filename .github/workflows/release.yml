name: release

# Publishes a GitHub Release with the terminal for Windows (.exe), macOS (.dmg) and x86_64 Linux
# (one executable, MoonTerminal-linux-x86_64) — and the station's Linux binaries,
# moon-station-x86_64 and moon-station-aarch64 — from one exact canonical stable tag.
# The build.yml workflow gates compilation and the test suite; THIS one ships the reviewed tagged
# commit and verifies GitHub's published digests of the Windows, Linux and station binaries
# against the local artifacts.
#
# Note it does NOT re-run those gates: publishing trusts whatever build.yml
# reported on the commit being tagged.
#
# THE LOCKFILE. MoonUI ships at its latest master, exactly as build.yml compiles it; its revision
# in the committed lock is never moved by hand, so the lock's MoonUI rows are stale by design and a
# build from them would compile the terminal against a MoonUI it was never tested with. The
# jobs that build the terminal therefore run build.yml's lockfile contract in the same three steps:
# `cargo fetch --locked` proves the committed lock agrees with the manifests, `cargo update` moves
# the three MoonUI crates — and only those — to one master revision, and
# `assert-only-moonui-moved.sh` fails the job if that refresh dragged any third-party version
# along. The build keeps `--locked`, so nothing past that one refresh can re-resolve. The station
# does not depend on MoonUI and builds from the committed lock as it stands.
#
# ONE revision per run: `validate` reads MoonUI master once and every terminal job refreshes to it
# with `--precise`. Each job refreshing to "master" on its own would let a MoonUI push landing
# mid-run ship the .exe and the .dmg against different MoonUI revisions, and a re-run of one job
# days later against yet another.
#
# Be honest about what that buys: the release compiles the MoonUI master of the moment THIS run
# started, which can be newer than the master build.yml validated for the tagged commit. The
# THIRD-PARTY set — what the freeze is actually about — is the committed one either way.
#
# The Rust toolchain is PINNED here for the same reason as in build.yml, and the stakes
# are higher: this workflow does not re-run the gates, so an unpinned compiler could
# first appear in a run that ships a binary to users. Keep the version in step with
# build.yml.
#
# Every build job checks out an immutable validated commit and caches restore-only
# (`save-if: false`). A release ref is not a reusable branch cache, so saving roughly 0.9 GiB per
# job only fills the shared 10 GB quota. Nothing is lost by not writing it.
#
# What restores: the cache key includes the job id, so the `windows` job below shares a
# key with build.yml's `windows` and warm-starts from what `main` wrote. The `macos-slice`
# job does not — macos-probe.yml's job is `macos-probe` — so the arm64 build compiles cold.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing canonical release tag (e.g. v0.24.1)"
        required: true
        type: string

permissions:
  contents: write # required to create the GitHub Release

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate exact release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      moonui: ${{ steps.moonui.outputs.rev }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - id: release
        name: Require a canonical tag on main at this exact commit
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bash .github/scripts/validate-release-tag.sh "$RELEASE_TAG"
      # The one MoonUI revision every terminal job of this run builds against — see the header.
      - id: moonui
        name: Resolve the MoonUI master revision for this release
        shell: bash
        run: |
          rev=$(git ls-remote https://github.com/Moonbot-Tech/MoonUI refs/heads/master | cut -f1)
          if [ "${#rev}" -ne 40 ]; then
            echo "::error::could not resolve MoonUI master: '$rev'"
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "MoonUI master for this release: $rev"

  windows:
    name: Windows .exe
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      # The lockfile contract — see the header and build.yml. After the cache restore, which keys
      # partly on lockfile content and must key on the COMMITTED one.
      - name: Verify the committed lockfile agrees with the manifests
        run: cargo fetch --locked
      - name: Refresh MoonUI only
        run: cargo update -p moon-gpui -p moon-gpui-platform -p moon-ui --precise ${{ needs.validate.outputs.moonui }}
      - name: Assert the refresh moved MoonUI and nothing else
        shell: bash
        run: bash .github/scripts/assert-only-moonui-moved.sh
      - name: Build release binary
        run: cargo build -p moon-ui-gpui --bin moonterminal --release --locked --target x86_64-pc-windows-msvc
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/moonterminal.exe dist/MoonTerminal.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/MoonTerminal.exe
          if-no-files-found: error
          # A re-run must be able to replace its own upload; artifacts are otherwise immutable.
          overwrite: true

  macos-slice:
    name: macOS slice (${{ matrix.arch }})
    needs: validate
    runs-on: macos-15
    # Build separately so packaging starts without a release build tree on its runner.
    # Apple silicon only: the Intel slice was dropped because its cross-build does not fit the runner's memory.
    strategy:
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
    env:
      # Keep the compiler floor in agreement with LSMinimumSystemVersion in make-dmg.sh.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      # Before the toolchain, so the compiler and the registry land on a disk that already has
      # room. See the script for what it removes and what it deliberately keeps.
      - name: Reclaim runner disk
        run: bash .github/scripts/free-macos-disk.sh
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
          key: ${{ matrix.target }}
      # The lockfile contract — see the header and build.yml.
      - name: Verify the committed lockfile agrees with the manifests
        run: cargo fetch --locked
      - name: Refresh MoonUI only
        run: cargo update -p moon-gpui -p moon-gpui-platform -p moon-ui --precise ${{ needs.validate.outputs.moonui }}
      - name: Assert the refresh moved MoonUI and nothing else
        run: bash .github/scripts/assert-only-moonui-moved.sh
      - name: Build release binary
        run: cargo build -p moon-ui-gpui --bin moonterminal --release --locked --target ${{ matrix.target }}
      - name: Stage the slice
        run: |
          mkdir -p stage
          mv target/${{ matrix.target }}/release/moonterminal stage/moonterminal-${{ matrix.arch }}
      # The name make-dmg.sh reads, so packaging downloads the arm64 binary into `stage/` unchanged.
      # Upload strips the executable bit; make-dmg.sh chmods the bundled copy that ships.
      - uses: actions/upload-artifact@v7
        with:
          name: macos-slice-${{ matrix.arch }}
          path: stage/moonterminal-${{ matrix.arch }}
          if-no-files-found: error
          # Artifacts are immutable, so a re-run that already uploaded would 409 without this.
          # Keep the artifact available for a packaging-only re-run after a flaked `hdiutil`.
          overwrite: true

  macos:
    name: macOS .dmg (Apple silicon)
    needs: [validate, macos-slice]
    runs-on: macos-15
    # Packages the arm64 binary built above into MoonTerminal.app and a distributable .dmg.
    # This job compiles nothing, so `hdiutil` runs without a Rust build tree on the same disk.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      # `merge-multiple` puts the arm64 binary at `stage/moonterminal-arm64`, as make-dmg.sh expects.
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-slice-*
          merge-multiple: true
          path: stage
      # `download-artifact` only warns when no artifact matches; fail here with the real problem.
      - name: Check the arm64 build arrived
        run: |
          test -f stage/moonterminal-arm64 ||
            { echo "the macos-slice-arm64 artifact is missing" >&2; exit 1; }
      - name: Package .app + .dmg
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: bash .github/scripts/make-dmg.sh "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/MoonTerminal.dmg
          if-no-files-found: error
          overwrite: true

  linux:
    name: Linux terminal (x86_64)
    needs: validate
    runs-on: ubuntu-latest
    # Built exactly as linux-probe.yml builds it on every pull request: in a bare ubuntu:22.04
    # container, so the binary asks for glibc 2.35 and nothing newer, with the package list
    # docs/MAC_LINUX_BUILD.md gives. The asset is the single executable a Linux build's updater
    # looks for (`moon_core::update`); a contract test holds the two names together.
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
    # A job container runs steps with `sh` unless told otherwise.
    defaults:
      run:
        shell: bash
    steps:
      - name: Install the build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxtst-dev libxcb1-dev \
            libdbus-1-dev
      # Full history with tags: the terminal's update baseline is the greatest release tag
      # reachable from the commit, and a build without the tags never asks for an update.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      # The checkout belongs to the runner's user while the container runs as root.
      - name: Trust the checkout inside the container
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-unknown-linux-gnu
      # The lockfile contract — see the header and build.yml. Not cached: a release build runs
      # rarely, and nothing on `main` writes a cache this job could restore.
      - name: Verify the committed lockfile agrees with the manifests
        run: cargo fetch --locked
      - name: Refresh MoonUI only
        run: cargo update -p moon-gpui -p moon-gpui-platform -p moon-ui --precise ${{ needs.validate.outputs.moonui }}
      - name: Assert the refresh moved MoonUI and nothing else
        run: bash .github/scripts/assert-only-moonui-moved.sh
      - name: Build release binary
        run: cargo build -p moon-ui-gpui --bin moonterminal --release --locked --target x86_64-unknown-linux-gnu
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/moonterminal dist/MoonTerminal-linux-x86_64
      # A library the binary links and this bare image lacks would be a missing line in the
      # documented package list; it must not reach a user as "cannot open shared object file".
      - name: Require every linked library to resolve
        run: |
          ldd dist/MoonTerminal-linux-x86_64 | tee ldd.txt
          if grep -q 'not found' ldd.txt; then
            echo "the release binary does not resolve its own libraries" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/MoonTerminal-linux-x86_64
          if-no-files-found: error
          overwrite: true

  linux-smoke:
    name: Linux terminal starts (ubuntu:24.04)
    needs: [validate, linux]
    runs-on: ubuntu-latest
    # The release's own Linux binary, started before it can be published: `publish` waits on this
    # job. Nobody starts the Linux build by hand before a release, and a published release cannot
    # be replaced — so the one check that it opens a window and draws a frame runs here, in an
    # image that carries run-time packages only, the way linux-probe.yml checks every pull request.
    container: ubuntu:24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    defaults:
      run:
        shell: bash
    steps:
      - name: Install what the terminal needs at run time
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libfontconfig1 libfreetype6 \
            libwayland-client0 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-6 libxtst6 libxcb1 \
            libdbus-1-3 \
            libvulkan1 mesa-vulkan-drivers \
            gnome-keyring libsecret-tools
      - name: Install the virtual display and the inspection tools
        run: |
          apt-get install -y --no-install-recommends \
            ca-certificates git xvfb dbus x11-utils imagemagick fonts-dejavu-core vulkan-tools
      # For the smoke script and the committed chart fixture the run draws. Full history like
      # every job of a release: the release contract holds each checkout to the validated commit
      # with its tags.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist/linux
      # An artifact is a zip and drops the executable bit, exactly as a browser download does.
      - name: Restore the executable bit
        run: chmod +x dist/linux/MoonTerminal-linux-x86_64
      - name: Start the terminal on a virtual display
        run: bash .github/scripts/linux-gui-smoke.sh dist/linux/MoonTerminal-linux-x86_64 crates/moon-core/fixtures smoke-out
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: linux-smoke
          path: smoke-out
          if-no-files-found: warn
          overwrite: true

  station:
    name: Station (${{ matrix.arch }}-linux-musl)
    needs: validate
    # The station is the binary the terminal installs on the user's Linux server and the server
    # updates itself to (docs-internal/STATION.md §6): a static musl build per architecture, the
    # asset name its updater looks for (`moon_core::update::station_asset_name`). Each is built on a
    # runner of its own architecture, so the musl C toolchain the station's C dependencies (ring,
    # SQLite) compile with is the distribution's native one — no cross compiler on the release path.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      # `musl-gcc` for the C inside the station's dependencies, per target so a build script's own
      # host C is left to the host compiler.
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      # Full history with tags: the station's version is the release tag (`build-support/git_meta.rs`),
      # and without the tags it builds as `dev`, which its updater never offers anything to.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - name: Install the musl C toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      # The fat-LTO link of the station peaks near 16 GB, the runner's whole RAM; past it the
      # kernel kills the runner ("received a shutdown signal", exit 143). Swap lets the peak page
      # out instead of failing the release.
      - name: Add swap for the LTO link
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
          key: ${{ matrix.arch }}-unknown-linux-musl
      - name: Build the station
        run: cargo build -p moon-station --release --locked --target ${{ matrix.arch }}-unknown-linux-musl
      - name: Stage the station
        run: |
          mkdir -p dist
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/moon-station dist/moon-station-${{ matrix.arch }}
      # The server runs it with nothing beside it: a binary that links a shared library would start
      # on this runner and fail on the user's Debian.
      - name: Require a static binary
        run: |
          file dist/moon-station-${{ matrix.arch }}
          file dist/moon-station-${{ matrix.arch }} | grep -Eq 'statically linked|static-pie linked'
      - uses: actions/upload-artifact@v7
        with:
          name: station-${{ matrix.arch }}
          path: dist/moon-station-${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish GitHub Release
    needs: [validate, windows, macos, station, linux, linux-smoke]
    runs-on: ubuntu-latest
    # The human gate on shipping. The `release` environment has required reviewers, so this whole
    # job - draft upload, digest verification, publication - waits until one of them approves the
    # run. `RELEASE_ADMIN_TOKEN` must be a secret of this environment, not of the repository: a job
    # outside the environment cannot read it, and the environment admits only `v*` tags and `main`,
    # so a workflow edited on a side branch reaches neither the token nor the gate.
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      # By name, not "everything": a bare download would also pull the intermediate macOS build
      # artifact onto this runner. It could never be PUBLISHED — `files:` below is an explicit
      # list — but naming what this job consumes keeps the release's inputs readable.
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist/windows
      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist/macos
      - uses: actions/download-artifact@v8
        with:
          pattern: station-*
          merge-multiple: true
          path: dist/station
      - uses: actions/download-artifact@v8
        with:
          name: linux
          path: dist/linux
      - name: Upload a draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ needs.validate.outputs.commit }}
          generate_release_notes: true
          draft: true
          make_latest: false
          files: |
            dist/windows/MoonTerminal.exe
            dist/macos/MoonTerminal.dmg
            dist/linux/MoonTerminal-linux-x86_64
            dist/station/moon-station-x86_64
            dist/station/moon-station-aarch64
      - name: Verify the draft Windows, Linux and station digests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          STATION_ASSET_DIR: dist/station
          LINUX_ASSET_PATH: dist/linux/MoonTerminal-linux-x86_64
        run: bash .github/scripts/verify-release-assets.sh "$RELEASE_TAG" dist/windows/MoonTerminal.exe
      - name: Publish the verified release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          STATION_ASSET_DIR: dist/station
          LINUX_ASSET_PATH: dist/linux/MoonTerminal-linux-x86_64
        run: bash .github/scripts/publish-verified-release.sh "$RELEASE_TAG" "$RELEASE_COMMIT" dist/windows/MoonTerminal.exe
