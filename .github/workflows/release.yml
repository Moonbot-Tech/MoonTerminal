name: release

# Publishes a GitHub Release with downloadable .exe + .dmg from one exact canonical stable tag.
# The build.yml workflow gates compilation and the test suite; THIS one ships the reviewed tagged
# commit and verifies GitHub's published Windows digest against the local artifact.
#
# Note it does NOT re-run those gates: publishing trusts whatever build.yml
# reported on the commit being tagged.
#
# THE LOCKFILE, and the one procedure this workflow depends on. Both builds below pass `--locked`,
# so a release is exactly the committed third-party set and a lock that disagrees with the
# manifests fails here loudly instead of being silently re-resolved. There is deliberately NO
# `cargo update` step: build.yml refreshes MoonUI on every run, but a release must never pull a
# MoonUI commit that appeared after the tag.
#
# The consequence is a rule for whoever tags: refresh MoonUI deliberately first
# (`cargo update -p moon-gpui -p moon-gpui-platform -p moon-ui`), commit the lock, let build.yml
# run on THAT commit, and tag it promptly.
#
# Be honest about what that buys. build.yml's compiling jobs refresh MoonUI at RUN time, so they
# validate whatever MoonUI master was at that moment, while this workflow ships the pin recorded in
# the commit. Refreshing right before tagging makes those the same revision; it does not make them
# the same by construction, and a MoonUI commit landing in between reopens the gap. The THIRD-PARTY
# set — what the freeze is actually about — is identical either way.
#
# The Rust toolchain is PINNED here for the same reason as in build.yml, and the stakes
# are higher: this workflow does not re-run the gates, so an unpinned compiler could
# first appear in a run that ships a binary to users. Keep the version in step with
# build.yml.
#
# Every build job checks out an immutable validated commit and caches restore-only
# (`save-if: false`). A release ref is not a reusable branch cache, so saving roughly 0.9 GiB per
# job only fills the shared 10 GB quota. Nothing is lost by not writing it.
#
# What restores: the cache key includes the job id, so the `windows` job below shares a
# key with build.yml's `windows` and warm-starts from what `main` wrote. The `macos` job
# does not — build.yml's macOS job is `macos-probe` — so a macOS release compiles cold,
# and now twice over: one cold compile per architecture of the universal binary.
# It always did compile cold; only the pointless write is gone.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing canonical release tag (e.g. v0.24.1)"
        required: true
        type: string

permissions:
  contents: write # required to create the GitHub Release

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate exact release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - id: release
        name: Require a canonical tag on main at this exact commit
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bash .github/scripts/validate-release-tag.sh "$RELEASE_TAG"

  windows:
    name: Windows .exe
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Build release binary
        run: cargo build -p moon-ui-gpui --bin moonterminal --release --locked --target x86_64-pc-windows-msvc
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/moonterminal.exe dist/MoonTerminal.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/MoonTerminal.exe
          if-no-files-found: error

  macos:
    name: macOS .dmg (universal)
    needs: validate
    runs-on: macos-14
    # Ships ONE universal binary covering both Macs, not two downloads: the two slices are
    # built here and `lipo`-joined by make-dmg.sh into a single MoonTerminal.app.
    #
    # Both slices are cross-built on this arm64 runner. The macOS SDK carries both
    # architectures, so `--target x86_64-apple-darwin` links natively — no Intel runner
    # involved, which also keeps the release off the ageing `macos-13` image.
    #
    # What that costs: the Intel slice is compiled but never EXECUTED here (an arm64 runner
    # has no Rosetta by default), so CI proves it links, not that it runs. Intel acceptance
    # is a live machine.
    env:
      # Both slices, and the LSMinimumSystemVersion make-dmg.sh writes, name the same floor.
      # Left at the default the Intel slice would claim 10.12 while the bundle says 11.0.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      # Two steps rather than one multi-target invocation: a red job then names the arch
      # that broke in its own step, instead of burying it in a combined log.
      - name: Build release binary (Apple Silicon)
        run: cargo build -p moon-ui-gpui --bin moonterminal --release --locked --target aarch64-apple-darwin
      # The slice moves out and its target dir goes with it: this runner has 14 GB of disk, and
      # two whole `--release` trees plus the cargo registry do not both fit. Only the per-triple
      # dir is removed — host build-script and proc-macro artifacts live in `target/release`
      # and are reused by the second build.
      - name: Stage the Apple Silicon slice and free its target dir
        run: |
          mkdir -p stage
          mv target/aarch64-apple-darwin/release/moonterminal stage/moonterminal-arm64
          rm -rf target/aarch64-apple-darwin
      - name: Build release binary (Intel)
        run: cargo build -p moon-ui-gpui --bin moonterminal --release --locked --target x86_64-apple-darwin
      - name: Stage the Intel slice
        run: mv target/x86_64-apple-darwin/release/moonterminal stage/moonterminal-x86_64
      - name: Package .app + .dmg
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: bash .github/scripts/make-dmg.sh "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/MoonTerminal.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [validate, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - name: Upload a draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ needs.validate.outputs.commit }}
          generate_release_notes: true
          draft: true
          make_latest: false
          files: |
            dist/windows/MoonTerminal.exe
            dist/macos/MoonTerminal.dmg
      - name: Verify the draft Windows digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: bash .github/scripts/verify-release-assets.sh "$RELEASE_TAG" dist/windows/MoonTerminal.exe
      - name: Publish the verified release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: bash .github/scripts/publish-verified-release.sh "$RELEASE_TAG" "$RELEASE_COMMIT" dist/windows/MoonTerminal.exe
