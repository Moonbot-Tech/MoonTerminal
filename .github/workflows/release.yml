name: release

# Publishes a GitHub Release with downloadable .exe + .dmg from one exact canonical stable tag.
# The build.yml workflow gates compilation and the test suite; THIS one ships the reviewed tagged
# commit and verifies GitHub's published Windows digest against the local artifact.
#
# Note it does NOT re-run those gates: publishing trusts whatever build.yml
# reported on the commit being tagged.
#
# THE LOCKFILE, and the one procedure this workflow depends on. Both builds below pass `--locked`,
# so a release is exactly the committed third-party set and a lock that disagrees with the
# manifests fails here loudly instead of being silently re-resolved. There is deliberately NO
# `cargo update` step: build.yml refreshes MoonUI on every run, but a release must never pull a
# MoonUI commit that appeared after the tag.
#
# The consequence is a rule for whoever tags: refresh MoonUI deliberately first
# (`cargo update -p moon-gpui -p moon-gpui-platform -p moon-ui`), commit the lock, let build.yml
# run on THAT commit, and tag it promptly.
#
# Be honest about what that buys. build.yml's compiling jobs refresh MoonUI at RUN time, so they
# validate whatever MoonUI master was at that moment, while this workflow ships the pin recorded in
# the commit. Refreshing right before tagging makes those the same revision; it does not make them
# the same by construction, and a MoonUI commit landing in between reopens the gap. The THIRD-PARTY
# set — what the freeze is actually about — is identical either way.
#
# The Rust toolchain is PINNED here for the same reason as in build.yml, and the stakes
# are higher: this workflow does not re-run the gates, so an unpinned compiler could
# first appear in a run that ships a binary to users. Keep the version in step with
# build.yml.
#
# Every build job checks out an immutable validated commit and caches restore-only
# (`save-if: false`). A release ref is not a reusable branch cache, so saving roughly 0.9 GiB per
# job only fills the shared 10 GB quota. Nothing is lost by not writing it.
#
# What restores: the cache key includes the job id, so the `windows` job below shares a
# key with build.yml's `windows` and warm-starts from what `main` wrote. The `macos-slice`
# legs do not — build.yml's macOS job is `macos-probe` — so each architecture of the
# universal binary compiles cold. They always did; only the pointless write is gone, and
# since the split the two colds run in parallel rather than back to back.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing canonical release tag (e.g. v0.24.1)"
        required: true
        type: string

permissions:
  contents: write # required to create the GitHub Release

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate exact release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - id: release
        name: Require a canonical tag on main at this exact commit
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bash .github/scripts/validate-release-tag.sh "$RELEASE_TAG"

  windows:
    name: Windows .exe
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Build release binary
        run: cargo build -p moon-ui-gpui --bin moonterminal --release --locked --target x86_64-pc-windows-msvc
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/moonterminal.exe dist/MoonTerminal.exe
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/MoonTerminal.exe
          if-no-files-found: error
          # A re-run must be able to replace its own upload; artifacts are otherwise immutable.
          overwrite: true

  macos-slice:
    name: macOS slice (${{ matrix.arch }})
    needs: validate
    runs-on: macos-14
    # One slice per job, so neither ever holds two `--release` trees and each starts on a fresh
    # disk. They used to be built in sequence in the packaging job, which had to delete the first
    # target dir mid-flight to make room for the second and still ran out at `hdiutil`: the image
    # arrives with 40 GiB free, and two release trees plus the registry do not fit in that.
    #
    # Both slices are cross-built on this arm64 runner. The macOS SDK carries both architectures,
    # so `--target x86_64-apple-darwin` links natively — no Intel runner involved, which also keeps
    # the release off the ageing `macos-13` image.
    #
    # What that costs: the Intel slice is compiled but never EXECUTED here (an arm64 runner has no
    # Rosetta by default), so CI proves it links, not that it runs. Intel acceptance is a live
    # machine. Splitting the job does not change that, and it does not change WHAT is compiled —
    # only where. The two jobs now compile in parallel, so the wall clock is the slower slice
    # rather than their sum.
    strategy:
      # A red arch must not cancel its sibling: the release is lost either way, and knowing whether
      # the break is Intel-only or common to both is what the next attempt is planned from. The
      # sibling's compile is already paid for by the time the first one fails.
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    env:
      # Both slices name the same floor as the LSMinimumSystemVersion `make-dmg.sh` hardcodes in
      # the packaging job. Left at the default the Intel slice would claim 10.12 while the bundle
      # says 11.0 — the two halves of that pair now live in different jobs, so changing one means
      # changing the other by hand.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      # Before the toolchain, so the compiler and the registry land on a disk that already has
      # room. See the script for what it removes and what it deliberately keeps.
      - name: Reclaim runner disk
        run: bash .github/scripts/free-macos-disk.sh
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
          # rust-cache keys on the job id, which both legs share. Naming the target keeps them
          # apart, so turning saving on later cannot make one arch restore the other's tree.
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build -p moon-ui-gpui --bin moonterminal --release --locked --target ${{ matrix.target }}
      - name: Stage the slice
        run: |
          mkdir -p stage
          mv target/${{ matrix.target }}/release/moonterminal stage/moonterminal-${{ matrix.arch }}
      # The name make-dmg.sh reads, so the packaging job can download both slices into `stage/`
      # unchanged. Upload strips the executable bit; `make-dmg.sh` chmods the joined binary, which
      # is the one that ships.
      - uses: actions/upload-artifact@v7
        with:
          name: macos-slice-${{ matrix.arch }}
          path: stage/moonterminal-${{ matrix.arch }}
          if-no-files-found: error
          # Artifacts are immutable, so a re-run of a leg that already uploaded would 409 without
          # this. Deliberately NO shortened retention: re-running just the packaging job is the
          # cheap recovery from a flaked `hdiutil`, and an expired slice would take it away.
          overwrite: true

  macos:
    name: macOS .dmg (universal)
    needs: [validate, macos-slice]
    runs-on: macos-14
    # Ships ONE universal binary covering both Macs, not two downloads: the slices built above are
    # `lipo`-joined by make-dmg.sh into a single MoonTerminal.app.
    #
    # This job compiles nothing, so `hdiutil` images the bundle on a disk holding two binaries and
    # a checkout instead of one that just finished two Rust builds.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      # `merge-multiple` puts both slices side by side in `stage/`, which is exactly the layout
      # make-dmg.sh expects (`stage/moonterminal-arm64`, `stage/moonterminal-x86_64`).
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-slice-*
          merge-multiple: true
          path: stage
      # `download-artifact` treats "no artifact matched the pattern" as a warning, and the next
      # thing to notice would be `lipo` complaining about a missing file. Name the real problem.
      - name: Check both slices arrived
        run: |
          for arch in arm64 x86_64; do
            test -f "stage/moonterminal-$arch" ||
              { echo "the macos-slice-$arch artifact is missing" >&2; exit 1; }
          done
      - name: Package .app + .dmg
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: bash .github/scripts/make-dmg.sh "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/MoonTerminal.dmg
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish GitHub Release
    needs: [validate, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      # By name, not "everything": a bare download would also pull the two intermediate macOS
      # slices onto this runner. They could never have been PUBLISHED — `files:` below is an
      # explicit list — but downloading them is pure transfer, and naming what this job consumes
      # keeps the release's inputs readable.
      - uses: actions/download-artifact@v8
        with:
          name: windows
          path: dist/windows
      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: dist/macos
      - name: Upload a draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ needs.validate.outputs.commit }}
          generate_release_notes: true
          draft: true
          make_latest: false
          files: |
            dist/windows/MoonTerminal.exe
            dist/macos/MoonTerminal.dmg
      - name: Verify the draft Windows digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: bash .github/scripts/verify-release-assets.sh "$RELEASE_TAG" dist/windows/MoonTerminal.exe
      - name: Publish the verified release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: bash .github/scripts/publish-verified-release.sh "$RELEASE_TAG" "$RELEASE_COMMIT" dist/windows/MoonTerminal.exe
