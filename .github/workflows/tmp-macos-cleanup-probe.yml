name: tmp macOS cleanup probe

# TEMPORARY. Exists only to exercise `.github/scripts/free-macos-disk.sh` and one real release
# slice on a live macos-14 runner before the change that adds them is merged. release.yml cannot
# do it: its jobs check out the validated TAG's commit, so a script that exists only on a branch is
# not there yet. Delete this file before merging.

# Push-triggered on this branch only: `workflow_dispatch` is offered solely for workflows that
# already exist on the default branch, which this one deliberately never will.
on:
  push:
    branches: [ci/split-macos-release-jobs]

jobs:
  probe:
    name: cleanup + one release slice
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - name: Reclaim runner disk
        run: bash .github/scripts/free-macos-disk.sh
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-apple-darwin
      - name: Build the Apple Silicon slice exactly as the release does
        run: cargo build -p moon-ui-gpui --bin moonterminal --release --locked --target aarch64-apple-darwin
      - name: Report what the slice left behind
        run: |
          df -h /
          ls -lh target/aarch64-apple-darwin/release/moonterminal
