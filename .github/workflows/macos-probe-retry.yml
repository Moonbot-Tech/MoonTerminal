name: macOS probe retry

# A separate workflow_run listener keeps the diagnostic probe unchanged and runs this trusted
# default-branch logic only after a probe attempt completes. It never checks out the triggering
# run's ref or executes its code.
on:
  workflow_run:
    workflows: ["macOS probe"]
    types: [completed]

permissions:
  actions: write # re-run the failed probe jobs; also reads their attempt data
  checks: read # read runner-acquisition annotations when job data omits steps
  contents: read # read this retry script from the default branch

# Duplicate completion notifications for one run must serialize, never cancel each other's retry.
concurrency:
  group: macos-probe-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry-unacquired:
    name: Retry only when no macOS runner was acquired
    if: >-
      (github.event.workflow_run.conclusion == 'cancelled' ||
      github.event.workflow_run.conclusion == 'failure') &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Re-run an unacquired probe, at most twice
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: bash .github/scripts/retry-macos-probe.sh "$RUN_ID" "$RUN_ATTEMPT"
