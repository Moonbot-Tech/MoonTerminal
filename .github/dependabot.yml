version: 2
updates:
  # Keep the GitHub Actions used by the workflows up to date.
  # Scoped to github-actions only, deliberately. Cargo.lock is committed now, so a `cargo`
  # ecosystem entry would work — but it would open a stream of automatic version-bump PRs,
  # which is the opposite of a freeze whose whole point is that third-party versions move
  # when a human decides to move them. Vulnerabilities are covered by the cargo-deny gate
  # in build.yml instead.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    # `dtolnay/rust-toolchain` is versioned by branches named after Rust releases, and the
    # author creates them ahead of the releases themselves — 1.98 / 1.99 / 1.100 exist as refs
    # while stable is still 1.97.x. Dependabot resolves the highest ref, so its "latest" is a
    # toolchain rustup cannot download and every compiling job dies at install time with a 404.
    # The pin therefore moves by hand, in step across build.yml and release.yml. Qualified by
    # `update-types` rather than left bare: an unqualified ignore would drop this action's
    # SECURITY update PRs too, and nothing else here watches it — the cargo-deny gate audits the
    # Rust lockfile, not the workflows.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
