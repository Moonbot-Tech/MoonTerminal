# Virtual workspace. The only binary is the moon-ui-gpui GPUI shell (`moonterminal`)
# built on the UI-agnostic moon-core; the shared moon-chart crate provides the math/
# geometry (view/axes/transform/build_order_geometry/instance types), wgpu-free.
#
# The old moon-terminal egui binary (root src/) was removed along with the wgpu engine and
# offscreen→readback; rendering now uses an own-pass DX11 implementation (chartdx). See
# docs/ARCHITECTURE.md (the "Rendering" section).
[workspace]
members = ["crates/moon-core", "crates/moon-chart", "crates/moon-ui-gpui"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true

# Dev build for the GPUI shell: the main source of stuttering (even for the cursor) is the DX12
# debug/validation layer enabled by GPUI and wgpu in debug via `cfg!(debug_assertions)`
# (also responsible for `HRESULT 0x887A002D` at startup without Graphics Tools). Disable it without
# switching to release: debug_assertions=false removes both layers; build dependencies (gpui/skia)
# with optimizations so runtime performance is close to release while incremental builds of our code remain fast.
[profile.dev]
debug-assertions = false

[profile.dev.package."*"]
opt-level = 3

# The tuner's threshold search is a tight numeric loop over every trade in the report, run
# thousands of times per click. Unoptimized it is several times slower than it needs to be, and
# the wildcard above covers dependencies only. Kept at 2 rather than 3: it buys the same speed
# here and rebuilds noticeably faster after an edit.
[profile.dev.package.moon-core]
opt-level = 2

# Moon UI: a unified local/public base for the GPUI runtime and components.
#
# Moonbot-Tech/MoonUI is now the canonical source for the Moon stack: standalone GPUI
# (`moon-gpui`) plus Moon components (`moon-ui`). Public dependencies are fetched through Git;
# local development overrides them with a sibling checkout in the untracked `.cargo/config.toml`.

# Zed's crates.io patches are not inherited transitively when GPUI is consumed as a dependency.
# Keep the GPUI process stack on the same patched crates the fork itself uses.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
